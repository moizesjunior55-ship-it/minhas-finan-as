<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Minhas Finanças</title>
<!-- PWA (Etapa 1): manifest e cor da barra. Se o manifest não estiver disponível, a aplicação segue funcionando normalmente. -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#17181c">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
:root{
  --bg:#17181c; --bg2:#1f2126; --card:#24262c; --border:#33353c;
  --text:#e7e7ea; --muted:#9a9ca3; --accent:#7c9cff; --green:#7fbf8f; --red:#e08787; --yellow:#e0c987;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
:root[data-theme="light"]{
  --bg:#f4f4f2; --bg2:#ececea; --card:#ffffff; --border:#dcdcda;
  --text:#2b2b2e; --muted:#6b6b6f; --accent:#4c6ef5; --green:#3fa361; --red:#d9534f; --yellow:#c99a2e;
}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif;font-size:15px;line-height:1.4}
.motion *{transition:background .15s,color .15s}
h1,h2,h3{font-weight:600;margin:0 0 10px}
.app{display:flex;min-height:100%}
nav.side{width:190px;background:var(--bg2);border-right:1px solid var(--border);padding:16px 10px;flex-shrink:0}
nav.side .brand{font-weight:700;font-size:17px;margin:4px 8px 20px;color:var(--text)}
nav.side button{display:block;width:100%;text-align:left;background:none;border:none;color:var(--muted);padding:10px 12px;border-radius:8px;font-size:14px;cursor:pointer;margin-bottom:2px}
nav.side button.active{background:var(--card);color:var(--text)}
main{flex:1;min-width:0;padding:20px;max-width:980px;margin:0 auto;padding-bottom:80px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:20px}
.card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:16px}
.stat .label{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.03em}
.stat .val{font-size:22px;font-weight:700;margin-top:4px}
.pos{color:var(--green)}.neg{color:var(--red)}
.row{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--border)}
.row:last-child{border-bottom:none}
.muted{color:var(--muted);font-size:13px}
.bar-bg{background:var(--bg2);border-radius:6px;height:8px;overflow:hidden;margin-top:6px}
.bar-fill{height:100%;border-radius:6px;background:var(--accent)}
button.primary{background:var(--accent);color:#fff;border:none;padding:9px 16px;border-radius:9px;font-size:14px;cursor:pointer}
button.ghost{background:none;border:1px solid var(--border);color:var(--text);padding:8px 12px;border-radius:9px;font-size:13px;cursor:pointer}
input,select{background:var(--bg2);border:1px solid var(--border);color:var(--text);border-radius:8px;padding:9px 10px;font-size:14px;width:100%}
label{font-size:12px;color:var(--muted);display:block;margin-bottom:4px}
.field{margin-bottom:12px}
.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}
.modal{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:20px;width:100%;max-width:420px;max-height:88vh;overflow:auto}
.fab{position:fixed;bottom:24px;right:24px;background:var(--accent);color:#fff;border:none;width:56px;height:56px;border-radius:50%;font-size:26px;cursor:pointer;box-shadow:0 2px 10px rgba(0,0,0,.3)}
.tag{display:inline-block;background:var(--bg2);border:1px solid var(--border);border-radius:20px;padding:3px 10px;font-size:12px;color:var(--muted)}
.tag-red{border-color:var(--red);color:var(--red)}
.tag-green{border-color:var(--green);color:var(--green)}
.tag-yellow{border-color:var(--yellow);color:var(--yellow)}
.tag-accent{border-color:var(--accent);color:var(--accent)}
table{width:100%;border-collapse:collapse}
.bottomnav{display:none}
.topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.filters select,.filters input{width:auto;min-width:110px}
.form-error{color:var(--red);font-size:13px;margin-top:2px;margin-bottom:10px;padding:8px 10px;background:rgba(224,135,135,.12);border-radius:8px}
.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,12px);background:var(--red);color:#fff;padding:10px 16px;border-radius:9px;font-size:13px;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:200;max-width:90%;text-align:center;box-shadow:0 2px 10px rgba(0,0,0,.3)}
.toast.show{opacity:1;transform:translate(-50%,0)}
.topbar{flex-wrap:wrap}
.topbar>div{display:flex;gap:8px;flex-wrap:wrap}
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:20px}
.details-toggle summary{cursor:pointer;color:var(--accent);font-size:12px;list-style:none}
.details-toggle summary::-webkit-details-marker{display:none}
.details-toggle summary::marker{content:""}
/* ===== V1.1.1 — Central de notificações ===== */
.notif-btn{position:fixed;top:calc(16px + env(safe-area-inset-top,0px));right:16px;bottom:auto;left:auto;
  width:48px;height:48px;font-size:20px;background:var(--card);color:var(--text);border:1px solid var(--border);
  box-shadow:0 2px 8px rgba(0,0,0,.25);z-index:45;display:flex;align-items:center;justify-content:center}
.notif-badge{position:absolute;top:-4px;right:-4px;min-width:18px;height:18px;border-radius:9px;background:var(--accent);
  color:#fff;font-size:11px;font-weight:700;display:none;align-items:center;justify-content:center;padding:0 4px;line-height:1}
.notif-item{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;padding:10px 0;border-bottom:1px solid var(--border)}
.notif-item:last-child{border-bottom:none}
.notif-item.is-read{opacity:.6}
/* ===== V1.1.4 — Dashboard refinado ===== */
/* Rótulo de agrupamento de seção no Dashboard — mesma aparência de .stat .label (cor/tamanho/
   letter-spacing já usados em todo o sistema), só que utilizável fora de .stat, para dar hierarquia
   de heading correta às seções (h2) sem herdar peso visual de título grande. Nenhuma cor nova. */
.section-label{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.03em;
  font-weight:600;margin:26px 0 8px}
.section-label:first-child{margin-top:0}
/* Card de alerta do Dashboard: reaproveita as cores de severidade já usadas na Central de
   Notificações (--red/--yellow), só como uma borda discreta de destaque — sem novo componente. */
.dash-alert{border-left-width:3px}
@media(max-width:760px){
  .two-col{grid-template-columns:1fr}
  .toast{bottom:90px}
  nav.side{display:none}
  main{padding:14px;padding-bottom:90px}
  .bottomnav{display:flex;position:fixed;left:0;right:0;bottom:0;background:var(--bg2);border-top:1px solid var(--border);padding-bottom:env(safe-area-inset-bottom,0px);z-index:40}
  .bottomnav button{flex:1;background:none;border:none;color:var(--muted);font-size:10px;padding:8px 2px;cursor:pointer}
  .bottomnav button.active{color:var(--accent)}
  .formgrid{grid-template-columns:1fr}
  .fab{bottom:76px}
  .notif-btn{top:calc(10px + env(safe-area-inset-top,0px));right:10px;width:42px;height:42px;font-size:18px}
}
</style>
</head>
<body class="motion">
<div class="app">
  <nav class="side" id="sideNav"></nav>
  <main id="main"></main>
</div>
<nav class="bottomnav" id="bottomNav"></nav>
<button class="fab notif-btn" id="notifBtn" title="Notificações" aria-label="Notificações" aria-haspopup="dialog">🔔<span class="notif-badge" id="notifBadge" aria-hidden="true"></span></button>
<button class="fab" id="fabBtn" title="Adicionar" aria-label="Adicionar lançamento">+</button>
<div id="modalRoot"></div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<script>
const DB_KEY='pfs_data_v1';
const DEFAULT_CATS=[
 {id:'c1',name:'Alimentação',icon:'🍽️'},{id:'c2',name:'Moradia',icon:'🏠'},
 {id:'c3',name:'Transporte',icon:'🚗'},{id:'c4',name:'Saúde',icon:'💊'},
 {id:'c5',name:'Educação',icon:'📚'},{id:'c6',name:'Lazer',icon:'🎮'},
 {id:'c7',name:'Compras',icon:'🛍️'},{id:'c8',name:'Assinaturas',icon:'🔁'},
 {id:'c9',name:'Contas',icon:'🧾'},{id:'c10',name:'Impostos',icon:'📄'},{id:'c11',name:'Outros',icon:'📦'}
];
// Formato de mês aceito em todo o sistema de fechamento: "YYYY-MM" (mesmo formato já usado por
// orcMonth/getBudgetStatuses/shiftYearMonth). Declarado aqui (bem antes de ser usado por
// normalizeMonthClosureItem) porque normalizeDB() — chamada logo abaixo, na inicialização do
// script — já invoca normalizeMonthClosures()/normalizeMonthClosureItem(), que dependem desta
// constante. A declaração original ficava mais abaixo no arquivo (na seção de Fechamento mensal),
// o que causava um ReferenceError (TDZ) sempre que DB.monthClosures continha algum registro no
// carregamento — quebrando o app inteiro para qualquer usuário que já tivesse fechado um mês.
// Correção mínima e isolada: só move a declaração; nenhuma regra de fechamento foi alterada.
const MONTH_RE=/^\d{4}-(0[1-9]|1[0-2])$/;
function uid(){return Math.random().toString(36).slice(2,10)}
// Converte um objeto Date para 'yyyy-mm-dd' usando os componentes LOCAIS (ano/mês/dia), nunca
// toISOString()/UTC. Correção Etapa 6: todayISO() usava new Date().toISOString().slice(0,10),
// que reflete o dia em UTC — no horário local brasileiro (UTC-3), isso fazia "hoje" virar
// silenciosamente o dia seguinte durante as últimas horas da noite (a partir de ~21h), pois às
// 22h locais já são 01h UTC do dia seguinte. Isso afetava toda a distinção realizado/futuro
// (accBalance, faturas, projeção) justamente no fim do dia. Mesma lógica agora usada em
// periodRange() (Relatórios) e no filtro de período de Lançamentos, para não haver duas
// conversões de data diferentes no sistema.
function dateToISOLocal(d){
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function todayISO(){return dateToISOLocal(new Date())}
function escapeHTML(v){
  return String(v==null?'':v).replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
}
let toastTimer=null;
function showToast(msg){
  const t=document.getElementById('toast'); if(!t) return;
  t.textContent=msg; t.classList.add('show');
  clearTimeout(toastTimer); toastTimer=setTimeout(()=>t.classList.remove('show'),4500);
}
function showFormError(msg){
  const el=document.getElementById('formError');
  if(el){el.textContent=msg;el.style.display='block';} else showToast(msg);
}
// divide um valor em N parcelas, sempre somando exatamente o total original (ajuste de centavos na 1ª parcela)
function splitInstallments(total,n){
  const cents=Math.round(Number(total)*100);
  const base=Math.floor(cents/n);
  const remainder=cents-base*n;
  const parts=[];
  for(let i=0;i<n;i++){ parts.push((i===0?base+remainder:base)/100); }
  return parts;
}
// Correção 3B (bug #9): valores monetários sempre em 2 casas (centavos). NaN continua NaN.
function money2(v){ const n=typeof v==='number'?v:parseFloat(v); return isFinite(n)?Math.round((n+Number.EPSILON)*100)/100:NaN; }
function toCents(v){ return Math.round((Number(v)||0)*100+ (Number(v)>=0?1e-7:-1e-7)); }
// Correção 3B (bug #8): carimbo de criação/alteração do lançamento (ms). Campo opcional; dados antigos não o têm.
function stampTx(t){ t.modifiedAt=Date.now(); return t; }
// Correção 3B (bug #4): recalcula os metadados do grupo de parcelamento (index/count/totalAmount)
// a partir das parcelas que realmente restam.
function syncInstallmentGroup(groupId){
  if(!groupId) return;
  const g=DB.transactions.filter(t=>t.installment&&t.installment.groupId===groupId)
    .sort((a,b)=>(a.installment.index-b.installment.index)||(a.date<b.date?-1:a.date>b.date?1:0));
  if(!g.length) return;
  const total=g.reduce((c,t)=>c+toCents(t.amount),0)/100;
  g.forEach((t,i)=>{ t.installment=Object.assign({},t.installment,{index:i+1,count:g.length,totalAmount:total}); });
}
// Correção F4: equivalente de syncInstallmentGroup para recorrência — depois de "Apenas esta", reindexa
// (index 1..n) e recalcula count com as ocorrências que restam. Só toca em index/count; datas, valores e ids ficam intactos.
function syncRecurrenceGroup(groupId){
  if(!groupId) return;
  const g=DB.transactions.filter(t=>t.recurrence&&t.recurrence.groupId===groupId)
    .sort((a,b)=>(a.recurrence.index-b.recurrence.index)||(a.date<b.date?-1:a.date>b.date?1:0));
  if(!g.length) return;
  g.forEach((t,i)=>{ t.recurrence=Object.assign({},t.recurrence,{index:i+1,count:g.length}); });
}
// soma n meses a uma data ISO (yyyy-mm-dd) preservando o dia quando possível, sem problemas de fuso
function addMonthsISO(iso,n){
  const [y,m,d]=iso.split('-').map(Number);
  let total=(m-1)+n;
  const ny=y+Math.floor(total/12);
  const nm=((total%12)+12)%12;
  const lastDay=new Date(ny,nm+1,0).getDate();
  const day=Math.min(d,lastDay);
  return ny+'-'+String(nm+1).padStart(2,'0')+'-'+String(day).padStart(2,'0');
}
function demoData(){
  const accounts=[{id:'a1',name:'Nubank',initial:800,demo:true},{id:'a2',name:'Dinheiro',initial:150,demo:true}];
  const t=[]; const m=todayISO().slice(0,7);
  const mk=(desc,val,type,cat,acc,day)=>t.push({id:uid(),desc,amount:val,type,categoryId:cat,accountId:acc,date:m+'-'+day,note:'',demo:true});
  mk('Salário',2500,'receita',null,'a1','05');
  mk('Mercado',350,'despesa','c1','a1','07');
  mk('Uber',80,'despesa','c3','a1','09');
  mk('Aluguel',900,'despesa','c2','a1','10');
  mk('Cinema',60,'despesa','c6','a2','12');
  mk('Academia',90,'despesa','c6','a1','15');
  mk('Internet',100,'despesa','c9','a1','18');
  return {accounts,transactions:t,categories:DEFAULT_CATS,budgets:{c1:500,c3:300,c6:200},
    cards:[],goals:[],monthClosures:[],settings:{theme:'dark',reduceMotion:false}};
}
function trySave(data){
  try{ localStorage.setItem(DB_KEY,JSON.stringify(data)); return true; }
  catch(e){ return false; }
}
function loadDB(){
  let raw=null;
  try{ raw=localStorage.getItem(DB_KEY); }
  catch(e){ raw=null; }
  if(!raw){const d=demoData();trySave(d);return d;}
  let parsed;
  try{parsed=JSON.parse(raw)}
  catch(e){
    const d=demoData();trySave(d);
    setTimeout(()=>showToast('Os dados salvos estavam corrompidos e foram reiniciados com dados de demonstração.'),0);
    return d;
  }
  return ensureDBShape(parsed);
}
// Correção F5: JSON sintaticamente válido, porém sem a estrutura mínima de um DB (null, {}, [], número/texto,
// sem accounts/transactions/categories, coleções que não são arrays de objetos). Antes, esse valor seguia direto
// para normalizeDB() e derrubava o app (tela branca). Aqui a chave EXISTE, então não é primeira instalação:
// não recria demo; mantém tudo que for válido (coleções, settings) e completa o resto com vazio/padrão.
// Um DB com a estrutura mínima correta é devolvido exatamente como estava (caminho normal inalterado).
function ensureDBShape(p){
  const isObj=p!=null&&typeof p==='object'&&!Array.isArray(p);
  if(isObj&&isRecordArray(p.accounts)&&isRecordArray(p.transactions)&&isRecordArray(p.categories)
     &&(p.cards===undefined||isRecordArray(p.cards))) return p;
  const s=isObj?p:{};
  const d=normalizeDB({
    accounts:isRecordArray(s.accounts)?s.accounts:[],
    transactions:isRecordArray(s.transactions)?s.transactions:[],
    categories:(isRecordArray(s.categories)&&s.categories.length)?s.categories:DEFAULT_CATS,
    budgets:s.budgets,cards:isRecordArray(s.cards)?s.cards:[],goals:s.goals,monthClosures:s.monthClosures,
    notificationState:s.notificationState,settings:s.settings
  });
  trySave(d);
  setTimeout(()=>showToast('Os dados salvos estavam incompletos. O que era válido foi mantido e o restante foi reiniciado.'),0);
  return d;
}
function saveDB(){
  const ok=trySave(DB);
  if(!ok) showToast('Não foi possível salvar. O armazenamento local está indisponível ou bloqueado — as alterações podem se perder ao recarregar.');
  return ok;
}
// Compatibilidade com dados de etapas anteriores: garante installment.totalAmount e recurrence.frequency
// em transações antigas, sem apagar ou migrar nada além disso.
function normalizeDB(db){
  // Correção #1: categories:[] (JSON válido) deixava os seletores vazios — repõe as categorias padrão. Lista não vazia nunca é tocada.
  if(Array.isArray(db.categories)&&db.categories.length===0) db.categories=DEFAULT_CATS.map(c=>Object.assign({},c));
  // Etapa 4: cartões são opcionais e não são criados automaticamente para dados existentes.
  db.cards=db.cards||[];
  // Auditoria 2 (achado 3): settings ausente/null/não-objeto vira {theme:'dark',reduceMotion:false};
  // settings parcial preserva os valores válidos e completa só o que falta. Nenhuma outra chave
  // de settings é tocada.
  if(!db.settings||typeof db.settings!=='object'||Array.isArray(db.settings)) db.settings={};
  if(db.settings.theme!=='light'&&db.settings.theme!=='dark') db.settings.theme='dark';
  if(typeof db.settings.reduceMotion!=='boolean') db.settings.reduceMotion=false;
  // V1.2.3: proteção defensiva em runtime — DB.budgets ausente/corrompido nunca deve quebrar a
  // tela de Orçamento nem o Dashboard. validateBackupData() já trata "budgets" como opcional
  // (mesmo padrão de cards/goals); esta linha é a rede de segurança complementar, cobrindo tanto
  // o backup importado quanto o localStorage que já esteja com esse campo ausente/corrompido.
  if(!db.budgets||typeof db.budgets!=='object'||Array.isArray(db.budgets)) db.budgets={};
  // V1.2.2: metas são opcionais e puramente informativas — instalações/backups antigos sem
  // DB.goals recebem um array vazio. normalizeGoals() (definida mais abaixo, na seção de metas)
  // também sanitiza cada item existente sem inventar dados financeiros.
  normalizeGoals(db);
  // V2.0.1: fechamento mensal é puramente administrativo (mês + data de fechamento + observação
  // opcional) — instalações/backups antigos sem DB.monthClosures recebem um array vazio.
  // normalizeMonthClosures() (definida na seção de Fechamento mensal) também descarta registros
  // corrompidos (mês em formato inválido) e nunca deixa mais de um fechamento para o mesmo mês,
  // sem inventar dados financeiros e sem lançar erro.
  normalizeMonthClosures(db);
  // V1.1.1: estado de leitura das notificações — apenas os ids já lidos, nunca as notificações
  // em si (que são sempre derivadas dos dados atuais). Compatível com instalações/backups antigos
  // que não possuíam esse campo.
  if(!db.notificationState||typeof db.notificationState!=='object'||Array.isArray(db.notificationState)){
    db.notificationState={readIds:[]};
  }
  if(!Array.isArray(db.notificationState.readIds)) db.notificationState.readIds=[];
  db.transactions.forEach(t=>{
    if(t.installment && t.installment.totalAmount==null){
      const group=db.transactions.filter(x=>x.installment && x.installment.groupId===t.installment.groupId);
      t.installment.totalAmount=group.reduce((s,x)=>s+Number(x.amount),0);
    }
    if(t.recurrence && !t.recurrence.frequency){
      t.recurrence.frequency='monthly';
    }
  });
  return db;
}
let DB=normalizeDB(loadDB());
document.documentElement.setAttribute('data-theme',DB.settings.theme==='light'?'light':'dark');
if(DB.settings.reduceMotion) document.body.classList.remove('motion');

function fmt(v){return 'R$ '+Number(v||0).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2})}
function catById(id){return DB.categories.find(c=>c.id===id)}
// Correção #2: transação sem categoryId vira a chave "undefined"/"null" nos agrupamentos por categoria — nunca exibir isso.
function missingCatLabel(cid){ return (cid==null||cid===''||cid==='undefined'||cid==='null')?'Sem categoria':cid; }
function accById(id){return DB.accounts.find(a=>a.id===id)}
// Saldo atual considera apenas lançamentos já ocorridos (data <= hoje). Lançamentos futuros
// (parcelas/recorrências à frente) não são descontados automaticamente do saldo bancário atual.
function accBalance(accId){
  const acc=accById(accId); if(!acc) return 0;
  let bal=Number(acc.initial||0);
  const today=todayISO();
  DB.transactions.forEach(t=>{
    if(t.date>today) return;
    if(t.type==='receita' && t.accountId===accId) bal+=Number(t.amount);
    if(t.type==='despesa' && t.accountId===accId) bal-=Number(t.amount);
    // Pagamento de fatura é o único momento em que o cartão afeta o saldo bancário.
    if(t.type==='pagamento_fatura' && t.accountId===accId) bal-=Number(t.amount);
    if(t.type==='transferencia'){
      if(t.accountId===accId) bal-=Number(t.amount);
      if(t.toAccountId===accId) bal+=Number(t.amount);
    }
  });
  return bal;
}
function totalBalance(){return DB.accounts.reduce((s,a)=>s+accBalance(a.id),0)}

// ================== ETAPA 4 — CARTÃO DE CRÉDITO ==================
// Regra central: uma compra no cartão (type:'cartao') NUNCA mexe no saldo bancário.
// Ela só ocupa limite e entra numa fatura. O saldo bancário só é afetado quando a fatura é
// paga, através de um lançamento próprio (type:'pagamento_fatura') que referencia a conta e
// o período da fatura quitada. Isso é o que impede a compra de ser descontada duas vezes.
function cardById(id){return DB.cards.find(c=>c.id===id)}

// Devolve a data de fechamento (ISO) do ciclo de fatura ao qual uma compra pertence.
// Regra: compra até o dia do fechamento (inclusive) entra no ciclo que fecha nesse mês;
// depois do fechamento, entra no ciclo que fecha no mês seguinte. O dia de fechamento é
// ajustado para o último dia do mês quando o mês for mais curto (ex: fechamento dia 31 em fevereiro).
function getInvoicePeriod(card,dateISO){
  const [y,m,d]=dateISO.split('-').map(Number);
  let closeY=y, closeM=m;
  if(d>card.closingDay){ closeM++; if(closeM>12){closeM=1;closeY++;} }
  const lastDay=new Date(closeY,closeM,0).getDate();
  const closeDay=Math.min(card.closingDay,lastDay);
  return closeY+'-'+String(closeM).padStart(2,'0')+'-'+String(closeDay).padStart(2,'0');
}
// Correção 3A (bug #1): identidade estável da fatura de uma compra.
// O pagamento de fatura guarda invoicePeriod (data de fechamento do ciclo). Se o período das
// compras fosse SEMPRE recalculado a partir do closingDay atual, mudar o dia de fechamento
// faria as compras de uma fatura já paga caírem em outro período e o pagamento ficaria órfão
// (a fatura voltaria a ficar devida). Por isso, quando o fechamento de um cartão muda, as compras
// que pertencem a faturas que já têm pagamento recebem um invoicePeriod fixo (e o dia de
// fechamento vigente, invoiceClosingDay, para o vencimento não "escorregar"). Ver
// freezePaidInvoicePeriods. Compras sem esses campos continuam usando getInvoicePeriod(), como antes.
function txInvoicePeriod(card,t){
  if(typeof t.invoicePeriod==='string' && /^\d{4}-\d{2}-\d{2}$/.test(t.invoicePeriod)) return t.invoicePeriod;
  return getInvoicePeriod(card,t.date);
}
// Dia de fechamento que vale para uma fatura ao decidir em que mês ela vence: o fixado junto com o
// período ou, sem isso, o do cartão.
function invoiceClosingRef(card,items){
  const it=items.find(t=>typeof t.invoicePeriod==='string' && Number.isInteger(t.invoiceClosingDay) && t.invoiceClosingDay>=1 && t.invoiceClosingDay<=31);
  return it?it.invoiceClosingDay:card.closingDay;
}
// Deve ser chamada ANTES de alterar card.closingDay: grava o período atual nas compras cujas
// faturas já têm algum pagamento (realizado ou agendado), para que continuem casando com ele.
function freezePaidInvoicePeriods(card){
  const paidPeriods=new Set(DB.transactions.filter(t=>t.type==='pagamento_fatura'&&t.cardId===card.id).map(t=>t.invoicePeriod));
  if(!paidPeriods.size) return;
  DB.transactions.forEach(t=>{
    if(t.type!=='cartao'||t.cardId!==card.id) return;
    const p=txInvoicePeriod(card,t);
    if(paidPeriods.has(p) && typeof t.invoicePeriod!=='string'){ t.invoicePeriod=p; t.invoiceClosingDay=card.closingDay; }
  });
}
// Data de vencimento de uma fatura a partir da sua data de fechamento. Se o dia de vencimento
// for menor que o de fechamento, o vencimento cai no mês seguinte ao do fechamento.
function invoiceDueDate(card,closingISO,closingDayRef){
  const [y,m]=closingISO.split('-').map(Number);
  let dueY=y, dueM=m;
  const refClosing=closingDayRef||card.closingDay;
  if(card.dueDay<refClosing){ dueM++; if(dueM>12){dueM=1;dueY++;} }
  const lastDay=new Date(dueY,dueM,0).getDate();
  const dueDay=Math.min(card.dueDay,lastDay);
  return dueY+'-'+String(dueM).padStart(2,'0')+'-'+String(dueDay).padStart(2,'0');
}
// Uma fatura é paga (isInvoicePaid) apenas quando ela tem valor (total>0) E a soma dos
// pagamentos JÁ REALIZADOS cobre o total — nunca pela mera existência de um pagamento, e nunca
// uma fatura de valor zero (sem nenhuma compra) é tratada como "paga" por essa comparação trivial.
//
// IMPORTANTE (correção pós-Etapa 4): "paidAmount"/"remaining" aqui consideram somente pagamentos
// já REALIZADOS (data <= hoje) — coerente com accBalance(), que também ignora lançamentos futuros.
// Um pagamento agendado para o futuro NÃO libera limite antes de sua data efetiva; ele só entra
// em jogo através de futureCardPaymentsScheduled()/futureCardPayments(), usado na projeção.
function getInvoicePaidAmount(cardId,period){
  const today=todayISO();
  return DB.transactions.filter(t=>t.type==='pagamento_fatura'&&t.cardId===cardId&&t.invoicePeriod===period&&t.date<=today)
    .reduce((s,t)=>s+Number(t.amount),0);
}
// Soma de pagamentos JÁ AGENDADOS para o futuro (data > hoje) para uma fatura específica —
// dinheiro que sairá da conta, mas que ainda não saiu e por isso ainda não libera limite.
function getInvoiceScheduledFuturePayment(cardId,period){
  const today=todayISO();
  return DB.transactions.filter(t=>t.type==='pagamento_fatura'&&t.cardId===cardId&&t.invoicePeriod===period&&t.date>today)
    .reduce((s,t)=>s+Number(t.amount),0);
}
function getInvoiceForPeriod(card,period){
  const items=DB.transactions.filter(t=>t.type==='cartao'&&t.cardId===card.id&&txInvoicePeriod(card,t)===period);
  const total=items.reduce((s,t)=>s+Number(t.amount),0);
  const paidAmount=getInvoicePaidAmount(card.id,period); // só pagamentos já realizados
  const scheduledFuture=getInvoiceScheduledFuturePayment(card.id,period);
  const remaining=Math.max(0,total-paidAmount); // o que ainda falta pagar, ignorando o que só está agendado
  // Fatura sem nenhuma compra (total 0) nunca é "paga": exige total>0 além de paidAmount>=total,
  // evitando o falso-positivo de 0>=0.
  const paid=total>0 && paidAmount>=total-1e-9; // tolera pequenos erros de ponto flutuante
  return {period,closingDate:period,dueDate:invoiceDueDate(card,period,invoiceClosingRef(card,items)),total,items,paidAmount,scheduledFuture,remaining,paid};
}
function getInvoiceRemaining(card,period){ return getInvoiceForPeriod(card,period).remaining; }
function isInvoicePaid(card,period){ return getInvoiceForPeriod(card,period).paid; }
function getInvoice(card,referenceDate){ return getInvoiceForPeriod(card,getInvoicePeriod(card,referenceDate)); }
function getCurrentInvoice(card){ return getInvoice(card,todayISO()); }
function getFutureInvoices(card){
  const currentPeriod=getInvoicePeriod(card,todayISO());
  const periods=[...new Set(DB.transactions.filter(t=>t.type==='cartao'&&t.cardId===card.id).map(t=>txInvoicePeriod(card,t)))]
    .filter(p=>p>currentPeriod).sort();
  return periods.map(p=>getInvoiceForPeriod(card,p));
}
// Todas as faturas (de qualquer período — passado, atual ou futuro) que ainda têm saldo em
// aberto (remaining>0), ordenadas da mais antiga para a mais nova. Usado tanto para o limite
// quanto para a seção "Faturas em aberto" da tela de Cartões — nenhuma fatura anterior fica
// escondida só porque já existe uma fatura mais recente.
function getOpenInvoices(card){
  const periods=[...new Set(DB.transactions.filter(t=>t.type==='cartao'&&t.cardId===card.id).map(t=>txInvoicePeriod(card,t)))].sort();
  return periods.map(p=>getInvoiceForPeriod(card,p)).filter(inv=>inv.remaining>0);
}
// "Limite utilizado" = soma do saldo AINDA NÃO PAGO (remaining, baseado em pagamentos já
// REALIZADOS) de TODAS as faturas do cartão — passadas, atual e futuras (parcelas ainda não
// vencidas já comprometem limite desde a compra). Um pagamento parcial libera só a parte paga;
// a diferença continua ocupando limite. Um pagamento agendado para o futuro NÃO libera limite
// até sua data efetiva (ver getInvoicePaidAmount).
function cardUsed(cardId){
  const card=cardById(cardId); if(!card) return 0;
  const periods=[...new Set(DB.transactions.filter(t=>t.type==='cartao'&&t.cardId===cardId).map(t=>txInvoicePeriod(card,t)))];
  return periods.reduce((s,p)=>s+getInvoiceForPeriod(card,p).remaining,0);
}
function cardAvailable(cardId){ const card=cardById(cardId); if(!card) return 0; return Number(card.limit)-cardUsed(cardId); }
function cardCurrentInvoice(cardId){ const card=cardById(cardId); if(!card) return null; return getCurrentInvoice(card); }
// Todos os pares (cartão, período) que já tiveram alguma compra registrada — base para o cálculo
// das obrigações futuras de cartão na projeção (ver futureCardObligations()).
function allInvoicePeriods(){
  const map={};
  DB.transactions.filter(t=>t.type==='cartao').forEach(t=>{
    const card=cardById(t.cardId); if(!card) return;
    const period=txInvoicePeriod(card,t);
    map[card.id+'|'+period]={card,period};
  });
  return Object.values(map);
}
// Compromisso futuro de cartão = para cada fatura, o saldo ainda não pago (remaining, baseado em
// pagamentos JÁ REALIZADOS) MENOS a parte que já está agendada para sair no futuro
// (scheduledFuture) — essa parte agendada é contada separadamente em futureCardPayments(), então
// subtraí-la aqui é o que evita a dupla contagem. Ou seja, para qualquer fatura:
//   obrigação (aqui) + pagamento agendado (futureCardPayments) === saldo total ainda devido
// nunca mais que isso, nunca menos.
// Exemplo: fatura R$500, sem pagamento nenhum -> obrigação=500, pagamento agendado=0 -> total 500.
// Fatura R$500, pagamento futuro agendado de R$500 -> obrigação=max(0,500-500)=0, pagamento
// agendado=500 -> total 500 (nunca 1000).
// Fatura R$500, pagamento futuro agendado de R$100 -> obrigação=max(0,500-100)=400, agendado=100
// -> total 500.
function futureCardObligations(){
  return allInvoicePeriods().reduce((s,{card,period})=>{
    const inv=getInvoiceForPeriod(card,period);
    return s+Math.max(0,inv.remaining-inv.scheduledFuture);
  },0);
}
// Pagamentos de fatura já agendados para o futuro (data > hoje) — a contrapartida de
// futureCardObligations() acima; juntas as duas funções nunca ultrapassam o saldo total devido.
function futureCardPayments(){
  return DB.transactions.filter(t=>t.type==='pagamento_fatura'&&isFutureDate(t.date)).reduce((s,t)=>s+Number(t.amount),0);
}
// ================== FIM ETAPA 4 ==================

function monthTx(ym){return DB.transactions.filter(t=>t.date.slice(0,7)===ym)}
// Só considera "já realizado" o que tem data <= hoje, mesmo dentro do mês corrente.
function realizedMonthTx(ym){ const today=todayISO(); return monthTx(ym).filter(t=>t.date<=today); }
function monthIn(ym){return realizedMonthTx(ym).filter(t=>t.type==='receita').reduce((s,t)=>s+Number(t.amount),0)}
function monthOut(ym){return realizedMonthTx(ym).filter(isExpenseLike).reduce((s,t)=>s+Number(t.amount),0)}

// ---- Base para "Disponível projetado" (preparação; Dashboard ainda não foi redesenhado) ----
function isFutureDate(dateStr){ return dateStr>todayISO(); }
function futureTx(){ return DB.transactions.filter(t=>isFutureDate(t.date)); }
function futureExpenses(){ return futureTx().filter(t=>t.type==='despesa').reduce((s,t)=>s+Number(t.amount),0); }
function futureIncome(){ return futureTx().filter(t=>t.type==='receita').reduce((s,t)=>s+Number(t.amount),0); }
function futureInstallments(){ return futureTx().filter(t=>!!t.installment); }
function futureRecurring(){ return futureTx().filter(t=>!!t.recurrence); }

// Disponível projetado = saldo atual (já realizado) + entradas futuras - despesas futuras
// - obrigações futuras de cartão - pagamentos de fatura já agendados para o futuro.
// Reaproveita totalBalance()/futureIncome()/futureExpenses() — nenhuma lógica paralela.
// Transferências (type 'transferencia') nunca entram em futureIncome/futureExpenses, pois elas
// só somam type 'receita'/'despesa' — por isso uma transferência futura é automaticamente neutra
// no total consolidado (não soma nem subtrai).
// Compras no cartão (type 'cartao') também nunca entram em futureExpenses (tipo diferente de
// 'despesa'), então nunca são descontadas do saldo diretamente — só entram via as duas parcelas
// de cartão abaixo, que já se excluem mutuamente por fatura (ver futureCardObligations/futureCardPayments).
function projectedBalance(){
  const currentBalance=totalBalance();
  const futInc=futureIncome();
  const futExp=futureExpenses();
  const cardObl=futureCardObligations();
  const cardPay=futureCardPayments();
  return {
    currentBalance,
    futureIncome:futInc,
    futureExpenses:futExp,
    futureCardObligations:cardObl,
    futureCardPayments:cardPay,
    projectedBalance:currentBalance+futInc-futExp-cardObl-cardPay
  };
}

// ================== V1.1.1 — CENTRAL DE NOTIFICAÇÕES ==================
// Notificações nunca são persistidas em si — são sempre recalculadas a partir dos dados atuais
// (cartões, faturas, parcelamentos, recorrências, projeção e orçamento), reaproveitando as mesmas
// funções já existentes, sem duplicar nenhuma regra financeira. O único estado persistido é o
// conjunto de ids já lidos (DB.notificationState.readIds), o que evita duas coisas: (1) uma
// notificação parecer "nova" de novo só porque a página recarregou, e (2) qualquer acúmulo de
// dados — o próprio ato de marcar como lida já poda os ids que não pertencem à lista atual.
//
// Cada notificação tem um id determinístico ligado ao evento que a gerou (ex.: cartão+período da
// fatura, id do lançamento, categoria+mês do orçamento), então o mesmo evento nunca gera duas
// notificações diferentes em renderizações sucessivas.
function parseISOLocal(iso){ const [y,m,d]=iso.split('-').map(Number); return new Date(y,m-1,d); }
// Diferença em dias inteiros (iso - fromISO), sem risco de fuso: ambas as datas são convertidas
// para meia-noite local antes da subtração (mesma técnica de dateToISOLocal).
function daysDiffISO(iso,fromISO){ return Math.round((parseISOLocal(iso)-parseISOLocal(fromISO))/86400000); }

function getNotifications(){
  const today=todayISO();
  const list=[];

  // A) Fatura próxima do vencimento (até 3 dias) e B) Fatura vencida.
  // Reaproveita getOpenInvoices(), que já cobre todas as faturas (de qualquer cartão/período) com
  // saldo em aberto — nenhuma lógica de fatura nova é criada aqui.
  DB.cards.forEach(card=>{
    getOpenInvoices(card).forEach(inv=>{
      const diff=daysDiffISO(inv.dueDate,today);
      if(diff<0){
        list.push({id:'inv_overdue_'+card.id+'_'+inv.period,type:'invoice_overdue',
          title:'Fatura vencida',message:`Fatura do cartão ${card.name} está vencida.`,
          date:inv.dueDate,severity:'danger'});
      } else if(diff<=3){
        list.push({id:'inv_due_'+card.id+'_'+inv.period,type:'invoice_due_soon',
          title:'Fatura próxima do vencimento',
          message:diff===0?`Fatura do cartão ${card.name} vence hoje.`:`Fatura do cartão ${card.name} vence em ${diff} dia${diff>1?'s':''}.`,
          date:inv.dueDate,severity:'warning'});
      }
    });
  });

  // C) Parcela/recorrência próxima (nos próximos 3 dias). Compras no cartão (type 'cartao') não
  // entram aqui: sua data é a de entrada na fatura, não uma data de vencimento própria — esse
  // aviso já é coberto pela fatura em A/B, evitando duas notificações para o mesmo compromisso.
  DB.transactions.forEach(t=>{
    if(t.type==='cartao'||t.type==='pagamento_fatura') return;
    if(!(t.installment||t.recurrence)) return;
    const diff=daysDiffISO(t.date,today);
    if(diff>=0 && diff<=3){
      const noun=t.installment?'Parcela':'Recorrência';
      list.push({id:'occ_'+t.id,type:'installment_due_soon',
        title:`${noun} próxima`,
        message:diff===0?`${noun} de ${t.desc} vence hoje.`:`${noun} de ${t.desc} vence em ${diff} dia${diff>1?'s':''}.`,
        date:t.date,severity:'warning'});
    }
  });

  // D) Saldo projetado negativo — reaproveita projectedBalance() sem nenhum cálculo paralelo.
  const proj=projectedBalance();
  if(proj.projectedBalance<0){
    list.push({id:'balance_negative_'+today,type:'projected_negative',
      title:'Saldo projetado negativo',
      message:`Seu saldo projetado ficará negativo: ${fmt(proj.projectedBalance)}.`,
      date:today,severity:'danger'});
  }

  // E) Orçamento próximo do limite (>=80%) e F) Orçamento excedido (>=100%) — V1.2.3: reaproveita
  // a MESMA função central getBudgetStatuses() usada pela tela de Orçamento e pelo resumo do
  // Dashboard, em vez de recalcular o gasto por categoria aqui (evita duas réguas diferentes de
  // "quanto já foi gasto" — inclusive quanto a compras no cartão contarem como gasto). Mantém
  // exatamente os mesmos dois eventos/ids/severidades de antes: nunca os dois ao mesmo tempo para
  // a mesma categoria, e nenhum evento novo.
  const ym=today.slice(0,7);
  const budgetStatus=getBudgetStatuses(ym);
  budgetStatus.rows.forEach(r=>{
    const name=r.category?r.category.name:r.categoryId;
    if(r.percentage>=100){
      list.push({id:'budget_exceeded_'+ym+'_'+r.categoryId,type:'budget_exceeded',
        title:'Orçamento excedido',message:`Orçamento de ${name} ultrapassado.`,date:today,severity:'danger'});
    } else if(r.percentage>=80){
      list.push({id:'budget_warning_'+ym+'_'+r.categoryId,type:'budget_warning',
        title:'Orçamento próximo do limite',message:`${name} atingiu ${r.percentage.toFixed(0)}% do orçamento.`,date:today,severity:'warning'});
    }
  });

  const readSet=new Set((DB.notificationState&&DB.notificationState.readIds)||[]);
  list.forEach(n=>{ n.read=readSet.has(n.id); });

  const sevRank={danger:0,warning:1,info:2};
  list.sort((a,b)=>(sevRank[a.severity]-sevRank[b.severity])||a.date.localeCompare(b.date));
  return list;
}

function markNotificationRead(id){
  DB.notificationState=DB.notificationState||{readIds:[]};
  const set=new Set(DB.notificationState.readIds); set.add(id);
  // Poda: mantém apenas ids que ainda correspondem a notificações atualmente exibidas, para o
  // localStorage nunca acumular ids de notificações já resolvidas (fatura paga, orçamento do mês
  // anterior etc.).
  const currentIds=new Set(getNotifications().map(n=>n.id));
  DB.notificationState.readIds=[...set].filter(id2=>currentIds.has(id2));
  saveDB();
}
function markAllNotificationsRead(){
  DB.notificationState=DB.notificationState||{readIds:[]};
  DB.notificationState.readIds=getNotifications().map(n=>n.id);
  saveDB();
}

function notifSeverityLabel(sev){ return sev==='danger'?'Crítico':(sev==='warning'?'Atenção':'Info'); }
function notifSeverityClass(sev){ return sev==='danger'?'tag-red':(sev==='warning'?'tag-yellow':'tag-accent'); }
function notifPanelHTML(list){
  if(!list.length){
    return `<h3 id="modalTitle">Notificações</h3><p class="muted">Nenhuma notificação no momento.</p>
    <div style="display:flex;justify-content:flex-end;margin-top:10px"><button class="ghost" onclick="closeModal()">Fechar</button></div>`;
  }
  const unreadCount=list.filter(n=>!n.read).length;
  const rows=list.map(n=>`<div class="notif-item${n.read?' is-read':''}">
      <div>
        <div style="font-weight:${n.read?400:700}">${escapeHTML(n.title)}
          <span class="tag ${notifSeverityClass(n.severity)}" style="margin-left:4px">${notifSeverityLabel(n.severity)}</span>
        </div>
        <div class="muted" style="font-size:13px;margin-top:2px">${escapeHTML(n.message)}</div>
        <div class="muted" style="font-size:11px;margin-top:2px">${escapeHTML(n.date.split('-').reverse().join('/'))}</div>
      </div>
      ${n.read?'':`<button class="ghost" data-marknotif="${escapeHTML(n.id)}" style="padding:3px 8px;white-space:nowrap" aria-label="Marcar '${escapeHTML(n.title)}' como lida">✔</button>`}
    </div>`).join('');
  return `<h3 id="modalTitle">Notificações</h3>
  <div style="display:flex;justify-content:flex-end;margin-bottom:4px">
    ${unreadCount>0?'<button class="ghost" id="markAllReadBtn" style="padding:5px 10px;font-size:12px">Marcar todas como lidas</button>':''}
  </div>
  <div>${rows}</div>
  <div style="display:flex;justify-content:flex-end;margin-top:10px"><button class="ghost" id="notifCloseBtn">Fechar</button></div>`;
}
function bindNotifPanelEvents(){
  document.querySelectorAll('[data-marknotif]').forEach(b=>b.onclick=()=>{
    markNotificationRead(b.dataset.marknotif);
    refreshNotifPanel();
    updateNotifBell();
  });
  const allBtn=document.getElementById('markAllReadBtn');
  if(allBtn) allBtn.onclick=()=>{
    markAllNotificationsRead();
    refreshNotifPanel();
    updateNotifBell();
  };
  const closeBtn=document.getElementById('notifCloseBtn');
  if(closeBtn) closeBtn.onclick=()=>closeModal();
}
// Atualiza o conteúdo do modal já aberto sem recriá-lo (mantém o listener de ESC/clique-fora e não
// rouba o foco a cada "marcar como lida"); devolve o foco a um botão do próprio painel em seguida.
function refreshNotifPanel(){
  const modal=document.querySelector('#modalRoot .modal');
  if(!modal) return;
  modal.innerHTML=notifPanelHTML(getNotifications());
  bindNotifPanelEvents();
  const firstBtn=modal.querySelector('button');
  if(firstBtn) firstBtn.focus();
}
function openNotifPanel(){
  openModal(notifPanelHTML(getNotifications()),'modalTitle');
  bindNotifPanelEvents();
}
function updateNotifBell(){
  const btn=document.getElementById('notifBtn'), badge=document.getElementById('notifBadge');
  if(!btn||!badge) return;
  const unread=getNotifications().filter(n=>!n.read);
  if(unread.length>0){
    badge.textContent=unread.length>99?'99+':String(unread.length);
    badge.style.display='flex';
    // Vermelho reservado apenas para quando houver ao menos uma notificação crítica não lida —
    // caso contrário o discreto azul de destaque já usado no restante do sistema.
    badge.style.background=unread.some(n=>n.severity==='danger')?'var(--red)':'var(--accent)';
    btn.setAttribute('aria-label',`Notificações (${unread.length} não lida${unread.length>1?'s':''})`);
  } else {
    badge.style.display='none';
    btn.setAttribute('aria-label','Notificações');
  }
}

let route='dashboard';
// Etapa 5: 'periodo' e 'status' são novos filtros (não persistidos no localStorage, como os demais
// filtros de tela já existentes). 'todos' preserva o comportamento anterior (nenhum filtro de
// período/status aplicado) para não mudar o resultado padrão da tela de Lançamentos.
let txFilters={periodo:'todos',status:'todos',categoria:'',conta:'',cartao:'',tipo:'',busca:'',customStart:'',customEnd:'',mFrom:todayISO().slice(0,7),mTo:todayISO().slice(0,7)};
// Ordenação da lista de lançamentos — não persistida no localStorage (mantida apenas durante a navegação).

function categoryTotals(ym){
  const totals={};
  realizedMonthTx(ym).filter(isExpenseLike).forEach(t=>{totals[t.categoryId]=(totals[t.categoryId]||0)+Number(t.amount)});
  return Object.entries(totals).sort((a,b)=>b[1]-a[1]);
}

function upcomingRowsHTML(list){
  if(!list.length) return '<p class="muted">Nenhum lançamento futuro.</p>';
  return list.map(t=>{
    const accName=accById(t.accountId)?accById(t.accountId).name:'';
    const cardName=t.cardId&&cardById(t.cardId)?cardById(t.cardId).name:'';
    const sign=(t.type==='receita')?'+':(t.type==='despesa'||t.type==='cartao'||t.type==='pagamento_fatura'?'-':'');
    const cls=(t.type==='receita')?'pos':(t.type==='despesa'||t.type==='cartao'||t.type==='pagamento_fatura'?'neg':'');
    let badge='';
    if(t.type==='cartao') badge+=`<span class="tag" style="margin-left:6px">Cartão</span>`;
    if(t.installment) badge=`<span class="tag" style="margin-left:6px">Parcela ${escapeHTML(t.installment.index)}/${escapeHTML(t.installment.count)}</span>`;
    else if(t.recurrence) badge=`<span class="tag" style="margin-left:6px">Recorrente · ${escapeHTML(t.recurrence.index)}/${escapeHTML(t.recurrence.count)}</span>`;
    let sub;
    if(t.type==='transferencia') sub=`${escapeHTML(accName)} → ${escapeHTML(accById(t.toAccountId)?accById(t.toAccountId).name:'')}`;
    else if(t.type==='cartao') sub=`💳 ${escapeHTML(cardName)}`;
    else if(t.type==='pagamento_fatura') sub=`💳 ${escapeHTML(cardName)} · ${escapeHTML(accName)}`;
    else sub=escapeHTML(accName);
    return `<div class="row" style="border:none;align-items:flex-start;padding:6px 0">
      <div><div class="muted" style="font-size:12px">${escapeHTML(t.date.split('-').reverse().join('/'))}</div><div>${escapeHTML(t.desc)}${badge}</div><div class="muted" style="font-size:12px">${sub}</div></div>
      <div class="${cls}" style="font-weight:600;white-space:nowrap">${sign}${fmt(t.amount)}</div>
    </div>`;
  }).join('');
}

// ================== V1.1.2 — PRÓXIMOS COMPROMISSOS ==================
// Consolida em uma única lista cronológica os compromissos financeiros futuros que já existem
// espalhados pelo sistema, sem nenhuma lógica financeira nova: reaproveita futureTx() (mesma base
// de "Disponível projetado"/"Próximos lançamentos") e getOpenInvoices() (mesma base usada nas
// notificações e na tela de Cartões).
//
// Regra contra dupla contagem visual (ver topo do arquivo): uma compra no cartão (type 'cartao')
// nunca entra aqui como item isolado — ela já está representada pela fatura em aberto a que
// pertence (item "Fatura", abaixo), então mostrar as duas seria o mesmo compromisso bancário
// duas vezes. Transferência entre contas próprias também fica de fora: não é um compromisso
// externo, é apenas movimentação entre contas do próprio usuário (mesma razão pela qual nunca
// entra em futureIncome()/futureExpenses()/projectedBalance()).
function getNextCommitments(){
  const items=[];

  // A) Lançamentos futuros comuns (despesa/receita, incluindo parcelas e recorrências) e
  // C) pagamentos de fatura já agendados para o futuro — ambos já são 'futureTx()'.
  futureTx().forEach(t=>{
    if(t.type==='cartao'||t.type==='transferencia') return;
    items.push({date:t.date,desc:t.desc,amount:Number(t.amount),kind:t.type,
      accountId:t.accountId,cardId:t.cardId,installment:t.installment,recurrence:t.recurrence,txId:t.id});
  });

  // B) Faturas em aberto (vencida, atual ou futura) — cada fatura entra como UM único compromisso,
  // na data do vencimento, nunca pelas compras que a compõem individualmente.
  // O valor mostrado é remaining MENOS scheduledFuture — a mesma subtração já feita em
  // futureCardObligations() — porque a parte já coberta por um pagamento futuro agendado é exibida
  // separadamente como item "Pagamento de fatura" (acima); somar as duas sem essa dedução
  // duplicaria visualmente a mesma obrigação bancária. Se a fatura já está inteiramente coberta por
  // um pagamento agendado (obrigação residual = 0), ela não aparece aqui — o pagamento agendado já
  // representa o compromisso por completo.
  DB.cards.forEach(card=>{
    getOpenInvoices(card).forEach(inv=>{
      const obligation=Math.max(0,inv.remaining-inv.scheduledFuture);
      if(obligation<=1e-9) return;
      items.push({date:inv.dueDate,desc:'Fatura '+card.name,amount:obligation,kind:'fatura',cardId:card.id});
    });
  });

  items.sort((a,b)=>a.date.localeCompare(b.date));
  return items;
}
function commitmentLabel(it){
  if(it.kind==='fatura') return 'Fatura';
  if(it.kind==='pagamento_fatura') return 'Pagamento de fatura';
  if(it.installment) return 'Parcela';
  if(it.recurrence) return 'Recorrência';
  return it.kind==='receita'?'Receita':'Despesa';
}
function commitmentsRowsHTML(list){
  if(!list.length) return '<p class="muted">Nenhum compromisso futuro.</p>';
  return list.map(it=>{
    const accName=it.accountId&&accById(it.accountId)?accById(it.accountId).name:'';
    const cardName=it.cardId&&cardById(it.cardId)?cardById(it.cardId).name:'';
    const cls=it.kind==='receita'?'pos':'neg';
    const sign=it.kind==='receita'?'+':'-';
    let sub;
    if(it.kind==='fatura') sub=`💳 ${escapeHTML(cardName)}`;
    else if(it.kind==='pagamento_fatura') sub=`💳 ${escapeHTML(cardName)} · ${escapeHTML(accName)}`;
    else sub=escapeHTML(accName);
    let groupBadge='';
    if(it.installment) groupBadge=`<span class="tag" style="margin-left:6px">${escapeHTML(it.installment.index)}/${escapeHTML(it.installment.count)}</span>`;
    else if(it.recurrence) groupBadge=`<span class="tag" style="margin-left:6px">${escapeHTML(it.recurrence.index)}/${escapeHTML(it.recurrence.count)}</span>`;
    return `<div class="row" style="border:none;align-items:flex-start;padding:6px 0">
      <div><div class="muted" style="font-size:12px">${escapeHTML(it.date.split('-').reverse().join('/'))}</div>
        <div>${escapeHTML(it.desc)}<span class="tag" style="margin-left:6px">${commitmentLabel(it)}</span>${groupBadge}</div>

  }).join('');
}

// ================== V1.1.3 — FLUXO DE CAIXA ==================
// Mostra a evolução dia a dia do saldo projetado, sem nenhuma regra financeira nova: consome
// diretamente projectedBalance() (para o saldo atual) e getNextCommitments() (mesma lista já
// deduplicada usada em "Próximos compromissos" — compra no cartão nunca aparece isolada, e a
// obrigação de fatura já vem líquida do que foi coberto por pagamento futuro agendado). O gráfico
// é apenas uma reprojeção temporal desses mesmos eventos; nenhuma segunda lógica de cartão/fatura
// é criada aqui.
const CASHFLOW_PERIODS=[7,15,30,60,90];
let cashFlowDays=30;

// Soma N dias (N pode ser negativo) a uma data ISO, sempre em componentes LOCAIS — composição de
// parseISOLocal()/dateToISOLocal(), já existentes (mesma técnica usada em daysDiffISO()), nunca
// toISOString(). Cobre corretamente virada de mês/ano e meses de tamanhos diferentes, pois delega
// a aritmética ao próprio objeto Date local.
function addDaysISO(iso,n){ const d=parseISOLocal(iso); d.setDate(d.getDate()+n); return dateToISOLocal(d); }

// Calcula a série diária do saldo projetado para os próximos `days` dias.
// `commitmentsAll` é opcional — quando o chamador já tiver a lista de getNextCommitments() calculada
// (como viewDashboard() tem, para "Próximos compromissos"), ela é reaproveitada em vez de refazer a
// varredura de DB.transactions/DB.cards uma segunda vez no mesmo render.
//
// Ponto inicial (dia 0) = saldo atual (accBalance/totalBalance via projectedBalance()), sem nenhum
// ajuste — exatamente como já é mostrado no card "Saldo atual". A partir do dia 1, cada compromisso
// (despesa/receita/pagamento de fatura/obrigação de fatura já líquida) é aplicado na sua própria
// data — nunca somado de uma vez só no fim do período. Compromissos com data <= hoje (ex.: fatura já
// vencida e ainda não paga) são aplicados no dia 1: o dia 0 precisa continuar representando fielmente
// o saldo bancário atual, então qualquer obrigação já vencida (mas ainda não refletida no saldo,
// pois só um pagamento realizado mexe em accBalance()) só pode aparecer a partir do primeiro passo
// futuro do gráfico.
function computeCashFlow(days,commitmentsAll){
  const today=todayISO();
  const current=projectedBalance().currentBalance;
  const endISO=addDaysISO(today,days);
  const all=commitmentsAll||getNextCommitments();
  const commitments=all.filter(it=>it.date<=endISO);

  // Correção 3A (bug #2): itens com data <= hoje (fatura vencida ou que vence hoje, ainda não paga)
  // antes entravam em deltaByDate mas nunca eram aplicados, pois o laço só lê de amanhã em diante.
  // Eles continuam sendo obrigação real (projectedBalance() já os desconta), então são aplicados no
  // primeiro passo futuro (dia 1), mantendo o dia 0 igual ao saldo atual. Cada item entra uma única vez.
  const firstStepISO=addDaysISO(today,1);
  const deltaByDate={};
  commitments.forEach(it=>{
    const signed=it.kind==='receita'?Number(it.amount):-Number(it.amount);
    const key=it.date<=today?firstStepISO:it.date;
    deltaByDate[key]=(deltaByDate[key]||0)+signed;
  });

  const points=[{date:today,balance:current}];
  let running=current;
  for(let i=1;i<=days;i++){
    const iso=addDaysISO(today,i);
    running+=(deltaByDate[iso]||0);
    points.push({date:iso,balance:running});
  }

  const balances=points.map(p=>p.balance);
  const minBalance=Math.min(...balances);
  const minIdx=balances.indexOf(minBalance);
  const finalPoint=points[points.length-1];

  const incomeItems=commitments.filter(it=>it.kind==='receita');
  const outflowItems=commitments.filter(it=>it.kind!=='receita');
  const totalIncome=incomeItems.reduce((s,it)=>s+Number(it.amount),0);
  const totalOutflow=outflowItems.reduce((s,it)=>s+Number(it.amount),0);
  const biggestIncome=incomeItems.slice().sort((a,b)=>Number(b.amount)-Number(a.amount))[0]||null;
  const biggestOutflow=outflowItems.slice().sort((a,b)=>Number(b.amount)-Number(a.amount))[0]||null;

  return {
    days,points,currentBalance:current,
    minBalance,minDate:points[minIdx].date,
    finalBalance:finalPoint.balance,finalDate:finalPoint.date,
    totalIncome,totalOutflow,biggestIncome,biggestOutflow,
    hasNegative:balances.some(b=>b<-1e-9)
  };
}

// SVG leve, sem bibliotecas externas e sem animação — usa as mesmas CSS vars de tema já definidas
// no :root (var(--accent)/var(--red)/var(--muted)), então acompanha o tema claro/escuro atual sem
// nenhuma cor nova. Uma linha tracejada em R$ 0 e um texto explícito ("fica negativo") garantem que
// o alerta de saldo negativo nunca dependa só da cor da linha.
function cashFlowChartSVG(data){
  const w=640,h=180,padL=48,padR=12,padT=14,padB=24;
  const innerW=w-padL-padR, innerH=h-padT-padB;
  const values=data.points.map(p=>p.balance);
  let maxV=Math.max(...values), minV=Math.min(...values);
  if(maxV===minV){ maxV+=1; minV-=1; }
  const pad=(maxV-minV)*0.12||1;
  const scaleMax=maxV+pad, scaleMin=minV-pad, scaleRange=scaleMax-scaleMin;
  const n=data.points.length-1;
  const xFor=(i)=>padL+(n?(i/n)*innerW:0);
  const yFor=(v)=>padT+innerH-((v-scaleMin)/scaleRange)*innerH;

  const lineColor=data.hasNegative?'var(--red)':'var(--accent)';
  const linePoints=data.points.map((p,i)=>`${xFor(i).toFixed(1)},${yFor(p.balance).toFixed(1)}`).join(' ');

  let zeroLine='';
  if(scaleMin<0 && scaleMax>0){
    const y0=yFor(0);
    zeroLine=`<line x1="${padL}" y1="${y0.toFixed(1)}" x2="${w-padR}" y2="${y0.toFixed(1)}" stroke="var(--muted)" stroke-width="1" stroke-dasharray="4 3"/>
    <text x="${w-padR}" y="${(y0-4).toFixed(1)}" font-size="10" fill="var(--muted)" text-anchor="end">R$ 0</text>`;
  }

  const minIdx=values.indexOf(data.minBalance);
  const minMarker=`<circle cx="${xFor(minIdx).toFixed(1)}" cy="${yFor(data.minBalance).toFixed(1)}" r="4" fill="${data.hasNegative?'var(--red)':'var(--accent)'}" stroke="var(--card)" stroke-width="1.5"/>`;

  const startLabel=data.points[0].date.split('-').reverse().join('/');
  const endLabel=data.points[data.points.length-1].date.split('-').reverse().join('/');
  const ariaLabel=escapeHTML(`Gráfico de evolução do saldo projetado de ${startLabel} a ${endLabel}. `+
    `Saldo atual ${fmt(data.currentBalance)}, menor saldo projetado ${fmt(data.minBalance)} em ${escapeHTML(data.minDate.split('-').reverse().join('/'))}, `+
    `saldo ao final do período ${fmt(data.finalBalance)}.`+(data.hasNegative?' O saldo projetado fica negativo neste período.':''));

  return `<svg viewBox="0 0 ${w} ${h}" width="100%" height="${h}" role="img" aria-label="${ariaLabel}">
    <title>Evolução do saldo projetado</title>
    ${zeroLine}
    <polyline points="${linePoints}" fill="none" stroke="${lineColor}" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
    ${minMarker}
    <text x="${padL}" y="${h-6}" font-size="10" fill="var(--muted)">${startLabel}</text>
    <text x="${w-padR}" y="${h-6}" font-size="10" fill="var(--muted)" text-anchor="end">${endLabel}</text>
  </svg>`;
}
// Monta o card completo (título, seletor de período, gráfico e resumo). `commitmentsAll` é
// repassado a computeCashFlow() para reaproveitar a mesma varredura já feita para "Próximos
// compromissos" no mesmo render (ver comentário de computeCashFlow acima).
function cashFlowCardHTML(commitmentsAll){
  const data=computeCashFlow(cashFlowDays,commitmentsAll);
  const periodOpts=CASHFLOW_PERIODS.map(d=>`<option value="${d}" ${d===cashFlowDays?'selected':''}>${d} dias</option>`).join('');
  const negativeAlert=data.hasNegative?`<p class="muted" style="color:var(--red);margin:8px 0 0" role="status">⚠ O saldo projetado fica negativo neste período.</p>`:'';
  const fmtLabel=(it)=>it?`${escapeHTML(it.desc)} — ${fmt(it.amount)} (${escapeHTML(it.date.split('-').reverse().join('/'))})`:null;
  const biggestIncomeLabel=fmtLabel(data.biggestIncome)||'Nenhuma receita futura';
  const biggestOutflowLabel=fmtLabel(data.biggestOutflow)||'Nenhuma saída futura';

  return `
  <div class="card" style="margin-bottom:20px">
    <div class="row" style="border:none;padding:0 0 6px;align-items:flex-start;flex-wrap:wrap;gap:8px">
      <div>
        <h3 style="margin:0 0 2px">Fluxo de caixa</h3>
        <p class="muted" style="margin:0;font-size:12px">Evolução projetada do seu saldo disponível nos próximos dias.</p>
      </div>
      <div style="margin-left:auto">
        <label for="cashFlowPeriod" style="margin-bottom:2px">Período</label>
        <select id="cashFlowPeriod" style="width:auto" aria-label="Selecionar período do fluxo de caixa">${periodOpts}</select>
      </div>
    </div>
    <div style="margin:10px 0 4px;overflow-x:auto">${cashFlowChartSVG(data)}</div>
    ${negativeAlert}
    <div class="two-col" style="margin:14px 0 0">
      <div>
        <div class="row" style="border:none;padding:3px 0"><span class="muted">Saldo atual</span><span style="font-weight:600">${fmt(data.currentBalance)}</span></div>
        <div class="row" style="border:none;padding:3px 0"><span class="muted">Menor saldo projetado</span><span style="font-weight:600" class="${data.minBalance<0?'neg':''}">${fmt(data.minBalance)} em ${escapeHTML(data.minDate.split('-').reverse().join('/'))}</span></div>
        <div class="row" style="border:none;padding:3px 0"><span class="muted">Saldo em ${data.days} dias</span><span style="font-weight:600" class="${data.finalBalance<0?'neg':''}">${fmt(data.finalBalance)}</span></div>
      </div>
      <div>
        <div class="row" style="border:none;padding:3px 0"><span class="muted">Receitas futuras no período</span><span class="pos">${fmt(data.totalIncome)}</span></div>
        <div class="row" style="border:none;padding:3px 0"><span class="muted">Saídas futuras no período</span><span class="neg">${fmt(data.totalOutflow)}</span></div>
        <div style="padding:3px 0"><div class="muted">Maior receita futura</div><div style="font-size:13px">${biggestIncomeLabel}</div></div>
        <div style="padding:3px 0"><div class="muted">Maior saída futura</div><div style="font-size:13px">${biggestOutflowLabel}</div></div>
      </div>
    </div>
  </div>`;
}

// ================== V1.1.4 — DASHBOARD REFINADO ==================
// Banner de alerta do Dashboard: puramente apresentacional. Não cria nenhuma segunda lista de
// notificações nem regra de severidade nova — lê a MESMA lista de getNotifications() (já usada
// pelo sino/central) e reaproveita notifSeverityLabel()/notifSeverityClass(), os mesmos rótulos e
// cores já usados na Central de Notificações. O clique abre o mesmo painel de sempre
// (openNotifPanel()), então não há duplicação de comportamento — só uma prévia visível sem precisar
// abrir o sino.
function dashboardAlertBannerHTML(notifs){
  const unread=notifs.filter(n=>!n.read);
  if(!unread.length) return '';
  const rank={danger:0,warning:1,info:2};
  const top=unread.slice().sort((a,b)=>rank[a.severity]-rank[b.severity])[0];
  const borderVar=top.severity==='danger'?'var(--red)':(top.severity==='warning'?'var(--yellow)':'var(--accent)');
  return `<div class="card dash-alert" style="margin-bottom:16px;border-left-color:${borderVar}">
    <div class="row" style="border:none;padding:0;align-items:flex-start;flex-wrap:wrap;gap:10px">
      <div>
        <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">
          <span class="tag ${notifSeverityClass(top.severity)}">${notifSeverityLabel(top.severity)}</span>
          <strong>${unread.length} notificaç${unread.length>1?'ões':'ão'} não lida${unread.length>1?'s':''}</strong>
        </div>
        <div class="muted" style="font-size:13px;margin-top:4px">${escapeHTML(top.title)}: ${escapeHTML(top.message)}</div>
      </div>
      <button class="ghost" id="btnDashboardNotifs" style="white-space:nowrap" aria-label="Abrir central de notificações">Ver notificações</button>
    </div>
  </div>`;
}

// ================== V1.2.1 — QUANTO POSSO GASTAR? ==================
// "Disponível para gastar" NÃO é um cálculo novo: é literalmente projectedBalance().projectedBalance,
// exibido com outro nome/contexto. "Até o próximo recebimento" e "Disponível por dia" também não
// inventam nenhuma regra de cartão/fatura — são derivados de getNextCommitments() (mesma lista já
// deduplicada de V1.1.2, que por sua vez já reflete exatamente as mesmas obrigações de cartão que
// projectedBalance() usa via futureCardObligations()/futureCardPayments()).
//
// Função pura: recebe os mesmos `commitmentsAll`/`proj` que viewDashboard() já calcula para as
// seções anteriores (Próximos compromissos, Fluxo de caixa), evitando qualquer recomputação.
// AJUSTE (horizonte curto): "Disponível para gastar" deixa de ser proj.projectedBalance (que soma
// TODAS as obrigações futuras cadastradas, inclusive faturas/parcelas de meses distantes) e passa a
// ser o saldo atual menos apenas os compromissos com vencimento real ATÉ o próximo recebimento —
// o mesmo horizonte de "Até o próximo recebimento" logo abaixo. Sem recebimento futuro cadastrado,
// o horizonte alternativo é o fim do mês atual. Nada além deste indicador muda: proj.projectedBalance
// continua intacto e ainda é usado no card "Disponível projetado" do Resumo financeiro; faturas,
// parcelas, limite de cartão, Fluxo de caixa, Próximos compromissos/lançamentos e Relatórios
// continuam lendo getNextCommitments()/projectedBalance() exatamente como antes.
function getSpendableSummary(commitmentsAll,proj){
  let disponivelParaGastar=proj.currentBalance, horizonDate=null, horizonKind=null;

  // getNextCommitments() já vem ordenada cronologicamente (ver seu próprio sort), então o primeiro
  // item de kind 'receita' É a próxima receita futura, sem precisar reordenar nada.
  const receitas=commitmentsAll.filter(it=>it.kind==='receita');
  let nextIncome=null, beforeNextIncome=null, daysUntilNextIncome=null, perDay=null;

  if(receitas.length){
    const nextDate=receitas[0].date;
    // Várias receitas no mesmo dia (mesma data da "próxima") contam juntas como um único evento —
    // é o mesmo instante no calendário, não duas próximas receitas diferentes.
    const sameDay=receitas.filter(it=>it.date===nextDate);
    const totalAmount=sameDay.reduce((s,it)=>s+Number(it.amount),0);
    nextIncome={date:nextDate,amount:totalAmount,
      desc:sameDay.length===1?sameDay[0].desc:`${sameDay.length} recebimentos`,count:sameDay.length};

    // Só os compromissos (despesa/pagamento de fatura/obrigação de fatura já líquida) com data
    // ESTRITAMENTE anterior à próxima receita entram aqui — a própria receita nunca é somada.
    const outflowsBefore=commitmentsAll.filter(it=>it.kind!=='receita'&&it.date<nextDate);
    const totalOutflowBefore=outflowsBefore.reduce((s,it)=>s+Number(it.amount),0);
    beforeNextIncome=proj.currentBalance-totalOutflowBefore;
    disponivelParaGastar=beforeNextIncome; horizonDate=nextDate; horizonKind='recebimento';

    daysUntilNextIncome=daysDiffISO(nextDate,todayISO());
    if(daysUntilNextIncome>0) perDay=beforeNextIncome/daysUntilNextIncome;
    // Se daysUntilNextIncome<=0 (recebimento hoje — o que as regras atuais de futureTx()/
    // isFutureDate() já impedem de acontecer na prática, já que uma data "hoje" não é futura),
    // perDay permanece null propositalmente, para nunca dividir por zero.
  } else {
    // Sem recebimento futuro cadastrado: horizonte alternativo = último dia do mês atual, para que
    // o indicador não volte a descontar compromissos de meses futuros distantes por falta de
    // referência.
    const t=todayISO(), y=Number(t.slice(0,4)), m=Number(t.slice(5,7));
    const eomISO=t.slice(0,7)+'-'+String(new Date(y,m,0).getDate()).padStart(2,'0');
    const outflowsBefore=commitmentsAll.filter(it=>it.kind!=='receita'&&it.date<=eomISO);
    const totalOutflowBefore=outflowsBefore.reduce((s,it)=>s+Number(it.amount),0);
    disponivelParaGastar=proj.currentBalance-totalOutflowBefore; horizonDate=eomISO; horizonKind='fim_do_mes';
  }

  return {disponivelParaGastar,nextIncome,beforeNextIncome,daysUntilNextIncome,perDay,horizonDate,horizonKind};
}

// Apenas apresentação: nenhum valor aqui é recalculado, só formatado/rotulado. Reaproveita fmt(),
// escapeHTML() e as mesmas classes visuais (.stat/.label/.val/.muted/.neg) já usadas em todo o
// Dashboard — nenhuma cor ou classe CSS nova.

        <div class="muted" style="font-size:13px">${escapeHTML(dateLabel)} — ${escapeHTML(s.nextIncome.desc)}</div>

  return `<div class="card stat" style="margin-bottom:20px">

}

// ================== V1.2.2 — METAS FINANCEIRAS ==================
// Metas são puramente informativas: apenas acompanham um valor-alvo definido pelo próprio usuário.
// Nenhuma função financeira existente (accBalance, totalBalance, projectedBalance, cardUsed,
// cardAvailable, getOpenInvoices, getNextCommitments, computeCashFlow, getNotifications,
// categoryTotals etc.) lê ou escreve em DB.goals, e nenhuma ação de meta (criar/editar/adicionar
// valor/remover valor/ativar/desativar/excluir) cria um DB.transactions ou altera
// DB.accounts/DB.cards/DB.budgets. É apenas acompanhamento — sem segunda lógica de saldo.

// Normaliza um único item de DB.goals para o formato mínimo, sem inventar dados financeiros:
// número inválido vira 0 (nunca um valor estimado), texto inválido vira string vazia, e um id
// ausente ganha um novo uid() só para a meta continuar utilizável na interface.
function normalizeGoalItem(g){
  if(!g||typeof g!=='object'||Array.isArray(g)) g={};
  const targetAmount=Number(g.targetAmount);
  const currentAmount=Number(g.currentAmount);
  let deadline=g.deadline;
  if(deadline!=null && typeof deadline!=='string') deadline=null;
  return {
    id:(typeof g.id==='string'&&g.id)?g.id:uid(),
    name:(typeof g.name==='string')?g.name:'',
    targetAmount:(isFinite(targetAmount)&&targetAmount>0)?targetAmount:0,
    currentAmount:(isFinite(currentAmount)&&currentAmount>=0)?currentAmount:0,
    deadline:deadline||null,
    active:g.active!==false
  };
}
// Garante DB.goals como array de metas válidas. Instalações/backups antigos sem "goals", ou com
// "goals" corrompido (não-array, itens que não são objetos, campos inválidos), continuam
// funcionando normalmente — nunca quebram o Dashboard nem o restante do sistema.
function normalizeGoals(db){
  if(!Array.isArray(db.goals)) db.goals=[];
  db.goals=db.goals.map(normalizeGoalItem);
}

function goalProgressPct(g){
  if(!g.targetAmount||g.targetAmount<=0) return 0;
  return (g.currentAmount/g.targetAmount)*100;
}
function goalRemaining(g){ return Math.max(0,(toCents(g.targetAmount)-toCents(g.currentAmount))/100); }
// Meta atingida: currentAmount >= targetAmount. Ultrapassar o objetivo é permitido e mostrado
// como "100%+"/percentual real (ver goalCardHTML) — currentAmount nunca é limitado ao objetivo.
function goalAchieved(g){ return g.targetAmount>0 && toCents(g.currentAmount)>=toCents(g.targetAmount); }
function goalStatus(g){
  if(!g.active) return 'inativa';
  if(goalAchieved(g)) return 'atingida';
  return 'andamento';
}
const GOAL_STATUS_LABEL={andamento:'Em andamento',atingida:'Meta atingida',inativa:'Inativa'};
const GOAL_STATUS_CLASS={andamento:'tag-accent',atingida:'tag-green',inativa:'tag'};
// Ordenação neutra e previsível (nunca um ranking financeiro): metas ativas primeiro, na ordem em
// que já estão armazenadas em DB.goals (ordem de criação); depois as inativas, mesma ordem relativa
// entre si. Usa apenas o sort estável nativo do array — nenhum critério de "melhor"/"pior" meta.
function sortedGoals(){
  return (DB.goals||[]).slice().sort((a,b)=>(a.active===b.active)?0:(a.active?-1:1));
}

function goalCardHTML(g){
  const pct=goalProgressPct(g);
  const barPct=Math.min(100,Math.max(0,pct));
  const status=goalStatus(g);
  const achieved=status==='atingida';
  const barColor=achieved?'var(--green)':'var(--accent)';
  const deadlineLabel=g.deadline?g.deadline.split('-').reverse().join('/'):'Sem prazo definido';
  const remainingLabel=achieved?'Meta atingida':`Faltam ${fmt(goalRemaining(g))}`;
  const pctLabel=(pct>100?'100%+':pct.toFixed(0)+'%')+' concluído';
  return `<div class="card" style="margin-bottom:10px${status==='inativa'?';opacity:.65':''}">
    <div class="row" style="border:none">
      <h3 style="margin:0">${escapeHTML(g.name||'(sem nome)')}</h3>
      <div><button class="ghost" data-editgoal="${escapeHTML(g.id)}" style="padding:3px 8px;margin-right:4px" aria-label="Editar meta ${escapeHTML(g.name||'')}">✎</button><button class="ghost" data-delgoal="${escapeHTML(g.id)}" style="padding:3px 8px" aria-label="Excluir meta ${escapeHTML(g.name||'')}">🗑</button></div>
    </div>
    <div class="row" style="border:none;padding:4px 0"><span>${fmt(g.currentAmount)} / ${fmt(g.targetAmount)}</span><span class="tag ${GOAL_STATUS_CLASS[status]}">${GOAL_STATUS_LABEL[status]}</span></div>
    <div class="bar-bg"><div class="bar-fill" style="width:${barPct.toFixed(0)}%;background:${barColor}"></div></div>
    <div class="muted" style="margin-top:6px;font-size:12px">${pctLabel} · ${remainingLabel}</div>
    <div class="muted" style="font-size:12px;margin-top:2px">Prazo: ${escapeHTML(deadlineLabel)}</div>
    <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:10px">
      <button class="ghost" data-addval="${escapeHTML(g.id)}" style="padding:6px 10px;font-size:13px">+ Adicionar valor</button>
      <button class="ghost" data-remval="${escapeHTML(g.id)}" style="padding:6px 10px;font-size:13px">− Remover valor</button>
      <button class="ghost" data-togglegoal="${escapeHTML(g.id)}" style="padding:6px 10px;font-size:13px">${g.active?'Desativar':'Reativar'}</button>
    </div>
  </div>`;
}
function viewMetas(){
  const goals=sortedGoals();
  const rows=goals.map(goalCardHTML).join('') || '<p class="muted">Nenhuma meta cadastrada ainda.</p>';
  return `<div class="topbar"><h1>Metas financeiras</h1><button class="primary" id="btnNovaMeta">+ Meta</button></div>
  <p class="muted" style="margin-top:-8px;margin-bottom:16px">Acompanhamento de objetivos de valor — não movimenta dinheiro nem altera saldo, contas, cartões ou orçamento.</p>
  ${rows}`;
}

// nunca cria um lançamento em DB.transactions nem toca em DB.accounts.
function goalValueForm(g,mode){

  return `<h3 id="modalTitle">${isAdd?'Adicionar valor':'Remover valor'} — ${escapeHTML(g.name||'')}</h3>
  <div id="formError" class="form-error" style="display:none" role="alert"></div>

}
function bindGoalValueEvents(g,mode){
  document.getElementById('saveGoalValBtn').onclick=()=>{
    const val=money2(document.getElementById('gvVal').value);
    if(!val||val<=0){ showFormError('Informe um valor maior que zero.'); return; }
    if(mode==='add'){
      g.currentAmount=(toCents(g.currentAmount)+toCents(val))/100;
    } else {
      // Preferir rejeitar com mensagem clara em vez de limitar silenciosamente o valor removido.
      if(toCents(val)>toCents(g.currentAmount)){ showFormError('O valor a remover não pode ser maior que o valor atual da meta.'); return; }
      g.currentAmount=Math.max(0,(toCents(g.currentAmount)-toCents(val))/100);
    }
    saveDB();closeModal();render();
  };
}

// Resumo compacto para o Dashboard — não duplica a tela de gerenciamento, só contagens e até 3
// metas ativas em andamento (as próximas na ordem já usada em sortedGoals()).
function goalsDashboardSummaryHTML(){
  const goals=DB.goals||[];
  if(!goals.length){
    return `<div class="card"><div class="row" style="border:none;padding:0"><h3 style="margin:0">Metas financeiras</h3><button class="ghost" id="btnVerMetas" style="padding:4px 10px;font-size:12px">Ver metas</button></div><p class="muted" style="margin-top:8px">Nenhuma meta cadastrada ainda.</p></div>`;

  const activeGoals=goals.filter(g=>g.active);
  const achievedGoals=activeGoals.filter(goalAchieved);
  const inProgress=activeGoals.length-achievedGoals.length;
  const highlight=sortedGoals().filter(g=>g.active&&!goalAchieved(g)).slice(0,3);
  const highlightHTML=highlight.length?highlight.map(g=>{
    const pct=Math.min(100,Math.max(0,goalProgressPct(g)));
    return `<div style="margin-bottom:10px">

      <div class="bar-bg"><div class="bar-fill" style="width:${pct.toFixed(0)}%"></div></div>
    </div>`;
  }).join(''):(activeGoals.length?'<p class="muted">Todas as metas ativas foram atingidas.</p>':'');
  return `<div class="card">
    <div class="row" style="border:none;padding:0 0 8px"><h3 style="margin:0">Metas financeiras</h3><button class="ghost" id="btnVerMetas" style="padding:4px 10px;font-size:12px">Ver metas</button></div>

      <div class="stat"><div class="label">Em andamento</div><div class="val" style="font-size:18px">${inProgress}</div></div>
      <div class="stat"><div class="label">Atingidas</div><div class="val" style="font-size:18px">${achievedGoals.length}</div></div>
    </div>
    ${highlightHTML}
  </div>`;
}

function viewDashboard(){
  const todayYM=todayISO().slice(0,7);
  // Período selecionado [from..to] (inclusive). Se vier invertido, troca; limita a 60 meses.
  let from=dashFrom, to=dashTo;
  if(from>to){ const t=from; from=to; to=t; }
  const months=[]; for(let m=from; m<=to && months.length<60; m=shiftYearMonth(m,1)) months.push(m);
  to=months[months.length-1];
  const single=(from===to);
  const isDefaultPeriod=(single && from===todayYM);
  const shortLbl=m=>BUDGET_MONTH_NAMES[Number(m.slice(5,7))-1].slice(0,3).toLowerCase()+'/'+m.slice(0,4);
  const mesLabel=single?budgetMonthLabel(from):shortLbl(from)+' a '+shortLbl(to);
  const mWord=single?(from===todayYM?'este mês':'em '+budgetMonthLabel(from)):'de '+mesLabel;
  const ent=months.reduce((s,m)=>s+monthIn(m),0), sai=months.reduce((s,m)=>s+monthOut(m),0), econ=ent-sai;
  const proj=projectedBalance();
  const catTot={};
  months.forEach(m=>categoryTotals(m).forEach(([cid,v])=>{ catTot[cid]=(catTot[cid]||0)+v; }));
  const cats=Object.entries(catTot).sort((a,b)=>b[1]-a[1]);
  const maxCat=cats[0];
  const barsHtml=cats.map(([cid,v])=>{
    const c=catById(cid); const max=cats[0][1]||1;
    return `<div style="margin-bottom:10px"><div class="row" style="border:none;padding:4px 0"><span>${escapeHTML((c?c.icon:'📦')+' '+(c?c.name:'Outros'))}</span><span>${fmt(v)}</span></div>
    <div class="bar-bg"><div class="bar-fill" style="width:${(v/max*100).toFixed(0)}%"></div></div></div>`;
  }).join('') || `<p class="muted">Sem despesas ${mWord}.</p>`;

  const insights=[];
  if(maxCat){const c=catById(maxCat[0]);insights.push(`Seu maior gasto ${mWord} foi ${escapeHTML(c?c.name:'Outros')}, totalizando ${fmt(maxCat[1])}.`)}
  insights.push(`Você teve ${months.reduce((s,m)=>s+monthTx(m).length,0)} lançamento(s) ${mWord}.`);
  insights.push(econ>=0?`Você economizou ${fmt(econ)} ${mWord}.`:`Você gastou ${fmt(Math.abs(econ))} a mais do que recebeu ${mWord}.`);
  // V1.2.3: reaproveita a MESMA função central getBudgetStatuses() usada na tela de Orçamento e
  // nas notificações — nenhum segundo cálculo de "quanto já foi gasto" aqui (inclui compras no
  // cartão como gasto, igual às duas outras telas). O limiar de 70%–99% é só um aviso mais cedo,
  // específico deste resumo do Dashboard — a régua de status (Atenção/Próximo/Excedido) em si
  // continua exclusivamente em getBudgetStatuses()/budgetStatusFor().
  if(single) getBudgetStatuses(from).rows.forEach(r=>{
    if(r.percentage>70 && r.percentage<100){
      insights.push(`Você já utilizou ${r.percentage.toFixed(0)}% do orçamento de ${escapeHTML(r.category?r.category.name:r.categoryId)}.`);
    }
  });

  const futAll=futureTx();
  const futInst=futureInstallments();
  const futRec=futureRecurring();
  const upcoming=futAll.slice().sort((a,b)=>a.date.localeCompare(b.date)).slice(0,5);
  const nextCommitmentsAll=getNextCommitments();
  // Filtro de mês: usa a MESMA lista de compromissos (já deduplicada) e só recorta por data.
  const eomISO=to+'-'+String(new Date(Number(to.slice(0,4)),Number(to.slice(5,7)),0).getDate()).padStart(2,'0');
  const monthItems=nextCommitmentsAll.filter(it=>{ const m=it.date.slice(0,7); return m>=from && m<=to; });
  const mesReceber=monthItems.filter(it=>it.kind==='receita').reduce((s,it)=>s+Number(it.amount),0);
  const mesPagar=monthItems.filter(it=>it.kind!=='receita').reduce((s,it)=>s+Number(it.amount),0);
  const ateFimMes=nextCommitmentsAll.filter(it=>it.date<=eomISO);
  const projMes=proj.currentBalance
    +ateFimMes.filter(it=>it.kind==='receita').reduce((s,it)=>s+Number(it.amount),0)
    -ateFimMes.filter(it=>it.kind!=='receita').reduce((s,it)=>s+Number(it.amount),0);
  const eomLabel=eomISO.split('-').reverse().join('/');

  const cardInvoices=DB.cards.map(c=>({c,inv:cardCurrentInvoice(c.id)}));
  const totalOpenInvoices=cardInvoices.reduce((s,x)=>s+x.inv.remaining,0);
  const biggestInvoice=cardInvoices.slice().sort((a,b)=>b.inv.remaining-a.inv.remaining)[0];
  const faturaCard=DB.cards.length?`<div class="card stat"><div class="label">Fatura atual</div><div class="val ${totalOpenInvoices>0?'neg':''}">${fmt(totalOpenInvoices)}</div>
    ${biggestInvoice&&biggestInvoice.inv.remaining>0?`<div class="muted" style="margin-top:4px">Maior: ${escapeHTML(biggestInvoice.c.name)} (${fmt(biggestInvoice.inv.remaining)})</div>`:''}</div>`:'';

  // Reaproveita a Central de Notificações (getNotifications(), já existente e intocada) só para
  // decidir se um banner de destaque aparece no topo do Dashboard — nenhuma notificação nova.
  const notifs=getNotifications();
  const alertBanner=dashboardAlertBannerHTML(notifs);

  // "Saídas futuras" = exatamente a soma das MESMAS três parcelas que projectedBalance() já
  // subtrai internamente (proj.futureExpenses+proj.futureCardObligations+proj.futureCardPayments) —
