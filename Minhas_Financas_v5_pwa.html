// Intervalo [inicio,fim] (ISO) para os períodos rápidos da tela de Lançamentos.
// Independente de periodRange() (usada em Relatórios) para não alterar o comportamento já validado
// daquela tela; a regra de cálculo do mês é a mesma (primeiro/último dia do mês via Date).
function lancPeriodRange(p){
  const now=new Date();
  if(p==='mes') return [new Date(now.getFullYear(),now.getMonth(),1),new Date(now.getFullYear(),now.getMonth()+1,0)];
  if(p==='anterior') return [new Date(now.getFullYear(),now.getMonth()-1,1),new Date(now.getFullYear(),now.getMonth(),0)];
  if(p==='proximo') return [new Date(now.getFullYear(),now.getMonth()+1,1),new Date(now.getFullYear(),now.getMonth()+2,0)];
  return null;
}
function sortTxList(list,sort){
  const arr=list.slice();
  if(sort==='oldest') arr.sort((a,b)=>a.date.localeCompare(b.date)||a.id.localeCompare(b.id));
  else if(sort==='amountDesc') arr.sort((a,b)=>Number(b.amount)-Number(a.amount));
  else if(sort==='amountAsc') arr.sort((a,b)=>Number(a.amount)-Number(b.amount));
  else arr.sort((a,b)=>b.date.localeCompare(a.date)||b.id.localeCompare(a.id)); // 'recent' (padrão)
  return arr;
}
// true quando algum filtro (além dos padrões) está ativo — usado no resumo de filtros e nas
// mensagens de estado vazio.
function hasActiveTxFilters(){
  const f=txFilters;
  return !!(f.tipo||f.categoria||f.conta||f.cartao||f.busca||f.status!=='todos'||f.periodo!=='todos');
}
function getFilteredTx(){
  let list=DB.transactions.slice();
  const f=txFilters;
  if(f.tipo) list=list.filter(t=>t.type===f.tipo);
  if(f.categoria) list=list.filter(t=>t.categoryId===f.categoria);
  if(f.conta) list=list.filter(t=>t.accountId===f.conta||t.toAccountId===f.conta);
  if(f.cartao) list=list.filter(t=>t.cardId===f.cartao);
  if(f.busca) list=list.filter(t=>(t.desc||'').toLowerCase().includes(f.busca.toLowerCase()));
  // Status: Realizado = data <= hoje; Futuro = data > hoje. Mesma regra usada em accBalance()/
  // realizedMonthTx() em todo o sistema — nenhuma terceira interpretação.
  const today=todayISO();
  if(f.status==='realizados') list=list.filter(t=>t.date<=today);
  else if(f.status==='futuros') list=list.filter(t=>t.date>today);
  if(f.periodo&&f.periodo!=='todos'){
    let s='',e='';
    if(f.periodo==='personalizado'){ s=f.customStart||''; e=f.customEnd||''; }
    else if(f.periodo==='meses'){ s=f.mFrom+'-01'; e=ymEndISO(f.mTo); }
    else{ const r=lancPeriodRange(f.periodo); if(r){ s=dateToISOLocal(r[0]); e=dateToISOLocal(r[1]); } }
    if(s) list=list.filter(t=>t.date>=s);
    if(e) list=list.filter(t=>t.date<=e);
  }
  return sortTxList(list,txSort);
}
// Resumo dos filtros atualmente aplicados (seção 6 da Etapa 5). Pagamento de fatura nunca entra
// no total de despesas (já é dinheiro saindo de uma compra já contabilizada) e transferência nunca
// entra como receita/despesa — mesma regra usada nos relatórios.
function filteredTxSummary(list){
  return {
    count:list.length,
    receitas:list.filter(t=>t.type==='receita').reduce((s,t)=>s+Number(t.amount),0),
    despesas:list.filter(t=>t.type==='despesa').reduce((s,t)=>s+Number(t.amount),0),
    cartao:list.filter(t=>t.type==='cartao').reduce((s,t)=>s+Number(t.amount),0)
  };
}
function emptyTxMessage(){
  if(!DB.transactions.length) return 'Nenhum lançamento encontrado.';
  return hasActiveTxFilters()?'Nenhum lançamento corresponde aos filtros atuais.':'Nenhum lançamento encontrado.';
}

// Etapa 5 — classificação visual da fatura, apenas para exibição (nenhuma matemática nova).
// Regra:
//   remaining === 0                              -> paga
//   remaining > 0 && período de fatura > período atual do cartão -> futura (compras de um ciclo
//     que ainda nem fechou; vencimento também está no futuro)
//   remaining > 0 && dueDate < hoje               -> vencida
//   remaining > 0 && dueDate >= hoje               -> em aberto / a vencer
function invoiceStatus(card,inv){
  const today=todayISO();
  if(inv.remaining<=1e-9) return 'paga';
  const currentPeriod=getInvoicePeriod(card,today);
  if(inv.period>currentPeriod) return 'futura';
  if(inv.dueDate<today) return 'vencida';
  return 'aberto';
}
const INVOICE_STATUS_LABEL={paga:'Paga',futura:'Futura',vencida:'Vencida',aberto:'Em aberto'};

  return `<div class="topbar"><h1>Cartões</h1><button class="primary" id="btnNovoCartao">+ Cartão</button></div>

    <button class="ghost" onclick="closeModal()">Cancelar</button>

function bindCardFormEvents(existing){

// period: qual fatura (identificada pela data de fechamento) está sendo paga — nunca assumimos
// "a atual" por padrão, para não perder/ignorar faturas anteriores ainda em aberto.
// Correção Etapa 6: o valor máximo permitido para um NOVO pagamento não é inv.remaining sozinho —
// isso ignora pagamentos futuros JÁ AGENDADOS (inv.scheduledFuture) e permitia, por exemplo, numa
// fatura de R$500 já com R$100 pago e R$200 agendado, agendar mais R$300 (300<=remaining=400),
// totalizando R$600 de compromissos sobre uma fatura de R$500. O teto correto é sempre
// remaining - scheduledFuture: o que ainda não está nem pago nem comprometido por nenhum
// agendamento existente.
function invoicePayableMax(inv){ return Math.max(0,inv.remaining-inv.scheduledFuture); }

function bindPayInvoiceEvents(card,period){

    const payableMax=invoicePayableMax(inv);

    DB.transactions.push(stampTx({id:uid(),type:'pagamento_fatura',desc:'Pagamento fatura '+card.name,cardId:card.id,accountId,invoicePeriod:inv.period,amount,date,categoryId:null,note:''}));

// Continua sobre o MESMO DB.budgets (categoryId -> limite mensal) já existente — nenhum schema
// novo, nenhuma segunda estrutura de orçamento. O que muda é só o CÁLCULO do que já foi gasto e a
// forma de exibir isso, centralizados aqui para que a tela de Orçamento, o resumo do Dashboard e as
// notificações de orçamento nunca apliquem regras diferentes entre si.

// Estado do mês selecionado na tela de Orçamento — não persistido, mesmo padrão de repPeriod/
// cashFlowDays (estado de navegação de tela, não um dado do usuário).
let orcFrom=todayISO().slice(0,7), orcTo=todayISO().slice(0,7);
// Período (mês inicial e final) selecionado no Dashboard. Não persistido, mesmo padrão de orcMonth.
let dashFrom=todayISO().slice(0,7), dashTo=todayISO().slice(0,7);
// Filtro De/até por mês reutilizável (Lançamentos, Relatórios, Evolução). p = prefixo dos ids.
function ymEndISO(ym){ return ym+'-'+String(new Date(Number(ym.slice(0,4)),Number(ym.slice(5,7)),0).getDate()).padStart(2,'0'); }
function monthRangeHTML(p,from,to){
  const isDefault=(from===to && from===todayISO().slice(0,7));
  return `<label for="${p}FromInp" class="muted" style="font-size:12px">De</label>
    <input type="month" id="${p}FromInp" value="${from}" style="width:auto">
    <button class="ghost" id="${p}Prev" aria-label="Voltar um mês">«</button>
    <button class="ghost" id="${p}Next" aria-label="Avançar um mês">»</button>
    <label for="${p}ToInp" class="muted" style="font-size:12px">até</label>
    <input type="month" id="${p}ToInp" value="${to}" style="width:auto">
    ${isDefault?'':`<button class="ghost" id="${p}Today" style="padding:4px 10px;font-size:12px">Hoje</button>`}`;
}
// Lista de meses [from..to] (inclusive) do filtro De/até — mesma regra do Dashboard: se vier
// invertido, troca; limita a 60 meses.
function monthRangeList(from,to){
  if(from>to){ const t=from; from=to; to=t; }
  const months=[]; for(let m=from; m<=to && months.length<60; m=shiftYearMonth(m,1)) months.push(m);
  return months;
}
// Rótulo do período: um mês -> "Setembro de 2026"; vários -> "jan/2026 a mar/2026" (igual ao Dashboard).
function monthRangeLabel(from,to){
  const months=monthRangeList(from,to);
  const f=months[0], t=months[months.length-1];
  if(f===t) return budgetMonthLabel(f);
  const sh=m=>BUDGET_MONTH_NAMES[Number(m.slice(5,7))-1].slice(0,3).toLowerCase()+'/'+m.slice(0,4);
  return sh(f)+' a '+sh(t);
}
// get() -> [from,to]; set(from,to). Campos mantêm início <= fim; « » deslocam o período todo.
function bindMonthRange(p,get,set){
  const $=id=>document.getElementById(p+id), ok=v=>/^\d{4}-\d{2}$/.test(v);
  if($('Prev')) $('Prev').onclick=()=>{ const [f,t]=get(); set(shiftYearMonth(f,-1),shiftYearMonth(t,-1)); render(); };
  if($('Next')) $('Next').onclick=()=>{ const [f,t]=get(); set(shiftYearMonth(f,1),shiftYearMonth(t,1)); render(); };
  if($('FromInp')) $('FromInp').onchange=e=>{ if(ok(e.target.value)){ const [,t]=get(); set(e.target.value,e.target.value>t?e.target.value:t); } render(); };
  if($('ToInp')) $('ToInp').onchange=e=>{ if(ok(e.target.value)){ const [f]=get(); set(e.target.value<f?e.target.value:f,e.target.value); } render(); };
  if($('Today')) $('Today').onclick=()=>{ const cur=todayISO().slice(0,7); set(cur,cur); render(); };
}
let repFrom=todayISO().slice(0,7), repTo=todayISO().slice(0,7);
let evoFrom=shiftYearMonth(todayISO().slice(0,7),-5), evoTo=todayISO().slice(0,7);
// Soma/subtrai meses a uma string "yyyy-mm", em componentes numéricos (nunca Date+toISOString()),
// cobrindo corretamente a virada de ano (dezembro -> janeiro do ano seguinte e vice-versa) — mesma
// técnica de addMonthsISO(), já existente, só que sem exigir um dia do mês.
function shiftYearMonth(ym,delta){
  const [y,m]=ym.split('-').map(Number);
  const total=(m-1)+delta;
  const ny=y+Math.floor(total/12);
  const nm=((total%12)+12)%12;
  return ny+'-'+String(nm+1).padStart(2,'0');
}
const BUDGET_MONTH_NAMES=['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
function budgetMonthLabel(ym){ const [y,m]=ym.split('-').map(Number); return BUDGET_MONTH_NAMES[m-1]+' de '+y; }

// Gasto "realizado" para fins de orçamento: MESMA regra já usada em Relatórios (isExpenseLike) —
// despesa comum e compra no cartão (na data da própria compra) contam; pagamento de fatura,
// transferência e receita nunca entram (pagamento de fatura já quita uma compra contada acima —
// contá-lo de novo dobraria o gasto). Só lançamentos com data <= hoje, igual a realizedMonthTx()/
// accBalance() — despesa futura nunca entra no realizado do mês. Parcelas/recorrências são
// lançamentos individuais com sua própria data, então já respeitam essa mesma regra naturalmente.
function budgetSpentByCategory(ym){
  const totals={};
  realizedMonthTx(ym).filter(isExpenseLike).forEach(t=>{
    totals[t.categoryId]=(totals[t.categoryId]||0)+Number(t.amount);
  });
  return totals;
}

// Classificação central de status (a MESMA usada pela tela de Orçamento, pelo resumo do Dashboard
// e pelo cálculo-base das notificações) — nenhuma outra régua de "atenção"/"excedido" em paralelo.
function budgetStatusFor(pct){
  if(pct>=100) return 'excedido';
  if(pct>=90) return 'proximo';
  if(pct>=80) return 'atencao';
  return 'normal';
}
const BUDGET_STATUS_LABEL={normal:'Normal',atencao:'Atenção',proximo:'Próximo do limite',excedido:'Excedido'};
const BUDGET_STATUS_CLASS={normal:'tag-accent',atencao:'tag-yellow',proximo:'tag-yellow',excedido:'tag-red'};

// Função central única: para um mês (ym), devolve o status de cada categoria com limite definido
// em DB.budgets (budget/spent/remaining/percentage/status) mais um resumo agregado. Reutilizada
// por viewOrcamento(), pelo resumo de orçamento do Dashboard e por getNotifications() — evita
// duplicar a regra de cálculo em três lugares diferentes, como pedido nesta etapa.
// Limites inválidos/corrompidos (não numéricos, zero ou negativos) são ignorados aqui, sem lançar
// erro e sem inventar um valor no lugar — nenhuma categoria com esses dados aparece na lista.
function getBudgetStatuses(ym){
  const spentByCat=budgetSpentByCategory(ym);
  const rows=Object.entries(DB.budgets||{})
    .filter(([,lim])=>Number(lim)>0)
    .map(([cid,lim])=>{
      const budget=Number(lim);
      const spent=spentByCat[cid]||0;
      const remaining=budget-spent;
      const percentage=budget>0?(spent/budget*100):0;
      return {categoryId:cid,category:catById(cid)||null,budget,spent,remaining,percentage,status:budgetStatusFor(percentage)};
    });
  const totalBudget=rows.reduce((s,r)=>s+r.budget,0);
  const totalSpent=rows.reduce((s,r)=>s+r.spent,0);
  const totalRemaining=totalBudget-totalSpent;
  const totalPercentage=totalBudget>0?(totalSpent/totalBudget*100):0;
  return {ym,rows,totalBudget,totalSpent,totalRemaining,totalPercentage};
}

// Orçamento de um período [from..to]: gasto realizado = soma dos meses (mesma regra de
// budgetSpentByCategory); limite = limite mensal × quantidade de meses. Para um único mês devolve
// exatamente o mesmo resultado de getBudgetStatuses(ym). Não altera getBudgetStatuses.
function getBudgetStatusesRange(from,to){
  const months=monthRangeList(from,to);
  if(months.length===1) return getBudgetStatuses(months[0]);
  const spentByCat={};
  months.forEach(m=>{ const t=budgetSpentByCategory(m); Object.keys(t).forEach(cid=>{ spentByCat[cid]=(spentByCat[cid]||0)+t[cid]; }); });
  const n=months.length;
  const rows=Object.entries(DB.budgets||{})
    .filter(([,lim])=>Number(lim)>0)
    .map(([cid,lim])=>{
      const budget=Number(lim)*n;
      const spent=spentByCat[cid]||0;
      const remaining=budget-spent;
      const percentage=budget>0?(spent/budget*100):0;
      return {categoryId:cid,category:catById(cid)||null,budget,spent,remaining,percentage,status:budgetStatusFor(percentage)};
    });
  const totalBudget=rows.reduce((s2,r)=>s2+r.budget,0);
  const totalSpent=rows.reduce((s2,r)=>s2+r.spent,0);
  const totalRemaining=totalBudget-totalSpent;
  const totalPercentage=totalBudget>0?(totalSpent/totalBudget*100):0;
  return {ym:months[0],from:months[0],to:months[n-1],months:n,rows,totalBudget,totalSpent,totalRemaining,totalPercentage};
}

function budgetRowHTML(r){
  const barPct=Math.min(100,Math.max(0,r.percentage));
  const barColor=r.status==='excedido'?'var(--red)':(r.status==='proximo'||r.status==='atencao'?'var(--yellow)':'var(--accent)');
  const over=r.status==='excedido';
  const remainingLabel=over?`Excedeu em ${fmt(Math.abs(r.remaining))}`:`Restante: ${fmt(r.remaining)}`;
  const pctLabel=r.percentage.toFixed(r.percentage%1===0?0:2)+'%';
  const name=r.category?(r.category.icon+' '+r.category.name):r.categoryId;
  return `<div class="card" style="margin-bottom:10px">
    <div class="row" style="border:none"><span>${escapeHTML(name)}</span><span class="tag ${BUDGET_STATUS_CLASS[r.status]}">${BUDGET_STATUS_LABEL[r.status]}</span></div>
    <div class="row" style="border:none;padding:4px 0"><span>${fmt(r.spent)} / ${fmt(r.budget)}</span></div>

}

// ================== V2.0.1 — FECHAMENTO MENSAL ==================
// Registro puramente administrativo/histórico: fechar um mês NUNCA cria, altera ou apaga
// transações, contas, cartões, faturas, limites, metas ou orçamentos. É apenas uma marcação de
// que o mês foi revisado, guardada em DB.monthClosures. Os valores mostrados no resumo do
// fechamento são sempre recalculados a partir dos dados reais (mesma filosofia de
// getNotifications(): nada aqui é a "fonte da verdade" financeira — é só leitura/derivação de
// funções já existentes).

// Sanitiza um único registro de DB.monthClosures. Um registro sem "month" em formato válido não
// tem como ser normalizado com um default seguro (ao contrário de goals/cards, não existe um
// "fechamento vazio" razoável), então é descartado — nunca lança erro, nunca inventa um mês.
function normalizeMonthClosureItem(mc){
  if(!mc||typeof mc!=='object'||Array.isArray(mc)) return null;
  if(typeof mc.month!=='string'||!MONTH_RE.test(mc.month)) return null;
  const closedAt=(typeof mc.closedAt==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(mc.closedAt)&&!isNaN(parseISOLocal(mc.closedAt).getTime()))
    ?mc.closedAt:todayISO();
  const note=(typeof mc.note==='string')?mc.note:'';
  const id=(typeof mc.id==='string'&&mc.id)?mc.id:uid();
  const out={id,month:mc.month,closedAt,note};
  if(typeof mc.closedAtTs==='number'&&isFinite(mc.closedAtTs)) out.closedAtTs=mc.closedAtTs;
  return out;
}
// Garante DB.monthClosures como array de fechamentos válidos, nunca mais de um por mês (mantém o
// primeiro registro válido encontrado para cada mês e descarta duplicatas silenciosamente, sem
// quebrar a normalização). Instalações/backups antigos sem "monthClosures", ou com esse campo
// corrompido (não-array, itens que não são objetos, mês inválido), continuam funcionando
// normalmente — nunca quebram a tela de Fechamento mensal nem o restante do sistema.
function normalizeMonthClosures(db){
  if(!Array.isArray(db.monthClosures)) db.monthClosures=[];
  const seen=new Set(); const result=[];
  db.monthClosures.forEach(raw=>{
    const item=normalizeMonthClosureItem(raw);
    if(!item||seen.has(item.month)) return;
    seen.add(item.month); result.push(item);
  });
  db.monthClosures=result;
}

// ---- Funções centrais (pequenas e reutilizáveis) ----
function getMonthClosure(month){ return (DB.monthClosures||[]).find(x=>x.month===month)||null; }
function isMonthClosed(month){ return !!getMonthClosure(month); }
// Cria o registro de fechamento se o mês ainda não estiver fechado. Se já estiver fechado, nunca
// cria um segundo registro — devolve o existente sem alterá-lo (idempotente), exatamente como
// pedido: "nunca deve existir mais de um fechamento para o mesmo mês".
function closeMonth(month,note){
  if(typeof month!=='string'||!MONTH_RE.test(month)) return null;
  const existing=getMonthClosure(month);
  if(existing) return existing;
  const record={id:uid(),month,closedAt:todayISO(),closedAtTs:Date.now(),note:(typeof note==='string'?note.trim():'')};
  DB.monthClosures.push(record);
  saveDB();
  return record;
}
// Remove o registro de fechamento do mês, se existir. Reabrir um mês já aberto é uma operação
// segura e idempotente (não faz nada, não lança erro). Nunca toca em DB.transactions/accounts/
// cards/budgets/goals.
function reopenMonth(month){
  const before=DB.monthClosures.length;
  DB.monthClosures=DB.monthClosures.filter(x=>x.month!==month);
  if(DB.monthClosures.length!==before) saveDB();
  return true;
}
// O fechamento NÃO congela o mês: um lançamento datado dentro de um mês já fechado continua
// permitido normalmente (nenhuma trava é adicionada em bindTxFormEvents/etc.). Este helper apenas
// detecta, de forma simples (sem sistema de auditoria), se existe algum lançamento no mês com data
// posterior à data em que o fechamento foi registrado — para a interface poder avisar que os dados
// atuais podem ter mudado desde o fechamento.
function monthClosureHasChangesAfterClosing(closure){
  if(!closure) return false;
  // Correção 3B (bug #8): "alteração posterior" = lançamento do mês criado/editado DEPOIS do fechamento
  // (t.modifiedAt > instante do fechamento), e não mais simplesmente data > closedAt. Lançamentos sem
  // modifiedAt (dados antigos) não geram aviso. Fechamentos antigos sem closedAtTs usam o fim do dia closedAt.
  const closeTs=(typeof closure.closedAtTs==='number')?closure.closedAtTs:(parseISOLocal(closure.closedAt).getTime()+86400000);
  return monthTx(closure.month).some(t=>typeof t.modifiedAt==='number' && t.modifiedAt>closeTs);
}

// Resumo central do mês para a tela de Fechamento — reaproveita exclusivamente funções já
// existentes (monthIn, realizedMonthTx, isExpenseLike, getBudgetStatuses), sem replicar nenhuma
// regra financeira nova:
// - "Total de despesas" segue a MESMA regra já usada em Relatórios via isExpenseLike() (despesa
//   comum + compra no cartão na data da compra); pagamento de fatura nunca conta como despesa de
//   novo (evita dupla contagem), igual ao resto do sistema.
// - "Gastos no cartão" e "Pagamentos de fatura" são mostrados separadamente, só para informação —
//   nenhum dos dois é somado uma segunda vez ao resultado do mês.
// - Transferências nunca entram no resultado do mês (mesma regra de sempre: só contam type
//   'receita'/'despesa'/'cartao'/'pagamento_fatura' conforme cada total específico).
// - Orçamento vem inteiramente de getBudgetStatuses(ym), a mesma função central já usada pela tela
//   de Orçamento, pelo resumo do Dashboard e pelas notificações — nenhum segundo cálculo aqui.
function getMonthClosingSummary(ym){
  const realized=realizedMonthTx(ym);
  const totalReceitas=monthIn(ym);
  const despesasList=realized.filter(isExpenseLike);
  const totalDespesas=despesasList.reduce((s,t)=>s+Number(t.amount),0);
  const cartaoList=realized.filter(t=>t.type==='cartao');
  const totalCartao=cartaoList.reduce((s,t)=>s+Number(t.amount),0);
  const faturaPagList=realized.filter(t=>t.type==='pagamento_fatura');
  const totalFaturaPaga=faturaPagList.reduce((s,t)=>s+Number(t.amount),0);
  const receitasList=realized.filter(t=>t.type==='receita');
  const budgetData=getBudgetStatuses(ym);
  return {
    month:ym,
    totalReceitas,
    totalDespesas,
    resultado:totalReceitas-totalDespesas,
    totalCartao,
    totalFaturaPaga,
    totalOrcado:budgetData.totalBudget,
    totalUtilizadoOrcamento:budgetData.totalSpent,
    percentualOrcamentoUtilizado:budgetData.totalPercentage,
    categoriasExcedidas:budgetData.rows.filter(r=>r.status==='excedido'),
    hasOrcamento:budgetData.rows.length>0,
    qtdLancamentos:realized.length,
    qtdDespesas:despesasList.length,
    qtdReceitas:receitasList.length
  };
}

// Resumo de um período [from..to]: soma dos resumos mensais (mesmas regras de
// getMonthClosingSummary); orçamento via getBudgetStatusesRange. Um único mês devolve exatamente
// getMonthClosingSummary(ym).
function getRangeClosingSummary(from,to){
  const months=monthRangeList(from,to);
  if(months.length===1) return getMonthClosingSummary(months[0]);
  const parts=months.map(getMonthClosingSummary);
  const sum=k=>parts.reduce((s2,x)=>s2+x[k],0);
  const totalReceitas=sum('totalReceitas'), totalDespesas=sum('totalDespesas');
  const b=getBudgetStatusesRange(from,to);
  return {
    month:months[0], from:months[0], to:months[months.length-1],
    totalReceitas, totalDespesas, resultado:totalReceitas-totalDespesas,
    totalCartao:sum('totalCartao'), totalFaturaPaga:sum('totalFaturaPaga'),
    totalOrcado:b.totalBudget, totalUtilizadoOrcamento:b.totalSpent, percentualOrcamentoUtilizado:b.totalPercentage,
    categoriasExcedidas:b.rows.filter(r=>r.status==='excedido'), hasOrcamento:b.rows.length>0,
    qtdLancamentos:sum('qtdLancamentos'), qtdDespesas:sum('qtdDespesas'), qtdReceitas:sum('qtdReceitas')
  };
}
// Gasto por categoria somado no período (mesma regra de budgetSpentByCategory).
function getRangeCategoryTotals(from,to){
  const tot={};
  monthRangeList(from,to).forEach(m=>{ const t=budgetSpentByCategory(m); Object.keys(t).forEach(cid=>{ tot[cid]=(tot[cid]||0)+t[cid]; }); });
  return tot;
}

// ================== V2.0.2 — COMPARAÇÃO HISTÓRICA ==================
// Compara dois meses lado a lado. É inteiramente derivada: nenhum dado novo é persistido, não há
// DB.comparisons nem segunda estrutura de relatório/transação. Os indicadores principais e o
// orçamento reaproveitam integralmente getMonthClosingSummary() (mesma função já usada pela tela
// de Fechamento mensal), que por sua vez já reaproveita isExpenseLike/realizedMonthTx/
// getBudgetStatuses() — nenhuma regra financeira é duplicada aqui. A única coisa nova é a
// comparação por categoria, que reaproveita budgetSpentByCategory() (mesma função central já usada
// pelo Orçamento). O fechamento mensal (DB.monthClosures) nunca é consultado como fonte de valores:
// a comparação funciona igual para mês aberto ou fechado.

// Estado do mês selecionado — mesmo padrão de orcMonth/fechMonth/repPeriod: navegação de tela,
// nunca persistido no localStorage. Padrão inicial pedido: Mês A = mês anterior, Mês B = mês atual.
let compFromA=shiftYearMonth(todayISO().slice(0,7),-1), compToA=compFromA;
let compFromB=todayISO().slice(0,7), compToB=compFromB;

// Resumo histórico de um mês: receitas, despesas, resultado, cartão, pagamento de fatura e
// orçamento — literalmente o mesmo resumo da tela de Fechamento mensal, sem segunda lógica.
// Funciona igual para o mês atual (respeitando realizado x futuro) e para meses passados.
function getHistoricalMonthSummary(ym){
  return getMonthClosingSummary(ym);
}

// Totais por categoria (despesas realizadas do mês: despesa comum + compra no cartão pela data da
// compra; pagamento de fatura e transferência nunca entram) — mesma função já usada pelo Orçamento,
// sem replicar a regra de categoria.
function getHistoricalCategoryTotals(ym){
  return budgetSpentByCategory(ym);
}

// Compara dois valores numéricos: diferença absoluta (Mês B - Mês A) e variação percentual
// ((Mês B - Mês A) / Mês A * 100). Quando o valor-base (a) é zero, a percentagem não é
// matematicamente válida — devolve null (a tela exibe "—") em vez de Infinity/NaN.
function compareValues(a,b){
  a=Number(a||0); b=Number(b||0);
  const diff=b-a;
  const pct=a!==0?(diff/Math.abs(a)*100):null;
  return {a,b,diff,pct};
}

// Monta a comparação completa entre dois meses (YYYY-MM). Não cria, altera nem persiste nenhum
// lançamento/estrutura — tudo é calculado em tempo real a partir de DB.transactions/DB.budgets/
// DB.categories através das funções já existentes.
function compareMonthRange(ymA,ymB){
  return comparePeriods({from:ymA,to:ymA},{from:ymB,to:ymB});
}
// Comparação entre dois períodos {from,to} (meses YYYY-MM, De/até). Com um mês em cada lado é
// idêntica à comparação mês a mês original.
function comparePeriods(pA,pB){
  const ymA=pA.from, ymB=pB.from;
  const summaryA=getRangeClosingSummary(pA.from,pA.to);
  const summaryB=getRangeClosingSummary(pB.from,pB.to);
  const indicators={
    receitas:compareValues(summaryA.totalReceitas,summaryB.totalReceitas),
    despesas:compareValues(summaryA.totalDespesas,summaryB.totalDespesas),
    resultado:compareValues(summaryA.resultado,summaryB.resultado),
    cartao:compareValues(summaryA.totalCartao,summaryB.totalCartao),
    faturaPaga:compareValues(summaryA.totalFaturaPaga,summaryB.totalFaturaPaga)
  };
  const catA=getRangeCategoryTotals(pA.from,pA.to);
  const catB=getRangeCategoryTotals(pB.from,pB.to);
  const catIds=new Set([...Object.keys(catA),...Object.keys(catB)]);
  const categories=[...catIds].map(cid=>{
    const cmp=compareValues(catA[cid]||0,catB[cid]||0);
    return {categoryId:cid,category:catById(cid)||null,...cmp};
  }).sort((x,y)=>Math.max(y.a,y.b)-Math.max(x.a,x.b));
  return {monthA:ymA,monthB:ymB,labelA:monthRangeLabel(pA.from,pA.to),labelB:monthRangeLabel(pB.from,pB.to),summaryA,summaryB,indicators,categories};
}

// Lê o estado atual de navegação (compMonthA/compMonthB) e devolve a comparação — usada pela tela.
function getHistoricalComparison(){
  return comparePeriods({from:compFromA,to:compToA},{from:compFromB,to:compToB});
}

// ================== V2.0.3 — EVOLUÇÃO FINANCEIRA ==================
// Série histórica mês a mês, 100% derivada: nenhum dado novo é persistido (não há DB.evolution/
// DB.history) e nenhuma lógica financeira é duplicada. Cada mês vem de getHistoricalMonthSummary()
// (= getMonthClosingSummary(), que já usa isExpenseLike/realizedMonthTx/getBudgetStatuses) e as
// categorias vêm de getHistoricalCategoryTotals() (= budgetSpentByCategory()). Variações reusam
// compareValues() da Comparação histórica. DB.monthClosures nunca é fonte de valores.

const EVOLUTION_PERIODS=[3,6,12];
// Estado de navegação (não persistido, mesmo padrão de compMonthA/orcMonth): padrão 6 meses.
let evoPeriod=6;

// Lista cronológica (do mais antigo ao mais recente) de n meses "YYYY-MM" terminando em endYm
// (padrão: mês atual local). Usa shiftYearMonth() — aritmética numérica, sem Date/toISOString().
function getEvolutionMonths(n,endYm){
  const end=endYm||todayISO().slice(0,7);
  const count=EVOLUTION_PERIODS.includes(n)?n:6;
  const months=[];
  for(let i=count-1;i>=0;i--) months.push(shiftYearMonth(end,-i));
  return months;
}
function evolutionMonthLabel(ym){
  const [y,m]=ym.split('-').map(Number);
  return BUDGET_MONTH_NAMES[m-1].slice(0,3)+'/'+y;
}
// Variação em relação ao mês anterior (valorAtual - valorAnterior; % = diff/anterior*100, null
// quando o anterior é zero) — a mesma regra de compareValues(); sem julgamento.
function evolutionVariation(prev,cur){ return compareValues(prev,cur); }

function getEvolutionData(months){
  const rows=months.map(ym=>({ym,summary:getHistoricalMonthSummary(ym)}));
  const keys={receitas:'totalReceitas',despesas:'totalDespesas',resultado:'resultado',cartao:'totalCartao',faturaPaga:'totalFaturaPaga'};
  rows.forEach((r,i)=>{
    r.variation=null;
    if(i>0){
      r.variation={};
      Object.keys(keys).forEach(k=>{ r.variation[k]=evolutionVariation(rows[i-1].summary[keys[k]],r.summary[keys[k]]); });
    }
  });
  return {months,rows};
}
// Categorias x meses (somente despesas realizadas; regra herdada de budgetSpentByCategory).
function getEvolutionCategoryData(months){
  const perMonth=months.map(ym=>getHistoricalCategoryTotals(ym));
  const ids=new Set(); perMonth.forEach(t=>Object.keys(t).forEach(id=>ids.add(id)));
  const rows=[...ids].map(cid=>{
    const values=perMonth.map(t=>t[cid]||0);
    return {categoryId:cid,category:catById(cid)||null,values,total:values.reduce((a,b)=>a+b,0)};
  }).sort((a,b)=>b.total-a.total);
  return {months,rows};
}

// ---- Apresentação ----
function evolutionChartSVG(rows){
  const W=640,H=260,padL=8,padR=8,padT=14,padB=34;
  const vals=[]; rows.forEach(r=>vals.push(r.summary.totalReceitas,r.summary.totalDespesas,r.summary.resultado));
  const max=Math.max(0,...vals), min=Math.min(0,...vals);
  const span=(max-min)||1;
  const plotH=H-padT-padB;
  const y=v=>padT+(max-v)/span*plotH;
  const y0=y(0);
  const groupW=(W-padL-padR)/rows.length;
  const barW=Math.min(26,groupW/4);
  const series=[['totalReceitas','var(--green)','Receitas'],['totalDespesas','var(--red)','Despesas'],['resultado','var(--accent)','Resultado']];
  const bars=rows.map((r,i)=>{
    const gx=padL+i*groupW+groupW/2-barW*1.5;
    const rects=series.map(([k,color,name],j)=>{
      const v=r.summary[k]; const top=Math.min(y(v),y0); const h=Math.max(Math.abs(y(v)-y0),v!==0?1:0);
      return `<rect x="${(gx+j*barW).toFixed(1)}" y="${top.toFixed(1)}" width="${(barW-2).toFixed(1)}" height="${h.toFixed(1)}" rx="2" style="fill:${color}"><title>${escapeHTML(evolutionMonthLabel(r.ym)+' · '+name+': '+fmt(v))}</title></rect>`;
    }).join('');
    const lx=(padL+i*groupW+groupW/2).toFixed(1);
    return rects+`<text x="${lx}" y="${H-12}" text-anchor="middle" style="fill:var(--muted);font-size:11px">${escapeHTML(evolutionMonthLabel(r.ym))}</text>`;
  }).join('');
  const legend=series.map(([,color,name])=>`<span style="display:inline-flex;align-items:center;gap:5px;margin-right:14px"><span style="width:10px;height:10px;border-radius:2px;background:${color};display:inline-block"></span>${name}</span>`).join('');
  return `<div class="muted" style="margin-bottom:6px">${legend}</div>
  <svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;display:block" role="img" aria-label="Gráfico de receitas, despesas e resultado por mês">
    <line x1="${padL}" x2="${W-padR}" y1="${y0.toFixed(1)}" y2="${y0.toFixed(1)}" style="stroke:var(--border);stroke-width:1"/>
    ${bars}
  </svg>`;
}
function evolutionVarCellHTML(value,cmp){
  const sub=cmp?`<div class="muted" style="font-size:11px">${historicalDiffLabel(cmp.diff)} · ${historicalPctLabel(cmp.pct)}</div>`:'';
  return `<td style="text-align:right;white-space:nowrap">${fmt(value)}${sub}</td>`;
}
function evolutionTableHTML(data){
  const body=data.rows.map(r=>{
    const s=r.summary, v=r.variation||{};
    return `<tr><td style="white-space:nowrap">${escapeHTML(evolutionMonthLabel(r.ym))}</td>
      ${evolutionVarCellHTML(s.totalReceitas,v.receitas)}${evolutionVarCellHTML(s.totalDespesas,v.despesas)}
      ${evolutionVarCellHTML(s.resultado,v.resultado)}${evolutionVarCellHTML(s.totalCartao,v.cartao)}
      ${evolutionVarCellHTML(s.totalFaturaPaga,v.faturaPaga)}</tr>`;
  }).join('');
  return `<div class="card" style="overflow-x:auto"><table style="min-width:560px">
    <thead><tr><th style="text-align:left">Mês</th><th style="text-align:right">Receitas</th><th style="text-align:right">Despesas</th><th style="text-align:right">Resultado</th><th style="text-align:right">Cartão</th><th style="text-align:right">Faturas</th></tr></thead>
    <tbody>${body}</tbody></table>
    <div class="muted" style="margin-top:8px;font-size:12px">Abaixo de cada valor: diferença e variação % em relação ao mês anterior do período ("—" quando o mês anterior é zero).</div></div>`;

function evolutionCategoryHTML(catData){
  if(!catData.rows.length) return '<div class="card"><p class="muted">Nenhuma despesa realizada no período.</p></div>';
  const head=catData.months.map(ym=>`<th style="text-align:right">${escapeHTML(evolutionMonthLabel(ym))}</th>`).join('');
  const body=catData.rows.map(r=>{
    const name=r.category?(r.category.icon+' '+r.category.name):missingCatLabel(r.categoryId);
    return `<tr><td style="white-space:nowrap">${escapeHTML(name)}</td>${r.values.map(v=>`<td style="text-align:right;white-space:nowrap">${fmt(v)}</td>`).join('')}</tr>`;
  }).join('');
  return `<div class="card" style="overflow-x:auto"><table style="min-width:${180+catData.months.length*95}px">
    <thead><tr><th style="text-align:left">Categoria</th>${head}</tr></thead><tbody>${body}</tbody></table></div>`;
}
function evolutionBudgetHTML(data){
  if(!data.rows.some(r=>r.summary.hasOrcamento)) return '<div class="card"><p class="muted">Nenhum orçamento definido.</p></div>';
  const body=data.rows.map(r=>{
    const s=r.summary;
    return `<tr><td style="white-space:nowrap">${escapeHTML(evolutionMonthLabel(r.ym))}</td>
      <td style="text-align:right">${fmt(s.totalOrcado)}</td><td style="text-align:right">${fmt(s.totalUtilizadoOrcamento)}</td>
      <td style="text-align:right">${s.percentualOrcamentoUtilizado.toFixed(0)}%</td><td style="text-align:right">${s.categoriasExcedidas.length}</td></tr>`;
  }).join('');
  return `<div class="card" style="overflow-x:auto"><table style="min-width:420px">
    <thead><tr><th style="text-align:left">Mês</th><th style="text-align:right">Orçado</th><th style="text-align:right">Gasto</th><th style="text-align:right">Utilizado</th><th style="text-align:right">Excedidas</th></tr></thead>
    <tbody>${body}</tbody></table>
    <div class="muted" style="margin-top:8px;font-size:12px">Gastos de cada mês comparados aos limites atuais (o orçamento não possui histórico próprio).</div></div>`;
}
function viewEvolucao(){
  let months;
  if(evoPeriod==='custom'){
    months=[]; for(let m=evoFrom; m<=evoTo && months.length<36; m=shiftYearMonth(m,1)) months.push(m);
    if(!months.length) months=[evoFrom];
  } else months=getEvolutionMonths(evoPeriod);
  const data=getEvolutionData(months);
  const catData=getEvolutionCategoryData(months);
  const btns=EVOLUTION_PERIODS.map(n=>`<button class="${evoPeriod===n?'primary':'ghost'}" data-evoperiod="${n}" aria-pressed="${evoPeriod===n}">${n} meses</button>`).join('')
    +`<button class="${evoPeriod==='custom'?'primary':'ghost'}" data-evoperiod="custom" aria-pressed="${evoPeriod==='custom'}">Por mês</button>`;
  const evoRange=evoPeriod==='custom'?`<div class="filters" style="align-items:center">${monthRangeHTML('evo',evoFrom,evoTo)}</div>`:'';
  return `<div class="topbar"><h1>Evolução financeira</h1></div>
  <div class="filters" role="group" aria-label="Período">${btns}</div>
  ${evoRange}
  <div class="muted" style="margin-bottom:10px">Valores <strong>realizados</strong> (data até hoje), calculados a partir dos lançamentos atuais, independentemente de o mês estar aberto ou fechado.</div>
  <h3>Evolução mensal</h3>
  <div class="card" style="margin-bottom:16px">${evolutionChartSVG(data.rows)}</div>
  <h3>Histórico</h3>${evolutionTableHTML(data)}
  <h3 style="margin-top:16px">Evolução por categoria</h3>${evolutionCategoryHTML(catData)}
  <h3 style="margin-top:16px">Orçamento</h3>${evolutionBudgetHTML(data)}`;
}

function periodRange(p){
  const now=new Date(); let start,end;
  if(p==='mes'){start=new Date(now.getFullYear(),now.getMonth(),1);end=new Date(now.getFullYear(),now.getMonth()+1,0);}
  else if(p==='passado'){start=new Date(now.getFullYear(),now.getMonth()-1,1);end=new Date(now.getFullYear(),now.getMonth(),0);}
  else if(p==='3m'){start=new Date(now.getFullYear(),now.getMonth()-2,1);end=new Date(now.getFullYear(),now.getMonth()+1,0);}
  else if(p==='6m'){start=new Date(now.getFullYear(),now.getMonth()-5,1);end=new Date(now.getFullYear(),now.getMonth()+1,0);}
  else if(p==='ano'){start=new Date(now.getFullYear(),0,1);end=new Date(now.getFullYear(),11,31);}
  else if(p==='meses') return [repFrom+'-01',ymEndISO(repTo)];
  return [dateToISOLocal(start),dateToISOLocal(end)];
}
let repPeriod='mes';
// Etapa 5 — corrige a mistura de lançamentos realizados e futuros no mesmo total.
// Regra (igual à usada em accBalance/realizedMonthTx): realizado = data <= hoje; futuro = data > hoje.
// Compra no cartão (type 'cartao') conta como despesa (realizada ou futura, conforme a data da
// COMPRA — nunca a data de pagamento da fatura). pagamento_fatura NUNCA entra nos totais de
// despesa, pois representa apenas a saída de dinheiro que já quita uma compra já contabilizada
// acima — contá-lo também seria dupla contagem do mesmo gasto. Transferência também não entra
// (não é receita nem despesa).
function isExpenseLike(t){ return t.type==='despesa'||t.type==='cartao'; }

  const futInc=future.filter(t=>t.type==='receita').reduce((a,t)=>a+Number(t.amount),0);
  const futOut=future.filter(t=>t.type==='despesa').reduce((a,t)=>a+Number(t.amount),0);
  const futCard=future.filter(t=>t.type==='cartao').reduce((a,t)=>a+Number(t.amount),0);

    .filter(inv=>inv.remaining>0);
  const futCardCommitmentsTotal=futCardCommitments.reduce((s2,inv)=>s2+inv.remaining,0);

  const catT={}; realized.filter(isExpenseLike).forEach(t=>catT[t.categoryId]=(catT[t.categoryId]||0)+Number(t.amount));

  return `<div class="topbar"><h1>Relatórios</h1>
    <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">${monthRangeHTML('rep',repFrom,repTo)}</div></div>

// ================== ETAPA 5 — BACKUP: IMPORTAÇÃO ==================
// Validação mínima exigida: o arquivo precisa ter accounts/transactions/categories como arrays
// (cada item sendo um objeto, não null/string/número — o bastante para normalizeDB() não quebrar
// ao acessar propriedades como t.installment), e budgets/settings como objetos. Nada é aceito fora
// disso (JSON inválido, estrutura incompatível, tipos errados). Nenhum dado atual é tocado antes
// dessa validação passar.
//
// Correção Etapa 6: "cards" passou a ser OPCIONAL aqui. Antes, um backup antigo sem a propriedade
// "cards" (de antes da Etapa 4, quando cartões não existiam) era rejeitado como inválido, mesmo
// normalizeDB() já sabendo preencher db.cards=db.cards||[] para esse exato caso — a validação
// estava mais restritiva do que a compatibilidade que o próprio sistema já oferece.
function isRecordArray(arr){
  return Array.isArray(arr) && arr.every(x=>x!=null && typeof x==='object' && !Array.isArray(x));
}
// Auditoria 2 (achado 2): validação ESTRUTURAL de registros financeiros. Não sanitiza, não inventa
// ids/datas e não converte texto em número — um registro inválido faz o backup inteiro ser rejeitado.
function isNonEmptyStr(v){ return typeof v==='string' && v.length>0; }
function isFiniteNum(v){ return typeof v==='number' && isFinite(v); }
function isISODateStr(v){
  if(typeof v!=='string' || !/^\d{4}-\d{2}-\d{2}$/.test(v)) return false;
  const [y,m,d]=v.split('-').map(Number);
  const dt=new Date(Date.UTC(y,m-1,d));
  return dt.getUTCFullYear()===y && dt.getUTCMonth()===m-1 && dt.getUTCDate()===d;
}
function isValidGroupMeta(g){
  return g!=null && typeof g==='object' && !Array.isArray(g) && isNonEmptyStr(g.groupId)
    && isFiniteNum(g.index) && isFiniteNum(g.count)
    && (g.totalAmount==null || isFiniteNum(g.totalAmount));
}
const TX_TYPES=['receita','despesa','transferencia','cartao','pagamento_fatura'];
function isValidTransactionRecord(t){
  if(!isNonEmptyStr(t.id) || TX_TYPES.indexOf(t.type)<0) return false;
  if(!isISODateStr(t.date) || !isFiniteNum(t.amount)) return false;
  if(t.type==='receita'||t.type==='despesa'){ if(!isNonEmptyStr(t.accountId)) return false; }
  else if(t.type==='transferencia'){ if(!isNonEmptyStr(t.accountId)||!isNonEmptyStr(t.toAccountId)) return false; }
  else if(t.type==='cartao'){ if(!isNonEmptyStr(t.cardId)) return false; }
  else if(t.type==='pagamento_fatura'){ if(!isNonEmptyStr(t.cardId)||!isNonEmptyStr(t.accountId)||typeof t.invoicePeriod!=='string') return false; }
  if(t.installment!=null && !isValidGroupMeta(t.installment)) return false;
  if(t.recurrence!=null && !isValidGroupMeta(t.recurrence)) return false;
  return true;
}
function isValidAccountRecord(a){ return isNonEmptyStr(a.id) && typeof a.name==='string' && isFiniteNum(a.initial); }
function isValidCategoryRecord(c){ return isNonEmptyStr(c.id) && typeof c.name==='string' && (c.icon===undefined||typeof c.icon==='string'); }
function isValidDayOfMonth(n){ return isFiniteNum(n) && Number.isInteger(n) && n>=1 && n<=31; }
function isValidCardRecord(c){
  return isNonEmptyStr(c.id) && typeof c.name==='string' && isFiniteNum(c.limit)
    && isValidDayOfMonth(c.closingDay) && isValidDayOfMonth(c.dueDay);
}
function validateBackupData(data){
  if(!data||typeof data!=='object'||Array.isArray(data)) return false;
  if(!isRecordArray(data.accounts)) return false;
  if(!isRecordArray(data.transactions)) return false;
  if(!isRecordArray(data.categories)) return false;
  if(!data.accounts.every(isValidAccountRecord)) return false;
  if(!data.transactions.every(isValidTransactionRecord)) return false;
  // Correção F6: transactions[].id precisa ser único — exclusão/edição/agrupamentos são feitos por id e atingiriam 2 registros.
  if(new Set(data.transactions.map(t=>t.id)).size!==data.transactions.length) return false;
  if(!data.categories.every(isValidCategoryRecord)) return false;
  if(data.cards!==undefined && !isRecordArray(data.cards)) return false; // cards é opcional (compat. com backups antigos)
  if(data.cards!==undefined && !data.cards.every(isValidCardRecord)) return false; // Auditoria 2: estrutura mínima de cada cartão
  if(data.goals!==undefined && !isRecordArray(data.goals)) return false; // goals é opcional (compat. com backups antigos, V1.2.2)
  if(data.budgets!==undefined && (typeof data.budgets!=='object'||data.budgets===null||Array.isArray(data.budgets))) return false; // budgets é opcional (compat. com backups antigos, alinhado a cards/goals — V1.2.3)
  if(data.monthClosures!==undefined && !isRecordArray(data.monthClosures)) return false; // monthClosures é opcional (compat. com backups antigos, alinhado a cards/goals/budgets — V2.0.1)
  // settings é opcional/tolerante: ausente, null ou de tipo inválido é aceito; normalizeDB() aplica os defaults.
  return true;
}
function showBackupError(msg){
  const el=document.getElementById('backupMsg');
  if(el){ el.textContent=msg; el.style.display='block'; } else showToast(msg);
}
function resetImportInput(){ const el=document.getElementById('importFileInput'); if(el) el.value=''; }
function importConfirmHTML(data){
  return `<h3 id="modalTitle">Confirmar importação de backup</h3>
  <p class="muted">Isso substituirá TODOS os dados atuais pelos dados do arquivo selecionado. Esta ação não pode ser desfeita.</p>
  <div class="card" style="margin:10px 0">
    <div class="row"><span>Contas</span><span>${data.accounts.length}</span></div>
    <div class="row"><span>Lançamentos</span><span>${data.transactions.length}</span></div>
    <div class="row"><span>Cartões</span><span>${data.cards.length}</span></div>
    <div class="row"><span>Metas</span><span>${(data.goals||[]).length}</span></div>
    <div class="row"><span>Fechamentos mensais</span><span>${(data.monthClosures||[]).length}</span></div>
  </div>
  <div style="display:flex;gap:8px;justify-content:flex-end">
    <button class="ghost" id="cancelImportBtn">Cancelar</button>
    <button class="primary" id="confirmImportBtn">Substituir dados</button>
  </div>`;
}
// Fluxo: ler -> validar -> (se inválido) mostrar erro e NÃO tocar em DB/localStorage -> (se válido)
// pedir confirmação -> só após confirmar, substitui DB, salva e renderiza.
function importBackupFile(file){
  const reader=new FileReader();
  reader.onload=()=>{
    let parsed;
    try{ parsed=JSON.parse(reader.result); }
    catch(e){ showBackupError('Backup inválido. Seus dados atuais foram preservados.'); resetImportInput(); return; }
    if(!validateBackupData(parsed)){ showBackupError('Backup inválido. Seus dados atuais foram preservados.'); resetImportInput(); return; }
    // Auditoria 2: normalização também protegida — se algo lançar, nada do estado atual é tocado.
    let normalized;
    try{ normalized=normalizeDB(parsed); }
    catch(e){ showBackupError('Backup inválido. Seus dados atuais foram preservados.'); resetImportInput(); return; }
    openModal(importConfirmHTML(normalized),'modalTitle');
    document.getElementById('confirmImportBtn').onclick=()=>{
      // Auditoria 2 (achado 7): só afirma sucesso se saveDB() realmente persistiu. Em caso de falha
      // o DB anterior é restaurado (trySave/localStorage.setItem não sobrescreve o valor antigo
      // quando lança erro), então memória e armazenamento continuam consistentes.
      const previousDB=DB;
      DB=normalized;
      if(!saveDB()){
        DB=previousDB;
        closeModal();
        resetImportInput();
        render();
        showBackupError('Não foi possível salvar o backup importado. Seus dados atuais foram preservados.');
        showToast('Não foi possível salvar o backup importado. Seus dados atuais foram preservados.');
        return;
      }
      closeModal();
      resetImportInput();
      render();
      showToast('Backup importado com sucesso.');
    };
    document.getElementById('cancelImportBtn').onclick=()=>{ closeModal(); resetImportInput(); };
  };
  reader.onerror=()=>{ showBackupError('Backup inválido. Seus dados atuais foram preservados.'); resetImportInput(); };
  reader.readAsText(file);
}
// ================== FIM BACKUP: IMPORTAÇÃO ==================

function modalKeyHandler(e){ if(e.key==='Escape') closeModal(); }

  document.getElementById('modalRoot').innerHTML=`<div class="modal-bg" id="mbg"><div class="modal" role="dialog" aria-modal="true" ${labelAttr}>${html}</div></div>`;
  document.getElementById('mbg').onclick=(e)=>{if(e.target.id==='mbg') closeModal()};
  document.addEventListener('keydown',modalKeyHandler);
  setTimeout(()=>{
    const modal=document.querySelector('.modal');
    const focusable=modal&&modal.querySelector('input,select,textarea,button');
    if(focusable) focusable.focus();
  },0);
}
function closeModal(){
  document.getElementById('modalRoot').innerHTML='';
  document.removeEventListener('keydown',modalKeyHandler);
  if(lastFocusedEl && typeof lastFocusedEl.focus==='function') lastFocusedEl.focus();
}

}

function askDeleteScope(t){
  if(!(t.installment||t.recurrence)){
    if(confirm('Excluir este lançamento?')){
      DB.transactions=DB.transactions.filter(x=>x.id!==t.id);saveDB();render();
    }
    return;
  }
  const kind=t.installment?'installment':'recurrence';
  const noun=kind==='installment'?'parcela':'ocorrência';
  const allLabel=kind==='installment'?'Todas as parcelas':'Toda a recorrência';
  openModal(`<h3 id="modalTitle">Excluir ${noun}</h3>
    <p class="muted">Este lançamento faz parte de um grupo. O que você deseja excluir?</p>
    <div style="display:flex;flex-direction:column;gap:8px;margin-top:12px">
      <button class="ghost" id="delOnlyBtn">Apenas esta</button>
      <button class="ghost" id="delAllBtn">${allLabel}</button>
      <button class="ghost" id="delCancelBtn">Cancelar</button>
    </div>`,'modalTitle');
  document.getElementById('delOnlyBtn').onclick=()=>{
    DB.transactions=DB.transactions.filter(x=>x.id!==t.id);
    if(t.installment) syncInstallmentGroup(t.installment.groupId);
    if(t.recurrence) syncRecurrenceGroup(t.recurrence.groupId); // Correção F4
    saveDB();closeModal();render();
  };
  document.getElementById('delAllBtn').onclick=()=>{
    const groupId=t[kind].groupId;
    DB.transactions=DB.transactions.filter(x=>!(x[kind]&&x[kind].groupId===groupId));
    saveDB();closeModal();render();
  };
  document.getElementById('delCancelBtn').onclick=()=>closeModal();
}

function askEditScope(t){
  if(!(t.installment||t.recurrence)){
    openModal(txForm(t),'modalTitle');bindTxFormEvents(t);return;
  }
  const kind=t.installment?'installment':'recurrence';
  const groupId=t[kind].groupId;
  const group=DB.transactions.filter(x=>x[kind]&&x[kind].groupId===groupId);
  const noun=kind==='installment'?'parcelamento':'recorrência';
  const allBtnLabel=kind==='installment'?'Editar todas as parcelas':'Editar todas as ocorrências futuras';
  openModal(`<h3 id="modalTitle">Editar lançamento</h3>
    <p class="muted">Este lançamento faz parte de um ${noun}.</p>
    <div style="display:flex;flex-direction:column;gap:8px;margin-top:12px">
      <button class="ghost" id="editOnlyBtn">Editar somente esta</button>
      <button class="ghost" id="editAllBtn">${allBtnLabel}</button>
      <button class="ghost" id="editCancelBtn">Cancelar</button>
    </div>`,'modalTitle');
  document.getElementById('editOnlyBtn').onclick=()=>{
    closeModal();openModal(txForm(t),'modalTitle');bindTxFormEvents(t);
  };
  document.getElementById('editAllBtn').onclick=()=>{
    closeModal();
    const scope=kind==='recurrence'?group.filter(x=>x.date>=t.date):group;
    openBulkEditForm(scope,kind==='installment'?'Editar todas as parcelas':'Editar ocorrências futuras');
  };
  document.getElementById('editCancelBtn').onclick=()=>closeModal();
}

function openBulkEditForm(list,heading){
  if(!list.length) return;
  const first=list[0];
  const isCartao=first.type==='cartao';
  const catOpts=DB.categories.map(c=>`<option value="${escapeHTML(c.id)}" ${first.categoryId===c.id?'selected':''}>${escapeHTML(c.icon+' '+c.name)}</option>`).join('');
  const accOpts=DB.accounts.map(a=>`<option value="${escapeHTML(a.id)}" ${first.accountId===a.id?'selected':''}>${escapeHTML(a.name)}</option>`).join('');
  // Compra parcelada/recorrente no cartão não tem conta bancária — não faz sentido oferecer
  // o campo "Conta" aqui, para não atribuir por engano uma conta a uma compra de cartão.
  openModal(`<h3 id="modalTitle">${heading}</h3>
    <div id="formError" class="form-error" style="display:none" role="alert"></div>
    <p class="muted">Alterações serão aplicadas a ${list.length} lançamento(s). Valor e data de cada um não são alterados aqui.</p>
    <div class="field"><label for="beDesc">Descrição</label><input id="beDesc" value="${escapeHTML(first.desc)}"></div>
    <div class="field"><label for="beCatSel">Categoria</label><select id="beCatSel">${catOpts}</select></div>
    ${isCartao?'':`<div class="field"><label for="beAcc">Conta</label><select id="beAcc">${accOpts}</select></div>`}
    <div class="field"><label for="beNote">Observação</label><input id="beNote" value="${escapeHTML(first.note||'')}"></div>
    <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:10px">
      <button class="ghost" onclick="closeModal()">Cancelar</button>
      <button class="primary" id="beSaveBtn">Salvar em todos</button>
    </div>`,'modalTitle');
  document.getElementById('beSaveBtn').onclick=()=>{
    const desc=document.getElementById('beDesc').value.trim();
    const categoryId=document.getElementById('beCatSel').value;
    const accountId=isCartao?null:document.getElementById('beAcc').value;
    const note=document.getElementById('beNote').value.trim();
    if(!desc){ showFormError('Informe uma descrição.'); return; }
    if(!categoryId||!catById(categoryId)){ showFormError('Selecione uma categoria válida.'); return; }
    if(!isCartao && (!accountId||!accById(accountId))){ showFormError('Selecione uma conta válida.'); return; }
    const ids=new Set(list.map(t=>t.id));
    DB.transactions.forEach(t=>{
      if(ids.has(t.id)){ t.desc=desc; t.categoryId=categoryId; if(!isCartao) t.accountId=accountId; t.note=note; stampTx(t); }
    });
    saveDB();closeModal();render();
  };
}

function txForm(existing){
  const t=existing||{type:'despesa',date:todayISO()};
  const catOpts=DB.categories.map(c=>`<option value="${escapeHTML(c.id)}" ${t.categoryId===c.id?'selected':''}>${escapeHTML(c.icon+' '+c.name)}</option>`).join('');
  const accOpts=DB.accounts.map(a=>`<option value="${escapeHTML(a.id)}" ${t.accountId===a.id?'selected':''}>${escapeHTML(a.name)}</option>`).join('');
  // Correção 3A (bug #3): o destino de uma transferência é toAccountId, não accountId (origem).
  const toAccOpts=DB.accounts.map(a=>`<option value="${escapeHTML(a.id)}" ${t.toAccountId===a.id?'selected':''}>${escapeHTML(a.name)}</option>`).join('');
  // Um cartão inativo não pode ser escolhido para uma NOVA compra, mas se já for o cartão de um
  // lançamento existente (editando), mantemos a opção para não perder a referência ao salvar.
  const selectableCards=DB.cards.filter(c=>c.active!==false||(existing&&existing.cardId===c.id));
  const cardOpts=selectableCards.map(c=>`<option value="${escapeHTML(c.id)}" ${t.cardId===c.id?'selected':''}>${escapeHTML(c.name)}${c.active===false?' (inativo)':''}</option>`).join('');
  const hasActiveCard=DB.cards.some(c=>c.active!==false);
  const isTransfer=t.type==='transferencia';
  const isCartao=t.type==='cartao';
  // Parcelamento e recorrência só fazem sentido ao criar um lançamento novo (não ao editar um já existente)
  const showSchedulingFields=!existing;
  const groupNote=existing&&(existing.installment||existing.recurrence)
    ?`<p class="muted" style="margin-top:-4px">${existing.installment?`Parcela ${escapeHTML(existing.installment.index)}/${escapeHTML(existing.installment.count)} de um parcelamento.`:`Ocorrência ${escapeHTML(existing.recurrence.index)}/${escapeHTML(existing.recurrence.count)} de uma recorrência.`} Alterações aqui afetam somente este lançamento.</p>`
    :'';
  return `<h3 id="modalTitle">${existing?'Editar':'Novo'} lançamento</h3>
  ${groupNote}
  <div id="formError" class="form-error" style="display:none" role="alert"></div>
  <div class="field"><label for="fType">Tipo</label><select id="fType">
    <option value="despesa" ${t.type==='despesa'?'selected':''}>Despesa</option>
    <option value="receita" ${t.type==='receita'?'selected':''}>Receita</option>
    <option value="transferencia" ${t.type==='transferencia'?'selected':''}>Transferência</option>
    ${(hasActiveCard||isCartao)?`<option value="cartao" ${isCartao?'selected':''}>Compra no cartão</option>`:''}</select></div>
  <div class="field"><label for="fDesc">Descrição</label><input id="fDesc" value="${escapeHTML(t.desc||'')}" placeholder="Ex: Mercado"></div>
  <div class="formgrid">
    <div class="field"><label for="fVal">Valor</label><input id="fVal" type="number" step="0.01" value="${escapeHTML(t.amount||'')}" placeholder="0,00"></div>
    <div class="field"><label for="fDate">Data</label><input id="fDate" type="date" value="${escapeHTML(t.date)}"></div>
  </div>
  <div class="field" id="catField" style="display:${isTransfer?'none':'block'}"><label for="fCatSel">Categoria</label><select id="fCatSel">${catOpts}</select></div>
  <div class="formgrid">
    <div class="field" id="accField" style="display:${isCartao?'none':'block'}"><label for="fAcc">Conta</label><select id="fAcc">${accOpts}</select></div>
    <div class="field" id="cardField" style="display:${isCartao?'block':'none'}"><label for="fCard">Cartão</label><select id="fCard">${cardOpts}</select></div>
    <div class="field" id="toAccField" style="display:${isTransfer?'block':'none'}"><label for="fToAcc">Para a conta</label><select id="fToAcc">${toAccOpts}</select></div>
  </div>
  <div class="field"><label for="fNote">Observação</label><input id="fNote" value="${escapeHTML(t.note||'')}"></div>
  ${showSchedulingFields?`
  <div class="field" id="parcField" style="display:${isTransfer?'none':'block'}">
    <label for="fParcelar"><input type="checkbox" id="fParcelar"> Parcelar este lançamento</label>
    <div id="parcN" style="display:none;margin-top:6px"><label for="fParcelasN">Número de parcelas</label><input id="fParcelasN" type="number" min="2" step="1" placeholder="Ex: 3"></div>
  </div>
  <div class="field" id="recField" style="display:${isTransfer?'none':'block'}">
    <label for="fRecorrer"><input type="checkbox" id="fRecorrer"> Repetir mensalmente (recorrência)</label>
    <div id="recN" style="display:none;margin-top:6px"><label for="fRecorrenciaN">Repetir por quantos meses</label><input id="fRecorrenciaN" type="number" min="2" step="1" placeholder="Ex: 6"></div>
  </div>`:''}
  <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:10px">
    <button class="ghost" onclick="closeModal()">Cancelar</button>
    <button class="primary" id="saveTxBtn">Salvar</button>
  </div>`;
}
function bindTxFormEvents(existing){
  document.getElementById('fType').onchange=(e)=>{
    const isTransfer=e.target.value==='transferencia';
    const isCartao=e.target.value==='cartao';
    document.getElementById('catField').style.display=isTransfer?'none':'block';
    document.getElementById('toAccField').style.display=isTransfer?'block':'none';
    document.getElementById('accField').style.display=isCartao?'none':'block';
    document.getElementById('cardField').style.display=isCartao?'block':'none';
    const parcField=document.getElementById('parcField'), recField=document.getElementById('recField');
    if(parcField) parcField.style.display=isTransfer?'none':'block';
    if(recField) recField.style.display=isTransfer?'none':'block';
    if(isTransfer){
      // Transferência não pode ser parcelada nem recorrente — zera qualquer seleção anterior.
      const pa=document.getElementById('fParcelar'), re=document.getElementById('fRecorrer');
      if(pa && pa.checked){ pa.checked=false; document.getElementById('parcN').style.display='none'; }
      if(re && re.checked){ re.checked=false; document.getElementById('recN').style.display='none'; }
    }
  };
  const parcelarChk=document.getElementById('fParcelar');
  if(parcelarChk) parcelarChk.onchange=(e)=>{
    document.getElementById('parcN').style.display=e.target.checked?'block':'none';
    if(e.target.checked){
      const rec=document.getElementById('fRecorrer');
      if(rec && rec.checked){ rec.checked=false; document.getElementById('recN').style.display='none'; }
    }
  };
  const recorrerChk=document.getElementById('fRecorrer');
  if(recorrerChk) recorrerChk.onchange=(e)=>{
    document.getElementById('recN').style.display=e.target.checked?'block':'none';
    if(e.target.checked){
      const pa=document.getElementById('fParcelar');
      if(pa && pa.checked){ pa.checked=false; document.getElementById('parcN').style.display='none'; }
    }
  };

  document.getElementById('saveTxBtn').onclick=()=>{
    const type=document.getElementById('fType').value;
    const isCartao=type==='cartao';
    const desc=document.getElementById('fDesc').value.trim();
    const amount=money2(document.getElementById('fVal').value);
    const date=document.getElementById('fDate').value;
    const accountId=isCartao?null:document.getElementById('fAcc').value;
    const note=document.getElementById('fNote').value.trim();

    if(!desc){ showFormError('Informe uma descrição para o lançamento.'); return; }
    if(!amount || amount<=0){ showFormError('O valor deve ser maior que zero.'); return; }
    if(!date){ showFormError('Informe uma data válida.'); return; }

    let cardId=null;
    if(isCartao){
      cardId=document.getElementById('fCard').value;
      // Compra no cartão não exige (nem usa) conta bancária — ver getInvoicePeriod/cardUsed.
      if(!cardId || !cardById(cardId)){ showFormError('Selecione um cartão válido.'); return; }
    } else if(!accountId || !accById(accountId)){ showFormError('Selecione uma conta válida. Cadastre uma conta antes de continuar.'); return; }

    let toAccountId=null, categoryId=null;
    if(type==='transferencia'){
      toAccountId=document.getElementById('fToAcc').value;
      if(!toAccountId || !accById(toAccountId)){ showFormError('Selecione a conta de destino.'); return; }
      if(toAccountId===accountId){ showFormError('A conta de destino deve ser diferente da conta de origem.'); return; }
    } else {
      categoryId=document.getElementById('fCatSel').value;
      if(!categoryId || !catById(categoryId)){ showFormError('Selecione uma categoria válida.'); return; }
    }

    const parcChk=document.getElementById('fParcelar');
    const recChk=document.getElementById('fRecorrer');
    const isParcelado=!existing && type!=='transferencia' && parcChk && parcChk.checked;
    const isRecorrente=!existing && type!=='transferencia' && recChk && recChk.checked;
    if(isParcelado && isRecorrente){ showFormError('Um lançamento não pode ser parcelado e recorrente ao mesmo tempo.'); return; }

    if(isParcelado){
      const nRaw=String(document.getElementById('fParcelasN').value).trim();
      const n=Number(nRaw);
      if(!nRaw || !Number.isInteger(n) || n<2){ showFormError('Informe um número inteiro de parcelas válido (mínimo 2).'); return; }
      if(toCents(amount)<n){ showFormError('O valor é pequeno demais para dividir em '+n+' parcelas: cada parcela precisa ter pelo menos R$ 0,01.'); return; }
      const parts=splitInstallments(amount,n);
      if(parts.some(p=>toCents(p)<1)){ showFormError('Este parcelamento geraria parcelas de R$ 0,00. Reduza o número de parcelas.'); return; }
      const groupId=uid();
      parts.forEach((amt,i)=>{
        DB.transactions.push(stampTx({id:uid(),desc,amount:amt,type,date:addMonthsISO(date,i),accountId,cardId,categoryId,note,installment:{groupId,index:i+1,count:n,totalAmount:amount}}));
      });
    } else if(isRecorrente){
      // Estrutura de recorrência: gera as ocorrências mensais de uma vez, cada uma sabendo seu índice/total no grupo.
      // Ainda será refinada em uma próxima etapa (ex: recorrência sem fim definido, outras frequências).
      const n=parseInt(document.getElementById('fRecorrenciaN').value,10);
      if(!n || n<2){ showFormError('Informe por quantos meses a recorrência deve se repetir (mínimo 2).'); return; }
      const groupId=uid();
      for(let i=0;i<n;i++){
        DB.transactions.push(stampTx({id:uid(),desc,amount,type,date:addMonthsISO(date,i),accountId,cardId,categoryId,note,recurrence:{groupId,index:i+1,count:n,frequency:'monthly'}}));
      }
    } else {
      const obj={id:existing?existing.id:uid(),desc,amount,type,date,accountId,cardId,note,categoryId};
      if(type==='transferencia'){ obj.toAccountId=toAccountId; obj.categoryId=null; }
      // Correção 3A (bug #1): editar sem mudar cartão/data preserva o período de fatura já fixado.
      if(existing && type==='cartao' && existing.invoicePeriod && existing.cardId===cardId && existing.date===date){
        obj.invoicePeriod=existing.invoicePeriod; if(existing.invoiceClosingDay) obj.invoiceClosingDay=existing.invoiceClosingDay;
      }
      stampTx(obj);
      if(existing){
        // Correção 3B (bug #5): transferência nunca carrega metadado de parcelamento.
        if(existing.installment && type!=='transferencia') obj.installment=existing.installment;
        if(existing.recurrence) obj.recurrence=existing.recurrence;
        const idx=DB.transactions.findIndex(x=>x.id===existing.id);
        DB.transactions[idx]=obj;
        // Correção 3B (bug #4): valor editado / parcela retirada do grupo => recalcula o grupo.
        if(existing.installment) syncInstallmentGroup(existing.installment.groupId);
      } else {
        DB.transactions.push(obj);
      }
    }

    saveDB();
    closeModal();
    render();
  };
}

function bindTxListEvents(){
  document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>{
    const t=DB.transactions.find(x=>x.id===b.dataset.edit); if(!t) return;
    if(t.type==='pagamento_fatura'){ showToast('Pagamento de fatura não pode ser editado. Exclua e registre novamente, se necessário.'); return; }
    askEditScope(t);
  });
  document.querySelectorAll('[data-viewgroup]').forEach(b=>b.onclick=()=>{
    const t=DB.transactions.find(x=>x.id===b.dataset.viewgroup); if(!t) return;
    const kind=t.installment?'installment':(t.recurrence?'recurrence':null);
    if(kind) openGroupModal(kind,t[kind].groupId,t.id);
  });
  document.querySelectorAll('[data-dup]').forEach(b=>b.onclick=()=>{
    const orig=DB.transactions.find(x=>x.id===b.dataset.dup); if(!orig) return;
    if(orig.type==='pagamento_fatura'){ showToast('Pagamento de fatura não pode ser duplicado.'); return; }
    // Duplicar não deve copiar id nem metadados de parcela/recorrência, para o novo lançamento não
    // parecer parte do lançamento original.
    const copy={...orig};
    delete copy.installment; delete copy.recurrence; delete copy.invoicePeriod; delete copy.invoiceClosingDay;
    delete copy.demo; // Correção F2: a duplicata é um dado criado pelo usuário, nunca herda o rótulo de demonstração.
    copy.id=uid(); copy.date=todayISO(); stampTx(copy);
    DB.transactions.push(copy);
    saveDB(); render();
  });
  document.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{
    const t=DB.transactions.find(x=>x.id===b.dataset.del); if(t) askDeleteScope(t);
  });
}

    <div id="formError" class="form-error" style="display:none" role="alert"></div>
    <div class="field"><label for="accName">Nome</label><input id="accName" placeholder="Ex: Nubank"></div>

    <div style="display:flex;gap:8px;justify-content:flex-end"><button class="ghost" onclick="closeModal()">Cancelar</button>

  document.querySelectorAll('[data-delcard]').forEach(b=>b.onclick=()=>{
    const c=cardById(b.dataset.delcard); if(!c) return;
    const hasTx=DB.transactions.some(t=>t.cardId===c.id);
    if(hasTx){ showToast('Não é possível excluir: este cartão possui compras ou pagamentos vinculados.'); return; }
    if(confirm('Excluir o cartão '+c.name+'?')){
      DB.cards=DB.cards.filter(x=>x.id!==c.id);
      if(txFilters.cartao===c.id) txFilters.cartao=''; // Correção F3: não deixar filtro invisível apontando p/ cartão excluído
      saveDB(); render();
    }
  });
  document.querySelectorAll('[data-payinvoice]').forEach(b=>b.onclick=()=>{
    const c=cardById(b.dataset.payinvoice); if(!c) return;
    const period=b.dataset.payperiod||getCurrentInvoice(c).period;
    if(DB.accounts.length<1){ showToast('Cadastre uma conta bancária antes de pagar a fatura.'); return; }
    openModal(payInvoiceForm(c,period),'modalTitle');bindPayInvoiceEvents(c,period);
  });

  if(document.getElementById('btnTransfer')) document.getElementById('btnTransfer').onclick=()=>{
    if(DB.accounts.length<2){ showToast('Cadastre pelo menos duas contas para fazer uma transferência.'); return; }
    const accOpts=DB.accounts.map(a=>`<option value="${escapeHTML(a.id)}">${escapeHTML(a.name)}</option>`).join('');
    openModal(`<h3 id="modalTitle">Transferência entre contas</h3>
    <div id="formError" class="form-error" style="display:none" role="alert"></div>
    <div class="field"><label for="trFrom">De</label><select id="trFrom">${accOpts}</select></div>
    <div class="field"><label for="trTo">Para</label><select id="trTo">${accOpts}</select></div>
    <div class="field"><label for="trVal">Valor</label><input id="trVal" type="number" step="0.01"></div>
    <div style="display:flex;gap:8px;justify-content:flex-end"><button class="ghost" onclick="closeModal()">Cancelar</button>
    <button class="primary" id="saveTrBtn">Transferir</button></div>`,'modalTitle');
    document.getElementById('saveTrBtn').onclick=()=>{
      const from=document.getElementById('trFrom').value, to=document.getElementById('trTo').value;
      const val=money2(document.getElementById('trVal').value);
      if(!from||!accById(from)||!to||!accById(to)){ showFormError('Selecione contas válidas.'); return; }
      if(from===to){ showFormError('A conta de destino deve ser diferente da conta de origem.'); return; }
      if(!val||val<=0){ showFormError('O valor da transferência deve ser maior que zero.'); return; }
      DB.transactions.push(stampTx({id:uid(),desc:'Transferência',amount:val,type:'transferencia',accountId:from,toAccountId:to,date:todayISO(),categoryId:null,note:''}));
      saveDB();closeModal();render();
    };
  };

  // Filtro de período do Dashboard: « » deslocam o período inteiro em 1 mês; os campos ajustam início/fim.
  if(document.getElementById('dashPrevMonth')) document.getElementById('dashPrevMonth').onclick=()=>{ dashFrom=shiftYearMonth(dashFrom,-1); dashTo=shiftYearMonth(dashTo,-1); render(); };
  if(document.getElementById('dashNextMonth')) document.getElementById('dashNextMonth').onclick=()=>{ dashFrom=shiftYearMonth(dashFrom,1); dashTo=shiftYearMonth(dashTo,1); render(); };
  if(document.getElementById('dashToday')) document.getElementById('dashToday').onclick=()=>{ dashFrom=dashTo=todayISO().slice(0,7); render(); };
  if(document.getElementById('dashFromInp')) document.getElementById('dashFromInp').onchange=(e)=>{ if(/^\d{4}-\d{2}$/.test(e.target.value)){ dashFrom=e.target.value; if(dashFrom>dashTo) dashTo=dashFrom; } render(); };
  if(document.getElementById('dashToInp')) document.getElementById('dashToInp').onchange=(e)=>{ if(/^\d{4}-\d{2}$/.test(e.target.value)){ dashTo=e.target.value; if(dashTo<dashFrom) dashFrom=dashTo; } render(); };
  bindMonthRange('orc',()=>[orcFrom,orcTo],(a,b)=>{orcFrom=a;orcTo=b;});
  if(document.getElementById('btnAddBudget')) document.getElementById('btnAddBudget').onclick=()=>{
    const catEl=document.getElementById('bCat'), valEl=document.getElementById('bVal');
    const cat=catEl?catEl.value:''; const val=parseFloat(valEl?valEl.value:'');
    const errEl=document.getElementById('orcError');
    function err(msg){ if(errEl){errEl.textContent=msg;errEl.style.display='block';} }
    if(!cat||!catById(cat)){ err('Selecione uma categoria válida.'); return; }
    if(!val||val<=0){ err('Informe um limite de orçamento maior que zero.'); return; }
    DB.budgets=DB.budgets||{}; DB.budgets[cat]=val; saveDB(); render();
  };

  // ---- V1.2.2 — Metas financeiras: apenas leem/gravam DB.goals, nunca DB.transactions/accounts/cards ----
  if(document.getElementById('btnVerMetas')) document.getElementById('btnVerMetas').onclick=()=>{route='metas';render();};
  if(document.getElementById('btnNovaMeta')) document.getElementById('btnNovaMeta').onclick=()=>{
    openModal(goalForm(),'modalTitle');bindGoalFormEvents();
  };
  document.querySelectorAll('[data-editgoal]').forEach(b=>b.onclick=()=>{
    const g=DB.goals.find(x=>x.id===b.dataset.editgoal); if(!g) return;
    openModal(goalForm(g),'modalTitle');bindGoalFormEvents(g);
  });
  document.querySelectorAll('[data-delgoal]').forEach(b=>b.onclick=()=>{
    const g=DB.goals.find(x=>x.id===b.dataset.delgoal); if(!g) return;
    if(confirm('Excluir a meta "'+(g.name||'')+'"? Isso não afeta contas, cartões, orçamento ou lançamentos.')){
      DB.goals=DB.goals.filter(x=>x.id!==g.id); saveDB(); render();
    }
  });
  document.querySelectorAll('[data-addval]').forEach(b=>b.onclick=()=>{
    const g=DB.goals.find(x=>x.id===b.dataset.addval); if(!g) return;
    openModal(goalValueForm(g,'add'),'modalTitle');bindGoalValueEvents(g,'add');
  });
  document.querySelectorAll('[data-remval]').forEach(b=>b.onclick=()=>{
    const g=DB.goals.find(x=>x.id===b.dataset.remval); if(!g) return;
    openModal(goalValueForm(g,'remove'),'modalTitle');bindGoalValueEvents(g,'remove');
  });
  document.querySelectorAll('[data-togglegoal]').forEach(b=>b.onclick=()=>{
    const g=DB.goals.find(x=>x.id===b.dataset.togglegoal); if(!g) return;
    g.active=!g.active; saveDB(); render();
  });

  // ---- V2.0.1 — Fechamento mensal: apenas cria/remove registros em DB.monthClosures, nunca
  // toca em DB.transactions/accounts/cards/budgets/goals ----
  document.querySelectorAll('[data-evoperiod]').forEach(b=>b.onclick=()=>{ evoPeriod=b.dataset.evoperiod==='custom'?'custom':(parseInt(b.dataset.evoperiod,10)||6); render(); });
  bindMonthRange('evo',()=>[evoFrom,evoTo],(a,b)=>{evoFrom=a;evoTo=b;});
  bindMonthRange('compA',()=>[compFromA,compToA],(a,b)=>{compFromA=a;compToA=b;});
  bindMonthRange('compB',()=>[compFromB,compToB],(a,b)=>{compFromB=a;compToB=b;});
  bindMonthRange('fech',()=>[fechFrom,fechTo],(a,b)=>{fechFrom=a;fechTo=b;});
  document.querySelectorAll('[data-closemonth]').forEach(btn=>btn.onclick=()=>{
    const ym=btn.dataset.closemonth;
    openModal(monthClosureConfirmFormHTML(ym),'modalTitle');
    bindMonthClosureConfirmEvents(ym);
  });
  document.querySelectorAll('[data-reopenmonth]').forEach(btn=>btn.onclick=()=>{
    const ym=btn.dataset.reopenmonth;
    if(confirm('Deseja reabrir '+budgetMonthLabel(ym)+'? Isso não altera nem remove nenhum lançamento.')){
      reopenMonth(ym); render(); showToast('Mês reaberto.');
    }
  });

  bindMonthRange('rep',()=>[repFrom,repTo],(a,b)=>{repFrom=a;repTo=b;});
  if(document.getElementById('themeSel')) document.getElementById('themeSel').onchange=(e)=>{
    DB.settings.theme=e.target.value; document.documentElement.setAttribute('data-theme',e.target.value); saveDB();
  };
  if(document.getElementById('motionChk')) document.getElementById('motionChk').onchange=(e)=>{
    DB.settings.reduceMotion=!e.target.checked; document.body.classList.toggle('motion',e.target.checked); saveDB();
  };
  if(document.getElementById('btnExport')) document.getElementById('btnExport').onclick=()=>{
    const blob=new Blob([JSON.stringify(DB,null,2)],{type:'application/json'});
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a'); a.href=url; a.download='backup-financas.json'; a.click();
    // Libera o ObjectURL depois do download para não acumular referências de memória a cada exportação.
    setTimeout(()=>URL.revokeObjectURL(url),1000);
  };
  if(document.getElementById('btnImport')) document.getElementById('btnImport').onclick=()=>{
    const el=document.getElementById('backupMsg'); if(el) el.style.display='none';
    document.getElementById('importFileInput').click();
  };
  if(document.getElementById('importFileInput')) document.getElementById('importFileInput').onchange=(e)=>{
    const file=e.target.files&&e.target.files[0];
    if(file) importBackupFile(file);
  };
  if(document.getElementById('btnClearDemo')) document.getElementById('btnClearDemo').onclick=()=>{
    if(confirm('Remover todos os dados de demonstração?')){
      DB.transactions=DB.transactions.filter(t=>!t.demo);
      // Correção Etapa 6: se TODAS as contas forem de demonstração (caso comum: instalação nova,
      // nunca usada), o filtro abaixo aplicado sem essa checagem zerava DB.accounts por completo,
      // contornando a regra de "nunca excluir a última conta" que o botão de excluir conta
      // individual respeita. Se não sobrar nenhuma conta real, mantemos as contas existentes
      // (apenas removendo o rótulo de demonstração) em vez de deixar o sistema sem nenhuma conta.
      const nonDemoAccounts=DB.accounts.filter(a=>!a.demo);
      if(nonDemoAccounts.length>0){
        // Correção F1: uma conta demo referenciada por lançamento real (DB.transactions já contém só
        // os não-demo neste ponto; conta de origem OU de destino) não é excluída — perde apenas o
        // rótulo de demonstração e passa a ser uma conta normal. Contas demo sem uso real seguem sendo removidas.
        const usedByReal=new Set();
        DB.transactions.forEach(t=>{ if(t.accountId) usedByReal.add(t.accountId); if(t.toAccountId) usedByReal.add(t.toAccountId); });
        DB.accounts=DB.accounts.filter(a=>!a.demo||usedByReal.has(a.id));
        DB.accounts.forEach(a=>{ delete a.demo; });
      } else {
        DB.accounts.forEach(a=>{ delete a.demo; });
        showToast('As contas de demonstração foram mantidas (sem o rótulo de demonstração) para que o sistema não fique sem nenhuma conta.');
      }
      saveDB();render();
    }
  };
  if(document.getElementById('btnReset')) document.getElementById('btnReset').onclick=()=>{
    if(confirm('Isso apagará TODOS os seus dados. Deseja continuar?')){
      // Correção (limpeza de dados): antes, este botão removia a chave do localStorage e chamava
      // loadDB() — mas loadDB() trata "nada salvo" como primeira instalação e recria
      // automaticamente os dados de demonstração (ver demoData()), salvando-os de volta no
      // localStorage. Na prática, "Apagar todos os dados" recriava a demonstração na hora, e ela
      // continuava voltando a cada reload. Agora este botão grava diretamente um estado vazio de
      // verdade (nenhuma conta/lançamento/cartão/meta/orçamento/fechamento, demo ou não) via
      // saveDB(), sem nunca remover a chave nem chamar loadDB()/demoData() aqui — então o "vazio"
      // persiste entre reloads como qualquer outro dado salvo. O tema e a preferência de redução de
      // movimento já em uso são preservados, por não serem dados financeiros nem de demonstração.
      DB=normalizeDB({accounts:[],transactions:[],categories:DEFAULT_CATS,budgets:{},cards:[],
        goals:[],monthClosures:[],notificationState:{readIds:[]},settings:Object.assign({},DB.settings)});
      saveDB();
      render();
    }
  };
}

document.getElementById('fabBtn').onclick=()=>{openModal(txForm(),'modalTitle');bindTxFormEvents()};
document.getElementById('notifBtn').onclick=()=>openNotifPanel();
render();
</script>
<script>
// PWA (Etapa 1): registro do Service Worker. Totalmente opcional e silencioso: sem suporte, em file:// ou sem HTTPS,
// nada acontece e a aplicação continua funcionando como antes. Não toca em localStorage nem em dados financeiros.
(function(){
  try{
    if(!('serviceWorker' in navigator)) return;
    if(location.protocol!=='https:' && location.protocol!=='http:') return;
    window.addEventListener('load',function(){
      try{ navigator.serviceWorker.register('sw.js').catch(function(){}); }catch(e){}
    });
  }catch(e){}
})();
</script>
</body>
