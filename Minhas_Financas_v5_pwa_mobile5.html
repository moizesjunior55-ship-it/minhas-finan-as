// ---- Gerenciamento de categorias (usa DB.categories / categoryId já existentes) ----
// Sempre substitui DB.categories por um array novo (nunca altera objetos no lugar): o primeiro carregamento
// usa DEFAULT_CATS como o próprio DB.categories, e mudar esses objetos alteraria também o padrão.
const CAT_ICON_CHOICES=['🍽️','🏠','🚗','💊','📚','🎮','🛍️','🔁','🧾','📄','📦','🛒','☕','✈️','🐶','🎁','💼','🏋️','💡','🏷️'];
function catNormName(n){ return String(n||'').trim().replace(/\s+/g,' ').toLowerCase(); }
function catReadOn(){ return !!(window.AppRead&&window.AppRead.isEnabled('categories.read')); }
function catDeleteOn(){ return !!(window.AppWrite&&window.AppWrite.isEnabled('categories.delete')); }   // 3D-06: só a flag da rota (em memória); a decisão remota/local usa também catReadOn()
function catSourceList(){   // 3D-04: com a leitura do Supabase ligada a lista exibida é a remota (nunca misturada com o DB local)
  if(!catReadOn())return DB.categories;
  const v=window.AppRead.view(typeof AuthUI!=='undefined'?AuthUI.userId():null);
  return v.status==='ok'?v.items:[];
}
function catEditTarget(id){   // 3D-05: com a leitura remota ligada a categoria a editar vem da MESMA lista remota exibida (cache da rota; sem nova leitura); desligada, é o DB local de sempre
  return catReadOn()?(catSourceList().find(c=>c.id===id)||null):catById(id);
}
function catNameTaken(name,exceptId){ const k=catNormName(name); return catSourceList().some(c=>c.id!==exceptId&&catNormName(c.name)===k); }
function categoryForm(existing){
  const c=existing||{name:'',icon:'🏷️'};
  return `<h3 id="modalTitle">${existing?'Editar':'Nova'} categoria</h3>
  <div id="formError" class="form-error" style="display:none" role="alert"></div>
  <div class="field"><label for="catName">Nome da categoria</label><input id="catName" maxlength="40" value="${escapeHTML(c.name)}" placeholder="Ex: Pets" autocomplete="off"></div>
  <div class="field"><label for="catIcon">Ícone (emoji)</label><input id="catIcon" maxlength="12" value="${escapeHTML(c.icon||'')}" placeholder="🏷️" autocomplete="off">
    <div class="icon-pick" role="group" aria-label="Sugestões de ícone">${CAT_ICON_CHOICES.map(i=>`<button type="button" data-pickicon="${escapeHTML(i)}" aria-label="Usar ícone ${escapeHTML(i)}">${escapeHTML(i)}</button>`).join('')}</div></div>
  <div style="display:flex;gap:8px;justify-content:flex-end"><button type="button" class="ghost" onclick="closeModal()">Cancelar</button><button type="button" class="primary" id="saveCatBtn">Salvar</button></div>`;
}
function bindCategoryFormEvents(existing){
  document.querySelectorAll('[data-pickicon]').forEach(b=>b.onclick=()=>{ document.getElementById('catIcon').value=b.dataset.pickicon; });
  document.getElementById('saveCatBtn').onclick=()=>{
    const name=document.getElementById('catName').value.trim().replace(/\s+/g,' ');
    const icon=document.getElementById('catIcon').value.trim()||'🏷️';
    if(!name){ showFormError('Informe um nome para a categoria.'); return; }
    if(catNameTaken(name,existing?existing.id:null)){ showFormError('Já existe uma categoria com esse nome.'); return; }
    if(!existing&&window.AppWrite&&window.AppWrite.isEnabled('categories.create')){
      // 3D-03: rota integrada. Grava SÓ no Supabase (pela camada de escrita aprovada); não altera DB nem chama saveDB. Erro do Supabase é mostrado como veio.
      let nid; do{ nid='cat_'+uid(); }while(catById(nid)||catSourceList().some(x=>x.id===nid));
      const btn=document.getElementById('saveCatBtn'); if(btn)btn.disabled=true;
      window.AppWrite.createCategory({id:nid,name:name,icon:icon}).then(r=>{
        if(!r||r.ok!==true){ if(btn)btn.disabled=false; showFormError('Não foi possível salvar no Supabase: '+String((r&&r.error)||'erro desconhecido')); return; }
        if(catReadOn()){ window.AppRead.invalidate(); showToast('Categoria gravada no Supabase. A lista será recarregada do Supabase.'); }   // 3D-04: 1 releitura (feita pela tela), sem escrever no DB
        else showToast('Categoria gravada no Supabase. Ela ainda não aparece na lista local (a leitura do Supabase não está ligada à tela).');
        closeModal(); render();
      });
      return;
    }
    if(existing&&window.AppWrite&&window.AppWrite.isEnabled('categories.update')){
      // 3D-05: rota integrada de edição. Envia SÓ nome/ícone (id identifica); grava SÓ no Supabase; não altera DB nem chama saveDB; sem plano B local. Erro/bloqueio é mostrado como veio.
      const btn=document.getElementById('saveCatBtn'); if(btn)btn.disabled=true;
      const fail=(m)=>{ if(btn)btn.disabled=false; showFormError('Não foi possível atualizar no Supabase: '+String(m||'erro desconhecido')); };
      window.AppWrite.updateCategory({id:existing.id,name:name,icon:icon}).then(r=>{
        if(!r||r.ok!==true){ fail(r&&r.error); return; }
        if(catReadOn())window.AppRead.invalidate();   // 1 releitura (feita pela tela); nada é escrito no DB local
        showToast('Categoria atualizada no Supabase. A lista será recarregada do Supabase.');
        closeModal(); render();
      },e=>fail(e&&e.message));
      return;
    }
    if(existing&&catReadOn()&&!catById(existing.id)){ showFormError('Esta categoria existe só no Supabase. Ligue categories.update para editá-la (a edição local não a alcança).'); return; }
    if(existing){
      // Mesmo id: os lançamentos (categoryId) continuam vinculados; só nome/ícone mudam.
      DB.categories=DB.categories.map(c=>c.id===existing.id?Object.assign({},c,{name,icon}):c);
    } else {
      let id; do{ id='cat_'+uid(); }while(catById(id));
      DB.categories=DB.categories.concat([{id,name,icon}]);
    }
    saveDB(); closeModal(); render();
    if(catReadOn())showToast('Salva no armazenamento local. A lista exibida vem do Supabase (leitura ligada) e não inclui '+(existing?'esta alteração.':'esta categoria.'));
  };
}
function removeCategoryNow(cat){
  // Só remove a categoria (e o limite de orçamento dela, que ficaria órfão). Lançamentos: categoryId vira null
  // ("Sem categoria"); nenhum valor, data, tipo, conta ou cartão é alterado.
  DB.transactions.forEach(t=>{ if(t.categoryId===cat.id) t.categoryId=null; });
  // Política: o orçamento da categoria excluída é removido junto (o usuário é avisado no diálogo de exclusão) — nunca fica órfão.
  if(Array.isArray(DB.budgets)) DB.budgets=DB.budgets.filter(b=>b.categoryId!==cat.id);
  DB.categories=DB.categories.filter(c=>c.id!==cat.id);
  if(txFilters.categoria===cat.id) txFilters.categoria='';
  saveDB();
}
function askDeleteCategory(cat){
  if(DB.categories.length<=1){ showToast('Não é possível excluir a única categoria. Mantenha ao menos uma.'); return; }
  const n=DB.transactions.filter(t=>t.categoryId===cat.id).length;
  const hasBudget=!!(Array.isArray(DB.budgets)&&DB.budgets.some(b=>b.categoryId===cat.id));
  if(n===0){
    if(confirm('Excluir a categoria "'+cat.name+'"?'+(hasBudget?' O orçamento dela também será removido.':''))){ removeCategoryNow(cat); render(); }
    return;
  }
  openModal(`<h3 id="modalTitle">Excluir categoria "${escapeHTML(cat.name)}"?</h3>
    <p>Existem <strong>${n} lançamento${n>1?'s':''}</strong> usando esta categoria.</p>
    <p class="muted">Os lançamentos <strong>não serão apagados</strong> e nenhum valor, data, conta ou cartão muda: eles passam a aparecer como "Sem categoria".${hasBudget?' O orçamento desta categoria será removido.':''}</p>
    <div style="display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap"><button type="button" class="ghost" onclick="closeModal()">Cancelar</button><button type="button" class="primary" id="confirmDelCat" style="background:var(--red)">Excluir e mover para "Sem categoria"</button></div>`,'modalTitle');
  document.getElementById('confirmDelCat').onclick=()=>{ removeCategoryNow(cat); closeModal(); render(); };
}
function askDeleteRemoteCategory(cat){
  // 3D-06: exclusão REMOTA (lógica). O alvo é a categoria da lista remota exibida (nunca o cadastro local); a trava da única categoria conta só a lista remota ativa;
  // modal próprio (sem confirmação nativa); envia só pela rota; sem plano B local e sem cascata. Erro do Supabase é mostrado como veio.
  if(!(catDeleteOn()&&catReadOn())){ showToast('A exclusão remota exige categories.read e categories.delete ligadas. Nada foi alterado.'); return; }
  if(!cat||typeof cat.id!=='string'||cat.id==='')return;
  if(catSourceList().length<=1){ showToast('Não é possível excluir a única categoria. Mantenha ao menos uma.'); return; }
  openModal(`<h3 id="modalTitle">Excluir categoria "${escapeHTML(cat.name)}" do Supabase?</h3>
    <div id="formError" class="form-error" style="display:none" role="alert"></div>
    <p>Esta ação remove a categoria da lista remota (Supabase). Ela deixará de aparecer na lista.</p>
    <p class="muted">Nenhum lançamento ou orçamento é alterado por esta ação, e nada muda nos dados locais deste aparelho.</p>
    <div style="display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap"><button type="button" class="ghost" onclick="closeModal()">Cancelar</button><button type="button" class="primary" id="confirmDelRemoteCat" style="background:var(--red)">Excluir da lista remota</button></div>`,'modalTitle');
  const btn=document.getElementById('confirmDelRemoteCat');
  btn.onclick=()=>{
    btn.disabled=true;
    const fail=(m)=>{ btn.disabled=false; showFormError('Não foi possível excluir no Supabase: '+String(m||'erro desconhecido')); };
    window.AppWrite.deleteCategory({id:cat.id}).then(r=>{
      if(!r||r.ok!==true){ fail(r&&r.error); return; }
      window.AppRead.invalidate();   // 1 releitura (feita pela tela); nada é escrito localmente
      showToast('Categoria excluída no Supabase. A lista será recarregada do Supabase.');
      closeModal(); render();
    },e=>fail(e&&e.message));
  };
}

// ================== ETAPA 5 — BACKUP: IMPORTAÇÃO ==================
// Validação mínima exigida: o arquivo precisa ter accounts/transactions/categories como arrays
// (cada item sendo um objeto, não null/string/número — o bastante para normalizeDB() não quebrar
// ao acessar propriedades como t.installment), e budgets/settings como objetos. Nada é aceito fora
// disso (JSON inválido, estrutura incompatível, tipos errados). Nenhum dado atual é tocado antes
// dessa validação passar.
//
// Correção Etapa 6: "cards" passou a ser OPCIONAL aqui. Antes, um backup antigo sem a propriedade
// "cards" (de antes da Etapa 4, quando cartões não existiam) era rejeitado como inválido, mesmo
// normalizeDB() já sabendo preencher db.cards=db.cards||[] para esse exato caso — a validação
// estava mais restritiva do que a compatibilidade que o próprio sistema já oferece.
function isRecordArray(arr){
  return Array.isArray(arr) && arr.every(x=>x!=null && typeof x==='object' && !Array.isArray(x));
}
// Auditoria 2 (achado 2): validação ESTRUTURAL de registros financeiros. Não sanitiza, não inventa
// ids/datas e não converte texto em número — um registro inválido faz o backup inteiro ser rejeitado.
function isNonEmptyStr(v){ return typeof v==='string' && v.length>0; }
function isFiniteNum(v){ return typeof v==='number' && isFinite(v); }
function isISODateStr(v){
  if(typeof v!=='string' || !/^\d{4}-\d{2}-\d{2}$/.test(v)) return false;
  const [y,m,d]=v.split('-').map(Number);
  const dt=new Date(Date.UTC(y,m-1,d));
  return dt.getUTCFullYear()===y && dt.getUTCMonth()===m-1 && dt.getUTCDate()===d;
}
function isValidGroupMeta(g){
  return g!=null && typeof g==='object' && !Array.isArray(g) && isNonEmptyStr(g.groupId)
    && isFiniteNum(g.index) && isFiniteNum(g.count)
    && (g.totalAmount==null || isFiniteNum(g.totalAmount));
}
const TX_TYPES=['receita','despesa','transferencia','cartao','pagamento_fatura'];
function isValidTransactionRecord(t){
  if(!isNonEmptyStr(t.id) || TX_TYPES.indexOf(t.type)<0) return false;
  if(!isISODateStr(t.date) || !isFiniteNum(t.amount)) return false;
  if(t.type==='receita'||t.type==='despesa'){ if(!isNonEmptyStr(t.accountId)) return false; }
  else if(t.type==='transferencia'){ if(!isNonEmptyStr(t.accountId)||!isNonEmptyStr(t.toAccountId)) return false; }
  else if(t.type==='cartao'){ if(!isNonEmptyStr(t.cardId)) return false; }
  else if(t.type==='pagamento_fatura'){ if(!isNonEmptyStr(t.cardId)||!isNonEmptyStr(t.accountId)||typeof t.invoicePeriod!=='string') return false; }
  if(t.installment!=null && !isValidGroupMeta(t.installment)) return false;
  if(t.recurrence!=null && !isValidGroupMeta(t.recurrence)) return false;
  return true;
}
function isValidAccountRecord(a){ return isNonEmptyStr(a.id) && typeof a.name==='string' && isFiniteNum(a.initial); }
function isValidCategoryRecord(c){ return isNonEmptyStr(c.id) && typeof c.name==='string' && (c.icon===undefined||typeof c.icon==='string'); }
function isValidDayOfMonth(n){ return isFiniteNum(n) && Number.isInteger(n) && n>=1 && n<=31; }
function isValidCardRecord(c){
  return isNonEmptyStr(c.id) && typeof c.name==='string' && isFiniteNum(c.limit)
    && isValidDayOfMonth(c.closingDay) && isValidDayOfMonth(c.dueDay);
}
function validateBackupData(data){
  if(!data||typeof data!=='object'||Array.isArray(data)) return false;
  if(!isRecordArray(data.accounts)) return false;
  if(!isRecordArray(data.transactions)) return false;
  if(!isRecordArray(data.categories)) return false;
  if(!data.accounts.every(isValidAccountRecord)) return false;
  if(!data.transactions.every(isValidTransactionRecord)) return false;
  // Correção F6: transactions[].id precisa ser único — exclusão/edição/agrupamentos são feitos por id e atingiriam 2 registros.
  if(new Set(data.transactions.map(t=>t.id)).size!==data.transactions.length) return false;
  if(!data.categories.every(isValidCategoryRecord)) return false;
  if(data.cards!==undefined && !isRecordArray(data.cards)) return false; // cards é opcional (compat. com backups antigos)
  if(data.cards!==undefined && !data.cards.every(isValidCardRecord)) return false; // Auditoria 2: estrutura mínima de cada cartão
  if(data.goals!==undefined && !isRecordArray(data.goals)) return false; // goals é opcional (compat. com backups antigos, V1.2.2)
  if(data.budgets!==undefined && !(Array.isArray(data.budgets)?isRecordArray(data.budgets):(typeof data.budgets==='object'&&data.budgets!==null))) return false; /* aceita lista (atual) ou mapa legado */ // budgets é opcional (compat. com backups antigos, alinhado a cards/goals — V1.2.3)
  if(data.monthClosures!==undefined && !isRecordArray(data.monthClosures)) return false; // monthClosures é opcional (compat. com backups antigos, alinhado a cards/goals/budgets — V2.0.1)
  // settings é opcional/tolerante: ausente, null ou de tipo inválido é aceito; normalizeDB() aplica os defaults.
  return true;
}
function showBackupError(msg){
  const el=document.getElementById('backupMsg');
  if(el){ el.textContent=msg; el.style.display='block'; } else showToast(msg);
}
function resetImportInput(){ const el=document.getElementById('importFileInput'); if(el) el.value=''; }
function importConfirmHTML(data){
  return `<h3 id="modalTitle">Confirmar importação de backup</h3>
  <p class="muted">Isso substituirá TODOS os dados atuais pelos dados do arquivo selecionado. Esta ação não pode ser desfeita.</p>
  <div class="card" style="margin:10px 0">
    <div class="row"><span>Contas</span><span>${data.accounts.length}</span></div>
    <div class="row"><span>Lançamentos</span><span>${data.transactions.length}</span></div>
    <div class="row"><span>Cartões</span><span>${data.cards.length}</span></div>
    <div class="row"><span>Orçamentos</span><span>${(data.budgets||[]).length}</span></div>
    <div class="row"><span>Metas</span><span>${(data.goals||[]).length}</span></div>
    <div class="row"><span>Fechamentos mensais</span><span>${(data.monthClosures||[]).length}</span></div>
  </div>
  <div style="display:flex;gap:8px;justify-content:flex-end">

// Fluxo: ler -> validar -> (se inválido) mostrar erro e NÃO tocar em DB/localStorage -> (se válido)
// pedir confirmação -> só após confirmar, substitui DB, salva e renderiza.
function importBackupFile(file){
  const reader=new FileReader();
  reader.onload=()=>{
    let parsed;
    try{ parsed=JSON.parse(reader.result); }
    catch(e){ showBackupError('Backup inválido. Seus dados atuais foram preservados.'); resetImportInput(); return; }
    if(!validateBackupData(parsed)){ showBackupError('Backup inválido. Seus dados atuais foram preservados.'); resetImportInput(); return; }
    // Auditoria 2: normalização também protegida — se algo lançar, nada do estado atual é tocado.
    let normalized;
    try{ normalized=normalizeDB(parsed); }
    catch(e){ showBackupError('Backup inválido. Seus dados atuais foram preservados.'); resetImportInput(); return; }
    openModal(importConfirmHTML(normalized),'modalTitle');
    document.getElementById('confirmImportBtn').onclick=()=>{
      // Auditoria 2 (achado 7): só afirma sucesso se saveDB() realmente persistiu. Em caso de falha
      // o DB anterior é restaurado (trySave/localStorage.setItem não sobrescreve o valor antigo
      // quando lança erro), então memória e armazenamento continuam consistentes.
      const previousDB=DB;
      DB=normalized;
      if(!saveDB()){
        DB=previousDB;
        closeModal();
        resetImportInput();
        render();
        showBackupError('Não foi possível salvar o backup importado. Seus dados atuais foram preservados.');
        showToast('Não foi possível salvar o backup importado. Seus dados atuais foram preservados.');
        return;
      }
      closeModal();
      resetImportInput();
      render();
      showToast('Backup importado com sucesso.');
    };
    document.getElementById('cancelImportBtn').onclick=()=>{ closeModal(); resetImportInput(); };
  };
  reader.onerror=()=>{ showBackupError('Backup inválido. Seus dados atuais foram preservados.'); resetImportInput(); };
  reader.readAsText(file);
}
// ================== FIM BACKUP: IMPORTAÇÃO ==================

// ---- Modals ----
let lastFocusedEl=null;
function modalKeyHandler(e){ if(e.key==='Escape') closeModal(); }
function openModal(html,titleId){
  lastFocusedEl=document.activeElement;
  const labelAttr=titleId?`aria-labelledby="${titleId}"`:'';
  document.getElementById('modalRoot').innerHTML=`<div class="modal-bg" id="mbg"><div class="modal" role="dialog" aria-modal="true" ${labelAttr}>${html}</div></div>`;
  document.getElementById('mbg').onclick=(e)=>{if(e.target.id==='mbg') closeModal()};
  document.addEventListener('keydown',modalKeyHandler);
  setTimeout(()=>{
    const modal=document.querySelector('.modal');
    const focusable=modal&&modal.querySelector('input,select,textarea,button');
    if(focusable) focusable.focus();
  },0);
}
function closeModal(){
  document.getElementById('modalRoot').innerHTML='';
  document.removeEventListener('keydown',modalKeyHandler);
  if(lastFocusedEl && typeof lastFocusedEl.focus==='function') lastFocusedEl.focus();
}

// ---- Relatórios: detalhe de uma despesa (apenas leitura, não altera nenhum dado) ----
function relTxInfo(t){
  const c=catById(t.categoryId);
  const card=t.cardId?cardById(t.cardId):null;
  const acc=accById(t.accountId);
  let origemLabel='Conta', origem;
  if(t.type==='cartao'){ origemLabel='Cartão'; origem=card?'💳 '+card.name:'Cartão removido'; }
  else { origem=acc?acc.name:'Sem conta associada'; }
  let parcela='';
  if(t.installment) parcela='Parcela '+t.installment.index+'/'+t.installment.count;
  else if(t.recurrence) parcela='Recorrente '+t.recurrence.index+'/'+t.recurrence.count;
  return {
    cat:c?c.icon+' '+c.name:missingCatLabel(t.categoryId),
    date:String(t.date).split('-').reverse().join('/'),
    origemLabel, origem, parcela,
    tipo:t.type==='cartao'?'Compra no cartão':(t.type==='receita'?'Receita':(t.type==='pagamento_fatura'?'Pagamento de fatura':'Despesa paga')),
    note:(typeof t.note==='string')?t.note.trim():''
  };
}
function relTxTitle(t){
  const i=relTxInfo(t);
  return [t.desc+' — '+fmt(t.amount), i.cat, i.date, i.origemLabel+': '+i.origem].concat(i.parcela?[i.parcela]:[]).join('\n')+'\n(clique para ver detalhes)';
}

// Lista (somente leitura) das despesas realizadas de uma categoria no período do relatório.
function openRelCatList(cid,rng,backFn){
  const [s,e]=rng||periodRange('meses');
  const list=DB.transactions.filter(t=>t.date>=s&&t.date<=e&&isSettled(t)&&isExpenseLike(t)&&String(t.categoryId)===String(cid))
    .sort((a,b)=>b.date.localeCompare(a.date)||b.amount-a.amount);
  const c=catById(cid);
  const total=list.reduce((a,t)=>a+Number(t.amount),0);
  const rows=list.map(t=>`<button type="button" class="rp-top" data-rpcattx="${escapeHTML(t.id)}" aria-label="Ver detalhes: ${escapeHTML(t.desc)}">

      <span class="neg rp-tv">${fmt(t.amount)}</span><span class="rp-chev" aria-hidden="true">›</span></button>`).join('')||'<p class="muted">Sem despesas realizadas nesta categoria no período.</p>';
  openModal(`<h3 id="modalTitle">${escapeHTML(c?c.icon+' '+c.name:missingCatLabel(cid))}</h3>

  document.querySelectorAll('[data-rpcattx]').forEach(b=>b.onclick=()=>{ const t=DB.transactions.find(x=>x.id===b.dataset.rpcattx); if(t) openRelTxDetail(t,again); });

// Lista (somente leitura) dos lançamentos realizados de um mês, por tipo — usada na tela de Evolução.

  const total=list.reduce((a,t)=>a+Number(t.amount),0);

  const rows=list.map(t=>`<button type="button" class="rp-top" data-evotx="${escapeHTML(t.id)}" aria-label="Ver detalhes: ${escapeHTML(t.desc)}">
      <div class="rp-tm"><div class="rp-td">${escapeHTML(t.desc)}</div><div class="rp-ts">${escapeHTML(relTxInfo(t).date)} · ${escapeHTML(relTxInfo(t).cat)}${relTxInfo(t).parcela?' · '+escapeHTML(relTxInfo(t).parcela):''}</div></div>
      <span class="${cls} rp-tv">${fmt(t.amount)}</span><span class="rp-chev" aria-hidden="true">›</span></button>`).join('')||'<p class="muted">Nenhum lançamento neste mês.</p>';
  openModal(`<h3 id="modalTitle">${escapeHTML(label)} · ${escapeHTML(evolutionMonthLabel(ym))}</h3>
    <p class="muted" style="margin:2px 0 8px">${list.length} ${list.length===1?'lançamento':'lançamentos'} · total <span class="${cls}">${fmt(total)}</span></p>
    <div class="rp-lm">${rows}</div>
    <div style="display:flex;justify-content:flex-end;gap:8px;margin-top:12px"><button class="ghost" onclick="closeModal()">Fechar</button></div>`,'modalTitle');
  const again=()=>openEvoTxList(ym,kind);
  document.querySelectorAll('[data-evotx]').forEach(b=>b.onclick=()=>{ const t=DB.transactions.find(x=>x.id===b.dataset.evotx); if(t) openRelTxDetail(t,again); });
}
// Fechamento mensal: lista (somente leitura) dos lançamentos realizados por trás de cada card,
// no período selecionado. Reaproveita os mesmos filtros do resumo (isExpenseLike etc.).
function openFechTxList(kind,fromO,toO,rngO){
  const fFrom=fromO||fechFrom, fTo=toO||fechTo;
  const months=monthRangeList(fFrom,fTo);
  const realized=rngO?DB.transactions.filter(t=>t.date>=rngO.start&&t.date<=rngO.end&&isSettled(t)):months.reduce((a,m)=>a.concat(realizedMonthTx(m)),[]);
  const defs={
    resultado:['Resultado',t=>t.type==='receita'||isExpenseLike(t)],
    receitas:['Receitas',t=>t.type==='receita'],
    despesas:['Despesas',t=>isExpenseLike(t)],
    cartao:['Gastos no cartão',t=>t.type==='cartao'],
    faturas:['Pagamentos de fatura',t=>t.type==='pagamento_fatura'],
    todos:['Lançamentos',t=>true]
  };
  const [label,fn]=defs[kind]||defs.todos;
  const list=realized.filter(fn).sort((a,b)=>b.date.localeCompare(a.date)||b.amount-a.amount);
  const signed=(kind==='resultado');
  const total=list.reduce((a,t)=>a+(signed&&t.type==='receita'?1:(signed&&isExpenseLike(t)?-1:1))*Number(t.amount),0);
  const totCls=(kind==='receitas'||(signed&&total>=0))?'pos':'neg';
  const valCls=t=>t.type==='receita'?'pos':((isExpenseLike(t))?'neg':'');
  const rows=list.map(t=>{ const i=relTxInfo(t);
    return `<button type="button" class="rp-top" data-fechtx="${escapeHTML(t.id)}" aria-label="Ver detalhes: ${escapeHTML(t.desc)}">
      <div class="rp-tm"><div class="rp-td">${escapeHTML(t.desc)}</div><div class="rp-ts">${escapeHTML(i.date)} · ${escapeHTML(i.cat)}${i.parcela?' · '+escapeHTML(i.parcela):''}</div></div>
      <span class="${valCls(t)} rp-tv">${signed&&isExpenseLike(t)?'−':''}${fmt(t.amount)}</span><span class="rp-chev" aria-hidden="true">›</span></button>`;
  }).join('')||'<p class="muted">Nenhum lançamento no período.</p>';
  openModal(`<h3 id="modalTitle">${escapeHTML(label)} · ${escapeHTML(rngO?rngO.label:monthRangeLabel(fFrom,fTo))}</h3>
    <p class="muted" style="margin:2px 0 8px">${list.length} ${list.length===1?'lançamento':'lançamentos'}${kind==='todos'?'':' · total <span class="'+totCls+'">'+fmt(total)+'</span>'}</p>
    <div class="rp-lm">${rows}</div>
    <div style="display:flex;justify-content:flex-end;gap:8px;margin-top:12px"><button class="ghost" onclick="closeModal()">Fechar</button></div>`,'modalTitle');
  const again=()=>openFechTxList(kind,fromO,toO,rngO);
  document.querySelectorAll('[data-fechtx]').forEach(b=>b.onclick=()=>{ const t=DB.transactions.find(x=>x.id===b.dataset.fechtx); if(t) openRelTxDetail(t,again); });
}
// Relatórios: lista (somente leitura) do que está "futuro/pendente" no período selecionado.
// Mesmas regras de viewRelatorios: !isSettled dentro do intervalo; compromissos de fatura via
// getInvoiceForPeriod (faturas com saldo em aberto cujo fechamento cai no período e é futuro).
function openRepFutList(kind){
  const [s0,e0]=periodRange('meses');
  const today=todayISO();
  const label={receitas:'Entradas futuras',despesas:'Despesas futuras',cartao:'Compras futuras no cartão',faturas:'Compromissos futuros de fatura'}[kind]||'Futuro';
  const range=escapeHTML(repPeriodInfo().label);
  if(kind==='faturas'){
    const invs=allInvoicePeriods().filter(({period})=>period>=s0&&period<=e0&&period>today)
      .map(({card,period})=>({card,inv:getInvoiceForPeriod(card,period)})).filter(x=>x.inv.remaining>0)
      .sort((a,b)=>a.inv.dueDate.localeCompare(b.inv.dueDate));
    const total=invs.reduce((a,x)=>a+x.inv.remaining,0);
    const rows=invs.map(({card,inv})=>`<div class="rp-top" style="cursor:default"><div class="rp-tm"><div class="rp-td">💳 ${escapeHTML(card.name)}</div><div class="rp-ts">Vence ${escapeHTML(brDateShort(inv.dueDate))} · fecha ${escapeHTML(brDateShort(inv.closingDate))}</div></div><span class="neg rp-tv">${fmt(inv.remaining)}</span></div>`).join('')||'<p class="muted">Nenhum compromisso de fatura no período.</p>';
    openModal(`<h3 id="modalTitle">${label} · ${range}</h3>
      <p class="muted" style="margin:2px 0 8px">${invs.length} ${invs.length===1?'fatura':'faturas'} · total <span class="neg">${fmt(total)}</span></p>
      <div class="rp-lm">${rows}</div>
      <div style="display:flex;justify-content:flex-end;margin-top:12px"><button class="ghost" onclick="closeModal()">Fechar</button></div>`,'modalTitle');
    return;
  }
  const type={receitas:'receita',despesas:'despesa',cartao:'cartao'}[kind];
  const list=DB.transactions.filter(t=>t.date>=s0&&t.date<=e0&&!isSettled(t)&&t.type===type)
    .sort((a,b)=>a.date.localeCompare(b.date)||b.amount-a.amount);
  const total=list.reduce((a,t)=>a+Number(t.amount),0);
  const cls=kind==='receitas'?'pos':'neg';
  const rows=list.map(t=>{ const i=relTxInfo(t);
    return `<button type="button" class="rp-top" data-repftx="${escapeHTML(t.id)}" aria-label="Ver detalhes: ${escapeHTML(t.desc)}">
      <div class="rp-tm"><div class="rp-td">${escapeHTML(t.desc)}</div><div class="rp-ts">${escapeHTML(i.date)} · ${escapeHTML(i.cat)}${i.parcela?' · '+escapeHTML(i.parcela):''}</div></div>
      <span class="${cls} rp-tv">${fmt(t.amount)}</span><span class="rp-chev" aria-hidden="true">›</span></button>`; }).join('')||'<p class="muted">Nenhum lançamento futuro no período.</p>';
  openModal(`<h3 id="modalTitle">${label} · ${range}</h3>
    <p class="muted" style="margin:2px 0 8px">${list.length} ${list.length===1?'lançamento':'lançamentos'} · total <span class="${cls}">${fmt(total)}</span></p>
    <div class="rp-lm">${rows}</div>
    <div style="display:flex;justify-content:flex-end;margin-top:12px"><button class="ghost" onclick="closeModal()">Fechar</button></div>`,'modalTitle');
  const again=()=>openRepFutList(kind);
  document.querySelectorAll('[data-repftx]').forEach(b=>b.onclick=()=>{ const t=DB.transactions.find(x=>x.id===b.dataset.repftx); if(t) openRelTxDetail(t,again); });
}
// Orçamento de um período da Comparação histórica, por categoria (somente leitura).
function openCompBudget(side,fromO,toO){
  const from=fromO||(side==='A'?compFromA:compFromB), to=toO||(side==='A'?compToA:compToB);
  const data=getBudgetStatusesRange(from,to);
  const label=monthRangeLabel(from,to);
  const rng=[from+'-01',ymEndISO(to)];
  const rows=data.rows.slice().sort((a,b)=>b.percentage-a.percentage);
  const back=()=>openCompBudget(side,fromO,toO);
  const html=rows.map((r,i)=>{
    const c=r.category;
    const bar=Math.min(100,Math.max(0,r.percentage));
    const col=r.status==='excedido'?'var(--red)':(r.status==='proximo'||r.status==='atencao'?'var(--yellow)':'var(--accent)');
    return `<button type="button" class="cp-brow" data-cpbrow="${i}" aria-label="Ver despesas de ${escapeHTML(c?c.name:missingCatLabel(r.categoryId))}">
      <span class="cp-ico" aria-hidden="true">${escapeHTML(c&&c.icon?c.icon:'🏷️')}</span>
      <div class="cp-bm"><div class="cp-bt"><span class="cp-cn">${escapeHTML(c?c.name:missingCatLabel(r.categoryId))}</span><span class="tag ${BUDGET_STATUS_CLASS[r.status]}">${BUDGET_STATUS_LABEL[r.status]}</span></div>
        <div class="cp-tr2"><div style="width:${bar.toFixed(0)}%;background:${col}"></div></div>
        <div class="cp-bs"><span>${fmt(r.spent)} de ${fmt(r.budget)}</span><span style="${r.status==='excedido'?'color:var(--red);font-weight:700':''}">${r.percentage.toFixed(0)}%</span></div></div>
      <span class="rp-chev" aria-hidden="true">›</span></button>`;
  }).join('')||'<p class="muted">Nenhum orçamento definido.</p>';
  openModal(`<h3 id="modalTitle">Orçamento · ${escapeHTML(label)}</h3>
    <p class="muted" style="margin:2px 0 10px">${fmt(data.totalSpent)} de ${fmt(data.totalBudget)} · ${data.totalPercentage.toFixed(0)}% utilizado</p>
    <div class="rp-lm">${html}</div>
    <div style="display:flex;justify-content:flex-end;margin-top:12px"><button class="ghost" onclick="closeModal()">Fechar</button></div>`,'modalTitle');
  document.querySelectorAll('[data-cpbrow]').forEach(b=>b.onclick=()=>{ const r=rows[Number(b.dataset.cpbrow)]; if(r) openRelCatList(r.categoryId,rng,back); });
}

// ---- Parcelamentos e recorrências: visualização e ações em grupo ----
function openGroupModal(kind,groupId,currentId){
  const group=DB.transactions.filter(t=>t[kind]&&t[kind].groupId===groupId).sort((a,b)=>a[kind].index-b[kind].index);
  if(!group.length) return;
  const meta=group[0][kind];
  const today=todayISO();
  const rows=group.map(t=>{
    const isCurrent=t.id===currentId;
    const future=!isSettled(t);
    return `<div class="row"${isCurrent?' style="font-weight:700"':''}>
      <span>${escapeHTML(t[kind].index)}/${escapeHTML(t[kind].count)} · ${escapeHTML(t.date.split('-').reverse().join('/'))}${isCurrent?' <span class="tag" style="margin-left:6px">atual</span>':''}${isManualTx(t)?settleStatusTagHTML(t):(future?' <span class="tag" style="margin-left:6px">futura</span>':'')}</span>
      <span class="${t.type==='receita'?'pos':(t.type==='despesa'||t.type==='cartao'?'neg':'')}">${fmt(t.amount)}</span>
    </div>`;
  }).join('');
  const subtitle=kind==='installment'
    ?`Total: ${fmt(meta.totalAmount!=null?meta.totalAmount:group.reduce((s,x)=>s+Number(x.amount),0))} · ${escapeHTML(meta.count)} parcelas`
    :`Recorrência mensal · ${escapeHTML(meta.count)} ocorrências`;
  openModal(`<h3 id="modalTitle">${escapeHTML(group[0].desc)}</h3>
    <p class="muted">${subtitle}</p>
    <div class="card" style="margin:10px 0">${rows}</div>
    <div style="display:flex;justify-content:flex-end"><button class="ghost" onclick="closeModal()">Fechar</button></div>`,'modalTitle');
}

function askDeleteScope(t){
  if(!(t.installment||t.recurrence)){
    if(confirm('Excluir este lançamento?')){
      DB.transactions=DB.transactions.filter(x=>x.id!==t.id);saveDB();render();
    }
    return;
  }
  const kind=t.installment?'installment':'recurrence';
  const noun=kind==='installment'?'parcela':'ocorrência';
  const allLabel=kind==='installment'?'Todas as parcelas':'Toda a recorrência';
  openModal(`<h3 id="modalTitle">Excluir ${noun}</h3>
    <p class="muted">Este lançamento faz parte de um grupo. O que você deseja excluir?</p>
    <div style="display:flex;flex-direction:column;gap:8px;margin-top:12px">
      <button class="ghost" id="delOnlyBtn">Apenas esta</button>
      <button class="ghost" id="delAllBtn">${allLabel}</button>
      <button class="ghost" id="delCancelBtn">Cancelar</button>
    </div>`,'modalTitle');
  document.getElementById('delOnlyBtn').onclick=()=>{
    DB.transactions=DB.transactions.filter(x=>x.id!==t.id);
    if(t.installment) syncInstallmentGroup(t.installment.groupId);
    if(t.recurrence) syncRecurrenceGroup(t.recurrence.groupId); // Correção F4
    saveDB();closeModal();render();
  };
  document.getElementById('delAllBtn').onclick=()=>{
    const groupId=t[kind].groupId;
    DB.transactions=DB.transactions.filter(x=>!(x[kind]&&x[kind].groupId===groupId));
    saveDB();closeModal();render();
  };
  document.getElementById('delCancelBtn').onclick=()=>closeModal();
}

function askEditScope(t){
  if(!(t.installment||t.recurrence)){
    openModal(txForm(t),'modalTitle');bindTxFormEvents(t);return;
  }
  const kind=t.installment?'installment':'recurrence';
  const groupId=t[kind].groupId;
  const group=DB.transactions.filter(x=>x[kind]&&x[kind].groupId===groupId);
  const noun=kind==='installment'?'parcelamento':'recorrência';
  const allBtnLabel=kind==='installment'?'Editar todas as parcelas':'Editar todas as ocorrências futuras';
  openModal(`<h3 id="modalTitle">Editar lançamento</h3>
    <p class="muted">Este lançamento faz parte de um ${noun}.</p>
    <div style="display:flex;flex-direction:column;gap:8px;margin-top:12px">
      <button class="ghost" id="editOnlyBtn">Editar somente esta</button>
      <button class="ghost" id="editAllBtn">${allBtnLabel}</button>
      <button class="ghost" id="editCancelBtn">Cancelar</button>
    </div>`,'modalTitle');
  document.getElementById('editOnlyBtn').onclick=()=>{
    closeModal();openModal(txForm(t),'modalTitle');bindTxFormEvents(t);
  };
  document.getElementById('editAllBtn').onclick=()=>{
    closeModal();
    const scope=kind==='recurrence'?group.filter(x=>x.date>=t.date):group;
    openBulkEditForm(scope,kind==='installment'?'Editar todas as parcelas':'Editar ocorrências futuras');
  };
  document.getElementById('editCancelBtn').onclick=()=>closeModal();
}

function openBulkEditForm(list,heading){
  if(!list.length) return;
  const first=list[0];
  const isCartao=first.type==='cartao';
  const catOpts=DB.categories.map(c=>`<option value="${escapeHTML(c.id)}" ${first.categoryId===c.id?'selected':''}>${escapeHTML(c.icon+' '+c.name)}</option>`).join('');
  const accOpts=DB.accounts.map(a=>`<option value="${escapeHTML(a.id)}" ${first.accountId===a.id?'selected':''}>${escapeHTML(a.name)}</option>`).join('');
  // Compra parcelada/recorrente no cartão não tem conta bancária — não faz sentido oferecer
  // o campo "Conta" aqui, para não atribuir por engano uma conta a uma compra de cartão.
  openModal(`<h3 id="modalTitle">${heading}</h3>
    <div id="formError" class="form-error" style="display:none" role="alert"></div>
    <p class="muted">Alterações serão aplicadas a ${list.length} lançamento(s). Valor e data de cada um não são alterados aqui.</p>
    <div class="field"><label for="beDesc">Descrição</label><input id="beDesc" value="${escapeHTML(first.desc)}"></div>
    <div class="field"><label for="beCatSel">Categoria</label><select id="beCatSel">${catOpts}</select></div>
    ${isCartao?'':`<div class="field"><label for="beAcc">Conta</label><select id="beAcc">${accOpts}</select></div>`}
    <div class="field"><label for="beNote">Observação</label><input id="beNote" value="${escapeHTML(first.note||'')}"></div>
    <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:10px">
      <button class="ghost" onclick="closeModal()">Cancelar</button>
      <button class="primary" id="beSaveBtn">Salvar em todos</button>
    </div>`,'modalTitle');
  document.getElementById('beSaveBtn').onclick=()=>{
    const desc=document.getElementById('beDesc').value.trim();
    const categoryId=document.getElementById('beCatSel').value;
    const accountId=isCartao?null:document.getElementById('beAcc').value;
    const note=document.getElementById('beNote').value.trim();
    if(!desc){ showFormError('Informe uma descrição.'); return; }
    if(!categoryId||!catById(categoryId)){ showFormError('Selecione uma categoria válida.'); return; }
    if(!isCartao && (!accountId||!accById(accountId))){ showFormError('Selecione uma conta válida.'); return; }
    const ids=new Set(list.map(t=>t.id));
    DB.transactions.forEach(t=>{
      if(ids.has(t.id)){ t.desc=desc; t.categoryId=categoryId; if(!isCartao) t.accountId=accountId; t.note=note; stampTx(t); }
    });
    saveDB();closeModal();render();
  };
}

function txForm(existing){
  const t=existing||{type:'despesa',date:todayISO()};
  const catOpts=DB.categories.map(c=>`<option value="${escapeHTML(c.id)}" ${t.categoryId===c.id?'selected':''}>${escapeHTML(c.icon+' '+c.name)}</option>`).join('');

  // Correção 3A (bug #3): o destino de uma transferência é toAccountId, não accountId (origem).
  const toAccOpts=DB.accounts.map(a=>`<option value="${escapeHTML(a.id)}" ${t.toAccountId===a.id?'selected':''}>${escapeHTML(a.name)}</option>`).join('');

  const cardOpts=selectableCards.map(c=>`<option value="${escapeHTML(c.id)}" ${t.cardId===c.id?'selected':''}>${escapeHTML(c.name)}${c.active===false?' (inativo)':''}</option>`).join('');

    ${(hasActiveCard||isCartao)?`<option value="cartao" ${isCartao?'selected':''}>Compra no cartão</option>`:''}</select></div>
  <div class="field"><label for="fDesc">Descrição</label><input id="fDesc" value="${escapeHTML(t.desc||'')}" placeholder="Ex: Mercado"></div>
  <div class="formgrid">
    <div class="field"><label for="fVal">Valor</label><input id="fVal" type="number" step="0.01" value="${escapeHTML(t.amount||'')}" placeholder="0,00"></div>
    <div class="field"><label for="fDate">Data</label><input id="fDate" type="date" value="${escapeHTML(t.date)}"></div>
  </div>
  <div class="field" id="catField" style="display:${isTransfer?'none':'block'}"><label for="fCatSel">Categoria</label><select id="fCatSel">${catOpts}</select></div>
  <div class="formgrid">
    <div class="field" id="accField" style="display:${isCartao?'none':'block'}"><label for="fAcc">Conta</label><select id="fAcc">${accOpts}</select></div>
    <div class="field" id="cardField" style="display:${isCartao?'block':'none'}"><label for="fCard">Cartão</label><select id="fCard">${cardOpts}</select></div>
    <div class="field" id="toAccField" style="display:${isTransfer?'block':'none'}"><label for="fToAcc">Para a conta</label><select id="fToAcc">${toAccOpts}</select></div>

function bindTxFormEvents(existing){
  // Campo "Já recebi/paguei": só para receita/despesa comum e, ao criar, só quando NÃO é parcelado/recorrente
  // (cada parcela/ocorrência é efetivada individualmente depois).
  const syncSettled=()=>{
    const ty=document.getElementById('fType').value;
    const manual=(ty==='receita'||ty==='despesa');
    const pa=document.getElementById('fParcelar'), re=document.getElementById('fRecorrer');
    const sched=!!((pa&&pa.checked)||(re&&re.checked));
    const f=document.getElementById('settledField'); if(f) f.style.display=(manual&&!sched)?'block':'none';
    const l=document.getElementById('fSettledLbl'); if(l) l.textContent=ty==='receita'?'Já recebi esta receita (efetivar agora)':'Já paguei esta despesa (efetivar agora)';
  };
  document.getElementById('fType').onchange=(e)=>{
    const isTransfer=e.target.value==='transferencia';
    const isCartao=e.target.value==='cartao';
    document.getElementById('catField').style.display=isTransfer?'none':'block';
    document.getElementById('toAccField').style.display=isTransfer?'block':'none';
    document.getElementById('accField').style.display=isCartao?'none':'block';
    document.getElementById('cardField').style.display=isCartao?'block':'none';
    const parcField=document.getElementById('parcField'), recField=document.getElementById('recField');
    if(parcField) parcField.style.display=isTransfer?'none':'block';
    if(recField) recField.style.display=isTransfer?'none':'block';
    if(isTransfer){
      // Transferência não pode ser parcelada nem recorrente — zera qualquer seleção anterior.
      const pa=document.getElementById('fParcelar'), re=document.getElementById('fRecorrer');
      if(pa && pa.checked){ pa.checked=false; document.getElementById('parcN').style.display='none'; }
      if(re && re.checked){ re.checked=false; document.getElementById('recN').style.display='none'; }
    }
    syncSettled();
  };
  const parcelarChk=document.getElementById('fParcelar');
  if(parcelarChk) parcelarChk.onchange=(e)=>{
    document.getElementById('parcN').style.display=e.target.checked?'block':'none';
    if(e.target.checked){
      const rec=document.getElementById('fRecorrer');
      if(rec && rec.checked){ rec.checked=false; document.getElementById('recN').style.display='none'; }
    }
    syncSettled();
  };
  const recorrerChk=document.getElementById('fRecorrer');
  if(recorrerChk) recorrerChk.onchange=(e)=>{
    document.getElementById('recN').style.display=e.target.checked?'block':'none';
    if(e.target.checked){
      const pa=document.getElementById('fParcelar');
      if(pa && pa.checked){ pa.checked=false; document.getElementById('parcN').style.display='none'; }
    }
    syncSettled();
  };
  syncSettled();

  document.getElementById('saveTxBtn').onclick=()=>{
    const type=document.getElementById('fType').value;
    const isCartao=type==='cartao';
    const desc=document.getElementById('fDesc').value.trim();
    const amount=money2(document.getElementById('fVal').value);
    const date=document.getElementById('fDate').value;
    const accountId=isCartao?null:document.getElementById('fAcc').value;
    const note=document.getElementById('fNote').value.trim();

    if(!desc){ showFormError('Informe uma descrição para o lançamento.'); return; }
    if(!amount || amount<=0){ showFormError('O valor deve ser maior que zero.'); return; }
    if(!date){ showFormError('Informe uma data válida.'); return; }

    let cardId=null;
    if(isCartao){
      cardId=document.getElementById('fCard').value;
      // Compra no cartão não exige (nem usa) conta bancária — ver getInvoicePeriod/cardUsed.
      if(!cardId || !cardById(cardId)){ showFormError('Selecione um cartão válido.'); return; }
    } else if(!accountId || !accById(accountId)){ showFormError('Selecione uma conta válida. Cadastre uma conta antes de continuar.'); return; }

    let toAccountId=null, categoryId=null;
    if(type==='transferencia'){
      toAccountId=document.getElementById('fToAcc').value;
      if(!toAccountId || !accById(toAccountId)){ showFormError('Selecione a conta de destino.'); return; }
      if(toAccountId===accountId){ showFormError('A conta de destino deve ser diferente da conta de origem.'); return; }
    } else {
      categoryId=document.getElementById('fCatSel').value;
      if(!categoryId || !catById(categoryId)){ showFormError('Selecione uma categoria válida.'); return; }
    }

    const parcChk=document.getElementById('fParcelar');
    const recChk=document.getElementById('fRecorrer');
    const isParcelado=!existing && type!=='transferencia' && parcChk && parcChk.checked;
    const isRecorrente=!existing && type!=='transferencia' && recChk && recChk.checked;
    if(isParcelado && isRecorrente){ showFormError('Um lançamento não pode ser parcelado e recorrente ao mesmo tempo.'); return; }

    // Receita/despesa comum nasce PENDENTE (settled:false) em parcelas/recorrências; nunca efetiva pela data.
    const sf=(type==='receita'||type==='despesa')?{settled:false}:{};
    if(isParcelado){
      const nRaw=String(document.getElementById('fParcelasN').value).trim();
      const n=Number(nRaw);
      if(!nRaw || !Number.isInteger(n) || n<2){ showFormError('Informe um número inteiro de parcelas válido (mínimo 2).'); return; }
      if(toCents(amount)<n){ showFormError('O valor é pequeno demais para dividir em '+n+' parcelas: cada parcela precisa ter pelo menos R$ 0,01.'); return; }
      const parts=splitInstallments(amount,n);
      if(parts.some(p=>toCents(p)<1)){ showFormError('Este parcelamento geraria parcelas de R$ 0,00. Reduza o número de parcelas.'); return; }
      const groupId=uid();
      parts.forEach((amt,i)=>{
        DB.transactions.push(stampTx({id:uid(),desc,amount:amt,type,date:addMonthsISO(date,i),accountId,cardId,categoryId,note,...sf,installment:{groupId,index:i+1,count:n,totalAmount:amount}}));
      });
    } else if(isRecorrente){
      // Estrutura de recorrência: gera as ocorrências mensais de uma vez, cada uma sabendo seu índice/total no grupo.
      // Ainda será refinada em uma próxima etapa (ex: recorrência sem fim definido, outras frequências).
      const n=parseInt(document.getElementById('fRecorrenciaN').value,10);
      if(!n || n<2){ showFormError('Informe por quantos meses a recorrência deve se repetir (mínimo 2).'); return; }
      const groupId=uid();
      for(let i=0;i<n;i++){
        DB.transactions.push(stampTx({id:uid(),desc,amount,type,date:addMonthsISO(date,i),accountId,cardId,categoryId,note,...sf,recurrence:{groupId,index:i+1,count:n,frequency:'monthly'}}));
      }
    } else {
      const obj={id:existing?existing.id:uid(),desc,amount,type,date,accountId,cardId,note,categoryId};
      if(type==='transferencia'){ obj.toAccountId=toAccountId; obj.categoryId=null; }
      if(type==='receita'||type==='despesa'){ const sc=document.getElementById('fSettled'); obj.settled=!!(sc&&sc.checked); }
      // Correção 3A (bug #1): editar sem mudar cartão/data preserva o período de fatura já fixado.
      if(existing && type==='cartao' && existing.invoicePeriod && existing.cardId===cardId && existing.date===date){
        obj.invoicePeriod=existing.invoicePeriod; if(existing.invoiceClosingDay) obj.invoiceClosingDay=existing.invoiceClosingDay;
      }
      stampTx(obj);
      if(existing){
        // Correção 3B (bug #5): transferência nunca carrega metadado de parcelamento.
        if(existing.installment && type!=='transferencia') obj.installment=existing.installment;
        if(existing.recurrence) obj.recurrence=existing.recurrence;
        const idx=DB.transactions.findIndex(x=>x.id===existing.id);
        DB.transactions[idx]=obj;
        // Correção 3B (bug #4): valor editado / parcela retirada do grupo => recalcula o grupo.
        if(existing.installment) syncInstallmentGroup(existing.installment.groupId);
      } else {
        DB.transactions.push(obj);
      }
    }

    saveDB();
    closeModal();
    render();
  };
}

// Navegação por notificação/Dashboard: abre Lançamentos já filtrado em "Atrasados" (ou "Todos", se não
// for atrasado) e rola até o lançamento, destacando-o rapidamente. Nada é alterado nos dados.
function resetTxFiltersTo(status){
  txFilters=Object.assign({},txFilters,{periodo:'todos',status:status,categoria:'',conta:'',cartao:'',tipo:'',busca:''});
}
function goToTx(id){
  const t=DB.transactions.find(x=>x.id===id); if(!t) return;
  resetTxFiltersTo(isOverdue(t)?'atrasados':'todos');
  route='lancamentos'; render();
  setTimeout(()=>{
    const row=document.querySelector('[data-txrow="'+id+'"]'); if(!row) return;
    row.scrollIntoView({block:'center'});
    row.style.transition='background .4s'; row.style.background='rgba(239,139,139,.18)';
    setTimeout(()=>{ row.style.background=''; },1800);
  },30);
}
// Cartões já filtrado em "Atrasadas", rolando até a fatura (nada é alterado nos dados).
function goToInvoice(cardId,period){
  invFilter='atrasadas'; route='cartoes'; render();
  setTimeout(()=>{
    const row=document.querySelector('[data-invrow="'+cardId+'|'+period+'"]'); if(!row) return;
    row.scrollIntoView({block:'center'});

}
function showOverdueInvoices(){ invFilter='atrasadas'; route='cartoes'; render(); window.scrollTo(0,0); }
function showOverdueList(){ resetTxFiltersTo('atrasados'); route='lancamentos'; render(); window.scrollTo(0,0); }
// Efetivação manual: "Recebi"/"Paguei" (settled=true) e desfazer (settled=false). Só mexe em t.settled;
// o saldo e demais totais são sempre recalculados a partir dele (accBalance/isSettled).
function setTxSettled(id,val){
  const t=DB.transactions.find(x=>x.id===id);
  if(!t||!isManualTx(t)) return false;
  t.settled=!!val; stampTx(t); saveDB();
  return true;
}
// Pedido de confirmação para "Recebi"/"Paguei". Camada própria (#confirmRoot), por cima de qualquer modal
// aberto (Compromissos, Fluxo de caixa, detalhes de KPI), para que "Cancelar" volte exatamente para a
// tela em que a pessoa estava, sem fechar nem recriar o modal de baixo.
let _confirmPrevFocus=null;
function closeSettleConfirm(){
  const root=document.getElementById('confirmRoot');
  if(root) root.remove();
  document.removeEventListener('keydown',_settleConfirmKey,true);
  if(_confirmPrevFocus && typeof _confirmPrevFocus.focus==='function' && document.contains(_confirmPrevFocus)) _confirmPrevFocus.focus();
  _confirmPrevFocus=null;
}
function _settleConfirmKey(e){
  if(e.key==='Escape'){ e.stopImmediatePropagation(); e.preventDefault(); closeSettleConfirm(); return; }
  if(e.key==='Tab'){
    const f=[...document.querySelectorAll('#confirmRoot button')]; if(!f.length) return;
    const first=f[0], last=f[f.length-1];
    if(e.shiftKey && document.activeElement===first){ e.preventDefault(); last.focus(); }
    else if(!e.shiftKey && document.activeElement===last){ e.preventDefault(); first.focus(); }
  }
}
function askSettleConfirm(t,onConfirm){
  closeSettleConfirm();
  _confirmPrevFocus=document.activeElement;
  const rec=t.type==='receita';
  const acc=accById(t.accountId);
  const dateTxt=String(t.date||'').split('-').reverse().join('/');
  const title=rec?'Confirmar recebimento?':'Confirmar pagamento?';
  const effect=acc
    ? (rec?`O valor será somado ao saldo de <strong>${escapeHTML(acc.name)}</strong>.`:`O valor será descontado do saldo de <strong>${escapeHTML(acc.name)}</strong>.`)
    : (rec?'O valor será marcado como recebido.':'O valor será marcado como pago.');
  const root=document.createElement('div');
  root.id='confirmRoot';
  root.innerHTML=`<div class="modal-bg confirm-bg" id="confirmBg"><div class="modal confirm-modal" role="alertdialog" aria-modal="true" aria-labelledby="confirmTitle" aria-describedby="confirmDesc">
    <h3 id="confirmTitle">${title}</h3>
    <div class="confirm-sum">
      <div class="confirm-desc">${escapeHTML(t.desc||'Sem descrição')}</div>
      <div class="confirm-amt ${rec?'pos':'neg'}">${rec?'+ ':'− '}${fmt(t.amount)}</div>
      ${dateTxt?`<div class="confirm-meta">Vencimento em ${escapeHTML(dateTxt)}</div>`:''}
    </div>
    <p class="muted" id="confirmDesc" style="margin:12px 0 0">${effect}</p>
    <div class="confirm-actions">
      <button type="button" class="ghost" id="confirmNo">Cancelar</button>
      <button type="button" class="primary" id="confirmYes">${rec?'Sim, recebi':'Sim, paguei'}</button>
    </div>
  </div></div>`;
  document.body.appendChild(root);
  document.getElementById('confirmBg').onclick=(e)=>{ if(e.target.id==='confirmBg') closeSettleConfirm(); };
  document.getElementById('confirmNo').onclick=()=>closeSettleConfirm();
  document.getElementById('confirmYes').onclick=()=>{ closeSettleConfirm(); onConfirm(); };
  document.addEventListener('keydown',_settleConfirmKey,true);
  setTimeout(()=>{ const y=document.getElementById('confirmYes'); if(y) y.focus(); },0);
}
function bindSettleButtons(){
  document.querySelectorAll('[data-settle],[data-unsettle]').forEach(b=>b.onclick=()=>{
    const doSettle=b.dataset.settle!=null;
    const id=doSettle?b.dataset.settle:b.dataset.unsettle;
    const apply=()=>{
      if(!setTxSettled(id,doSettle)) return;
      if(document.getElementById('commitList')){ closeModal(); render(); openCommitmentsModal(); }
      else if(document.getElementById('cfList')){ const k=lastCfListKind; closeModal(); render(); openCashFlowListModal(k); }
      else if(document.getElementById('kpiDetailList')){ const k=lastKpiKey; closeModal(); render(); openKpiDetail(k); }
      else render();
    };
    if(!doSettle){ apply(); return; }            // desfazer continua direto (é reversível)
    const t=DB.transactions.find(x=>x.id===id);
    if(!t||!isManualTx(t)) return;
    askSettleConfirm(t,apply);                   // Recebi/Paguei pedem confirmação
  });
}
function bindTxListEvents(){
  bindSettleButtons();
  document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>{
    const t=DB.transactions.find(x=>x.id===b.dataset.edit); if(!t) return;
    if(t.type==='pagamento_fatura'){ showToast('Pagamento de fatura não pode ser editado. Exclua e registre novamente, se necessário.'); return; }
    askEditScope(t);
  });
  document.querySelectorAll('[data-viewgroup]').forEach(b=>b.onclick=()=>{
    const t=DB.transactions.find(x=>x.id===b.dataset.viewgroup); if(!t) return;
    const kind=t.installment?'installment':(t.recurrence?'recurrence':null);
    if(kind) openGroupModal(kind,t[kind].groupId,t.id);
  });
  document.querySelectorAll('[data-dup]').forEach(b=>b.onclick=()=>{
    const orig=DB.transactions.find(x=>x.id===b.dataset.dup); if(!orig) return;
    if(orig.type==='pagamento_fatura'){ showToast('Pagamento de fatura não pode ser duplicado.'); return; }
    // Duplicar não deve copiar id nem metadados de parcela/recorrência, para o novo lançamento não
    // parecer parte do lançamento original.
    const copy={...orig};
    delete copy.installment; delete copy.recurrence; delete copy.invoicePeriod; delete copy.invoiceClosingDay;
    delete copy.demo; // Correção F2: a duplicata é um dado criado pelo usuário, nunca herda o rótulo de demonstração.
    copy.id=uid(); copy.date=todayISO(); stampTx(copy);
    if(isManualTx(copy)) copy.settled=false; else delete copy.settled; // a cópia nasce pendente
    DB.transactions.push(copy);
    saveDB(); render();
  });
  document.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{
    const t=DB.transactions.find(x=>x.id===b.dataset.del); if(t) askDeleteScope(t);
  });
}

  document.querySelectorAll('[data-delcard]').forEach(b=>b.onclick=()=>{
    const c=cardById(b.dataset.delcard); if(!c) return;
    const hasTx=DB.transactions.some(t=>t.cardId===c.id);
    if(hasTx){ showToast('Não é possível excluir: este cartão possui compras ou pagamentos vinculados.'); return; }
    if(confirm('Excluir o cartão '+c.name+'?')){
      DB.cards=DB.cards.filter(x=>x.id!==c.id);
      if(txFilters.cartao===c.id) txFilters.cartao=''; // Correção F3: não deixar filtro invisível apontando p/ cartão excluído
      saveDB(); render();
    }

// ================== FASE 3B-04 — PRÉ-MIGRAÇÃO (SOMENTE DRY-RUN; NENHUMA ESCRITA, NENHUM BOTÃO, NENHUMA EXECUÇÃO AUTOMÁTICA) ==================
// preMigrationDryRun() monta em memória os payloads que uma FUTURA migração enviaria e confere todas as travas. Ela só LÊ:
// AuthUI.userId()/checkSession() e SELECT (HEAD+count) de existência via AuthUI.countOwnRows(). Não escreve no Supabase, no
// localStorage, no IndexedDB nem em DB. Só é chamada manualmente (ex.: console); nada no app a invoca.
// Origem dos dados: cópia profunda do DB local atual passada por normalizeDB() — nunca o backup bruto.
// Não envia: user_id, created_at, updated_at, deleted_at, accounts.color, nem qualquer campo local fora do schema.
// Colunas NOT NULL com default (modo 'def') NUNCA vão como null: a chave é omitida quando não há valor.
const PM_TABLES=Object.freeze(['categories','cards','accounts','budgets','goals','month_closures','transactions']);   // ordem da migração
const PM_SOURCE_KEY=Object.freeze({categories:'categories',cards:'cards',accounts:'accounts',budgets:'budgets',goals:'goals',month_closures:'monthClosures',transactions:'transactions'});
const PM_FORBIDDEN_COLS=Object.freeze(['user_id','created_at','updated_at','deleted_at','color']);
// [coluna, caminho local, tipo SQL, modo]  modo: 'req' = NOT NULL sem default | 'def' = NOT NULL com default (omitir se vazio) | 'opt' = aceita NULL
const PM_SPEC=Object.freeze({
  categories:[['id',['id'],'text','req'],['name',['name'],'text','req'],['icon',['icon'],'text','opt']],
  cards:[['id',['id'],'text','req'],['name',['name'],'text','req'],['credit_limit',['limit'],'numeric','req'],['closing_day',['closingDay'],'int4','req'],['due_day',['dueDay'],'int4','req'],['active',['active'],'bool','def']],
  accounts:[['id',['id'],'text','req'],['name',['name'],'text','req'],['initial',['initial'],'numeric','def'],['demo',['demo'],'bool','def']],
  budgets:[['id',['id'],'text','req'],['category_id',['categoryId'],'text','req'],['amount',['amount'],'numeric','req'],['period',['period'],'text','def']],
  goals:[['id',['id'],'text','req'],['name',['name'],'text','def'],['target_amount',['targetAmount'],'numeric','def'],['current_amount',['currentAmount'],'numeric','def'],['deadline',['deadline'],'date','opt'],['active',['active'],'bool','def']],
  month_closures:[['id',['id'],'text','req'],['month',['month'],'text','req'],['closed_at',['closedAt'],'date','req'],['closed_at_ts',['closedAtTs'],'int8','opt'],['note',['note'],'text','def']],
  transactions:[['id',['id'],'text','req'],['type',['type'],'text','req'],['description',['desc'],'text','def'],['amount',['amount'],'numeric','req'],['date',['date'],'date','req'],
    ['note',['note'],'text','opt'],['category_id',['categoryId'],'text','opt'],['account_id',['accountId'],'text','opt'],['to_account_id',['toAccountId'],'text','opt'],['card_id',['cardId'],'text','opt'],
    ['settled',['settled'],'bool','opt'],['demo',['demo'],'bool','def'],['modified_at',['modifiedAt'],'int8','opt'],['invoice_period',['invoicePeriod'],'date','opt'],['invoice_closing_day',['invoiceClosingDay'],'int4','opt'],
    ['installment_group_id',['installment','groupId'],'text','opt'],['installment_index',['installment','index'],'int4','opt'],['installment_count',['installment','count'],'int4','opt'],['installment_total_amount',['installment','totalAmount'],'numeric','opt'],
    ['recurrence_group_id',['recurrence','groupId'],'text','opt'],['recurrence_index',['recurrence','index'],'int4','opt'],['recurrence_count',['recurrence','count'],'int4','opt'],['recurrence_frequency',['recurrence','frequency'],'text','opt']]
});
function pmGet(o,path){ let v=o; for(let i=0;i<path.length;i++){ if(v==null||typeof v!=='object') return undefined; v=v[path[i]]; } return v; }
// Monta os payloads (cópia nova; não altera o db recebido). Registros com demo===true ficam de fora. Mantém a ordem original.
function pmBuildPayloads(db){
  const out={};
  PM_TABLES.forEach(t=>{
    const src=Array.isArray(db[PM_SOURCE_KEY[t]])?db[PM_SOURCE_KEY[t]]:[];
    out[t]=src.filter(r=>!(r&&r.demo===true)).map(r=>{
      const o={};
      PM_SPEC[t].forEach(c=>{
        const v=pmGet(r,c[1]);
        if(c[3]==='opt') o[c[0]]=(v===undefined?null:v);
        else if(c[3]==='def'){ if(v!==undefined&&v!==null) o[c[0]]=v; }
        else o[c[0]]=v;
      });
      return o;
    });
  });
  return out;
}
function pmTypeOk(kind,v){
  switch(kind){
    case 'text': return typeof v==='string';
    case 'numeric': return typeof v==='number'&&isFinite(v);
    case 'int4': return typeof v==='number'&&Number.isInteger(v)&&v>=-2147483648&&v<=2147483647;
    case 'int8': return typeof v==='number'&&Number.isSafeInteger(v);
    case 'date': return isISODateStr(v);
    case 'bool': return typeof v==='boolean';
  }
  return false;
}
const PM_TX_TYPES=Object.freeze(['receita','despesa','transferencia','cartao','pagamento_fatura']);
// Valida os payloads contra o schema real (conferido na 3B-03.1) e contra o db de origem. Devolve a lista de erros (vazia = válido).
function pmValidatePayloads(P,srcDB){
  const errs=[]; const E=m=>errs.push(m);
  if(!P||typeof P!=='object'){ return ['Payloads ausentes.']; }
  Object.keys(P).forEach(k=>{ if(PM_TABLES.indexOf(k)<0) E('Tabela fora do schema no payload: '+k); });
  const ids={};
  PM_TABLES.forEach(t=>{
    const list=P[t];
    if(!Array.isArray(list)){ E(t+': payload ausente ou não é lista.'); ids[t]=new Set(); return; }
    const spec=PM_SPEC[t], cols=spec.map(c=>c[0]); const seen=new Set();
    list.forEach((p,i)=>{
      const w=t+'['+i+']'+(p&&typeof p.id==='string'?' id='+p.id:'');
      if(!p||typeof p!=='object'||Array.isArray(p)){ E(w+': registro inválido.'); return; }
      Object.keys(p).forEach(k=>{
        if(PM_FORBIDDEN_COLS.indexOf(k)>=0) E(w+': campo proibido no payload: '+k);
        else if(cols.indexOf(k)<0) E(w+': campo fora do schema: '+k);
      });
      spec.forEach(c=>{
        const col=c[0], kind=c[2], mode=c[3], has=Object.prototype.hasOwnProperty.call(p,col), v=p[col];
        if(mode==='req'){ if(!has||v===null||v===undefined){ E(w+': campo obrigatório ausente: '+col); return; } if(!pmTypeOk(kind,v)) E(w+': tipo inválido em '+col); }

  { const k=new Set(); (P.month_closures||[]).forEach(p=>{ if(typeof p.month!=='string'||!MONTH_RE.test(p.month)) E('month_closures id='+p.id+': month inválido.'); if(k.has(p.month)) E('month_closures id='+p.id+': mês duplicado.'); k.add(p.month); }); }

  if(srcDB){

// Dry-run. `envOverride` existe só para testes (injeção de dependências). Retorna {status:'PRONTA'|'BLOQUEADA',ok,userId,counts,supabase,errors,warnings,payloads,report}.
async function preMigrationDryRun(envOverride){
  const env=Object.assign(pmDefaultEnv(),envOverride||{});
  const errors=[],warnings=[]; let userId=null,authOk=false,payloads=null,counts={},supabase=null;
  const msg=e=>String((e&&e.message)||e);
  // 1) autenticação: sessão ativa e id válido, obtido só de AuthUI.userId()
  try{
    if(!env.isAuthenticated()) errors.push('Usuário não autenticado.');
    else{
      const u=env.userId();
      if(typeof u!=='string'||!UID_RE.test(u)) errors.push('AuthUI.userId() ausente ou inválido.');
      else{
        userId=u;
        const s=await env.checkSession();
        if(!s||s.ok!==true) errors.push('Sessão não está ativa.');
        else if(s.userId!==u) errors.push('A sessão ativa não corresponde ao AuthUI.userId().');
        else authOk=true;
      }
    }
  }catch(e){ errors.push('Falha ao verificar a sessão: '+msg(e)); }
  if(authOk){
    // 2) banco local válido, normalizado, sem demo; payloads montados em memória e validados
    let clone=null;
    try{
      const loc=env.getLocal();
      if(!loc||loc.owner!==userId) errors.push('O banco local carregado não pertence ao usuário autenticado.');
      else if(!loc.db||typeof loc.db!=='object'||Array.isArray(loc.db)) errors.push('Banco local ausente ou inválido.');
      else{
        clone=JSON.parse(JSON.stringify(loc.db));
        const before=JSON.stringify(clone);
        if(!validateBackupData(clone)){ errors.push('Banco local inválido (estrutura rejeitada por validateBackupData).'); clone=null; }
        else{
          normalizeDB(clone);
          if(JSON.stringify(clone)!==before){ errors.push('O banco local não está normalizado: normalizeDB() alteraria dados. Nada foi corrigido.'); clone=null; }
        }
      }
    }catch(e){ errors.push('Falha ao preparar o banco local: '+msg(e)); clone=null; }
    if(clone){
      try{
        const demo=pmCountDemo(clone);
        payloads=env.buildPayloads(clone);
        const ve=pmValidatePayloads(payloads,clone); ve.forEach(x=>errors.push(x));
        if(payloads){
          PM_TABLES.forEach(t=>{ counts[t]=Array.isArray(payloads[t])?payloads[t].length:0; });
          counts.installments=(payloads.transactions||[]).filter(p=>p&&p.installment_group_id!==null&&p.installment_group_id!==undefined).length;
          counts.recurrences=(payloads.transactions||[]).filter(p=>p&&p.recurrence_group_id!==null&&p.recurrence_group_id!==undefined).length;
          counts.demo=demo;
          const total=PM_TABLES.reduce((s,t)=>s+counts[t],0);
          if(total===0) warnings.push('Nenhum registro financeiro real para migrar.');
        }
      }catch(e){ errors.push('Falha ao montar/validar os payloads: '+msg(e)); payloads=null; }
    }
    // 3) trava principal: o usuário NÃO pode ter nenhum registro financeiro no Supabase (somente SELECT/count)
    try{
      supabase={};
      const rs=await Promise.all(PM_TABLES.map(t=>env.countOwnRows(t)));
      PM_TABLES.forEach((t,i)=>{
        const r=rs[i];
        if(!r||r.ok!==true||typeof r.count!=='number'||!Number.isInteger(r.count)||r.count<0){ supabase[t]=null; errors.push('Supabase inacessível ou contagem inválida ao consultar '+t+(r&&r.error?' ('+r.error+')':'')+'.'); }   // falha fechada: sem número válido, bloqueia
        else{ supabase[t]=r.count; if(r.count>0) errors.push('O usuário já possui '+r.count+' registro(s) em '+t+' no Supabase. Migração abortada: sem merge, sem sobrescrita, sem exclusão.'); }
      });
    }catch(e){ errors.push('Falha ao consultar o Supabase: '+msg(e)); }
  }
  const status=errors.length?'BLOQUEADA':'PRONTA';
  const result={status,ok:status==='PRONTA',userId,counts,supabase,errors,warnings,payloads:status==='PRONTA'?payloads:null};
  result.report=pmFormatReport(result);
  return result;
}

// ================== FASE 3B-05 — INFRAESTRUTURA DA MIGRAÇÃO REAL (NADA É EXECUTADO AUTOMATICAMENTE; SEM BOTÃO) ==================
// migrateLocalDataToSupabase() só roda se for chamada manualmente (console). migrationPreview() e verifyMigration() só LEEM.
// Única escrita possível: window.MigrationIO.insertBatch (INSERT puro, com o cliente já existente e a sessão atual). Sem upsert, update,
// delete, rpc, service_role, fetch direto ou user_id no payload. Fail-closed: qualquer divergência interrompe e nada é "corrigido".

const PM_MIG_STATE={running:false};
function pmMigFail(msg){ const e=new Error(msg); e.pmAbort=true; throw e; }

    insertBatch:(t,r,u)=>IO?IO.insertBatch(t,r,u):Promise.resolve({ok:false,error:'MigrationIO indisponível'}),
    selectOwn:(t,u)=>IO?IO.selectOwn(t,u):Promise.resolve({ok:false,error:'MigrationIO indisponível'}),

// Validar sessão + usuário (retorna mensagem de erro ou null)
async function pmMigCheckAuth(env,expectedUserId){
  try{
    if(!env.isAuthenticated()) return 'Usuário não autenticado.';
    const u=env.userId();
    if(typeof u!=='string'||!UID_RE.test(u)) return 'AuthUI.userId() ausente ou inválido.';
    if(expectedUserId!==undefined&&u!==expectedUserId) return 'O usuário autenticado mudou durante a migração.';
    const s=await env.checkSession();
    if(!s||s.ok!==true) return 'Sessão não está ativa.';

function pmMigCheckOwner(env,userId){
  try{ const loc=env.getLocal(); if(!loc||loc.owner!==userId) return 'O banco local carregado não pertence ao usuário autenticado.'; return null; }
  catch(e){ return 'Falha ao ler o banco local: '+pmMigMsg(e); }

// Validar tabela vazia para o usuário (somente SELECT/count)
async function pmMigCheckEmpty(env,table){

    if(r.count>0) return table+' já possui '+r.count+' registro(s) do usuário. Sem merge, sem sobrescrita.';

}
// Cópia normalizada do DB local (nunca altera o original; exige que normalizeDB() não mude nada)
function pmMigLocalClone(env,userId){
  const o=pmMigCheckOwner(env,userId); if(o) pmMigFail(o);
  const loc=env.getLocal();
  if(!loc.db||typeof loc.db!=='object'||Array.isArray(loc.db)) pmMigFail('Banco local ausente ou inválido.');
  const clone=JSON.parse(JSON.stringify(loc.db)); const before=JSON.stringify(clone);
  if(!validateBackupData(clone)) pmMigFail('Banco local inválido (rejeitado por validateBackupData).');

// Montar payload (com checagens extras às da pré-migração)
function pmMigBuild(env,clone){

// Comparação campo a campo (usada pela verificação final)

      const r=await env.selectOwn(t,userId);
      if(!r||r.ok!==true||!Array.isArray(r.rows)) pmMigFail('Resposta inesperada ao ler '+t+(r&&r.error?' ('+r.error+')':'')+'.');

      else if(!pmMigSameIds(r.rows,exp)) e.push(t+': IDs divergem.');
      r.rows.forEach(x=>{ if(x.user_id!==userId) e.push(t+': registro de outro usuário.'); if(x.deleted_at!==null&&x.deleted_at!==undefined) e.push(t+' id='+x.id+': excluído (deleted_at).'); });
      if(!e.length) pmMigCompareTable(t,exp,r.rows).forEach(x=>e.push(x));

    const idset=t=>new Set(srv[t].map(x=>x.id));
    const cats=idset('categories'),cards=idset('cards'),accs=idset('accounts');
    srv.transactions.forEach(x=>{
      if(x.category_id&&!cats.has(x.category_id)) errors.push('transactions id='+x.id+': category_id órfão no Supabase.');
      if(x.card_id&&!cards.has(x.card_id)) errors.push('transactions id='+x.id+': card_id órfão no Supabase.');
      if(x.account_id&&!accs.has(x.account_id)) errors.push('transactions id='+x.id+': account_id órfão no Supabase.');
      if(x.to_account_id&&!accs.has(x.to_account_id)) errors.push('transactions id='+x.id+': to_account_id órfão no Supabase.');

    srv.budgets.forEach(x=>{ if(!cats.has(x.category_id)) errors.push('budgets id='+x.id+': category_id órfão no Supabase.'); });

    if(inst(srv.transactions)!==inst(P.transactions)) errors.push('Quantidade de parcelamentos diverge.');
    if(rec(srv.transactions)!==rec(P.transactions)) errors.push('Quantidade de recorrências diverge.');

  PM_TABLES.forEach(t=>{ const p=per[t]; L.push('- '+t+': '+(p?('local '+p.expected+' · Supabase '+p.found+' · '+(p.ok?'OK':'DIVERGE')):'não verificada')); });
  if(per.installments) L.push('- parcelamentos: local '+per.installments.expected+' · Supabase '+per.installments.found);
  if(per.recurrences) L.push('- recorrências: local '+per.recurrences.expected+' · Supabase '+per.recurrences.found);
  if(errors.length){ L.push(''); L.push('DIVERGÊNCIAS ('+errors.length+'):'); errors.slice(0,40).forEach(x=>L.push('- '+x)); }

// Migração real. SÓ roda quando chamada manualmente. Nunca lança exceção: devolve sempre um relatório.
async function migrateLocalDataToSupabase(envOverride){
  const R={ok:false,status:'ABORTADA',userId:null,stages:[],errors:[],writesAttempted:false,verification:null,report:''};
  if(PM_MIG_STATE.running){ R.errors.push('Já existe uma migração em andamento.'); R.report=pmMigFmt(R); return R; }
  PM_MIG_STATE.running=true;
  try{
    const env=pmMigEnv(envOverride);
    if(typeof env.insertBatch!=='function'||typeof env.selectOwn!=='function') pmMigFail('Camada de E/S da migração indisponível.');
    // 1) autenticação + dry-run completo imediatamente antes de qualquer escrita
    const ae=await pmMigCheckAuth(env); if(ae) pmMigFail(ae);
    const userId=env.userId(); R.userId=userId;
    const dry=await preMigrationDryRun(env);
    if(!dry||dry.status!=='PRONTA'||dry.ok!==true) pmMigFail('Dry-run não retornou PRONTO PARA MIGRAÇÃO'+(dry&&dry.errors&&dry.errors.length?': '+dry.errors.slice(0,5).join(' | '):'.'));
    if(dry.userId!==userId) pmMigFail('Dry-run foi feito para outro usuário.');
    PM_TABLES.forEach(t=>{ if(!dry.supabase||dry.supabase[t]!==0) pmMigFail('Dry-run: '+t+' não está vazia.'); });
    // 2) payload final, validado de novo contra uma cópia normalizada do DB local; congelado por impressão digital
    const clone=pmMigLocalClone(env,userId); const P=pmMigBuild(env,clone);
    const fpLocal=JSON.stringify(env.getLocal().db), fpPayload=JSON.stringify(P);
    PM_TABLES.forEach(t=>{ R.stages.push({table:t,expected:P[t].length,inserted:0,found:null,state:'pendente'}); });
    // 3) etapas na ordem obrigatória
    for(let i=0;i<PM_TABLES.length;i++){
      const t=PM_TABLES[i], st=R.stages[i], rows=P[t];
      const a=await pmMigCheckAuth(env,userId); if(a) pmMigFail(a);
      const o=pmMigCheckOwner(env,userId); if(o) pmMigFail(o);
      if(JSON.stringify(env.getLocal().db)!==fpLocal) pmMigFail('O banco local mudou durante a migração.');
      if(JSON.stringify(P)!==fpPayload) pmMigFail('O payload mudou durante a migração.');
      const em=await pmMigCheckEmpty(env,t); if(em) pmMigFail(em);
      st.state='gravando';
      for(let k=0;k<rows.length;k+=PM_IO_MAX_BATCH_LOCAL){
        const chunk=rows.slice(k,k+PM_IO_MAX_BATCH_LOCAL);
        R.writesAttempted=true;
        let w; try{ w=await env.insertBatch(t,chunk,userId); }catch(e){ st.state='falhou'; pmMigFail(t+': falha no insert ('+pmMigMsg(e)+').'); }
        if(!w||w.ok!==true){ st.state='falhou'; pmMigFail(t+': insert recusado'+(w&&w.error?' ('+w.error+')':'')+'.'); }
        st.inserted+=chunk.length;
      }
      st.found=await pmMigCheckStage(env,t,rows,userId);   // aborta se divergir
      st.state='conferida';
    }
    // 4) verificação final completa
    const v=await verifyMigration(env); R.verification={status:v.status,errors:v.errors};
    if(!v.ok) pmMigFail('Verificação final divergente: '+v.errors.slice(0,5).join(' | '));
    R.ok=true; R.status='CONCLUÍDA';
  }catch(e){
    R.ok=false; R.status='ABORTADA'; R.errors.push(pmMigMsg(e));
    R.stages.forEach(s=>{ if(s.state==='pendente') s.state='não executada'; else if(s.state==='gravando') s.state='interrompida'; });
  }finally{ PM_MIG_STATE.running=false; }
  R.report=pmMigFmt(R); return R;
}

function pm6Fmt(title,R){
  const L=[title+': '+R.status,'Usuário: '+(R.userId||'-'),'Tabela: categories · ID de teste: '+PM6_TEST_ID,'Escrita real tentada nesta chamada: '+(R.writesAttempted?'SIM (1 INSERT)':'NÃO')];

  c.recurrences=(Array.isArray(db.transactions)?db.transactions:[]).filter(t=>t&&t.recurrence&&typeof t.recurrence==='object').length;

function pm7PayloadCounts(P){
  const c={}; PM_TABLES.forEach(t=>{ c[t]=Array.isArray(P&&P[t])?P[t].length:0; });
  const tx=(P&&Array.isArray(P.transactions))?P.transactions:[];

  c.recurrences=tx.filter(p=>p&&p.recurrence_group_id!==null&&p.recurrence_group_id!==undefined).length;

}
// Fingerprint: usuário + contagens (local e payload) + IDs + todos os valores dos payloads + totais de parcelas/recorrências
function pm7Fingerprint(env,userId,localCounts,P){
  const pc=pm7PayloadCounts(P), ids={}, vals={};
  PM_TABLES.forEach(t=>{ const l=Array.isArray(P[t])?P[t]:[]; ids[t]=l.map(p=>p&&p.id); vals[t]=env.sha256(pm7Canon(l)); });
  const body={v:'3B-07',userId,localCounts,payloadCounts:pc,installments:pc.installments,recurrences:pc.recurrences,ids,valueHashes:vals};
  return {fingerprint:env.sha256(pm7Canon(body)),payloadCounts:pc,valueHashes:vals};
}
function pm7GroupBy(list,key){ const m=new Map(); list.forEach(p=>{ const g=p[key]; if(g===null||g===undefined) return; if(!m.has(g)) m.set(g,[]); m.get(g).push(p); }); return m; }
// Prova funcional dos mapeamentos: monta um banco sintético com valores sentinela e confere cada coluna
function pm7CheckMappings(env){
  const errs=[];
  PM7_MAPPINGS.forEach(m=>{
    const spec=(PM_SPEC[m[0]]||[]).find(c=>c[0]===m[2]);
    if(!spec) errs.push('mapeamento ausente no PM_SPEC: '+m[0]+'.'+m[2]);
    else if(spec[1].join('.')!==m[1].join('.')) errs.push('mapeamento diverge em '+m[0]+'.'+m[2]+' (esperado '+m[1].join('.')+', obtido '+spec[1].join('.')+').');
  });
  const syn={categories:[{id:'c1',name:'C'}],cards:[{id:'k1',name:'K',limit:1111,closingDay:11,dueDay:22,active:true}],accounts:[{id:'a1',name:'A',initial:333}],
    budgets:[{id:'b1',categoryId:'c1',amount:44,period:'monthly'}],goals:[{id:'g1',name:'G',targetAmount:555,currentAmount:66,active:true}],
    monthClosures:[{id:'m1',month:'2026-01',closedAt:'2026-02-01',closedAtTs:1770000000000,note:'n'}],
    transactions:[{id:'t1',type:'cartao',desc:'D',amount:7,date:'2026-01-05',cardId:'k1',modifiedAt:1760000000000,invoicePeriod:'2026-02-01',invoiceClosingDay:9,
      installment:{groupId:'gi',index:2,count:3,totalAmount:21},recurrence:{groupId:'gr',index:4,count:5,frequency:'monthly'}}]};
  const P=env.buildPayloads(JSON.parse(JSON.stringify(syn)));
  const srcKey={categories:'categories',cards:'cards',accounts:'accounts',budgets:'budgets',goals:'goals',month_closures:'monthClosures',transactions:'transactions'};
  PM7_MAPPINGS.forEach(m=>{
    const row=P&&P[m[0]]&&P[m[0]][0]; const want=pmGet(syn[srcKey[m[0]]][0],m[1]);
    if(!row||row[m[2]]!==want) errs.push('prova funcional falhou em '+m[0]+'.'+m[2]+' (esperado '+JSON.stringify(want)+', obtido '+JSON.stringify(row?row[m[2]]:undefined)+').');
  });

}
function pm7Fmt(R){
  const sec=R.sections, c=R.counts||{}, n=v=>(v===undefined||v===null)?'-':v, s=R.supabase||{};
  const L=['PRÉ-MIGRAÇÃO REAL FINAL 3B-07','','Status: '+(R.ok?'PRONTO PARA MIGRAÇÃO':'BLOQUEADO'),'Usuário: '+(R.userId||'-'),''];
  [['Autenticação','auth'],['Owner local','owner'],['Banco local','local'],['Normalização','normalization'],['Payloads','payloads'],['Schema','schema'],['Integridade','integrity'],['Supabase vazio','supabaseEmpty']].forEach(p=>L.push(p[0]+': '+sec[p[1]]));
  L.push('Fingerprint: '+(R.fingerprint||'-'),'','Contagens:','');
  PM_TABLES.forEach(t=>L.push(t+': '+n(c[t])));
  L.push('','Installments: '+n(c.installments),'Recurrences: '+n(c.recurrences),'Demo: '+n(c.demo),'','Supabase:','');
  PM_TABLES.forEach(t=>L.push(t+': '+(s[t]===undefined||s[t]===null?'não consultado':s[t])));
  L.push('','Escritas reais nesta fase: 0');
  if(R.warnings.length){ L.push('','AVISOS:'); R.warnings.forEach(w=>L.push('- '+w)); }
  if(R.errors.length){ L.push('','MOTIVOS DO BLOQUEIO ('+R.errors.length+'):'); R.errors.slice(0,60).forEach(e=>L.push('- '+e)); if(R.errors.length>60) L.push('- … e mais '+(R.errors.length-60)+' motivo(s).'); }
  L.push('','Schema (atestado, não relido pelo navegador): '+PM7_SCHEMA_ATTEST.pk+'; user_id '+PM7_SCHEMA_ATTEST.userIdDefault+'; RLS '+PM7_SCHEMA_ATTEST.rls+'; atestado em '+PM7_SCHEMA_ATTEST.date+'.');
  L.push('RESULTADO: '+(R.ok?'PRONTO_PARA_MIGRACAO':'BLOQUEADO'));
  return L.join('\n');
}

// processa o retorno bruto de UMA tabela: valida e separa ativos x apagados (soft delete). Nunca altera os dados.
function processRows(table,rows,userId,E,W){
  const active=[],items=[]; let soft=0; const seen=new Set();
  rows.forEach((row,i)=>{
    const w=table+'['+i+']'+(row&&typeof row.id==='string'?' id='+row.id:'');
    if(!row||typeof row!=='object'||Array.isArray(row)){ E(w+': registro inválido.'); return; }
    if(typeof row.id!=='string'||!row.id.length){ E(w+': registro sem id.'); return; }
    if(seen.has(row.id)){ E(w+': id duplicado.'); return; }
    seen.add(row.id);
    if(row.user_id!==userId){ E(w+': user_id ausente ou pertence a outro usuário.'); return; }
    if(!has(row,'deleted_at')||row.deleted_at===undefined){ E(w+': coluna deleted_at ausente.'); return; }
    if(row.deleted_at!==null){
      if(typeof row.deleted_at!=='string'||!row.deleted_at.length){ E(w+': deleted_at inválido.'); return; }
      soft++; return;   // apagado (soft delete): não entra no DB ativo
    }
    const before=[]; const Eh=m=>{ before.push(m); E(m); };
    validateRow(table,row,w,Eh,W);
    if(!before.length) businessRow(table,row,w,Eh);
    if(before.length) return;
    active.push(row); items.push(convertRow(table,row));
  });
  return {active,items,soft};
}

async function authenticate(env){

  const u=env.userId();
  if(typeof u!=='string'||!UUID.test(u)) throw new Error('Leitura bloqueada: userId ausente ou inválido.');

  if(!s||s.ok!==true) throw new Error('Leitura bloqueada: sessão inativa'+(s&&s.error?' ('+s.error+')':'')+'.');
  if(s.userId!==u) throw new Error('Leitura bloqueada: a sessão ativa não corresponde ao userId do AuthUI.');

async function fetchTable(env,table,userId){

async function readTables(env,tables,R){

<script>
// PWA (Etapa 1): registro do Service Worker. Totalmente opcional e silencioso: sem suporte, em file:// ou sem HTTPS,
// nada acontece e a aplicação continua funcionando como antes. Não toca em localStorage nem em dados financeiros.
(function(){
  try{
    if(!('serviceWorker' in navigator)) return;
    if(location.protocol!=='https:' && location.protocol!=='http:') return;
    // Atualização automática: procura versão nova do SW ao abrir e sempre que o app volta ao primeiro plano
    // (importante no celular, onde o app instalado quase nunca é "recarregado"). Quando uma versão nova assume
    // o controle, a página recarrega UMA vez — a menos que haja uma janela/formulário aberto, para não perder o
    // que a pessoa está digitando. Os dados ficam no localStorage, então o recarregamento não os afeta.
    var hadController=!!navigator.serviceWorker.controller, reloaded=false;
    navigator.serviceWorker.addEventListener('controllerchange',function(){
      if(!hadController){ hadController=true; return; }   // primeira instalação: nada a recarregar
      if(reloaded) return;
      var mr=document.getElementById('modalRoot');
      if(mr && mr.children.length) return;                // há janela aberta: atualiza na próxima abertura
      reloaded=true; location.reload();
    });
    window.addEventListener('load',function(){
      try{
        navigator.serviceWorker.register('sw.js',{updateViaCache:'none'}).then(function(reg){
          document.addEventListener('visibilitychange',function(){
            if(document.visibilityState==='visible'){ try{ reg.update(); }catch(e){} }
          });
        }).catch(function(){});
      }catch(e){}
    });
  }catch(e){}
})();

// Filtro De/Até (mobile): reduz a fonte do mês só o necessário para o texto caber inteiro ("novembro de 2026").
(function(){
  let raf=0;
  function fit(){
    raf=0;
    document.querySelectorAll('.pb-in').forEach(function(box){
      const t=box.querySelector('.pb-txt'); if(!t) return;
      const cs=getComputedStyle(box);
      const avail=box.clientWidth-parseFloat(cs.paddingLeft)-parseFloat(cs.paddingRight)-2;
      if(avail<=0) return;
      let fs=16; t.style.fontSize=fs+'px';
      while(fs>9 && t.getBoundingClientRect().width>avail){ fs-=0.5; t.style.fontSize=fs+'px'; }
    });
  }
  function sched(){ if(!raf) raf=requestAnimationFrame(fit); }
  window.addEventListener('resize',sched);
  window.addEventListener('orientationchange',sched);
  if(document.fonts&&document.fonts.ready) document.fonts.ready.then(sched);
  const m=document.getElementById('main');
  if(m) new MutationObserver(sched).observe(m,{childList:true,subtree:true});
  sched();
})();
</script>
