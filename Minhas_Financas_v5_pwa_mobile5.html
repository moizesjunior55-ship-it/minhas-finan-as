function viewDashboard(){
  const todayYM=todayISO().slice(0,7);
  // Período selecionado [from..to] (inclusive). Se vier invertido, troca; limita a 60 meses.
  let from=dashFrom, to=dashTo;
  if(from>to){ const t=from; from=to; to=t; }
  const months=[]; for(let m=from; m<=to && months.length<60; m=shiftYearMonth(m,1)) months.push(m);
  to=months[months.length-1];
  const single=(from===to);
  const isDefaultPeriod=(single && from===todayYM);
  const shortLbl=m=>BUDGET_MONTH_NAMES[Number(m.slice(5,7))-1].slice(0,3).toLowerCase()+'/'+m.slice(0,4);
  const mesLabel=single?budgetMonthLabel(from):shortLbl(from)+' a '+shortLbl(to);
  const mWord=single?(from===todayYM?'este mês':'em '+budgetMonthLabel(from)):'de '+mesLabel;
  const ent=months.reduce((s,m)=>s+monthIn(m),0), sai=months.reduce((s,m)=>s+monthOut(m),0), econ=ent-sai;
  const proj=projectedBalance();
  const catTot={};
  months.forEach(m=>categoryTotals(m).forEach(([cid,v])=>{ catTot[cid]=(catTot[cid]||0)+v; }));
  const cats=Object.entries(catTot).sort((a,b)=>b[1]-a[1]);
  const maxCat=cats[0];
  const catSum=cats.reduce((x,[,v])=>x+v,0)||1;
  const barsHtml=cats.map(([cid,v])=>{
    const c=catById(cid); const max=cats[0][1]||1;
    const nm=c?c.name:'Outros', ic=c?(c.icon||'📦'):'📦';
    return `<div class="oc-row" role="button" tabindex="0" data-ocat="${escapeHTML(String(cid))}" aria-label="Ver lançamentos de ${escapeHTML(nm)}">
      <div class="oc-line"><div class="oc-ico" aria-hidden="true">${escapeHTML(ic)}</div>
        <div class="oc-name"><b>${escapeHTML(nm)}</b><span class="oc-sub">${(v/catSum*100).toFixed(0)}% das despesas</span></div>
        <span class="oc-val">${fmt(v)}</span><span class="oc-chev" aria-hidden="true">›</span></div>
      <div class="oc-bar" aria-hidden="true"><i style="width:${(v/max*100).toFixed(0)}%"></i></div></div>`;
  }).join('') || `<p class="muted">Sem despesas ${mWord}.</p>`;

  const insights=[];
  // Apresentação: cada insight é {icon,label,value,hint,tone}; os valores são os mesmos de antes.
  if(maxCat){const c=catById(maxCat[0]);insights.push({act:'cat:'+maxCat[0],icon:c?c.icon:'📦',label:'Maior gasto',value:escapeHTML(c?c.name:'Outros'),side:fmt(maxCat[1]),hint:`Categoria que mais pesou ${mWord}.`})}
  const txCount=months.reduce((s,m)=>s+monthTx(m).length,0);
  insights.push({act:'tx',icon:'🧾',label:'Lançamentos',value:String(txCount),hint:`${txCount===1?'lançamento registrado':'lançamentos registrados'} ${mWord}.`});
  insights.push(econ>=0
    ?{act:'result',icon:'💰',label:'Resultado',value:'Positivo',side:fmt(econ),tone:'pos',hint:`Você economizou ${fmt(econ)} ${mWord}.`}
    :{act:'result',icon:'⚠️',label:'Resultado',value:'Negativo',side:fmt(Math.abs(econ)),tone:'neg',hint:`Você gastou ${fmt(Math.abs(econ))} a mais do que recebeu ${mWord}.`});
  // V1.2.3: reaproveita a MESMA função central getBudgetStatuses() usada na tela de Orçamento e
  // nas notificações — nenhum segundo cálculo de "quanto já foi gasto" aqui (inclui compras no
  // cartão como gasto, igual às duas outras telas). O limiar de 70%–99% é só um aviso mais cedo,
  // específico deste resumo do Dashboard — a régua de status (Atenção/Próximo/Excedido) em si
  // continua exclusivamente em getBudgetStatuses()/budgetStatusFor().
  if(single) getBudgetStatuses(from).rows.forEach(r=>{
    if(r.percentage>70 && r.percentage<100){
      insights.push({act:'bud:'+r.id,icon:'🎯',label:'Orçamento',value:escapeHTML(r.category?r.category.name:r.categoryId),side:r.percentage.toFixed(0)+'%',tone:'warn',hint:`Você já utilizou ${r.percentage.toFixed(0)}% do orçamento de ${escapeHTML(r.category?r.category.name:r.categoryId)}.`});
    }
  });

  window.__dashCtx={months,mWord,mesLabel,single,from,ent,sai,econ};
  const futAll=futureTx();
  const futInst=futureInstallments();
  const futRec=futureRecurring();
  const nextCommitmentsAll=getNextCommitments();
  // "Próximos compromissos" foi unificada aqui: a única informação que ela tinha e esta lista não tinha
  // são as faturas de cartão em aberto (uma linha por fatura, no vencimento). Elas entram na MESMA lista.
  const faturaItems=nextCommitmentsAll.filter(it=>it.kind==='fatura').map(it=>({_fatura:true,date:it.date,desc:it.desc,amount:it.amount,cardId:it.cardId,period:it.period}));
  const upRank=t=>t._fatura?(t.date<todayISO()?0:2):txPriorityRank(t);
  const upcoming=futAll.concat(faturaItems).sort((a,b)=>(upRank(a)-upRank(b))||a.date.localeCompare(b.date)).slice(0,5);
  // Filtro de mês: usa a MESMA lista de compromissos (já deduplicada) e só recorta por data.
  const eomISO=to+'-'+String(new Date(Number(to.slice(0,4)),Number(to.slice(5,7)),0).getDate()).padStart(2,'0');
  const monthItems=nextCommitmentsAll.filter(it=>{ const m=it.date.slice(0,7); return m>=from && m<=to; });
  const mesReceber=monthItems.filter(it=>it.kind==='receita').reduce((s,it)=>s+Number(it.amount),0);
  const mesPagar=monthItems.filter(it=>it.kind!=='receita').reduce((s,it)=>s+Number(it.amount),0);
  const ateFimMes=nextCommitmentsAll.filter(it=>it.date<=eomISO);
  const projMes=proj.currentBalance
    +ateFimMes.filter(it=>it.kind==='receita').reduce((s,it)=>s+Number(it.amount),0)
    -ateFimMes.filter(it=>it.kind!=='receita').reduce((s,it)=>s+Number(it.amount),0);
  const eomLabel=eomISO.split('-').reverse().join('/');

  const cardInvoices=DB.cards.map(c=>({c,inv:cardCurrentInvoice(c.id)}));
  const totalOpenInvoices=cardInvoices.reduce((s,x)=>s+x.inv.remaining,0);
  const biggestInvoice=cardInvoices.slice().sort((a,b)=>b.inv.remaining-a.inv.remaining)[0];
  const faturaCard=DB.cards.length?`<div class="card stat stat-click stat-tone-neg" role="button" tabindex="0" data-dstat="fatura" aria-label="Ver faturas atuais"><div class="label">Fatura atual</div><div class="val ${totalOpenInvoices>0?'neg':''}">${fmt(totalOpenInvoices)}</div>
    ${biggestInvoice&&biggestInvoice.inv.remaining>0?`<div class="muted" style="margin-top:4px">Maior: ${escapeHTML(biggestInvoice.c.name)} (${fmt(biggestInvoice.inv.remaining)})</div>`:''}</div>`:'';

  // Reaproveita a Central de Notificações (getNotifications(), já existente e intocada) só para
  // decidir se um banner de destaque aparece no topo do Dashboard — nenhuma notificação nova.
  const notifs=getNotifications();
  const alertBanner=dashboardAlertBannerHTML(notifs);

  // "Saídas futuras" = exatamente a soma das MESMAS três parcelas que projectedBalance() já
  // subtrai internamente (proj.futureExpenses+proj.futureCardObligations+proj.futureCardPayments) —
  // nenhum cálculo novo, só a soma exibida como um único total em vez de dois números que dariam a
  // falsa impressão de precisarem ser somados pelo usuário.
  const saidasFuturasTotal=proj.futureExpenses+proj.futureCardObligations+proj.futureCardPayments;

  // "Quanto posso gastar?" (V1.2.1) — reaproveita proj e nextCommitmentsAll, ambos já calculados
  // acima para outras seções; nenhuma nova varredura de DB.transactions/DB.cards é feita aqui.
  const spendable=getSpendableSummary(nextCommitmentsAll,proj);
  const budgetDashHTML=dashboardBudgetsHTML(from,to);
  dashKpiCtx={all:nextCommitmentsAll,monthItems,ateFimMes,eomLabel,mesLabel,proj,projMes,spendable,saidasFuturasTotal};

  return `
  <div class="topbar"><h1>Dashboard</h1>
    <div class="period-bar" role="group" aria-label="Período do resumo">
      <button class="ghost" id="dashPrevMonth" aria-label="Voltar um mês">‹</button>
      <label for="dashFromInp">De</label>
      <span class="pb-in"><span class="pb-txt">${pbLabel(from)}</span><input type="month" id="dashFromInp" value="${from}"></span>
      <label for="dashToInp">até</label>
      <span class="pb-in"><span class="pb-txt">${pbLabel(to)}</span><input type="month" id="dashToInp" value="${to}"></span>
      <button class="ghost" id="dashNextMonth" aria-label="Avançar um mês">›</button>
      ${isDefaultPeriod?'':'<button class="ghost period-today" id="dashToday">Hoje</button>'}
    </div>
  </div>
  ${overdueBannerHTML()}
  ${alertBanner}
  <h2 class="section-label">Resumo financeiro — ${mesLabel}</h2>
  <div class="grid kpi-grid">
    <div class="card stat kpi-click" data-kpi="saldo" role="button" tabindex="0" aria-label="Ver detalhes: Saldo atual"><div class="label">Saldo atual</div><div class="val">${fmt(proj.currentBalance)}</div><div class="kpi-more">Ver contas ›</div></div>
    <div class="card stat kpi-click" data-kpi="projetado" role="button" tabindex="0" aria-label="Ver detalhes: Saldo projetado">
      <div class="label">Saldo projetado até ${eomLabel}</div>
      <div class="val ${projMes>=0?'':'neg'}">${fmt(projMes)}</div>
      ${projMes<0?'<div class="muted" style="color:var(--red);margin-top:4px;font-size:12px">⚠ Projeção negativa até essa data.</div>':''}
      <div class="kpi-more">Ver detalhes ›</div>
    </div>
    <div class="card stat kpi-click" data-kpi="receber" role="button" tabindex="0" aria-label="Ver detalhes: A receber"><div class="label">A receber em ${mesLabel}</div><div class="val pos">${fmt(mesReceber)}</div>
      <div class="kpi-more">Ver detalhes ›</div>
    </div>
    <div class="card stat kpi-click" data-kpi="pagar" role="button" tabindex="0" aria-label="Ver detalhes: A pagar">
      <div class="label">A pagar em ${mesLabel}</div>
      <div class="val neg">${fmt(mesPagar)}</div>
      <div class="kpi-more">Ver detalhes ›</div>
    </div>
  </div>

  ${spendableCardHTML(spendable)}

  <h2 class="section-label">Próximos</h2>
  <div class="two-col">
    <div class="card">
      <div class="card-head"><h3>Próximos lançamentos</h3><button class="ghost" id="btnVerLancFuturos">Ver todos</button></div>
      <div class="card-cap">${futAll.length} lançamento(s) futuro(s) · ${futInst.length} parcela(s) · ${futRec.length} recorrência(s)${faturaItems.length?` · 💳 ${faturaItems.length} fatura(s)`:''}${overdueList().length?` · 🔴 ${overdueList().length} atrasado(s)`:''}</div>
      ${upcomingRowsHTML(upcoming)}
    </div>
  </div>

  <h2 class="section-label">Fluxo de caixa</h2>
  ${cashFlowCardHTML(nextCommitmentsAll)}

  <h2 class="section-label">Orçamentos</h2>
  ${budgetDashHTML}

// Intervalo [inicio,fim] (ISO) para os períodos rápidos da tela de Lançamentos.
// Independente de periodRange() (usada em Relatórios) para não alterar o comportamento já validado
// daquela tela; a regra de cálculo do mês é a mesma (primeiro/último dia do mês via Date).
function lancPeriodRange(p){
  const now=new Date();
  if(p==='mes') return [new Date(now.getFullYear(),now.getMonth(),1),new Date(now.getFullYear(),now.getMonth()+1,0)];
  if(p==='anterior') return [new Date(now.getFullYear(),now.getMonth()-1,1),new Date(now.getFullYear(),now.getMonth(),0)];
  if(p==='proximo') return [new Date(now.getFullYear(),now.getMonth()+1,1),new Date(now.getFullYear(),now.getMonth()+2,0)];
  return null;
}
function sortTxList(list,sort){
  const arr=list.slice();
  if(sort==='oldest') arr.sort((a,b)=>a.date.localeCompare(b.date)||a.id.localeCompare(b.id));
  else if(sort==='amountDesc') arr.sort((a,b)=>Number(b.amount)-Number(a.amount));
  else if(sort==='amountAsc') arr.sort((a,b)=>Number(a.amount)-Number(b.amount));
  else arr.sort((a,b)=>b.date.localeCompare(a.date)||b.id.localeCompare(a.id)); // 'recent' (padrão)
  return arr;
}
// true quando algum filtro (além dos padrões) está ativo — usado no resumo de filtros e nas
// mensagens de estado vazio.
function hasActiveTxFilters(){
  const f=txFilters;
  return !!(f.tipo||f.categoria||f.conta||f.cartao||f.busca||f.status!=='todos'||f.periodo!=='todos');
}
function getFilteredTx(){
  let list=DB.transactions.slice();
  const f=txFilters;
  if(f.tipo) list=list.filter(t=>t.type===f.tipo);
  if(f.categoria) list=list.filter(t=>t.categoryId===f.categoria);
  if(f.conta) list=list.filter(t=>t.accountId===f.conta||t.toAccountId===f.conta);
  if(f.cartao) list=list.filter(t=>t.cardId===f.cartao);
  if(f.busca) list=list.filter(t=>(t.desc||'').toLowerCase().includes(f.busca.toLowerCase()));
  // Status: Realizado = isSettled(t) (efetivado); Pendente/Futuro = !isSettled(t). Mesma regra usada
  // em accBalance()/realizedMonthTx() em todo o sistema — nenhuma terceira interpretação.
  if(f.status==='realizados') list=list.filter(isSettled);
  else if(f.status==='futuros') list=list.filter(t=>!isSettled(t));
  else if(f.status==='atrasados') list=list.filter(isOverdue); // SOMENTE receita/despesa comum, não realizada, data < hoje
  if(f.periodo&&f.periodo!=='todos'){
    let s='',e='';
    if(f.periodo==='dia'){ const b=periodBounds({type:'day',date:f.dia}); if(!b.ok) return []; s=b.start; e=b.end; }
    else if(f.periodo==='personalizado'){ const b=periodBounds({type:'range',start:f.customStart,end:f.customEnd},true); if(!b.ok) return []; s=b.start; e=b.end; }
    else if(f.periodo==='meses'){ s=f.mFrom+'-01'; e=ymEndISO(f.mTo); }
    else{ const r=lancPeriodRange(f.periodo); if(r){ s=dateToISOLocal(r[0]); e=dateToISOLocal(r[1]); } }
    if(s) list=list.filter(t=>t.date>=s);
    if(e) list=list.filter(t=>t.date<=e);
  }
  // Prioridade: 1) atrasados 2) pendentes de hoje 3) demais — ordenação atual preservada dentro de cada grupo.
  return stableByRank(sortTxList(list,txSort),txPriorityRank);
}
// Resumo dos filtros atualmente aplicados (seção 6 da Etapa 5). Pagamento de fatura nunca entra
// no total de despesas (já é dinheiro saindo de uma compra já contabilizada) e transferência nunca
// entra como receita/despesa — mesma regra usada nos relatórios.
function filteredTxSummary(list){
  return {
    count:list.length,
    receitas:list.filter(t=>t.type==='receita').reduce((s,t)=>s+Number(t.amount),0),
    despesas:list.filter(t=>t.type==='despesa').reduce((s,t)=>s+Number(t.amount),0),
    cartao:list.filter(t=>t.type==='cartao').reduce((s,t)=>s+Number(t.amount),0)
  };
}
function emptyTxMessage(){
  if(!DB.transactions.length) return 'Nenhum lançamento encontrado.';
  return hasActiveTxFilters()?'Nenhum lançamento corresponde aos filtros atuais.':'Nenhum lançamento encontrado.';
}

// Cor da conta: cada conta recebe uma das 10 cores da paleta, sem repetir enquanto houver cor livre.
// A escolha fica gravada em a.color, então não muda ao excluir/criar outras contas.
const AC_COLORS=10; // quantidade de cores disponíveis (ac-c0 … ac-c9)
function accNextColor(skipId){
  const used=new Set(DB.accounts.filter(x=>x.id!==skipId&&Number.isInteger(x.color)).map(x=>x.color%AC_COLORS));
  for(let i=0;i<AC_COLORS;i++) if(!used.has(i)) return i;
  const cnt=new Array(AC_COLORS).fill(0); DB.accounts.forEach(x=>{ if(x.id!==skipId&&Number.isInteger(x.color)) cnt[x.color%AC_COLORS]++; });
  return cnt.indexOf(Math.min(...cnt));
}
function accColorIdx(a){
  if(!Number.isInteger(a.color)){ a.color=accNextColor(a.id); try{ saveDB(); }catch(e){} }
  return a.color%AC_COLORS;
}

function accColorPickerHTML(sel){
  return `<div class="ac-picker" role="radiogroup" aria-labelledby="accColorLbl" data-sel="${sel}">${
    Array.from({length:AC_COLORS},(_,i)=>`<button type="button" class="ac-sw ac-c${i}" data-accsw="${i}" role="radio" aria-checked="${i===sel}" aria-label="Cor ${i+1}">${i===sel?'✓':''}</button>`).join('')
  }</div>`;
}
function bindAccColorPicker(){
  const box=document.querySelector('.ac-picker'); if(!box) return;
  box.querySelectorAll('[data-accsw]').forEach(b=>b.onclick=()=>{
    box.dataset.sel=b.dataset.accsw;
    box.querySelectorAll('[data-accsw]').forEach(x=>{ const on=x===b; x.setAttribute('aria-checked',on); x.textContent=on?'✓':''; });
  });
}
function accPickedColor(){
  const box=document.querySelector('.ac-picker'); const n=box?parseInt(box.dataset.sel,10):NaN;
  return Number.isInteger(n)?n%AC_COLORS:accNextColor();
}

// accById()/accBalance()/accColorIdx() (locais) NÃO são usados no ramo remoto. Nada é gravado: sem saveDB, sem color, sem localStorage, sem SELECT de transactions.
function accReadOn(){ return !!(window.AppRead&&window.AppRead.isEnabled('accounts.read')); }
function accRemoteView(){ return accReadOn()?window.AppRead.viewAccounts(typeof AuthUI!=='undefined'?AuthUI.userId():null):null; }

// Saldo da conta REMOTA: initial remoto + transactions LOCAIS (continuam locais) cujo accountId/toAccountId == account.id. Mesmas regras de accBalance(), sem tocar nela.
function accBalanceRemote(account){
  if(!account) return 0;
  const accId=account.id; let bal=Number(account.initial||0);
  DB.transactions.forEach(t=>{
    if(!isSettled(t)) return;
    if(t.type==='receita' && t.accountId===accId) bal+=Number(t.amount);
    if(t.type==='despesa' && t.accountId===accId) bal-=Number(t.amount);
    if(t.type==='pagamento_fatura' && t.accountId===accId) bal-=Number(t.amount);
    if(t.type==='transferencia'){
      if(t.accountId===accId) bal-=Number(t.amount);
      if(t.toAccountId===accId) bal+=Number(t.amount);
    }
  });
  return bal;
}

// Detalhe (somente leitura) de uma conta: mesmas regras de accBalance() (só lançamentos efetivados).
function openAccountDetail(id){
  const a=accById(id); if(!a) return;
  const bal=accBalance(id);
  const ym=todayISO().slice(0,7);
  const rel=DB.transactions.filter(t=>isSettled(t)&&(t.accountId===id||t.toAccountId===id)&&(t.type==='receita'||t.type==='despesa'||t.type==='pagamento_fatura'||t.type==='transferencia'));
  const delta=t=>{
    const v=Number(t.amount);
    if(t.type==='receita') return v;
    if(t.type==='transferencia') return t.toAccountId===id?v:-v;
    return -v;
  };
  let ent=0, sai=0;
  rel.filter(t=>t.date.slice(0,7)===ym).forEach(t=>{ if(t.type==='transferencia') return; const d=delta(t); if(d>0) ent+=d; else sai-=d; });
  const list=rel.slice().sort((x,y)=>x.date<y.date?1:(x.date>y.date?-1:0)).slice(0,15);
  const rows=list.map(t=>{
    const d=delta(t);
    const c=catById(t.categoryId);
    let sub;
    if(t.type==='transferencia') sub=t.toAccountId===id?('Transferência de '+((accById(t.accountId)||{}).name||'—')):('Transferência para '+((accById(t.toAccountId)||{}).name||'—'));
    else if(t.type==='pagamento_fatura') sub='💳 Pagamento de fatura';
    else sub=c?(c.icon+' '+c.name):'Sem categoria';
    return `<div class="bt-row"><div class="bt-main"><div class="bt-desc">${escapeHTML(t.desc||'')}</div><div class="muted">${escapeHTML(t.date.split('-').reverse().join('/'))} · ${escapeHTML(sub)}</div></div><div class="bt-amt ${d>=0?'pos':'neg'}">${d>=0?'+':'-'}${fmt(Math.abs(d))}</div></div>`;
  }).join('')||'<p class="muted" style="margin:6px 0">Nenhuma movimentação efetivada nesta conta.</p>';
  openModal(`<div class="bud-detail">
    <div class="bc-head" style="margin-bottom:14px">
      <span class="ac-av ac-c${accColorIdx(a)}" aria-hidden="true">${escapeHTML((String(a.name||'').trim().charAt(0)||'?').toUpperCase())}</span>
      <div class="bc-title"><h3 id="modalTitle" style="margin:0;font-size:18px">${escapeHTML(a.name)}</h3><div class="muted">Saldo atual</div></div>
      <div class="bc-pct"><b style="color:${bal<0?'var(--red)':'var(--text)'};font-size:22px">${fmt(bal)}</b></div>
    </div>
    <div class="bc-figs" style="grid-template-columns:1fr 1fr">
      <div class="is-ok"><div class="bud-fig-l">Entradas no mês</div><div class="bc-v">${fmt(ent)}</div></div>
      <div><div class="bud-fig-l">Saídas no mês</div><div class="bc-v" style="color:var(--red)">${fmt(sai)}</div></div>
    </div>
    <div class="bt-title">Últimas movimentações <span class="muted">(${list.length})</span></div>
    <div class="bt-list">${rows}</div>
    <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:14px"><button type="button" class="primary" style="min-height:44px" onclick="closeModal()">Fechar</button></div>
  </div>`,'modalTitle');
}

// Etapa 5 — classificação visual da fatura, apenas para exibição (nenhuma matemática nova).
// Regra:
//   remaining === 0                              -> paga
//   remaining > 0 && período de fatura > período atual do cartão -> futura (compras de um ciclo
//     que ainda nem fechou; vencimento também está no futuro)
//   remaining > 0 && dueDate < hoje               -> vencida
//   remaining > 0 && dueDate >= hoje               -> em aberto / a vencer
function invoiceStatus(card,inv){
  const today=todayISO();
  if(inv.remaining<=1e-9) return 'paga';
  if(isInvoiceOverdue(card,inv)) return 'vencida'; // = ATRASADA (venc. < hoje e não paga)
  const currentPeriod=getInvoicePeriod(card,today);
  if(inv.period>currentPeriod) return 'futura';
  if(inv.dueDate===today) return 'hoje';
  return 'aberto';
}
const INVOICE_STATUS_LABEL={paga:'Paga',futura:'Futura',vencida:'🔴 Atrasada',hoje:'Vence hoje',aberto:'Em aberto'};
const INVOICE_STATUS_CLASS={paga:'tag-green',futura:'tag-accent',vencida:'tag-red',hoje:'tag-yellow',aberto:'tag-yellow'};
function viewCartoes(){
  const VISIBLE_INV=3; // faturas mostradas de cara; o restante fica recolhido em "Ver mais"
  const br=d=>escapeHTML(String(d).split('-').reverse().join('/'));
  const brShort=d=>{const p=String(d).split('-'); return escapeHTML(p[2]+'/'+p[1]);};
  const cards=DB.cards.map(c=>{
    const used=cardUsed(c.id), avail=cardAvailable(c.id), inv=cardCurrentInvoice(c.id);
    // Filtro de faturas: 'abertas' (padrão, igual ao comportamento anterior) | 'atrasadas' | 'pagas' | 'todas'.
    // Atrasadas primeiro (prioridade), depois vencendo hoje, depois as demais — ordem original preservada dentro de cada grupo.
    const allInv=getAllInvoices(c);
    let open;
    if(invFilter==='atrasadas') open=allInv.filter(i=>isInvoiceOverdue(c,i));
    else if(invFilter==='pagas') open=allInv.filter(i=>i.remaining<=1e-9).reverse();
    else if(invFilter==='todas') open=allInv;
    else open=getOpenInvoices(c); // todas as faturas com saldo em aberto, da mais antiga à mais nova
    if(invFilter!=='pagas') open=stableByRank(open,i=>invoiceRank(c,i));
    const hasOverdueInv=allInv.some(i=>isInvoiceOverdue(c,i));
    const everHadPurchase=DB.transactions.some(t=>t.type==='cartao'&&t.cardId===c.id);
    const usedPct=Math.min(100,(used/(c.limit||1)*100));
    const invRow=o=>{
      const status=invoiceStatus(c,o);
      const statusTag=`<span class="tag ${INVOICE_STATUS_CLASS[status]}">${INVOICE_STATUS_LABEL[status]}</span>`;
      const partialTag=o.paidAmount>0?`<span class="tag">Parcialmente paga</span>`:'';
      const detail=[];
      if(o.paidAmount>0) detail.push(`Total ${fmt(o.total)}`,`pago ${fmt(o.paidAmount)}`);
      if(o.scheduledFuture>0) detail.push(`agendado ${fmt(o.scheduledFuture)}`);
      const odI=isInvoiceOverdue(c,o);
      return `<div class="cc-inv" data-invrow="${escapeHTML(c.id)}|${escapeHTML(o.period)}"${odI?' style="box-shadow:inset 3px 0 0 var(--red)"':''}>
        <button type="button" class="inv-open" data-openinvoice="${escapeHTML(c.id)}" data-invperiod="${escapeHTML(o.period)}" aria-label="Ver detalhes da fatura com vencimento em ${br(o.dueDate)}">
          <span class="cc-inv-d">${br(o.dueDate)}</span>
          <span class="cc-inv-m">${statusTag}${partialTag}<span>fecha ${brShort(o.closingDate)}</span></span>
          ${detail.length?`<span class="cc-inv-x">${detail.join(' · ')}</span>`:''}
        </button>
        <div class="cc-inv-r">
          <span class="cc-inv-v ${o.remaining>0?'neg':''}">${fmt(o.remaining)}</span>
          ${o.remaining>1e-9?`<button class="ghost" data-payinvoice="${escapeHTML(c.id)}" data-payperiod="${escapeHTML(o.period)}">Pagar</button>`:''}
        </div>
      </div>`;
    };
    const shown=open.slice(0,VISIBLE_INV).map(invRow).join('');
    const hiddenN=open.length-VISIBLE_INV;
    const more=hiddenN>0?`<details class="cc-more"><summary><span class="m-closed">Ver mais ${hiddenN} fatura${hiddenN>1?'s':''}</span><span class="m-open">Mostrar menos</span></summary>${open.slice(VISIBLE_INV).map(invRow).join('')}</details>`:'';
    const FLT_TITLE={abertas:'Faturas em aberto',atrasadas:'🔴 Faturas atrasadas',pagas:'Faturas pagas',todas:'Todas as faturas'};
    const FLT_EMPTY={atrasadas:'Nenhuma fatura atrasada.',pagas:'Nenhuma fatura paga.',todas:'Nenhuma fatura.'};
    const openBlock=open.length
      ?`<div class="cc-open"><div class="cc-open-h"><span>${FLT_TITLE[invFilter]||FLT_TITLE.abertas}</span><span class="muted">${open.length}</span></div>${shown}${more}</div>`
      :(invFilter!=='abertas'?`<p class="cc-empty">${FLT_EMPTY[invFilter]}</p>`:everHadPurchase?'<span class="tag tag-green" style="margin-top:16px;display:inline-block">Fatura paga</span>':'<p class="cc-empty">Nenhuma fatura em aberto.</p>');
    const curInner=`<span class="cc-cur-l"><span class="cc-cur-t">Fatura atual</span><span class="cc-cur-s">Fecha dia ${escapeHTML(c.closingDay)} · Vence dia ${escapeHTML(c.dueDay)}</span></span><span class="cc-cur-r"><span class="cc-cur-v ${inv.remaining>0?'neg':''}">${fmt(inv.remaining)}</span>${inv.items.length?'<span class="inv-chev" aria-hidden="true">›</span>':''}</span>`;
    const curBlock=inv.items.length
      ?`<button type="button" class="inv-open cc-current" data-openinvoice="${escapeHTML(c.id)}" data-invperiod="${escapeHTML(inv.period)}" aria-label="Ver detalhes da fatura atual de ${escapeHTML(c.name)}">${curInner}</button>`
      :`<div class="cc-current">${curInner}</div>`;
    const barCol=(used>c.limit||usedPct>=90)?'var(--red)':(usedPct>=70?'var(--yellow)':'var(--accent)');
    const chipSvg='<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="M3 10h18"/><path d="M7 15h3"/></svg>';
    return `<div class="card cc-card${hasOverdueInv?' is-late':''}${c.active===false?' is-off':''}">
      <div class="cc-head">
        <div class="cc-chip">${chipSvg}</div>
        <div class="cc-name">
          <h3>${escapeHTML(c.name)}</h3>
          ${(c.active===false||hasOverdueInv)?`<div class="cc-badges">${c.active===false?'<span class="tag">inativo</span>':''}${hasOverdueInv?'<span class="tag tag-red" style="white-space:nowrap">🔴 Atrasada</span>':''}</div>`:''}
        </div>
        <div class="cc-actions"><button class="ghost" data-editcard="${escapeHTML(c.id)}" aria-label="Editar cartão ${escapeHTML(c.name)}" title="Editar">${budIco('edit',17)}</button><button class="ghost cc-del" data-delcard="${escapeHTML(c.id)}" aria-label="Excluir cartão ${escapeHTML(c.name)}" title="Excluir">${budIco('del',17)}</button></div>
      </div>
      <div class="cc-avail">
        <div><div class="cc-l">Disponível</div><div class="cc-avail-v ${avail<0?'neg':''}">${fmt(avail)}</div></div>
        <div class="cc-lim"><div class="cc-l">Limite</div><div class="cc-lim-v">${fmt(c.limit)}</div></div>
      </div>
      <div class="bar-bg cc-bar"><div class="bar-fill" style="width:${usedPct.toFixed(0)}%;background:${barCol}"></div></div>
      <div class="cc-usage"><span>Usado ${fmt(used)}</span><span>${usedPct.toFixed(0)}% do limite</span></div>
      ${curBlock}
      ${inv.paidAmount>0&&inv.remaining>0?`<div class="cc-note">Pago ${fmt(inv.paidAmount)} de ${fmt(inv.total)} · restante ${fmt(inv.remaining)}</div>`:''}
      ${openBlock}
    </div>`;
  }).join('');
  const invFilterBar=DB.cards.length?`<div class="filters" id="invFilterBar"><select id="fInvFilter" aria-label="Filtrar faturas"><option value="abertas" ${invFilter==='abertas'?'selected':''}>Faturas: Em aberto</option><option value="atrasadas" ${invFilter==='atrasadas'?'selected':''}>🔴 Atrasadas</option><option value="pagas" ${invFilter==='pagas'?'selected':''}>Pagas</option><option value="todas" ${invFilter==='todas'?'selected':''}>Todas</option></select></div>`:'';
  return `<div class="topbar"><h1>Cartões</h1><button class="primary" id="btnNovoCartao">+ Cartão</button></div>
  ${invFilterBar}
  <div class="cc-grid">${cards||'<p class="muted">Nenhum cartão cadastrado.</p>'}</div>`;
}

// Detalhes de uma fatura (somente consulta). Reutiliza getInvoiceForPeriod() e invoiceStatus(): o total,
// as compras (inv.items), o status e os valores pago/agendado são exatamente os que o sistema já usa.
function openInvoiceDetail(cardId,period){
  const card=cardById(cardId); if(!card) return;
  const inv=getInvoiceForPeriod(card,period);
  const br=d=>escapeHTML(String(d).split('-').reverse().join('/'));
  const status=invoiceStatus(card,inv);
  const items=inv.items.slice().sort((a,b)=>(a.date<b.date?-1:a.date>b.date?1:0));
  const rows=items.map(t=>{
    const cat=t.categoryId?catById(t.categoryId):null;
    const parc=t.installment?`<span class="tag" style="margin-left:6px">Parcela ${escapeHTML(t.installment.index)}/${escapeHTML(t.installment.count)}</span>`:'';
    return `<div class="inv-item">
      <div class="inv-desc"><div>${escapeHTML(t.desc)}${parc}</div>
      <div class="muted" style="font-size:12px">${br(t.date)}${' · '+(cat?escapeHTML(cat.icon?cat.icon+' '+cat.name:cat.name):'Sem categoria')}</div></div>
      <div class="inv-amt neg">${fmt(t.amount)}</div></div>`;
  }).join('');
  // Pagamentos já registrados para esta fatura (leitura dos lançamentos existentes; nada é criado).
  const pays=DB.transactions.filter(t=>t.type==='pagamento_fatura'&&t.cardId===card.id&&t.invoicePeriod===period)
    .sort((a,b)=>(a.date<b.date?-1:a.date>b.date?1:0));
  const today=todayISO();
  const payRows=pays.map(t=>`<div class="inv-item"><div class="inv-desc">Pagamento · ${br(t.date)}${t.date>today?' <span class="tag" style="margin-left:6px">agendado</span>':''}</div><div class="inv-amt pos">${fmt(t.amount)}</div></div>`).join('');
  const payBlock=pays.length
    ?`<div class="muted" style="font-size:12px;margin:12px 0 2px">Pagamentos desta fatura</div><div>${payRows}</div>`:'';
  openModal(`<h3 id="modalTitle" style="margin-bottom:4px">Fatura — ${escapeHTML(card.name)}</h3>
    <div style="margin-bottom:8px"><span class="tag ${INVOICE_STATUS_CLASS[status]}">${INVOICE_STATUS_LABEL[status]}</span>${inv.paidAmount>0&&inv.remaining>0?'<span class="tag" style="margin-left:6px">Parcialmente paga</span>':''}</div>
    <div class="muted">Fecha em ${br(inv.closingDate)} · Vence em ${br(inv.dueDate)}</div>
    <div class="muted">Compras de ${br(period)} (ciclo que fecha nesta data)</div>
    <div style="margin:12px 0 2px" class="muted">${items.length} lançamento${items.length===1?'':'s'}</div>
    <div>${rows||'<p class="muted">Nenhuma compra nesta fatura.</p>'}</div>
    <div class="row" style="border-top:1px solid var(--border);margin-top:6px"><strong>TOTAL DA FATURA</strong><strong id="invDetailTotal">${fmt(inv.total)}</strong></div>
    ${inv.paidAmount>0?`<div class="row" style="border:none;padding:2px 0"><span class="muted">Valor pago</span><span class="pos">${fmt(inv.paidAmount)}</span></div>`:''}
    ${inv.paidAmount>0&&inv.remaining>0?`<div class="row" style="border:none;padding:2px 0"><span class="muted">Restante</span><span class="neg">${fmt(inv.remaining)}</span></div>`:''}
    ${payBlock}
    <div style="display:flex;justify-content:flex-start;margin-top:14px"><button type="button" class="ghost" onclick="closeModal()">← Voltar aos cartões</button></div>`,'modalTitle');
}

function bindCardFormEvents(existing){
  document.getElementById('saveCardBtn').onclick=()=>{
    const name=document.getElementById('cName').value.trim();
    const limit=money2(document.getElementById('cLimit').value);
    const closingDay=parseInt(document.getElementById('cClose').value,10);
    const dueDay=parseInt(document.getElementById('cDue').value,10);
    const active=document.getElementById('cActive').checked;
    if(!name){ showFormError('Informe um nome para o cartão.'); return; }

    if(!dueDay||dueDay<1||dueDay>31){ showFormError('Informe um dia de vencimento entre 1 e 31.'); return; }
    if(existing){
      // Correção 3A (bug #1): preserva a identidade das faturas que já têm pagamento antes de mudar o fechamento.
      if(existing.closingDay!==closingDay) freezePaidInvoicePeriods(existing);
      Object.assign(existing,{name,limit,closingDay,dueDay,active});
    } else {
      DB.cards.push({id:uid(),name,limit,closingDay,dueDay,active});
    }
    saveDB();closeModal();render();
  };
}
// period: qual fatura (identificada pela data de fechamento) está sendo paga — nunca assumimos
// "a atual" por padrão, para não perder/ignorar faturas anteriores ainda em aberto.
// Correção Etapa 6: o valor máximo permitido para um NOVO pagamento não é inv.remaining sozinho —
// isso ignora pagamentos futuros JÁ AGENDADOS (inv.scheduledFuture) e permitia, por exemplo, numa
// fatura de R$500 já com R$100 pago e R$200 agendado, agendar mais R$300 (300<=remaining=400),
// totalizando R$600 de compromissos sobre uma fatura de R$500. O teto correto é sempre
// remaining - scheduledFuture: o que ainda não está nem pago nem comprometido por nenhum
// agendamento existente.
function invoicePayableMax(inv){ return Math.max(0,inv.remaining-inv.scheduledFuture); }
function payInvoiceForm(card,period){

  <div class="field"><label for="piAcc">Conta de pagamento</label><select id="piAcc">${accOpts}</select></div>
  <div class="field"><label for="piVal">Valor (pagamento parcial permitido)</label><input id="piVal" type="number" step="0.01" max="${payableMax}" value="${payableMax}"></div>

// ================== V1.2.3 — ORÇAMENTO AVANÇADO ==================
// Orçamentos são um cadastro do usuário em DB.budgets ([{id,categoryId,amount,period}]) — nenhuma
// segunda estrutura de orçamento nem segundo registro de despesas. O que muda é só o CÁLCULO do que já foi gasto e a
// forma de exibir isso, centralizados aqui para que a tela de Orçamento, o resumo do Dashboard e as
// notificações de orçamento nunca apliquem regras diferentes entre si.

// Estado do mês selecionado na tela de Orçamento — não persistido, mesmo padrão de repPeriod/
// cashFlowDays (estado de navegação de tela, não um dado do usuário).
let orcFrom=todayISO().slice(0,7), orcTo=todayISO().slice(0,7);
// Período (mês inicial e final) selecionado no Dashboard. Não persistido, mesmo padrão de orcMonth.
let dashFrom=todayISO().slice(0,7), dashTo=todayISO().slice(0,7);
// Filtro De/até por mês reutilizável (Lançamentos, Relatórios, Evolução). p = prefixo dos ids.
function ymEndISO(ym){ return ym+'-'+String(new Date(Number(ym.slice(0,4)),Number(ym.slice(5,7)),0).getDate()).padStart(2,'0'); }
// ===== Período por DIAS (Lançamentos e Relatórios) =====
// Evolui o filtro de período existente para 3 tipos: 'month' (comportamento atual, De/até por mês), 'day' e 'range'.
// Datas são strings 'yyyy-mm-dd' (a mesma representação de t.date em todo o app) comparadas por string; nunca
// new Date('yyyy-mm-dd')/toISOString() (UTC). Só leitura/derivação: nada aqui grava em DB, localStorage ou rede.
function isValidISODate(s){
  if(typeof s!=='string'||!/^\d{4}-\d{2}-\d{2}$/.test(s)) return false;
  const y=Number(s.slice(0,4)), m=Number(s.slice(5,7)), d=Number(s.slice(8,10));
  const dt=new Date(y,m-1,d);   // componentes locais: rejeita 2026-02-30 etc.
  return dt.getFullYear()===y&&dt.getMonth()===m-1&&dt.getDate()===d;
}
// spec: {type:'month',from,to} | {type:'day',date} | {type:'range',start,end}. Retorna {ok,start,end,msg,level}.
// ok=false => o filtro NÃO deve ser executado (msg explica). open=true (legado de Lançamentos > Personalizado): um intervalo
// com só uma das datas continua valendo "em aberto" daquele lado, apenas com aviso (ok=true, level='warn').
function periodBounds(spec,open){
  const t=spec&&spec.type;
  if(t==='day'){
    if(!isValidISODate(spec.date)) return {ok:false,start:'',end:'',msg:'Informe uma data válida para filtrar por dia.',level:'error'};
    return {ok:true,start:spec.date,end:spec.date,msg:'',level:''};
  }
  if(t==='range'){
    const s=isValidISODate(spec.start)?spec.start:'', e=isValidISODate(spec.end)?spec.end:'';
    if(s&&e&&s>e) return {ok:false,start:s,end:e,msg:'Data inicial não pode ser maior que a data final.',level:'error'};
    if(s&&e) return {ok:true,start:s,end:e,msg:'',level:''};
    const msg=!s&&!e?'Informe a data inicial e a data final.':(!s?'Informe a data inicial.':'Informe a data final.');
    return open?{ok:true,start:s,end:e,msg:msg,level:'warn'}:{ok:false,start:s,end:e,msg:msg,level:'error'};
  }
  return {ok:true,start:spec.from+'-01',end:ymEndISO(spec.to),msg:'',level:''};
}
function periodMsgHTML(b,id){
  return (b&&b.msg)?`<div class="${b.level==='error'?'form-error':'muted'}" id="${id}" role="alert" style="${b.level==='error'?'':'font-size:13px;margin:2px 0 10px'}">${escapeHTML(b.msg)}</div>`:'';
}
function brDateFull(iso){ return String(iso).split('-').reverse().join('/'); }
function pbLabel(ym){ try{ const [y,m]=String(ym).split('-').map(Number); if(!y||!m) return ''; return new Date(y,m-1,1).toLocaleDateString('pt-BR',{month:'long',year:'numeric'}); }catch(e){ return String(ym||''); } }
function monthRangeHTML(p,from,to){
  const isDefault=(from===to && from===todayISO().slice(0,7));
  return `<div class="period-bar" role="group" aria-label="Período">
    <button class="ghost" id="${p}Prev" aria-label="Voltar um mês">‹</button>
    <label for="${p}FromInp">De</label>
    <span class="pb-in"><span class="pb-txt">${pbLabel(from)}</span><input type="month" id="${p}FromInp" value="${from}"></span>
    <label for="${p}ToInp">até</label>
    <span class="pb-in"><span class="pb-txt">${pbLabel(to)}</span><input type="month" id="${p}ToInp" value="${to}"></span>
    <button class="ghost" id="${p}Next" aria-label="Avançar um mês">›</button>
    ${isDefault?'':`<button class="ghost period-today" id="${p}Today">Hoje</button>`}
  </div>`;
}
// Lista de meses [from..to] (inclusive) do filtro De/até — mesma regra do Dashboard: se vier
// invertido, troca; limita a 60 meses.
function monthRangeList(from,to){
  if(from>to){ const t=from; from=to; to=t; }
  const months=[]; for(let m=from; m<=to && months.length<60; m=shiftYearMonth(m,1)) months.push(m);
  return months;
}
// Rótulo do período: um mês -> "Setembro de 2026"; vários -> "jan/2026 a mar/2026" (igual ao Dashboard).
function monthRangeLabel(from,to){
  const months=monthRangeList(from,to);
  const f=months[0], t=months[months.length-1];
  if(f===t) return budgetMonthLabel(f);
  const sh=m=>BUDGET_MONTH_NAMES[Number(m.slice(5,7))-1].slice(0,3).toLowerCase()+'/'+m.slice(0,4);
  return sh(f)+' a '+sh(t);
}
// get() -> [from,to]; set(from,to). Campos mantêm início <= fim; « » deslocam o período todo.
function bindMonthRange(p,get,set){
  const $=id=>document.getElementById(p+id), ok=v=>/^\d{4}-\d{2}$/.test(v);
  if($('Prev')) $('Prev').onclick=()=>{ const [f,t]=get(); set(shiftYearMonth(f,-1),shiftYearMonth(t,-1)); render(); };
  if($('Next')) $('Next').onclick=()=>{ const [f,t]=get(); set(shiftYearMonth(f,1),shiftYearMonth(t,1)); render(); };
  if($('FromInp')) $('FromInp').onchange=e=>{ if(ok(e.target.value)){ const [,t]=get(); set(e.target.value,e.target.value>t?e.target.value:t); } render(); };
  if($('ToInp')) $('ToInp').onchange=e=>{ if(ok(e.target.value)){ const [f]=get(); set(e.target.value<f?e.target.value:f,e.target.value); } render(); };
  if($('Today')) $('Today').onclick=()=>{ const cur=todayISO().slice(0,7); set(cur,cur); render(); };
}
let repFrom=todayISO().slice(0,7), repTo=todayISO().slice(0,7);
// Relatórios — tipo de período: 'month' (padrão, De/até por mês como antes) | 'day' | 'range'. Não persistido (igual a repFrom/repTo).
let repMode='month', repDay='', repStart='', repEnd='';
function repPeriodInfo(){
  if(repMode==='day'){ const b=periodBounds({type:'day',date:repDay}); return Object.assign({},b,{label:b.ok?brDateFull(b.start):''}); }
  if(repMode==='range'){ const b=periodBounds({type:'range',start:repStart,end:repEnd}); return Object.assign({},b,{label:b.ok?(b.start===b.end?brDateFull(b.start):brDateFull(b.start)+' a '+brDateFull(b.end)):''}); }
  const b=periodBounds({type:'month',from:repFrom,to:repTo}); return Object.assign({},b,{label:monthRangeLabel(repFrom,repTo)});
}
let evoFrom=shiftYearMonth(todayISO().slice(0,7),-5), evoTo=todayISO().slice(0,7);
// Soma/subtrai meses a uma string "yyyy-mm", em componentes numéricos (nunca Date+toISOString()),
// cobrindo corretamente a virada de ano (dezembro -> janeiro do ano seguinte e vice-versa) — mesma
// técnica de addMonthsISO(), já existente, só que sem exigir um dia do mês.
function shiftYearMonth(ym,delta){
  const [y,m]=ym.split('-').map(Number);
  const total=(m-1)+delta;
  const ny=y+Math.floor(total/12);
  const nm=((total%12)+12)%12;
  return ny+'-'+String(nm+1).padStart(2,'0');
}
const BUDGET_MONTH_NAMES=['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
function budgetMonthLabel(ym){ const [y,m]=ym.split('-').map(Number); return BUDGET_MONTH_NAMES[m-1]+' de '+y; }

// Gasto "realizado" para fins de orçamento: MESMA regra já usada em Relatórios (isExpenseLike) —
// despesa comum e compra no cartão (na data da própria compra) contam; pagamento de fatura,
// transferência e receita nunca entram (pagamento de fatura já quita uma compra contada acima —
// contá-lo de novo dobraria o gasto). Só lançamentos com data <= hoje, igual a realizedMonthTx()/
// accBalance() — despesa futura nunca entra no realizado do mês. Parcelas/recorrências são
// lançamentos individuais com sua própria data, então já respeitam essa mesma regra naturalmente.
function budgetSpentByCategory(ym){
  const totals={};
  realizedMonthTx(ym).filter(isExpenseLike).forEach(t=>{
    totals[t.categoryId]=(totals[t.categoryId]||0)+Number(t.amount);
  });
  return totals;
}

// Classificação central de status (a MESMA usada pela tela de Orçamento, pelo resumo do Dashboard
// e pelo cálculo-base das notificações) — nenhuma outra régua de "atenção"/"excedido" em paralelo.
function budgetStatusFor(pct){
  if(pct>=100) return 'excedido';
  if(pct>=90) return 'proximo';
  if(pct>=80) return 'atencao';
  return 'normal';
}
const BUDGET_STATUS_LABEL={normal:'Normal',atencao:'Atenção',proximo:'Próximo do limite',excedido:'Excedido'};
const BUDGET_STATUS_CLASS={normal:'tag-accent',atencao:'tag-yellow',proximo:'tag-yellow',excedido:'tag-red'};

// Função central única: para um mês (ym), devolve o status de cada categoria com limite definido
// em DB.budgets (budget/spent/remaining/percentage/status) mais um resumo agregado. Reutilizada
// por viewOrcamento(), pelo resumo de orçamento do Dashboard e por getNotifications() — evita
// duplicar a regra de cálculo em três lugares diferentes, como pedido nesta etapa.
// Limites inválidos/corrompidos (não numéricos, zero ou negativos) são ignorados aqui, sem lançar
// erro e sem inventar um valor no lugar — nenhuma categoria com esses dados aparece na lista.
// Lista de orçamentos válidos do usuário (DB.budgets). Única porta de entrada para os cálculos.
function activeBudgets(){ return (Array.isArray(DB.budgets)?DB.budgets:[]).filter(b=>b&&Number(b.amount)>0); }
function getBudgetStatuses(ym){
  const spentByCat=budgetSpentByCategory(ym);
  const rows=activeBudgets()
    .map(b=>{
      const cid=b.categoryId;
      const budget=Number(b.amount);
      const spent=spentByCat[cid]||0;
      const remaining=budget-spent;
      const percentage=budget>0?(spent/budget*100):0;
      return {id:b.id,period:b.period,categoryId:cid,category:catById(cid)||null,budget,spent,remaining,percentage,status:budgetStatusFor(percentage)};
    });
  const totalBudget=rows.reduce((s,r)=>s+r.budget,0);
  const totalSpent=rows.reduce((s,r)=>s+r.spent,0);
  const totalRemaining=totalBudget-totalSpent;
  const totalPercentage=totalBudget>0?(totalSpent/totalBudget*100):0;
  return {ym,rows,totalBudget,totalSpent,totalRemaining,totalPercentage};
}

// Orçamento de um período [from..to]: gasto realizado = soma dos meses (mesma regra de
// budgetSpentByCategory); limite = limite mensal × quantidade de meses. Para um único mês devolve
// exatamente o mesmo resultado de getBudgetStatuses(ym). Não altera getBudgetStatuses.
function getBudgetStatusesRange(from,to){
  const months=monthRangeList(from,to);
  if(months.length===1) return getBudgetStatuses(months[0]);
  const spentByCat={};
  months.forEach(m=>{ const t=budgetSpentByCategory(m); Object.keys(t).forEach(cid=>{ spentByCat[cid]=(spentByCat[cid]||0)+t[cid]; }); });
  const n=months.length;
  const rows=activeBudgets()
    .map(b=>{
      const cid=b.categoryId;
      const budget=Number(b.amount)*n;
      const spent=spentByCat[cid]||0;
      const remaining=budget-spent;
      const percentage=budget>0?(spent/budget*100):0;
      return {id:b.id,period:b.period,categoryId:cid,category:catById(cid)||null,budget,spent,remaining,percentage,status:budgetStatusFor(percentage)};
    });
  const totalBudget=rows.reduce((s2,r)=>s2+r.budget,0);
  const totalSpent=rows.reduce((s2,r)=>s2+r.spent,0);
  const totalRemaining=totalBudget-totalSpent;
  const totalPercentage=totalBudget>0?(totalSpent/totalBudget*100):0;
  return {ym:months[0],from:months[0],to:months[n-1],months:n,rows,totalBudget,totalSpent,totalRemaining,totalPercentage};
}

// ---- Detalhe (somente leitura) de um orçamento: lançamentos que compõem o "Utilizado" ----

function budgetTxList(r,from,to){

// ================== FIM ORÇAMENTO AVANÇADO ==================

// ================== V2.0.1 — FECHAMENTO MENSAL ==================
// Registro puramente administrativo/histórico: fechar um mês NUNCA cria, altera ou apaga
// transações, contas, cartões, faturas, limites, metas ou orçamentos. É apenas uma marcação de
// que o mês foi revisado, guardada em DB.monthClosures. Os valores mostrados no resumo do
// fechamento são sempre recalculados a partir dos dados reais (mesma filosofia de
// getNotifications(): nada aqui é a "fonte da verdade" financeira — é só leitura/derivação de
// funções já existentes).

// Sanitiza um único registro de DB.monthClosures. Um registro sem "month" em formato válido não
// tem como ser normalizado com um default seguro (ao contrário de goals/cards, não existe um
// "fechamento vazio" razoável), então é descartado — nunca lança erro, nunca inventa um mês.
function normalizeMonthClosureItem(mc){
  if(!mc||typeof mc!=='object'||Array.isArray(mc)) return null;
  if(typeof mc.month!=='string'||!MONTH_RE.test(mc.month)) return null;
  const closedAt=(typeof mc.closedAt==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(mc.closedAt)&&!isNaN(parseISOLocal(mc.closedAt).getTime()))
    ?mc.closedAt:todayISO();
  const note=(typeof mc.note==='string')?mc.note:'';
  const id=(typeof mc.id==='string'&&mc.id)?mc.id:uid();
  const out={id,month:mc.month,closedAt,note};
  if(typeof mc.closedAtTs==='number'&&isFinite(mc.closedAtTs)) out.closedAtTs=mc.closedAtTs;
  return out;
}
// Garante DB.monthClosures como array de fechamentos válidos, nunca mais de um por mês (mantém o
// primeiro registro válido encontrado para cada mês e descarta duplicatas silenciosamente, sem
// quebrar a normalização). Instalações/backups antigos sem "monthClosures", ou com esse campo
// corrompido (não-array, itens que não são objetos, mês inválido), continuam funcionando
// normalmente — nunca quebram a tela de Fechamento mensal nem o restante do sistema.
function normalizeMonthClosures(db){
  if(!Array.isArray(db.monthClosures)) db.monthClosures=[];
  const seen=new Set(); const result=[];
  db.monthClosures.forEach(raw=>{
    const item=normalizeMonthClosureItem(raw);
    if(!item||seen.has(item.month)) return;
    seen.add(item.month); result.push(item);
  });
  db.monthClosures=result;
}

// ---- Funções centrais (pequenas e reutilizáveis) ----
function getMonthClosure(month){ return (DB.monthClosures||[]).find(x=>x.month===month)||null; }
function isMonthClosed(month){ return !!getMonthClosure(month); }
// Cria o registro de fechamento se o mês ainda não estiver fechado. Se já estiver fechado, nunca
// cria um segundo registro — devolve o existente sem alterá-lo (idempotente), exatamente como
// pedido: "nunca deve existir mais de um fechamento para o mesmo mês".
function closeMonth(month,note){
  if(typeof month!=='string'||!MONTH_RE.test(month)) return null;
  const existing=getMonthClosure(month);
  if(existing) return existing;
  const record={id:uid(),month,closedAt:todayISO(),closedAtTs:Date.now(),note:(typeof note==='string'?note.trim():'')};
  DB.monthClosures.push(record);
  saveDB();
  return record;
}
// Remove o registro de fechamento do mês, se existir. Reabrir um mês já aberto é uma operação
// segura e idempotente (não faz nada, não lança erro). Nunca toca em DB.transactions/accounts/
// cards/budgets/goals.
function reopenMonth(month){
  const before=DB.monthClosures.length;
  DB.monthClosures=DB.monthClosures.filter(x=>x.month!==month);
  if(DB.monthClosures.length!==before) saveDB();
  return true;
}
// O fechamento NÃO congela o mês: um lançamento datado dentro de um mês já fechado continua
// permitido normalmente (nenhuma trava é adicionada em bindTxFormEvents/etc.). Este helper apenas
// detecta, de forma simples (sem sistema de auditoria), se existe algum lançamento no mês com data
// posterior à data em que o fechamento foi registrado — para a interface poder avisar que os dados
// atuais podem ter mudado desde o fechamento.
function monthClosureHasChangesAfterClosing(closure){
  if(!closure) return false;
  // Correção 3B (bug #8): "alteração posterior" = lançamento do mês criado/editado DEPOIS do fechamento
  // (t.modifiedAt > instante do fechamento), e não mais simplesmente data > closedAt. Lançamentos sem
  // modifiedAt (dados antigos) não geram aviso. Fechamentos antigos sem closedAtTs usam o fim do dia closedAt.
  const closeTs=(typeof closure.closedAtTs==='number')?closure.closedAtTs:(parseISOLocal(closure.closedAt).getTime()+86400000);
  return monthTx(closure.month).some(t=>typeof t.modifiedAt==='number' && t.modifiedAt>closeTs);
}

// Resumo central do mês para a tela de Fechamento — reaproveita exclusivamente funções já
// existentes (monthIn, realizedMonthTx, isExpenseLike, getBudgetStatuses), sem replicar nenhuma
// regra financeira nova:
// - "Total de despesas" segue a MESMA regra já usada em Relatórios via isExpenseLike() (despesa
//   comum + compra no cartão na data da compra); pagamento de fatura nunca conta como despesa de
//   novo (evita dupla contagem), igual ao resto do sistema.
// - "Gastos no cartão" e "Pagamentos de fatura" são mostrados separadamente, só para informação —
//   nenhum dos dois é somado uma segunda vez ao resultado do mês.
// - Transferências nunca entram no resultado do mês (mesma regra de sempre: só contam type
//   'receita'/'despesa'/'cartao'/'pagamento_fatura' conforme cada total específico).
// - Orçamento vem inteiramente de getBudgetStatuses(ym), a mesma função central já usada pela tela
//   de Orçamento, pelo resumo do Dashboard e pelas notificações — nenhum segundo cálculo aqui.
function getMonthClosingSummary(ym){
  const realized=realizedMonthTx(ym);
  const totalReceitas=monthIn(ym);
  const despesasList=realized.filter(isExpenseLike);
  const totalDespesas=despesasList.reduce((s,t)=>s+Number(t.amount),0);
  const cartaoList=realized.filter(t=>t.type==='cartao');
  const totalCartao=cartaoList.reduce((s,t)=>s+Number(t.amount),0);
  const faturaPagList=realized.filter(t=>t.type==='pagamento_fatura');
  const totalFaturaPaga=faturaPagList.reduce((s,t)=>s+Number(t.amount),0);
  const receitasList=realized.filter(t=>t.type==='receita');
  const budgetData=getBudgetStatuses(ym);
  return {
    month:ym,
    totalReceitas,
    totalDespesas,
    resultado:totalReceitas-totalDespesas,
    totalCartao,
    totalFaturaPaga,
    totalOrcado:budgetData.totalBudget,
    totalUtilizadoOrcamento:budgetData.totalSpent,
    percentualOrcamentoUtilizado:budgetData.totalPercentage,
    categoriasExcedidas:budgetData.rows.filter(r=>r.status==='excedido'),
    hasOrcamento:budgetData.rows.length>0,
    qtdLancamentos:realized.length,
    qtdDespesas:despesasList.length,
    qtdReceitas:receitasList.length
  };
}

// Resumo de um período [from..to]: soma dos resumos mensais (mesmas regras de
// getMonthClosingSummary); orçamento via getBudgetStatusesRange. Um único mês devolve exatamente
// getMonthClosingSummary(ym).
function getRangeClosingSummary(from,to){
  const months=monthRangeList(from,to);
  if(months.length===1) return getMonthClosingSummary(months[0]);
  const parts=months.map(getMonthClosingSummary);
  const sum=k=>parts.reduce((s2,x)=>s2+x[k],0);
  const totalReceitas=sum('totalReceitas'), totalDespesas=sum('totalDespesas');
  const b=getBudgetStatusesRange(from,to);
  return {
    month:months[0], from:months[0], to:months[months.length-1],
    totalReceitas, totalDespesas, resultado:totalReceitas-totalDespesas,
    totalCartao:sum('totalCartao'), totalFaturaPaga:sum('totalFaturaPaga'),
    totalOrcado:b.totalBudget, totalUtilizadoOrcamento:b.totalSpent, percentualOrcamentoUtilizado:b.totalPercentage,
    categoriasExcedidas:b.rows.filter(r=>r.status==='excedido'), hasOrcamento:b.rows.length>0,
    qtdLancamentos:sum('qtdLancamentos'), qtdDespesas:sum('qtdDespesas'), qtdReceitas:sum('qtdReceitas')
  };
}
// Gasto por categoria somado no período (mesma regra de budgetSpentByCategory).
function getRangeCategoryTotals(from,to){
  const tot={};
  monthRangeList(from,to).forEach(m=>{ const t=budgetSpentByCategory(m); Object.keys(t).forEach(cid=>{ tot[cid]=(tot[cid]||0)+t[cid]; }); });
  return tot;
}

// ================== V2.0.2 — COMPARAÇÃO HISTÓRICA ==================
// Compara dois meses lado a lado. É inteiramente derivada: nenhum dado novo é persistido, não há
// DB.comparisons nem segunda estrutura de relatório/transação. Os indicadores principais e o
// orçamento reaproveitam integralmente getMonthClosingSummary() (mesma função já usada pela tela
// de Fechamento mensal), que por sua vez já reaproveita isExpenseLike/realizedMonthTx/
// getBudgetStatuses() — nenhuma regra financeira é duplicada aqui. A única coisa nova é a
// comparação por categoria, que reaproveita budgetSpentByCategory() (mesma função central já usada
// pelo Orçamento). O fechamento mensal (DB.monthClosures) nunca é consultado como fonte de valores:
// a comparação funciona igual para mês aberto ou fechado.

// Estado do mês selecionado — mesmo padrão de orcMonth/fechMonth/repPeriod: navegação de tela,
// nunca persistido no localStorage. Padrão inicial pedido: Mês A = mês anterior, Mês B = mês atual.
let compFromA=shiftYearMonth(todayISO().slice(0,7),-1), compToA=compFromA;
let compFromB=todayISO().slice(0,7), compToB=compFromB;

// Resumo histórico de um mês: receitas, despesas, resultado, cartão, pagamento de fatura e
// orçamento — literalmente o mesmo resumo da tela de Fechamento mensal, sem segunda lógica.
// Funciona igual para o mês atual (respeitando realizado x futuro) e para meses passados.
function getHistoricalMonthSummary(ym){
  return getMonthClosingSummary(ym);
}

// Totais por categoria (despesas realizadas do mês: despesa comum + compra no cartão pela data da
// compra; pagamento de fatura e transferência nunca entram) — mesma função já usada pelo Orçamento,
// sem replicar a regra de categoria.
function getHistoricalCategoryTotals(ym){
  return budgetSpentByCategory(ym);
}

// Compara dois valores numéricos: diferença absoluta (Mês B - Mês A) e variação percentual
// ((Mês B - Mês A) / Mês A * 100). Quando o valor-base (a) é zero, a percentagem não é
// matematicamente válida — devolve null (a tela exibe "—") em vez de Infinity/NaN.
function compareValues(a,b){
  a=Number(a||0); b=Number(b||0);
  const diff=b-a;
  const pct=a!==0?(diff/Math.abs(a)*100):null;
  return {a,b,diff,pct};
}

// Monta a comparação completa entre dois meses (YYYY-MM). Não cria, altera nem persiste nenhum
// lançamento/estrutura — tudo é calculado em tempo real a partir de DB.transactions/DB.budgets/
// DB.categories através das funções já existentes.
function compareMonthRange(ymA,ymB){
  return comparePeriods({from:ymA,to:ymA},{from:ymB,to:ymB});
}
// Comparação entre dois períodos {from,to} (meses YYYY-MM, De/até). Com um mês em cada lado é
// idêntica à comparação mês a mês original.
function comparePeriods(pA,pB){
  const ymA=pA.from, ymB=pB.from;
  const summaryA=getRangeClosingSummary(pA.from,pA.to);
  const summaryB=getRangeClosingSummary(pB.from,pB.to);
  const indicators={
    receitas:compareValues(summaryA.totalReceitas,summaryB.totalReceitas),
    despesas:compareValues(summaryA.totalDespesas,summaryB.totalDespesas),
    resultado:compareValues(summaryA.resultado,summaryB.resultado),
    cartao:compareValues(summaryA.totalCartao,summaryB.totalCartao),
    faturaPaga:compareValues(summaryA.totalFaturaPaga,summaryB.totalFaturaPaga)
  };
  const catA=getRangeCategoryTotals(pA.from,pA.to);
  const catB=getRangeCategoryTotals(pB.from,pB.to);
  const catIds=new Set([...Object.keys(catA),...Object.keys(catB)]);
  const categories=[...catIds].map(cid=>{
    const cmp=compareValues(catA[cid]||0,catB[cid]||0);
    return {categoryId:cid,category:catById(cid)||null,...cmp};
  }).sort((x,y)=>Math.max(y.a,y.b)-Math.max(x.a,x.b));
  return {monthA:ymA,monthB:ymB,labelA:monthRangeLabel(pA.from,pA.to),labelB:monthRangeLabel(pB.from,pB.to),summaryA,summaryB,indicators,categories};
}

// Lê o estado atual de navegação (compMonthA/compMonthB) e devolve a comparação — usada pela tela.
function getHistoricalComparison(){
  return comparePeriods({from:compFromA,to:compToA},{from:compFromB,to:compToB});
}

// ---- Apresentação (somente números — nenhuma nota, ranking ou julgamento automático) ----
function historicalPctLabel(pct){
  if(pct==null) return '—';
  return (pct>=0?'+':'')+pct.toFixed(2).replace('.',',')+'%';
}
function historicalDiffLabel(diff){
  return (diff>0?'+':'')+fmt(diff);
}
function historicalDeltaHTML(cmp,flagNeg){
  if(Math.abs(cmp.diff)<0.005) return '<span class="cp-d cp-0">—</span>';
  const up=cmp.diff>0;
  const pct=cmp.pct==null?'':`<span class="cp-dp">${historicalPctLabel(cmp.pct)}</span>`;
  return `<span class="cp-d ${up?'cp-up':'cp-dn'}${(flagNeg&&!up)?' cp-bad':''}"><span class="cp-dv"><b aria-hidden="true">${up?'▲':'▼'}</b>${escapeHTML(historicalDiffLabel(cmp.diff))}</span>${pct}</span>`;
}
function historicalIndicatorRowHTML(label,cmp,labelA,labelB,key,flagNeg,kind){
  const ck=(side)=>kind?` data-cpkind="${kind}" data-cpside="${side}" role="button" tabindex="0" aria-label="Ver lançamentos: ${escapeHTML(label)} — ${escapeHTML(side==='A'?labelA:labelB)}"`:'';
  const negRow=flagNeg&&(cmp.b<0);
  return `<div class="cp-r cp-grid${key?' cp-key':''}${negRow?' cp-negrow':''}">
    <span class="cp-l">${escapeHTML(label)}</span>
    <span class="cp-a${kind?' cp-ck':''}${flagNeg&&cmp.a<0?' cp-nv':''}"${ck('A')} data-l="${escapeHTML(labelA)}">${fmt(cmp.a)}</span>
    <span class="cp-b${kind?' cp-ck':''}${flagNeg&&cmp.b<0?' cp-nv':''}"${ck('B')} data-l="${escapeHTML(labelB)}">${fmt(cmp.b)}</span>
    <span class="cp-dd">${historicalDeltaHTML(cmp,flagNeg)}</span></div>`;
}
function historicalBudgetCardHTML(summary,label,side){
  if(!summary.hasOrcamento){
    return `<div class="card cp-bud"><h3>${escapeHTML(label)}</h3><p class="muted" style="margin:0">Nenhum orçamento definido.</p></div>`;
  }
  const pct=Number(summary.percentualOrcamentoUtilizado||0);
  const exc=summary.categoriasExcedidas.length;
  const rest=Number(summary.totalOrcado||0)-Number(summary.totalUtilizadoOrcamento||0);
  const st=budgetStatusFor(pct);
  const col=st==='excedido'?'var(--red)':(st==='proximo'||st==='atencao'?'var(--yellow)':'var(--accent)');
  return `<div class="card cp-bud cp-click" role="button" tabindex="0" data-cpbud="${side}" aria-label="Ver orçamento por categoria — ${escapeHTML(label)}">
    <div class="cp-bh"><h3>${escapeHTML(label)}</h3><span class="rp-chev" aria-hidden="true">›</span></div>

// ================== V2.0.3 — EVOLUÇÃO FINANCEIRA ==================
// Série histórica mês a mês, 100% derivada: nenhum dado novo é persistido (não há DB.evolution/
// DB.history) e nenhuma lógica financeira é duplicada. Cada mês vem de getHistoricalMonthSummary()
// (= getMonthClosingSummary(), que já usa isExpenseLike/realizedMonthTx/getBudgetStatuses) e as
// categorias vêm de getHistoricalCategoryTotals() (= budgetSpentByCategory()). Variações reusam
// compareValues() da Comparação histórica. DB.monthClosures nunca é fonte de valores.

const EVOLUTION_PERIODS=[3,6,12];
// Estado de navegação (não persistido, mesmo padrão de compMonthA/orcMonth): padrão 6 meses.
let evoPeriod=6;

// Lista cronológica (do mais antigo ao mais recente) de n meses "YYYY-MM" terminando em endYm
// (padrão: mês atual local). Usa shiftYearMonth() — aritmética numérica, sem Date/toISOString().
function getEvolutionMonths(n,endYm){
  const end=endYm||todayISO().slice(0,7);
  const count=EVOLUTION_PERIODS.includes(n)?n:6;
  const months=[];
  for(let i=count-1;i>=0;i--) months.push(shiftYearMonth(end,-i));
  return months;
}
function evolutionMonthLabel(ym){
  const [y,m]=ym.split('-').map(Number);
  return BUDGET_MONTH_NAMES[m-1].slice(0,3)+'/'+y;
}
// Variação em relação ao mês anterior (valorAtual - valorAnterior; % = diff/anterior*100, null
// quando o anterior é zero) — a mesma regra de compareValues(); sem julgamento.
function evolutionVariation(prev,cur){ return compareValues(prev,cur); }

function getEvolutionData(months){
  const rows=months.map(ym=>({ym,summary:getHistoricalMonthSummary(ym)}));
  const keys={receitas:'totalReceitas',despesas:'totalDespesas',resultado:'resultado',cartao:'totalCartao',faturaPaga:'totalFaturaPaga'};
  rows.forEach((r,i)=>{
    r.variation=null;
    if(i>0){
      r.variation={};
      Object.keys(keys).forEach(k=>{ r.variation[k]=evolutionVariation(rows[i-1].summary[keys[k]],r.summary[keys[k]]); });
    }
  });
  return {months,rows};
}
// Categorias x meses (somente despesas realizadas; regra herdada de budgetSpentByCategory).
function getEvolutionCategoryData(months){
  const perMonth=months.map(ym=>getHistoricalCategoryTotals(ym));
  const ids=new Set(); perMonth.forEach(t=>Object.keys(t).forEach(id=>ids.add(id)));
  const rows=[...ids].map(cid=>{
    const values=perMonth.map(t=>t[cid]||0);
    return {categoryId:cid,category:catById(cid)||null,values,total:values.reduce((a,b)=>a+b,0)};
  }).sort((a,b)=>b.total-a.total);
  return {months,rows};
}

function evolutionChartSVG(rows){
  const kfmt=v=>{ const a=Math.abs(v); const t=a>=1000?(a/1000).toFixed(a>=10000?0:1).replace('.0','').replace('.',',')+'k':String(Math.round(a)); return (v<0?'-':'')+t; };
  const vals=[]; rows.forEach(r=>vals.push(r.summary.totalReceitas,r.summary.totalDespesas,r.summary.resultado));
  const rawMax=Math.max(0,...vals), rawMin=Math.min(0,...vals);
  const allZero=!vals.some(v=>Math.abs(v)>=0.005);
  // escala "bonita": passo arredondado, com folga para os rótulos
  const rough=((rawMax-rawMin)||1)*1.18/4;
  const mag=Math.pow(10,Math.floor(Math.log10(rough)));
  const step=[1,2,2.5,5,10].map(m=>m*mag).find(x=>x>=rough)||mag*10;
  const top=Math.ceil(rawMax*1.12/step)*step||step, bot=rawMin<0?Math.floor(rawMin*1.12/step)*step:0;
  const span=(top-bot)||1;
  const Y=v=>((top-v)/span*100);
  const ticks=[]; for(let v=bot;v<=top+1e-9;v+=step) ticks.push(v);
  const grid=ticks.map(v=>`<i class="${Math.abs(v)<1e-9?'zero':''}" style="top:${Y(v).toFixed(2)}%"></i>`).join('');
  const axis=ticks.map(v=>`<span style="top:${Y(v).toFixed(2)}%">${v===0?'0':kfmt(v)}</span>`).join('');
  const series=[['totalReceitas','r','Receitas','receitas'],['totalDespesas','d','Despesas','despesas'],['resultado','s','Resultado',null]];
  const cols=rows.map(r=>{
    const bars=series.map(([k,cls,name,kind])=>{
      const v=r.summary[k], zero=Math.abs(v)<0.005;
      const tip=escapeHTML(evolutionMonthLabel(r.ym)+' · '+name+': '+fmt(v));
      let inner='';
      if(!zero){
        const h=Math.max(Math.abs(v)/span*100,0.6);
        if(v>0) inner=`<u style="top:${Y(v).toFixed(2)}%;height:${h.toFixed(2)}%"></u><em style="bottom:calc(${(100-Y(v)).toFixed(2)}% + 3px)">${kfmt(v)}</em>`;
        else inner=`<u class="neg" style="top:${Y(0).toFixed(2)}%;height:${h.toFixed(2)}%"></u><em style="top:calc(${(Y(0)+h).toFixed(2)}% + 3px)">${kfmt(v)}</em>`;
      }
      const clk=(kind&&!zero)?` clk" data-evo="tx" data-ym="${r.ym}" data-kind="${kind}`:'';
      return `<button type="button" class="evc-b ${cls}${clk}" title="${tip}" aria-label="${tip}"${(kind&&!zero)?'':' tabindex="-1"'}>${inner}</button>`;
    }).join('');
    return `<div class="evc-col"><div class="evc-plot">${bars}</div><div class="evc-m">${escapeHTML(evolutionMonthLabel(r.ym))}</div></div>`;
  }).join('');
  const sum=k=>rows.reduce((a,r)=>a+Number(r.summary[k]||0),0);
  const res=sum('resultado');
  const kpi=(c,l,v,cls)=>`<div class="evc-kpi"><span><i style="background:${c}"></i>${l}</span><b class="${cls||''}">${fmt(v)}</b></div>`;
  const kpis=`<div class="evc-kpis">${kpi('var(--green)','Receitas',sum('totalReceitas'))}${kpi('var(--red)','Despesas',sum('totalDespesas'))}${kpi('var(--accent)','Resultado',res,res>0.005?'pos':(res<-0.005?'neg':''))}</div>`;
  return `${kpis}<div class="evc-scroll"><div class="evc ${rows.length>6?'nolbl':''}" role="img" aria-label="Gráfico de receitas, despesas e resultado por mês" style="min-width:${46+rows.length*44}px">
    <div class="evc-axis">${axis}</div>
    <div class="evc-main"><div class="evc-grid">${grid}</div>${cols}${allZero?'<div class="evc-empty">Sem movimentações realizadas no período</div>':''}</div>
  </div></div>`;
}
function evolutionVarCellHTML(value,cmp,goodUp,ym,kind){
  const zero=Math.abs(value)<0.005;
  let chip='';
  if(cmp && Math.abs(cmp.diff)>=0.005){
    const up=cmp.diff>0, good=(goodUp===null)?null:(up===goodUp);
    const cls=good===null?'':(good?'good':'bad');
    chip=`<span class="ev-d ${cls}"><b aria-hidden="true">${up?'▲':'▼'}</b>${escapeHTML(historicalDiffLabel(cmp.diff))}${cmp.pct==null?'':' · '+escapeHTML(historicalPctLabel(cmp.pct))}</span>`;
  }
  const clk=(ym&&kind&&!zero)?` class="clk" tabindex="0" role="button" data-evo="tx" data-ym="${ym}" data-kind="${kind}" aria-label="Ver lançamentos de ${escapeHTML(evolutionMonthLabel(ym))}"`:'';
  return `<td${clk}><div class="${zero?'z':''}">${fmt(value)}</div><div class="ev-s">${chip}</div></td>`;
}

function periodRange(p){
  const now=new Date(); let start,end;
  if(p==='mes'){start=new Date(now.getFullYear(),now.getMonth(),1);end=new Date(now.getFullYear(),now.getMonth()+1,0);}
  else if(p==='passado'){start=new Date(now.getFullYear(),now.getMonth()-1,1);end=new Date(now.getFullYear(),now.getMonth(),0);}
  else if(p==='3m'){start=new Date(now.getFullYear(),now.getMonth()-2,1);end=new Date(now.getFullYear(),now.getMonth()+1,0);}
  else if(p==='6m'){start=new Date(now.getFullYear(),now.getMonth()-5,1);end=new Date(now.getFullYear(),now.getMonth()+1,0);}
  else if(p==='ano'){start=new Date(now.getFullYear(),0,1);end=new Date(now.getFullYear(),11,31);}
  else if(p==='meses'){ const b=repPeriodInfo(); return b.ok?[b.start,b.end]:[repFrom+'-01',ymEndISO(repTo)]; }
  return [dateToISOLocal(start),dateToISOLocal(end)];
}
let repPeriod='mes';
// Etapa 5 — corrige a mistura de lançamentos realizados e futuros no mesmo total.
// Regra (igual à usada em accBalance/realizedMonthTx): realizado = data <= hoje; futuro = data > hoje.
// Compra no cartão (type 'cartao') conta como despesa (realizada ou futura, conforme a data da
// COMPRA — nunca a data de pagamento da fatura). pagamento_fatura NUNCA entra nos totais de
// despesa, pois representa apenas a saída de dinheiro que já quita uma compra já contabilizada
// acima — contá-lo também seria dupla contagem do mesmo gasto. Transferência também não entra
// (não é receita nem despesa).
function isExpenseLike(t){ return t.type==='despesa'||t.type==='cartao'; }
function repPeriodBarHTML(){
  const sel=`<select id="repMode" aria-label="Filtrar relatório por">${[['month','Mês inteiro'],['day','Dia específico'],['range','Intervalo']].map(([v,l])=>`<option value="${v}" ${repMode===v?'selected':''}>${l}</option>`).join('')}</select>`;
  if(repMode==='day') return sel+`<input type="date" id="repDayInp" value="${escapeHTML(repDay||'')}" aria-label="Dia do relatório">`;
  if(repMode==='range') return sel+`<span class="muted">De</span><input type="date" id="repStartInp" value="${escapeHTML(repStart||'')}" aria-label="Data inicial do relatório"><span class="muted">até</span><input type="date" id="repEndInp" value="${escapeHTML(repEnd||'')}" aria-label="Data final do relatório">`;
  return sel+monthRangeHTML('rep',repFrom,repTo);
}
function viewRelatorios(){
  const pInfo=repPeriodInfo();
  if(!pInfo.ok) return `<div class="topbar"><h1>Relatórios</h1>
    <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">${repPeriodBarHTML()}</div></div>${periodMsgHTML(pInfo,'repPeriodMsg')}`;
  const [s,e]=periodRange('meses');
  const today=todayISO();
  const listAll=DB.transactions.filter(t=>t.date>=s&&t.date<=e);
  const realized=listAll.filter(isSettled);
  const future=listAll.filter(t=>!isSettled(t));

  const inc=realized.filter(t=>t.type==='receita').reduce((a,t)=>a+Number(t.amount),0);
  const out=realized.filter(isExpenseLike).reduce((a,t)=>a+Number(t.amount),0);
  const futInc=future.filter(t=>t.type==='receita').reduce((a,t)=>a+Number(t.amount),0);
  const futOut=future.filter(t=>t.type==='despesa').reduce((a,t)=>a+Number(t.amount),0);
  const futCard=future.filter(t=>t.type==='cartao').reduce((a,t)=>a+Number(t.amount),0);

  // Compromissos futuros de cartão dentro do período: faturas cujo período de fatura (fechamento)
  // cai dentro do intervalo selecionado e ainda têm saldo em aberto — reaproveita getInvoiceForPeriod,
  // sem lógica financeira nova.
  const futCardCommitments=allInvoicePeriods()
    .filter(({period})=>period>=s&&period<=e&&period>today)
    .map(({card,period})=>getInvoiceForPeriod(card,period))
    .filter(inv=>inv.remaining>0);
  const futCardCommitmentsTotal=futCardCommitments.reduce((s2,inv)=>s2+inv.remaining,0);

  const catT={}; realized.filter(isExpenseLike).forEach(t=>catT[t.categoryId]=(catT[t.categoryId]||0)+Number(t.amount));
  const sorted=Object.entries(catT).sort((a,b)=>b[1]-a[1]);
  const bars=sorted.map(([cid,v])=>{const c=catById(cid);const max=sorted[0][1]||1;

      <div class="rp-cb"><div class="rp-cr"><span>${escapeHTML(c?c.name:missingCatLabel(cid))}</span><span>${fmt(v)}</span></div>
      <div class="rp-track"><div class="rp-fill" style="width:${(v/max*100).toFixed(0)}%"></div></div></div><span class="rp-chev" aria-hidden="true">›</span></button>`}).join('')||'<p class="muted">Sem despesas realizadas no período.</p>';
  const maiores=realized.filter(isExpenseLike).sort((a,b)=>b.amount-a.amount).slice(0,5)
    .map((t,i)=>{const c=catById(t.categoryId);
      return `<button type="button" class="rp-top" data-rptx="${escapeHTML(t.id)}" title="${escapeHTML(relTxTitle(t))}" aria-label="Ver detalhes: ${escapeHTML(t.desc)}"><span class="rp-rank">${i+1}</span>
      <div class="rp-tm"><div class="rp-td">${escapeHTML(t.desc)}</div><div class="rp-ts">${escapeHTML(c?c.icon+' '+c.name:missingCatLabel(t.categoryId))} · ${escapeHTML(relTxInfo(t).parcela||'À vista')}</div></div>
      <span class="neg rp-tv">${fmt(t.amount)}</span><span class="rp-chev" aria-hidden="true">›</span></button>`}).join('')||'<p class="muted">Sem despesas realizadas no período.</p>';
  const infoSvg='<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/></svg>';
  return `<div class="topbar"><h1>Relatórios</h1>
    <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">${repPeriodBarHTML()}</div></div>
  <div class="rp-note">${infoSvg}<div>Valores <strong>realizados</strong> consideram lançamentos efetivados (receitas “Recebi”, despesas “Paguei”; cartão e faturas pela data); valores <strong>futuros/pendentes</strong> são apenas previsão e não afetam o saldo atual.</div></div>
  <div class="rp-sec">Realizado no período</div>
  <div class="grid stat-grid">
    <div class="card stat rp-card fc-click rp-pos" data-repkind="r:receitas" role="button" tabindex="0" aria-label="Ver entradas realizadas"><div class="label">Entradas realizadas</div><div class="val pos">${fmt(inc)}</div></div>
    <div class="card stat rp-card fc-click rp-neg" data-repkind="r:despesas" role="button" tabindex="0" aria-label="Ver despesas realizadas"><div class="label">Despesas realizadas</div><div class="val neg">${fmt(out)}</div></div>
    <div class="card stat rp-card fc-click rp-res ${inc-out>=0?'rp-pos':'rp-neg'}" data-repkind="r:resultado" role="button" tabindex="0" aria-label="Ver lançamentos do resultado realizado"><div class="label">Resultado realizado</div><div class="val ${inc-out>=0?'pos':'neg'}">${fmt(inc-out)}</div></div>

    <div class="card stat rp-card fc-click rp-fut rp-neg" data-repkind="f:despesas" role="button" tabindex="0" aria-label="Ver despesas futuras"><div class="label">Despesas futuras</div><div class="val neg">${fmt(futOut)}</div></div>

    ${futCardCommitments.length?`<div class="card stat rp-card fc-click rp-fut rp-neg" data-repkind="f:faturas" role="button" tabindex="0" aria-label="Ver compromissos futuros de fatura"><div class="label">Compromissos futuros de fatura</div><div class="val neg">${fmt(futCardCommitmentsTotal)}</div></div>`:''}

  </div>`;
