// Alinha o DB em memória à sessão atual. Chamada a cada mudança de sessão (login, logout, troca de conta, restauração da
// sessão no F5). Se o usuário não mudou (ex.: renovação de token), não faz nada.
function syncDBWithSession(){
  const uid=currentAuthUserId();
  if(uid===DB_OWNER) return;
  // 1) descarta tudo do usuário anterior: modais/confirmações abertos, estado de tela, caches e o próprio DB
  try{ closeSettleConfirm(); }catch(e){}
  try{ closeModal(); }catch(e){}
  resetFinancialViewState();
  DB=emptyDB(); DB_OWNER=null;
  // 2) só então carrega o DB do novo usuário (se houver sessão válida)
  if(uid){
    try{ DB=normalizeDB(loadDBFor(uid)); DB_OWNER=uid; }
    catch(e){
      DB=emptyDB(); DB_OWNER=null;   // falha ao carregar: fica vazio e sem gravar (não sobrescreve dados guardados)
      setTimeout(()=>showToast('Não foi possível carregar os dados desta conta. Nada foi apagado; recarregue o app.'),0);
    }
  }
  applyDBSettingsToDOM();
  setFinancialUILock(!DB_OWNER);
  render();
}

function fmt(v){return 'R$ '+Number(v||0).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2})}
function catById(id){return DB.categories.find(c=>c.id===id)}
// Correção #2: transação sem categoryId vira a chave "undefined"/"null" nos agrupamentos por categoria — nunca exibir isso.
function missingCatLabel(cid){ return (cid==null||cid===''||cid==='undefined'||cid==='null')?'Sem categoria':cid; }
function accById(id){return DB.accounts.find(a=>a.id===id)}
// ===== Efetivação MANUAL de receitas/despesas comuns =====
// Receita/despesa comum (type 'receita'/'despesa') só é REALIZADA quando o usuário confirma
// ("Recebi"/"Paguei"), gravado em t.settled===true. A data é apenas a previsão: nunca efetiva sozinha.
// Cartão (type 'cartao'), pagamento de fatura e transferência NÃO usam esse campo: continuam
// realizados por data <= hoje, exatamente como antes (lógica de cartão/fatura/parcelas intacta).
function isManualTx(t){ return !!t && (t.type==='receita'||t.type==='despesa'); }
function isSettled(t){ return isManualTx(t) ? t.settled===true : t.date<=todayISO(); }
// ATRASADO = receita/despesa comum, NÃO realizada (settled!==true) e com data ANTERIOR a hoje.
// Calculado dinamicamente a cada uso (nada é gravado): mudar a data ou clicar Recebi/Paguei reclassifica na hora.
// Cartão/fatura/transferência nunca são "atrasados" por esta regra (isManualTx).
function isOverdue(t){ return isManualTx(t) && t.settled!==true && t.date<todayISO(); }
// Estágio: 'realizado' | 'atrasado' | 'pendente_hoje' | 'futuro'. Só para receita/despesa comum.
function txStage(t){
  if(!isManualTx(t)) return isSettled(t)?'realizado':'futuro';
  if(t.settled===true) return 'realizado';
  const d=todayISO();
  return t.date<d?'atrasado':(t.date===d?'pendente_hoje':'futuro');
}
// Prioridade de exibição: 0 atrasado, 1 pendente de hoje, 2 demais. Usada só para ORDENAR listas (estável).
function txPriorityRank(t){ const g=txStage(t); return g==='atrasado'?0:(g==='pendente_hoje'?1:2); }
function stableByRank(list,rankFn){
  return list.map((x,i)=>[x,i]).sort((a,b)=>(rankFn(a[0])-rankFn(b[0]))||(a[1]-b[1])).map(p=>p[0]);
}
function overdueList(){ return DB.transactions.filter(isOverdue); }
function brDateShort(iso){ const [y,m,d]=iso.split('-'); return d+'/'+m+(y!==todayISO().slice(0,4)?'/'+y:''); }
// Saldo atual considera apenas lançamentos já REALIZADOS: receitas/despesas comuns efetivadas
// manualmente (settled) e, para os demais tipos, os de data <= hoje. Pendentes (futuros ou vencidos
// e ainda não confirmados) não alteram o saldo atual.
function accBalance(accId){
  const acc=accById(accId); if(!acc) return 0;
  let bal=Number(acc.initial||0);
  const today=todayISO();
  DB.transactions.forEach(t=>{
    if(!isSettled(t)) return;
    if(t.type==='receita' && t.accountId===accId) bal+=Number(t.amount);
    if(t.type==='despesa' && t.accountId===accId) bal-=Number(t.amount);
    // Pagamento de fatura é o único momento em que o cartão afeta o saldo bancário.
    if(t.type==='pagamento_fatura' && t.accountId===accId) bal-=Number(t.amount);
    if(t.type==='transferencia'){
      if(t.accountId===accId) bal-=Number(t.amount);
      if(t.toAccountId===accId) bal+=Number(t.amount);
    }
  });
  return bal;
}
function totalBalance(){return DB.accounts.reduce((s,a)=>s+accBalance(a.id),0)}

// ================== ETAPA 4 — CARTÃO DE CRÉDITO ==================
// Regra central: uma compra no cartão (type:'cartao') NUNCA mexe no saldo bancário.
// Ela só ocupa limite e entra numa fatura. O saldo bancário só é afetado quando a fatura é
// paga, através de um lançamento próprio (type:'pagamento_fatura') que referencia a conta e
// o período da fatura quitada. Isso é o que impede a compra de ser descontada duas vezes.
function cardById(id){return DB.cards.find(c=>c.id===id)}

// Devolve a data de fechamento (ISO) do ciclo de fatura ao qual uma compra pertence.
// Regra: compra até o dia do fechamento (inclusive) entra no ciclo que fecha nesse mês;
// depois do fechamento, entra no ciclo que fecha no mês seguinte. O dia de fechamento é
// ajustado para o último dia do mês quando o mês for mais curto (ex: fechamento dia 31 em fevereiro).
function getInvoicePeriod(card,dateISO){
  const [y,m,d]=dateISO.split('-').map(Number);
  let closeY=y, closeM=m;
  if(d>card.closingDay){ closeM++; if(closeM>12){closeM=1;closeY++;} }
  const lastDay=new Date(closeY,closeM,0).getDate();
  const closeDay=Math.min(card.closingDay,lastDay);
  return closeY+'-'+String(closeM).padStart(2,'0')+'-'+String(closeDay).padStart(2,'0');
}
// Correção 3A (bug #1): identidade estável da fatura de uma compra.
// O pagamento de fatura guarda invoicePeriod (data de fechamento do ciclo). Se o período das
// compras fosse SEMPRE recalculado a partir do closingDay atual, mudar o dia de fechamento
// faria as compras de uma fatura já paga caírem em outro período e o pagamento ficaria órfão
// (a fatura voltaria a ficar devida). Por isso, quando o fechamento de um cartão muda, as compras
// que pertencem a faturas que já têm pagamento recebem um invoicePeriod fixo (e o dia de
// fechamento vigente, invoiceClosingDay, para o vencimento não "escorregar"). Ver
// freezePaidInvoicePeriods. Compras sem esses campos continuam usando getInvoicePeriod(), como antes.
function txInvoicePeriod(card,t){
  if(typeof t.invoicePeriod==='string' && /^\d{4}-\d{2}-\d{2}$/.test(t.invoicePeriod)) return t.invoicePeriod;
  return getInvoicePeriod(card,t.date);
}
// Dia de fechamento que vale para uma fatura ao decidir em que mês ela vence: o fixado junto com o
// período ou, sem isso, o do cartão.
function invoiceClosingRef(card,items){
  const it=items.find(t=>typeof t.invoicePeriod==='string' && Number.isInteger(t.invoiceClosingDay) && t.invoiceClosingDay>=1 && t.invoiceClosingDay<=31);
  return it?it.invoiceClosingDay:card.closingDay;
}
// Deve ser chamada ANTES de alterar card.closingDay: grava o período atual nas compras cujas
// faturas já têm algum pagamento (realizado ou agendado), para que continuem casando com ele.
function freezePaidInvoicePeriods(card){
  const paidPeriods=new Set(DB.transactions.filter(t=>t.type==='pagamento_fatura'&&t.cardId===card.id).map(t=>t.invoicePeriod));
  if(!paidPeriods.size) return;
  DB.transactions.forEach(t=>{
    if(t.type!=='cartao'||t.cardId!==card.id) return;
    const p=txInvoicePeriod(card,t);
    if(paidPeriods.has(p) && typeof t.invoicePeriod!=='string'){ t.invoicePeriod=p; t.invoiceClosingDay=card.closingDay; }
  });
}
// Data de vencimento de uma fatura a partir da sua data de fechamento. Se o dia de vencimento
// for menor que o de fechamento, o vencimento cai no mês seguinte ao do fechamento.
function invoiceDueDate(card,closingISO,closingDayRef){
  const [y,m]=closingISO.split('-').map(Number);
  let dueY=y, dueM=m;
  const refClosing=closingDayRef||card.closingDay;
  if(card.dueDay<refClosing){ dueM++; if(dueM>12){dueM=1;dueY++;} }
  const lastDay=new Date(dueY,dueM,0).getDate();
  const dueDay=Math.min(card.dueDay,lastDay);
  return dueY+'-'+String(dueM).padStart(2,'0')+'-'+String(dueDay).padStart(2,'0');
}
// Uma fatura é paga (isInvoicePaid) apenas quando ela tem valor (total>0) E a soma dos
// pagamentos JÁ REALIZADOS cobre o total — nunca pela mera existência de um pagamento, e nunca
// uma fatura de valor zero (sem nenhuma compra) é tratada como "paga" por essa comparação trivial.
//
// IMPORTANTE (correção pós-Etapa 4): "paidAmount"/"remaining" aqui consideram somente pagamentos
// já REALIZADOS (data <= hoje) — coerente com accBalance(), que também ignora lançamentos futuros.
// Um pagamento agendado para o futuro NÃO libera limite antes de sua data efetiva; ele só entra
// em jogo através de futureCardPaymentsScheduled()/futureCardPayments(), usado na projeção.
function getInvoicePaidAmount(cardId,period){
  const today=todayISO();
  return DB.transactions.filter(t=>t.type==='pagamento_fatura'&&t.cardId===cardId&&t.invoicePeriod===period&&t.date<=today)
    .reduce((s,t)=>s+Number(t.amount),0);
}
// Soma de pagamentos JÁ AGENDADOS para o futuro (data > hoje) para uma fatura específica —
// dinheiro que sairá da conta, mas que ainda não saiu e por isso ainda não libera limite.
function getInvoiceScheduledFuturePayment(cardId,period){
  const today=todayISO();
  return DB.transactions.filter(t=>t.type==='pagamento_fatura'&&t.cardId===cardId&&t.invoicePeriod===period&&t.date>today)
    .reduce((s,t)=>s+Number(t.amount),0);
}
function getInvoiceForPeriod(card,period){
  const items=DB.transactions.filter(t=>t.type==='cartao'&&t.cardId===card.id&&txInvoicePeriod(card,t)===period);
  const total=items.reduce((s,t)=>s+Number(t.amount),0);
  const paidAmount=getInvoicePaidAmount(card.id,period); // só pagamentos já realizados
  const scheduledFuture=getInvoiceScheduledFuturePayment(card.id,period);
  const remaining=Math.max(0,total-paidAmount); // o que ainda falta pagar, ignorando o que só está agendado
  // Fatura sem nenhuma compra (total 0) nunca é "paga": exige total>0 além de paidAmount>=total,
  // evitando o falso-positivo de 0>=0.
  const paid=total>0 && paidAmount>=total-1e-9; // tolera pequenos erros de ponto flutuante
  return {period,closingDate:period,dueDate:invoiceDueDate(card,period,invoiceClosingRef(card,items)),total,items,paidAmount,scheduledFuture,remaining,paid};
}
// ATRASADA = fatura NÃO paga (remaining>0, conforme getInvoiceForPeriod: só pagamentos já realizados) com
// vencimento ANTERIOR a hoje. Classificação derivada, calculada a cada uso — nada é gravado e nada é marcado
// como pago pela data. Pagar pelo fluxo existente zera remaining e a fatura deixa de ser atrasada.
function isInvoiceOverdue(card,inv){ return inv.remaining>1e-9 && inv.dueDate<todayISO(); }
// 'paga' | 'atrasada' | 'pendente_hoje' (vence hoje) | 'futura' (vence depois de hoje)
function invoiceStage(card,inv){
  if(inv.remaining<=1e-9) return 'paga';
  const d=todayISO();
  return inv.dueDate<d?'atrasada':(inv.dueDate===d?'pendente_hoje':'futura');
}
function invoiceRank(card,inv){ const g=invoiceStage(card,inv); return g==='atrasada'?0:(g==='pendente_hoje'?1:2); }
// Todas as faturas (com compras) de um cartão, da mais antiga à mais nova — inclui as pagas.
function getAllInvoices(card){
  const periods=[...new Set(DB.transactions.filter(t=>t.type==='cartao'&&t.cardId===card.id).map(t=>txInvoicePeriod(card,t)))].sort();
  return periods.map(p=>getInvoiceForPeriod(card,p)).filter(inv=>inv.items.length>0);
}
function overdueInvoicesAll(){
  const out=[]; DB.cards.forEach(c=>getOpenInvoices(c).forEach(inv=>{ if(isInvoiceOverdue(c,inv)) out.push({card:c,inv}); })); return out;
}
function getInvoiceRemaining(card,period){ return getInvoiceForPeriod(card,period).remaining; }
function isInvoicePaid(card,period){ return getInvoiceForPeriod(card,period).paid; }
function getInvoice(card,referenceDate){ return getInvoiceForPeriod(card,getInvoicePeriod(card,referenceDate)); }
function getCurrentInvoice(card){ return getInvoice(card,todayISO()); }
function getFutureInvoices(card){
  const currentPeriod=getInvoicePeriod(card,todayISO());
  const periods=[...new Set(DB.transactions.filter(t=>t.type==='cartao'&&t.cardId===card.id).map(t=>txInvoicePeriod(card,t)))]
    .filter(p=>p>currentPeriod).sort();
  return periods.map(p=>getInvoiceForPeriod(card,p));
}
// Todas as faturas (de qualquer período — passado, atual ou futuro) que ainda têm saldo em
// aberto (remaining>0), ordenadas da mais antiga para a mais nova. Usado tanto para o limite
// quanto para a seção "Faturas em aberto" da tela de Cartões — nenhuma fatura anterior fica
// escondida só porque já existe uma fatura mais recente.
function getOpenInvoices(card){
  const periods=[...new Set(DB.transactions.filter(t=>t.type==='cartao'&&t.cardId===card.id).map(t=>txInvoicePeriod(card,t)))].sort();
  return periods.map(p=>getInvoiceForPeriod(card,p)).filter(inv=>inv.remaining>0);
}
// "Limite utilizado" = soma do saldo AINDA NÃO PAGO (remaining, baseado em pagamentos já
// REALIZADOS) de TODAS as faturas do cartão — passadas, atual e futuras (parcelas ainda não
// vencidas já comprometem limite desde a compra). Um pagamento parcial libera só a parte paga;
// a diferença continua ocupando limite. Um pagamento agendado para o futuro NÃO libera limite
// até sua data efetiva (ver getInvoicePaidAmount).
function cardUsed(cardId){
  const card=cardById(cardId); if(!card) return 0;
  const periods=[...new Set(DB.transactions.filter(t=>t.type==='cartao'&&t.cardId===cardId).map(t=>txInvoicePeriod(card,t)))];
  return periods.reduce((s,p)=>s+getInvoiceForPeriod(card,p).remaining,0);
}
function cardAvailable(cardId){ const card=cardById(cardId); if(!card) return 0; return Number(card.limit)-cardUsed(cardId); }
function cardCurrentInvoice(cardId){ const card=cardById(cardId); if(!card) return null; return getCurrentInvoice(card); }
// Todos os pares (cartão, período) que já tiveram alguma compra registrada — base para o cálculo
// das obrigações futuras de cartão na projeção (ver futureCardObligations()).
function allInvoicePeriods(){
  const map={};
  DB.transactions.filter(t=>t.type==='cartao').forEach(t=>{
    const card=cardById(t.cardId); if(!card) return;
    const period=txInvoicePeriod(card,t);
    map[card.id+'|'+period]={card,period};
  });
  return Object.values(map);
}
// Compromisso futuro de cartão = para cada fatura, o saldo ainda não pago (remaining, baseado em
// pagamentos JÁ REALIZADOS) MENOS a parte que já está agendada para sair no futuro
// (scheduledFuture) — essa parte agendada é contada separadamente em futureCardPayments(), então
// subtraí-la aqui é o que evita a dupla contagem. Ou seja, para qualquer fatura:
//   obrigação (aqui) + pagamento agendado (futureCardPayments) === saldo total ainda devido
// nunca mais que isso, nunca menos.
// Exemplo: fatura R$500, sem pagamento nenhum -> obrigação=500, pagamento agendado=0 -> total 500.
// Fatura R$500, pagamento futuro agendado de R$500 -> obrigação=max(0,500-500)=0, pagamento
// agendado=500 -> total 500 (nunca 1000).
// Fatura R$500, pagamento futuro agendado de R$100 -> obrigação=max(0,500-100)=400, agendado=100
// -> total 500.
function futureCardObligations(){
  return allInvoicePeriods().reduce((s,{card,period})=>{
    const inv=getInvoiceForPeriod(card,period);
    return s+Math.max(0,inv.remaining-inv.scheduledFuture);
  },0);
}
// Pagamentos de fatura já agendados para o futuro (data > hoje) — a contrapartida de
// futureCardObligations() acima; juntas as duas funções nunca ultrapassam o saldo total devido.
function futureCardPayments(){
  return DB.transactions.filter(t=>t.type==='pagamento_fatura'&&isFutureDate(t.date)).reduce((s,t)=>s+Number(t.amount),0);
}
// ================== FIM ETAPA 4 ==================

function monthTx(ym){return DB.transactions.filter(t=>t.date.slice(0,7)===ym)}
// Só considera "já realizado" o que isSettled(): receita/despesa comum confirmada manualmente; demais tipos por data <= hoje.
function realizedMonthTx(ym){ return monthTx(ym).filter(isSettled); }
function monthIn(ym){return realizedMonthTx(ym).filter(t=>t.type==='receita').reduce((s,t)=>s+Number(t.amount),0)}
function monthOut(ym){return realizedMonthTx(ym).filter(isExpenseLike).reduce((s,t)=>s+Number(t.amount),0)}

// ---- Base para "Disponível projetado" (preparação; Dashboard ainda não foi redesenhado) ----
function isFutureDate(dateStr){ return dateStr>todayISO(); }
// "Futuro" = ainda não realizado (inclui receita/despesa comum VENCIDA e não confirmada, que segue na projeção).
function futureTx(){ return DB.transactions.filter(t=>!isSettled(t)); }
function futureExpenses(){ return futureTx().filter(t=>t.type==='despesa').reduce((s,t)=>s+Number(t.amount),0); }
function futureIncome(){ return futureTx().filter(t=>t.type==='receita').reduce((s,t)=>s+Number(t.amount),0); }
function futureInstallments(){ return futureTx().filter(t=>!!t.installment); }
function futureRecurring(){ return futureTx().filter(t=>!!t.recurrence); }

// Disponível projetado = saldo atual (já realizado) + entradas futuras - despesas futuras
// - obrigações futuras de cartão - pagamentos de fatura já agendados para o futuro.
// Reaproveita totalBalance()/futureIncome()/futureExpenses() — nenhuma lógica paralela.
// Transferências (type 'transferencia') nunca entram em futureIncome/futureExpenses, pois elas
// só somam type 'receita'/'despesa' — por isso uma transferência futura é automaticamente neutra
// no total consolidado (não soma nem subtrai).
// Compras no cartão (type 'cartao') também nunca entram em futureExpenses (tipo diferente de
// 'despesa'), então nunca são descontadas do saldo diretamente — só entram via as duas parcelas
// de cartão abaixo, que já se excluem mutuamente por fatura (ver futureCardObligations/futureCardPayments).
function projectedBalance(){
  const currentBalance=totalBalance();
  const futInc=futureIncome();
  const futExp=futureExpenses();
  const cardObl=futureCardObligations();
  const cardPay=futureCardPayments();
  return {
    currentBalance,
    futureIncome:futInc,
    futureExpenses:futExp,
    futureCardObligations:cardObl,
    futureCardPayments:cardPay,
    projectedBalance:currentBalance+futInc-futExp-cardObl-cardPay
  };
}

// ================== V1.1.1 — CENTRAL DE NOTIFICAÇÕES ==================
// Notificações nunca são persistidas em si — são sempre recalculadas a partir dos dados atuais
// (cartões, faturas, parcelamentos, recorrências, projeção e orçamento), reaproveitando as mesmas
// funções já existentes, sem duplicar nenhuma regra financeira. O único estado persistido é o
// conjunto de ids já lidos (DB.notificationState.readIds), o que evita duas coisas: (1) uma
// notificação parecer "nova" de novo só porque a página recarregou, e (2) qualquer acúmulo de
// dados — o próprio ato de marcar como lida já poda os ids que não pertencem à lista atual.
//
// Cada notificação tem um id determinístico ligado ao evento que a gerou (ex.: cartão+período da
// fatura, id do lançamento, categoria+mês do orçamento), então o mesmo evento nunca gera duas
// notificações diferentes em renderizações sucessivas.
function parseISOLocal(iso){ const [y,m,d]=iso.split('-').map(Number); return new Date(y,m-1,d); }
// Diferença em dias inteiros (iso - fromISO), sem risco de fuso: ambas as datas são convertidas
// para meia-noite local antes da subtração (mesma técnica de dateToISOLocal).
function daysDiffISO(iso,fromISO){ return Math.round((parseISOLocal(iso)-parseISOLocal(fromISO))/86400000); }

function getNotifications(){
  const today=todayISO();
  const list=[];

  // A) Fatura próxima do vencimento (até 3 dias) e B) Fatura vencida.
  // Reaproveita getOpenInvoices(), que já cobre todas as faturas (de qualquer cartão/período) com
  // saldo em aberto — nenhuma lógica de fatura nova é criada aqui.
  DB.cards.forEach(card=>{
    getOpenInvoices(card).forEach(inv=>{
      const diff=daysDiffISO(inv.dueDate,today);
      if(diff<0){
        // Mesmo id determinístico de sempre (cartão+período): a lista é recalculada, então a mesma fatura atrasada
        // nunca gera duas notificações; "lida" fica em readIds. Some quando a fatura é paga pelo fluxo existente.
        const late=-diff;
        list.push({id:'inv_overdue_'+card.id+'_'+inv.period,type:'invoice_overdue',invoice:{cardId:card.id,period:inv.period},
          title:'🔴 Fatura atrasada',
          message:`${card.name} — ${fmt(inv.remaining)}. Vencimento: ${brDateShort(inv.dueDate)}. Atrasada há ${late} dia${late>1?'s':''}.`,
          date:inv.dueDate,severity:'danger'});
      } else if(diff<=3){
        list.push({id:'inv_due_'+card.id+'_'+inv.period,type:'invoice_due_soon',
          title:'Fatura próxima do vencimento',
          message:diff===0?`Fatura do cartão ${card.name} vence hoje.`:`Fatura do cartão ${card.name} vence em ${diff} dia${diff>1?'s':''}.`,
          date:inv.dueDate,severity:'warning'});
      }
    });
  });

  // C) Parcela/recorrência próxima (nos próximos 3 dias). Compras no cartão (type 'cartao') não
  // entram aqui: sua data é a de entrada na fatura, não uma data de vencimento própria — esse
  // aviso já é coberto pela fatura em A/B, evitando duas notificações para o mesmo compromisso.
  DB.transactions.forEach(t=>{
    if(t.type==='cartao'||t.type==='pagamento_fatura') return;
    if(!(t.installment||t.recurrence)) return;
    if(isManualTx(t) && t.settled===true) return; // já recebida/paga: nada a avisar
    const diff=daysDiffISO(t.date,today);
    if(diff>=0 && diff<=3){
      const noun=t.installment?'Parcela':'Recorrência';
      list.push({id:'occ_'+t.id,type:'installment_due_soon',
        title:`${noun} próxima`,
        message:diff===0?`${noun} de ${t.desc} vence hoje.`:`${noun} de ${t.desc} vence em ${diff} dia${diff>1?'s':''}.`,
        date:t.date,severity:'warning'});
    }
  });

  // C2) Lançamento ATRASADO (receita/despesa comum não realizada com data < hoje). O id é determinístico
  // (tx_overdue_<id>_<data>): a lista é sempre recalculada, então o mesmo atraso NUNCA gera duas
  // notificações; "lida" fica em notificationState.readIds. Continua atrasado/prioridade enquanto não
  // for realizado, mas não volta a ser "não lida". Mudou a data para outro dia atrasado => novo id.
  // Nunca efetiva nada. Some assim que o usuário clica Recebi/Paguei ou a data deixa de ser passada.
  DB.transactions.forEach(t=>{
    if(!isOverdue(t)) return;
    const rec=t.type==='receita';
    list.push({id:'tx_overdue_'+t.id+'_'+t.date,type:'tx_overdue',txId:t.id,
      title:rec?'🔴 Receita atrasada':'🔴 Despesa atrasada',
      message:`${rec?'A receita':'A despesa'} “${t.desc}” de ${fmt(t.amount)} venceu em ${brDateShort(t.date)} e ainda não foi marcada como ${rec?'recebida':'paga'}.`,
      date:t.date,severity:'danger'});
  });

  // D) Saldo projetado negativo — reaproveita projectedBalance() sem nenhum cálculo paralelo.
  const proj=projectedBalance();
  if(proj.projectedBalance<0){
    list.push({id:'balance_negative_'+today,type:'projected_negative',
      title:'Saldo projetado negativo',
      message:`Seu saldo projetado ficará negativo: ${fmt(proj.projectedBalance)}.`,
      date:today,severity:'danger'});
  }

  // E) Orçamento próximo do limite (>=80%) e F) Orçamento excedido (>=100%) — V1.2.3: reaproveita
  // a MESMA função central getBudgetStatuses() usada pela tela de Orçamento e pelo resumo do
  // Dashboard, em vez de recalcular o gasto por categoria aqui (evita duas réguas diferentes de
  // "quanto já foi gasto" — inclusive quanto a compras no cartão contarem como gasto). Mantém
  // exatamente os mesmos dois eventos/ids/severidades de antes: nunca os dois ao mesmo tempo para
  // a mesma categoria, e nenhum evento novo.
  const ym=today.slice(0,7);
  const budgetStatus=getBudgetStatuses(ym);
  budgetStatus.rows.forEach(r=>{
    const name=r.category?r.category.name:r.categoryId;
    if(r.percentage>=100){
      list.push({id:'budget_exceeded_'+ym+'_'+r.categoryId,type:'budget_exceeded',
        title:'Orçamento excedido',message:`Orçamento de ${name} ultrapassado.`,date:today,severity:'danger'});
    } else if(r.percentage>=80){
      list.push({id:'budget_warning_'+ym+'_'+r.categoryId,type:'budget_warning',
        title:'Orçamento próximo do limite',message:`${name} atingiu ${r.percentage.toFixed(0)}% do orçamento.`,date:today,severity:'warning'});
    }
  });

  const readSet=new Set((DB.notificationState&&DB.notificationState.readIds)||[]);
  list.forEach(n=>{ n.read=readSet.has(n.id); });

  const sevRank={danger:0,warning:1,info:2};
  list.sort((a,b)=>(sevRank[a.severity]-sevRank[b.severity])||a.date.localeCompare(b.date));
  return list;
}

function markNotificationRead(id){
  DB.notificationState=DB.notificationState||{readIds:[]};
  const set=new Set(DB.notificationState.readIds); set.add(id);
  // Poda: mantém apenas ids que ainda correspondem a notificações atualmente exibidas, para o
  // localStorage nunca acumular ids de notificações já resolvidas (fatura paga, orçamento do mês
  // anterior etc.).
  const currentIds=new Set(getNotifications().map(n=>n.id));
  DB.notificationState.readIds=[...set].filter(id2=>currentIds.has(id2));
  saveDB();
}
function markAllNotificationsRead(){
  DB.notificationState=DB.notificationState||{readIds:[]};
  DB.notificationState.readIds=getNotifications().map(n=>n.id);
  saveDB();
}

function notifSeverityLabel(sev){ return sev==='danger'?'Crítico':(sev==='warning'?'Atenção':'Info'); }
function notifSeverityClass(sev){ return sev==='danger'?'tag-red':(sev==='warning'?'tag-yellow':'tag-accent'); }

function notifPanelHTML(list){
  const closeRow='<div class="np-foot"><button class="ghost" id="notifCloseBtn" onclick="closeModal()">Fechar</button></div>';
  if(!list.length){
    return `<div class="np"><div class="np-head"><div><h3 id="modalTitle">Notificações</h3></div></div>

    <strong>Tudo em dia</strong><span class="muted">Nenhum alerta por enquanto.</span></div>${closeRow}</div>`;
  }
  const unreadCount=list.filter(n=>!n.read).length;
  const rows=list.map(n=>{
    const sev=n.severity==='danger'?'danger':(n.severity==='warning'?'warning':'info');
    const msg=escapeHTML(n.message).replace(/(R\$\s?-?[\d.]+(?:,\d{2})?)/g,'<b class="np-val">$1</b>');
    const acts=(n.txId?`<button class="ghost np-act" data-gotx="${escapeHTML(n.txId)}">Ver lançamento</button>`:'')+
              (n.invoice?`<button class="ghost np-act" data-goinv="${escapeHTML(n.invoice.cardId)}|${escapeHTML(n.invoice.period)}">Ver fatura</button>`:'');
    return `<li class="np-item np-${sev}${n.read?' is-read':''}">
      <div class="np-ico">${notifIconSVG(sev)}</div>
      <div class="np-main">
        <div class="np-title">${escapeHTML(n.title)}${n.read?'':'<span class="np-dot" aria-label="Não lida"></span>'}</div>
        <div class="np-msg">${msg}</div>
        <div class="np-meta"><span class="np-sev">${notifSeverityLabel(n.severity)}</span><time>${escapeHTML(n.date.split('-').reverse().join('/'))}</time></div>
        ${acts?`<div class="np-acts">${acts}</div>`:''}
      </div>
      ${n.read?'':`<button class="ghost np-check" data-marknotif="${escapeHTML(n.id)}" title="Marcar como lida" aria-label="Marcar '${escapeHTML(n.title)}' como lida"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12 4.5 4.5L19 7"/></svg></button>`}
    </li>`;
  }).join('');
  return `<div class="np">
    <div class="np-head">
      <div><h3 id="modalTitle">Notificações</h3><div class="np-sub">${unreadCount>0?`${unreadCount} não lida${unreadCount>1?'s':''}`:'Todas lidas'}</div></div>
      ${unreadCount>0?'<button class="ghost np-all" id="markAllReadBtn">Marcar todas como lidas</button>':''}
    </div>
    <ul class="np-list">${rows}</ul>
    ${closeRow}
  </div>`;
}
function bindNotifPanelEvents(){
  document.querySelectorAll('[data-marknotif]').forEach(b=>b.onclick=()=>{
    markNotificationRead(b.dataset.marknotif);
    afterNotifRead();
  });
  const allBtn=document.getElementById('markAllReadBtn');
  if(allBtn) allBtn.onclick=()=>{
    markAllNotificationsRead();
    afterNotifRead();
  };
  document.querySelectorAll('[data-goinv]').forEach(b=>b.onclick=()=>{ const [c,p]=b.dataset.goinv.split('|'); closeModal(); goToInvoice(c,p); });
  document.querySelectorAll('[data-gotx]').forEach(b=>b.onclick=()=>{ const id=b.dataset.gotx; closeModal(); goToTx(id); });
  const closeBtn=document.getElementById('notifCloseBtn');
  if(closeBtn) closeBtn.onclick=()=>closeModal();
}
// Depois de visualizar/dispensar: no mobile (≤760px) o painel sai da frente na hora; no desktop só
// fecha quando não restar nenhuma não lida. Ao fechar, a tela atrás é redesenhada (o banner do
// Dashboard e o selo do sino deixam de mostrar a notificação já lida).
function afterNotifRead(){
  const mobile=window.matchMedia&&window.matchMedia('(max-width:760px)').matches;
  const stillUnread=getNotifications().some(n=>!n.read);
  if(mobile||!stillUnread){
    closeModal(); render(); updateNotifBell();
  } else {
    refreshNotifPanel(); updateNotifBell();
  }
}
// Atualiza o conteúdo do modal já aberto sem recriá-lo (mantém o listener de ESC/clique-fora e não
// rouba o foco a cada "marcar como lida"); devolve o foco a um botão do próprio painel em seguida.
function refreshNotifPanel(){
  const modal=document.querySelector('#modalRoot .modal');
  if(!modal) return;
  modal.innerHTML=notifPanelHTML(getNotifications());
  bindNotifPanelEvents();
  const firstBtn=modal.querySelector('button');
  if(firstBtn) firstBtn.focus();
}
function openNotifPanel(){
  openModal(notifPanelHTML(getNotifications()),'modalTitle');
  bindNotifPanelEvents();
}
function updateNotifBell(){
  const btn=document.getElementById('notifBtn'), badge=document.getElementById('notifBadge');
  if(!btn||!badge) return;
  const unread=getNotifications().filter(n=>!n.read);
  if(unread.length>0){
    badge.textContent=unread.length>99?'99+':String(unread.length);
    badge.style.display='flex';
    // Vermelho reservado apenas para quando houver ao menos uma notificação crítica não lida —
    // caso contrário o discreto azul de destaque já usado no restante do sistema.
    badge.style.background=unread.some(n=>n.severity==='danger')?'var(--red)':'var(--accent)';
    btn.setAttribute('aria-label',`Notificações (${unread.length} não lida${unread.length>1?'s':''})`);
  } else {
    badge.style.display='none';
    btn.setAttribute('aria-label','Notificações');
  }
}

    else if(t.recurrence) badge=`<span class="tag">Recorrente · ${escapeHTML(t.recurrence.index)}/${escapeHTML(t.recurrence.count)}</span>`;
    let sub;
    if(t.type==='transferencia') sub=`${escapeHTML(accName)} → ${escapeHTML(accById(t.toAccountId)?accById(t.toAccountId).name:'')}`;
    else if(t.type==='cartao') sub=`💳 ${escapeHTML(cardName)}`;
    else if(t.type==='pagamento_fatura') sub=`💳 ${escapeHTML(cardName)} · ${escapeHTML(accName)}`;
    else sub=escapeHTML(accName);
    if(isOverdue(t)) badge=`<span class="tag tag-red" style="white-space:nowrap">🔴 Atrasado</span>`+badge;
    return `<div class="li li-click" data-uptx="${escapeHTML(t.id)}" role="button" tabindex="0" aria-label="Editar lançamento: ${escapeHTML(t.desc)}">
      ${dateChipHTML(t.date)}
      <div class="li-main"><div class="li-title"><span>${escapeHTML(t.desc)}</span>${badge}</div>${sub?`<div class="li-sub">${sub}</div>`:''}</div>
      <div class="li-amt ${cls}">${sign}${fmt(t.amount)}${isManualTx(t)?`<div style="margin-top:4px">${settleBtnHTML(t,false)}</div>`:''}</div>
    </div>`;
  }).join('');
}

// ================== V1.1.2 — PRÓXIMOS COMPROMISSOS ==================
// Consolida em uma única lista cronológica os compromissos financeiros futuros que já existem
// espalhados pelo sistema, sem nenhuma lógica financeira nova: reaproveita futureTx() (mesma base
// de "Disponível projetado"/"Próximos lançamentos") e getOpenInvoices() (mesma base usada nas
// notificações e na tela de Cartões).
//
// Regra contra dupla contagem visual (ver topo do arquivo): uma compra no cartão (type 'cartao')
// nunca entra aqui como item isolado — ela já está representada pela fatura em aberto a que
// pertence (item "Fatura", abaixo), então mostrar as duas seria o mesmo compromisso bancário
// duas vezes. Transferência entre contas próprias também fica de fora: não é um compromisso
// externo, é apenas movimentação entre contas do próprio usuário (mesma razão pela qual nunca
// entra em futureIncome()/futureExpenses()/projectedBalance()).
function getNextCommitments(){
  const items=[];

  // A) Lançamentos futuros comuns (despesa/receita, incluindo parcelas e recorrências) e
  // C) pagamentos de fatura já agendados para o futuro — ambos já são 'futureTx()'.
  futureTx().forEach(t=>{
    if(t.type==='cartao'||t.type==='transferencia') return;
    items.push({date:t.date,desc:t.desc,amount:Number(t.amount),kind:t.type,
      accountId:t.accountId,cardId:t.cardId,installment:t.installment,recurrence:t.recurrence,txId:t.id});
  });

  // B) Faturas em aberto (vencida, atual ou futura) — cada fatura entra como UM único compromisso,
  // na data do vencimento, nunca pelas compras que a compõem individualmente.
  // O valor mostrado é remaining MENOS scheduledFuture — a mesma subtração já feita em
  // futureCardObligations() — porque a parte já coberta por um pagamento futuro agendado é exibida
  // separadamente como item "Pagamento de fatura" (acima); somar as duas sem essa dedução
  // duplicaria visualmente a mesma obrigação bancária. Se a fatura já está inteiramente coberta por
  // um pagamento agendado (obrigação residual = 0), ela não aparece aqui — o pagamento agendado já
  // representa o compromisso por completo.
  DB.cards.forEach(card=>{
    getOpenInvoices(card).forEach(inv=>{
      const obligation=Math.max(0,inv.remaining-inv.scheduledFuture);
      if(obligation<=1e-9) return;
      items.push({date:inv.dueDate,desc:'Fatura '+card.name,amount:obligation,kind:'fatura',cardId:card.id,period:inv.period});
    });
  });

  items.sort((a,b)=>a.date.localeCompare(b.date));
  return items;
}
function commitmentLabel(it){
  if(it.kind==='fatura') return 'Fatura';
  if(it.kind==='pagamento_fatura') return 'Pagamento de fatura';
  if(it.installment) return 'Parcela';
  if(it.recurrence) return 'Recorrência';
  return it.kind==='receita'?'Receita':'Despesa';
}
// Só exibição: atrasados (receita/despesa comum) primeiro; demais na ordem original (por data).
function prioritizeCommitments(list){
  return stableByRank(list,it=>{ const tx=it.txId?DB.transactions.find(x=>x.id===it.txId):null; return ((tx&&isOverdue(tx))||(it.kind==='fatura'&&it.date<todayISO()))?0:1; });
}
function commitmentsRowsHTML(list){
  if(!list.length) return '<p class="muted">Nenhum compromisso futuro.</p>';
  return list.map(it=>{
    const accName=it.accountId&&accById(it.accountId)?accById(it.accountId).name:'';
    const cardName=it.cardId&&cardById(it.cardId)?cardById(it.cardId).name:'';
    const cls=it.kind==='receita'?'pos':'neg';
    const sign=it.kind==='receita'?'+':'-';
    let sub;
    if(it.kind==='fatura') sub=`💳 ${escapeHTML(cardName)}`;
    else if(it.kind==='pagamento_fatura') sub=`💳 ${escapeHTML(cardName)} · ${escapeHTML(accName)}`;
    else sub=escapeHTML(accName);
    let groupBadge='';
    { const tx=it.txId?DB.transactions.find(x=>x.id===it.txId):null; if((tx&&isOverdue(tx))||(it.kind==='fatura'&&it.date<todayISO())) groupBadge='<span class="tag tag-red" style="white-space:nowrap">🔴 Atrasado</span>'; }
    if(it.installment) groupBadge+=`<span class="tag">${escapeHTML(it.installment.index)}/${escapeHTML(it.installment.count)}</span>`;
    else if(it.recurrence) groupBadge+=`<span class="tag">${escapeHTML(it.recurrence.index)}/${escapeHTML(it.recurrence.count)}</span>`;
    return `<div class="li">
      ${dateChipHTML(it.date)}
      <div class="li-main"><div class="li-title"><span>${escapeHTML(it.desc)}</span><span class="tag">${commitmentLabel(it)}</span>${groupBadge}</div>${sub?`<div class="li-sub">${sub}</div>`:''}</div>
      <div class="li-amt ${cls}">${sign}${fmt(it.amount)}${(()=>{const tx=it.txId?DB.transactions.find(x=>x.id===it.txId):null;return tx&&isManualTx(tx)?`<div style="margin-top:4px">${settleBtnHTML(tx,false)}</div>`:'';})()}</div>
    </div>`;
  }).join('');
}
function openCommitmentsModal(){
  const all=prioritizeCommitments(getNextCommitments());
  openModal(`<h3 id="modalTitle">Próximos compromissos</h3>
    <div style="margin-top:10px" id="commitList">${commitmentsRowsHTML(all)}</div>
    <div style="display:flex;justify-content:flex-end;margin-top:10px"><button class="ghost" onclick="closeModal()">Fechar</button></div>`,'modalTitle');
  bindSettleButtons();
}

// ================== V1.1.3 — FLUXO DE CAIXA ==================
// Mostra a evolução dia a dia do saldo projetado, sem nenhuma regra financeira nova: consome
// diretamente projectedBalance() (para o saldo atual) e getNextCommitments() (mesma lista já
// deduplicada usada em "Próximos compromissos" — compra no cartão nunca aparece isolada, e a
// obrigação de fatura já vem líquida do que foi coberto por pagamento futuro agendado). O gráfico
// é apenas uma reprojeção temporal desses mesmos eventos; nenhuma segunda lógica de cartão/fatura
// é criada aqui.
const CASHFLOW_PERIODS=[7,15,30,60,90];
let cashFlowDays=30;

// Soma N dias (N pode ser negativo) a uma data ISO, sempre em componentes LOCAIS — composição de
// parseISOLocal()/dateToISOLocal(), já existentes (mesma técnica usada em daysDiffISO()), nunca
// toISOString(). Cobre corretamente virada de mês/ano e meses de tamanhos diferentes, pois delega
// a aritmética ao próprio objeto Date local.
function addDaysISO(iso,n){ const d=parseISOLocal(iso); d.setDate(d.getDate()+n); return dateToISOLocal(d); }

// Calcula a série diária do saldo projetado para os próximos `days` dias.
// `commitmentsAll` é opcional — quando o chamador já tiver a lista de getNextCommitments() calculada
// (como viewDashboard() tem, para "Próximos compromissos"), ela é reaproveitada em vez de refazer a
// varredura de DB.transactions/DB.cards uma segunda vez no mesmo render.
//
// Ponto inicial (dia 0) = saldo atual (accBalance/totalBalance via projectedBalance()), sem nenhum
// ajuste — exatamente como já é mostrado no card "Saldo atual". A partir do dia 1, cada compromisso
// (despesa/receita/pagamento de fatura/obrigação de fatura já líquida) é aplicado na sua própria
// data — nunca somado de uma vez só no fim do período. Compromissos com data <= hoje (ex.: fatura já
// vencida e ainda não paga) são aplicados no dia 1: o dia 0 precisa continuar representando fielmente
// o saldo bancário atual, então qualquer obrigação já vencida (mas ainda não refletida no saldo,
// pois só um pagamento realizado mexe em accBalance()) só pode aparecer a partir do primeiro passo
// futuro do gráfico.
function computeCashFlow(days,commitmentsAll){
  const today=todayISO();
  const current=projectedBalance().currentBalance;
  const endISO=addDaysISO(today,days);
  const all=commitmentsAll||getNextCommitments();
  const commitments=all.filter(it=>it.date<=endISO);

  // Correção 3A (bug #2): itens com data <= hoje (fatura vencida ou que vence hoje, ainda não paga)
  // antes entravam em deltaByDate mas nunca eram aplicados, pois o laço só lê de amanhã em diante.
  // Eles continuam sendo obrigação real (projectedBalance() já os desconta), então são aplicados no
  // primeiro passo futuro (dia 1), mantendo o dia 0 igual ao saldo atual. Cada item entra uma única vez.
  const firstStepISO=addDaysISO(today,1);
  const deltaByDate={};
  const eventsByDate={}; // só para exibição (tooltip/detalhe do gráfico); não entra em nenhum cálculo
  commitments.forEach(it=>{
    const signed=it.kind==='receita'?Number(it.amount):-Number(it.amount);
    const key=it.date<=today?firstStepISO:it.date;
    deltaByDate[key]=(deltaByDate[key]||0)+signed;
    (eventsByDate[key]=eventsByDate[key]||[]).push({desc:it.desc,amount:Number(it.amount),kind:it.kind,signed,origDate:it.date});
  });

  const points=[{date:today,balance:current,events:[]}];
  let running=current;
  for(let i=1;i<=days;i++){
    const iso=addDaysISO(today,i);
    running+=(deltaByDate[iso]||0);
    points.push({date:iso,balance:running,events:eventsByDate[iso]||[]});
  }

  const balances=points.map(p=>p.balance);
  const minBalance=Math.min(...balances);
  const minIdx=balances.indexOf(minBalance);
  const finalPoint=points[points.length-1];

  const incomeItems=commitments.filter(it=>it.kind==='receita');
  const outflowItems=commitments.filter(it=>it.kind!=='receita');
  const totalIncome=incomeItems.reduce((s,it)=>s+Number(it.amount),0);
  const totalOutflow=outflowItems.reduce((s,it)=>s+Number(it.amount),0);
  const biggestIncome=incomeItems.slice().sort((a,b)=>Number(b.amount)-Number(a.amount))[0]||null;
  const biggestOutflow=outflowItems.slice().sort((a,b)=>Number(b.amount)-Number(a.amount))[0]||null;

  return {
    days,points,currentBalance:current,
    minBalance,minDate:points[minIdx].date,
    finalBalance:finalPoint.balance,finalDate:finalPoint.date,
    totalIncome,totalOutflow,biggestIncome,biggestOutflow,
    hasNegative:balances.some(b=>b<-1e-9)
  };
}

// SVG leve, sem bibliotecas externas e sem animação — usa as mesmas CSS vars de tema já definidas
// no :root (var(--accent)/var(--red)/var(--muted)), então acompanha o tema claro/escuro atual sem
// nenhuma cor nova. Uma linha tracejada em R$ 0 e um texto explícito ("fica negativo") garantem que
// o alerta de saldo negativo nunca dependa só da cor da linha.
function cashFlowChartSVG(data){
  // Apresentação apenas: os pontos (data.points) vêm de computeCashFlow(), sem nenhum cálculo novo.
  // Largura acompanha a tela (textos legíveis no celular); a altura é proporcional.
  const vw=(typeof window!=='undefined'&&window.innerWidth)?window.innerWidth:1024;
  const w=vw<=760?Math.max(280,Math.min(560,vw-56)):720, h=vw<=760?200:230;
  const padL=vw<=760?62:70, padR=14, padT=16, padB=28;
  const innerW=w-padL-padR, innerH=h-padT-padB;
  const values=data.points.map(p=>p.balance);
  let maxV=Math.max(...values), minV=Math.min(...values);
  if(maxV===minV){ maxV+=1; minV-=1; }
  const pad=(maxV-minV)*0.12||1;
  const scaleMax=maxV+pad, scaleMin=minV-pad, scaleRange=scaleMax-scaleMin;
  const n=data.points.length-1;
  const xFor=(i)=>padL+(n?(i/n)*innerW:0);
  const yFor=(v)=>padT+innerH-((v-scaleMin)/scaleRange)*innerH;
  const short=(v)=>'R$ '+Math.round(v).toLocaleString('pt-BR');
  const dm=(iso)=>iso.slice(8,10)+'/'+iso.slice(5,7);

  const lineColor=data.hasNegative?'var(--red)':'var(--accent)';
  // Saldo é "em degraus": fica igual até o próximo compromisso — o degrau mostra isso sem inventar valores intermediários.
  let path='M'+xFor(0).toFixed(1)+','+yFor(values[0]).toFixed(1);
  for(let k=1;k<values.length;k++){ path+=' L'+xFor(k).toFixed(1)+','+yFor(values[k-1]).toFixed(1)+' L'+xFor(k).toFixed(1)+','+yFor(values[k]).toFixed(1); }
  const baseY=(padT+innerH).toFixed(1);
  const area=path+' L'+xFor(n).toFixed(1)+','+baseY+' L'+xFor(0).toFixed(1)+','+baseY+' Z';

  // Linhas de referência discretas (máximo, meio, mínimo) com rótulo no eixo Y.
  const ticks=[maxV,(maxV+minV)/2,minV];
  const grid=ticks.map(v=>`<line x1="${padL}" y1="${yFor(v).toFixed(1)}" x2="${w-padR}" y2="${yFor(v).toFixed(1)}" stroke="var(--border)" stroke-width="1"/>
    <text x="${padL-8}" y="${(yFor(v)+4).toFixed(1)}" font-size="11" fill="var(--muted)" text-anchor="end">${short(v)}</text>`).join('');

  let zeroLine='';
  if(scaleMin<0 && scaleMax>0){
    const y0=yFor(0);
    zeroLine=`<line x1="${padL}" y1="${y0.toFixed(1)}" x2="${w-padR}" y2="${y0.toFixed(1)}" stroke="var(--red)" stroke-width="1" stroke-dasharray="4 3"/>
    <text x="${padL-8}" y="${(y0+4).toFixed(1)}" font-size="11" fill="var(--red)" text-anchor="end">R$ 0</text>`;
  }

  const minIdx=values.indexOf(data.minBalance);
  const mx=xFor(minIdx), my=yFor(data.minBalance);
  const mcol=data.hasNegative?'var(--red)':'var(--accent)';
  let minMarker=`<circle cx="${mx.toFixed(1)}" cy="${my.toFixed(1)}" r="5" fill="${mcol}" stroke="var(--card)" stroke-width="2"/>`;
  if(minIdx>0){
    const right=mx>w/2;
    // Posição padrão do rótulo (como antes). Se ela cair em cima da linha tracejada do R$ 0, tenta acima do ponto
    // (centralizado) e, por último, abaixo — para o texto nunca ficar sobreposto à linha vermelha.
    const y0=zeroLine?yFor(0):null;
    const hitsZero=(y)=>y0!==null&&Math.abs((y-4)-y0)<10;
    const half=40, cxm=Math.max(padL+half,Math.min(w-padR-half,mx));
    const cands=[
      {x:right?mx-9:mx+9,y:my+(my>padT+innerH-16?-9:17),a:right?'end':'start'},
      {x:cxm,y:my-12,a:'middle'},
      {x:cxm,y:my+17,a:'middle'}
    ].filter(c=>c.y>=padT&&c.y<=padT+innerH+4);
    const pick=cands.find(c=>!hitsZero(c.y))||cands[0];
    minMarker+=`<text x="${pick.x.toFixed(1)}" y="${pick.y.toFixed(1)}" font-size="11" font-weight="600" fill="var(--text)" stroke="var(--card)" stroke-width="3" paint-order="stroke" stroke-linejoin="round" text-anchor="${pick.a}">Menor: ${short(data.minBalance)}</text>`;
  }
  const startDot=`<circle cx="${xFor(0).toFixed(1)}" cy="${yFor(values[0]).toFixed(1)}" r="4" fill="var(--muted)" stroke="var(--card)" stroke-width="2"/>`;

  const startISO=data.points[0].date, endISO=data.points[n].date;
  const midISO=data.points[Math.floor(n/2)].date;
  const startLabel=startISO.split('-').reverse().join('/');
  const endLabel=endISO.split('-').reverse().join('/');
  const xl=(x,t,a)=>`<text x="${x}" y="${h-8}" font-size="11" fill="var(--muted)" text-anchor="${a}">${t}</text>`;
  const ariaLabel=escapeHTML(`Gráfico de evolução do saldo projetado de ${startLabel} a ${endLabel}. `+
    `Saldo atual ${fmt(data.currentBalance)}, menor saldo projetado ${fmt(data.minBalance)} em ${escapeHTML(data.minDate.split('-').reverse().join('/'))}, `+
    `saldo ao final do período ${fmt(data.finalBalance)}.`+(data.hasNegative?' O saldo projetado fica negativo neste período.':''));

  // Interatividade (apenas apresentação): marcadores nos dias com movimentação + camada de captura do ponteiro.
  const evDots=data.points.map((pt,k)=>{
    if(!pt.events||!pt.events.length) return '';
    const net=pt.events.reduce((a,e)=>a+e.signed,0);
    return `<circle cx="${xFor(k).toFixed(1)}" cy="${yFor(values[k]).toFixed(1)}" r="3.5" fill="${net>=0?'var(--green)':'var(--red)'}" stroke="var(--card)" stroke-width="1.5" pointer-events="none"/>`;
  }).join('');
  const geo={w,h,padL,padR,padT,innerH,innerW,n,scaleMin,scaleMax};
  const interact=`${evDots}
    <g id="cfHover" style="display:none" pointer-events="none">
      <line id="cfHoverLine" x1="0" x2="0" y1="${padT}" y2="${padT+innerH}" stroke="var(--muted)" stroke-width="1" stroke-dasharray="3 3"/>
      <circle id="cfHoverDot" r="5.5" cx="0" cy="0" fill="var(--accent)" stroke="var(--card)" stroke-width="2"/>
    </g>
    <rect id="cfHit" x="${padL}" y="${padT}" width="${innerW}" height="${innerH}" fill="transparent" style="cursor:crosshair;touch-action:pan-y"/>`;
  return `<svg id="cfSvg" data-geo='${JSON.stringify(geo)}' tabindex="0" viewBox="0 0 ${w} ${h}" width="100%" style="display:block;max-width:100%;height:auto;outline:none" role="img" aria-label="${ariaLabel} Use as setas do teclado ou passe o mouse para ver o saldo de cada dia.">
    <defs><linearGradient id="cfGrad" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" style="stop-color:${lineColor};stop-opacity:.28"/><stop offset="100%" style="stop-color:${lineColor};stop-opacity:0"/></linearGradient></defs>
    ${grid}
    <path d="${area}" fill="url(#cfGrad)" stroke="none"/>
    ${zeroLine}
    <path d="${path}" fill="none" stroke="${lineColor}" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
    ${startDot}${minMarker}
    ${xl(padL,dm(startISO)+' (hoje)','start')}${n>=4?xl((padL+innerW/2).toFixed(1),dm(midISO),'middle'):''}${xl(w-padR,dm(endISO),'end')}
    ${interact}
  </svg>`;
}
// Monta o card completo (título, seletor de período, resumo e gráfico). `commitmentsAll` é
// repassado a computeCashFlow() para reaproveitar a mesma varredura já feita para "Próximos
// compromissos" no mesmo render. Apresentação apenas: os números exibidos são exatamente os de
// computeCashFlow(), só reorganizados em blocos.
function cashFlowCardHTML(commitmentsAll){
  const data=computeCashFlow(cashFlowDays,commitmentsAll);
  window.__cfData=data; // usado só pelo hover/clique do gráfico
  const periodOpts=CASHFLOW_PERIODS.map(d=>`<option value="${d}" ${d===cashFlowDays?'selected':''}>${d} dias</option>`).join('');
  const negativeAlert=data.hasNegative?`<p style="color:var(--red);margin:0 0 12px;font-size:13px" role="status">⚠ O saldo projetado fica negativo neste período.</p>`:'';
  const dmy=(iso)=>escapeHTML(iso.split('-').reverse().join('/'));
  const topRow=(label,it,cls,emptyTxt)=>`<div class="cf-top${it?' cf-pick':''}"${it?` data-cfday="${escapeHTML(it.date<=data.points[0].date?data.points[1]?data.points[1].date:it.date:it.date)}" role="button" tabindex="0" aria-label="Ver este dia no gráfico"`:''}>
      <div class="bud-fig-l">${label}</div>
      ${it?`<div class="cf-top-main"><span class="cf-top-desc">${escapeHTML(it.desc)}</span><b class="${cls}">${fmt(it.amount)}</b></div><div class="muted" style="font-size:12px">${dmy(it.date)}</div>`:`<div class="muted" style="font-size:13px">${emptyTxt}</div>`}
    </div>`;

  return `
  <div class="card cf-card" style="margin-bottom:20px">
    <div class="goal-head" style="margin-bottom:14px">
      <div style="min-width:0">
        <h3 style="margin:0 0 2px">Fluxo de caixa</h3>
        <p class="muted" style="margin:0;font-size:12px">Evolução projetada do seu saldo disponível nos próximos dias.</p>
      </div>
      <div style="flex-shrink:0">
        <label for="cashFlowPeriod" style="margin-bottom:2px">Período</label>
        <select id="cashFlowPeriod" style="width:auto" aria-label="Selecionar período do fluxo de caixa">${periodOpts}</select>
      </div>
    </div>
    ${negativeAlert}
    <div class="cf-kpis">
      <div class="bud-fig"><div class="bud-fig-l">Saldo atual</div><div class="bud-fig-v">${fmt(data.currentBalance)}</div></div>
      <div class="bud-fig cf-pick ${data.minBalance<0?'is-over':''}" data-cfday="${escapeHTML(data.minDate)}" role="button" tabindex="0" aria-label="Ver o dia do menor saldo no gráfico"><div class="bud-fig-l">Menor saldo</div><div class="bud-fig-v ${data.minBalance<0?'neg':''}">${fmt(data.minBalance)}</div><div class="muted" style="font-size:12px;margin-top:2px">em ${dmy(data.minDate)}</div></div>
      <div class="bud-fig cf-pick ${data.finalBalance<0?'is-over':''}" data-cfday="${escapeHTML(data.finalDate)}" role="button" tabindex="0" aria-label="Ver o saldo final no gráfico"><div class="bud-fig-l">Saldo em ${data.days} dias</div><div class="bud-fig-v ${data.finalBalance<0?'neg':''}">${fmt(data.finalBalance)}</div><div class="muted" style="font-size:12px;margin-top:2px">${dmy(data.finalDate)}</div></div>
    </div>
    <div class="cf-chart" id="cfChart">${cashFlowChartSVG(data)}<div class="cf-tip" id="cfTip" role="presentation" style="display:none"></div></div>
    <div class="cf-detail" id="cfDetail" aria-live="polite"></div>
    <div class="cf-kpis cf-two">

// Interação do gráfico (hover/toque/teclado/clique). Só lê window.__cfData (os pontos de computeCashFlow()); não altera dados.
let cfPinnedISO=null; // dia "fixado" por clique; é estado de tela, não dado do usuário
function bindCashFlowChart(){
  const svg=document.getElementById('cfSvg'), hit=document.getElementById('cfHit'), box=document.getElementById('cfChart');
  const tip=document.getElementById('cfTip'), det=document.getElementById('cfDetail'), data=window.__cfData;
  if(!svg||!hit||!box||!tip||!det||!data) return;
  const g=JSON.parse(svg.getAttribute('data-geo'));
  const pts=data.points;
  const hov=document.getElementById('cfHover'), hl=document.getElementById('cfHoverLine'), hd=document.getElementById('cfHoverDot');
  const xFor=i=>g.padL+(g.n?(i/g.n)*g.innerW:0);
  const yFor=v=>g.padT+g.innerH-((v-g.scaleMin)/(g.scaleMax-g.scaleMin))*g.innerH;
  const WD=['domingo','segunda','terça','quarta','quinta','sexta','sábado'];
  const dayName=iso=>{ const d=parseISOLocal(iso); return WD[d.getDay()]+', '+iso.slice(8,10)+'/'+iso.slice(5,7)+'/'+iso.slice(0,4); };
  const kindLbl=e=>e.kind==='receita'?'Receita':(e.kind==='fatura'?'Fatura':(e.kind==='pagamento_fatura'?'Pagamento de fatura':'Saída'));
  const late=(e,pt)=>e.origDate<pt.date?` · venceu em ${e.origDate.slice(8,10)}/${e.origDate.slice(5,7)}`:'';
  const idxOf=iso=>pts.findIndex(p=>p.date===iso);
  let hoverIdx=-1;

  function place(i){
    const pt=pts[i], x=xFor(i), y=yFor(pt.balance);
    hov.style.display=''; hl.setAttribute('x1',x); hl.setAttribute('x2',x); hd.setAttribute('cx',x); hd.setAttribute('cy',y);
    hd.setAttribute('fill',pt.balance<0?'var(--red)':'var(--accent)');
  }
  function showTip(i){
    const pt=pts[i], rect=svg.getBoundingClientRect(), crect=box.getBoundingClientRect();
    const sx=rect.width/g.w;
    const evs=pt.events.map(e=>`<div class="ev"><span>${escapeHTML(e.desc)}</span><span class="${e.signed>=0?'pos':'neg'}">${e.signed>=0?'+':'−'}${fmt(e.amount)}</span></div>`).join('');
    tip.innerHTML=`<b class="d">${dayName(pt.date)}${i===0?' (hoje)':''}</b><div class="bal ${pt.balance<0?'neg':''}">${fmt(pt.balance)}</div>${evs||'<div class="muted" style="margin-top:4px">Sem movimentações</div>'}`;
    tip.style.display='block';
    const px=(rect.left-crect.left)+xFor(i)*sx, tw=tip.offsetWidth, th=tip.offsetHeight;
    let left=px+14; if(left+tw>crect.width-6) left=px-14-tw; if(left<6) left=6;
    const py=(rect.top-crect.top)+yFor(pt.balance)*sx;
    let top=py-th-12; if(top<6) top=Math.min(py+14,crect.height-th-6);
    tip.style.left=left+'px'; tip.style.top=Math.max(6,top)+'px';
  }
  function hideTip(){ tip.style.display='none'; if(cfPinnedISO&&idxOf(cfPinnedISO)>=0) place(idxOf(cfPinnedISO)); else hov.style.display='none'; hoverIdx=-1; }
  function renderDetail(){
    const i=cfPinnedISO?idxOf(cfPinnedISO):-1;
    if(i<0){ cfPinnedISO=null; det.className='cf-detail'; det.textContent='Passe o mouse (ou toque) no gráfico para ver o saldo de cada dia. Clique para fixar um dia aqui.'; return; }
    const pt=pts[i], prev=i>0?pts[i-1].balance:pt.balance, delta=pt.balance-prev;
    const evs=pt.events.map(e=>`<div class="cf-ev"><span>${escapeHTML(e.desc)}<small>${kindLbl(e)}${late(e,pt)}</small></span><b class="${e.signed>=0?'pos':'neg'}">${e.signed>=0?'+':'−'}${fmt(e.amount)}</b></div>`).join('');
    det.className='cf-detail on';
    det.innerHTML=`<div class="cf-dh"><span>${dayName(pt.date)}${i===0?' (hoje)':''}</span><span><b class="${pt.balance<0?'neg':''}">${fmt(pt.balance)}</b> <button type="button" class="ghost" id="cfUnpin" aria-label="Limpar dia selecionado">Limpar</button></span></div>`
      +(i>0?`<div style="margin-top:2px">Variação no dia: <b class="${delta>=0?'pos':'neg'}">${delta>=0?'+':'−'}${fmt(Math.abs(delta))}</b></div>`:'<div style="margin-top:2px">Saldo atual, antes dos compromissos futuros.</div>')
      +(evs||'<div class="cf-ev"><span>Sem movimentações neste dia</span></div>');
    const u=document.getElementById('cfUnpin'); if(u) u.onclick=()=>{ cfPinnedISO=null; place0(); renderDetail(); };
  }
  function place0(){ hov.style.display='none'; tip.style.display='none'; }
  function pin(i){ cfPinnedISO=(cfPinnedISO===pts[i].date)?null:pts[i].date; renderDetail(); if(cfPinnedISO) place(i); else place0(); }
  function idxFromEvent(e){
    const rect=svg.getBoundingClientRect(), x=(e.clientX-rect.left)*(g.w/rect.width);
    return Math.max(0,Math.min(g.n,Math.round(((x-g.padL)/g.innerW)*g.n)));
  }
  function move(e){ const i=idxFromEvent(e); if(i===hoverIdx) return; hoverIdx=i; place(i); showTip(i); }
  hit.addEventListener('pointermove',move);
  hit.addEventListener('pointerdown',move);
  hit.addEventListener('pointerleave',hideTip);
  hit.addEventListener('pointercancel',hideTip);
  hit.addEventListener('click',e=>{ pin(idxFromEvent(e)); });
  // Teclado: setas navegam dia a dia, Home/End vão às pontas, Enter/Espaço fixam o dia.
  let kIdx=0;
  svg.addEventListener('focus',()=>{ kIdx=cfPinnedISO&&idxOf(cfPinnedISO)>=0?idxOf(cfPinnedISO):0; hoverIdx=kIdx; place(kIdx); showTip(kIdx); });
  svg.addEventListener('blur',hideTip);
  svg.addEventListener('keydown',e=>{
    const k=e.key; let ni=kIdx;
    if(k==='ArrowRight') ni=Math.min(g.n,kIdx+1); else if(k==='ArrowLeft') ni=Math.max(0,kIdx-1);
    else if(k==='Home') ni=0; else if(k==='End') ni=g.n;
    else if(k==='Enter'||k===' '){ e.preventDefault(); pin(kIdx); return; }
    else if(k==='Escape'){ cfPinnedISO=null; renderDetail(); place0(); return; }
    else return;
    e.preventDefault(); kIdx=ni; hoverIdx=ni; place(ni); showTip(ni);
  });
  // Cartões "Menor saldo", "Saldo em X dias" e "Maior receita/saída" levam ao dia correspondente no gráfico.
  document.querySelectorAll('.cf-card [data-cfday]').forEach(el=>{
    const go=()=>{ const i=idxOf(el.dataset.cfday); if(i<0) return; cfPinnedISO=pts[i].date; renderDetail(); place(i); box.scrollIntoView({block:'nearest',behavior:'smooth'}); };
    el.addEventListener('click',go);
    el.addEventListener('keydown',e=>{ if((e.key==='Enter'||e.key===' ')&&e.target===el){ e.preventDefault(); go(); } });
  });
  document.querySelectorAll('.cf-card [data-cflist]').forEach(el=>{
    const go=()=>openCashFlowListModal(el.dataset.cflist);
    el.addEventListener('click',go);
    el.addEventListener('keydown',e=>{ if((e.key==='Enter'||e.key===' ')&&e.target===el){ e.preventDefault(); go(); } });
  });
  renderDetail();
  if(cfPinnedISO&&idxOf(cfPinnedISO)>=0) place(idxOf(cfPinnedISO));
}

// ================== V1.2.1 — QUANTO POSSO GASTAR? ==================
// "Disponível para gastar" NÃO é um cálculo novo: é literalmente projectedBalance().projectedBalance,
// exibido com outro nome/contexto. "Até o próximo recebimento" e "Disponível por dia" também não
// inventam nenhuma regra de cartão/fatura — são derivados de getNextCommitments() (mesma lista já
// deduplicada de V1.1.2, que por sua vez já reflete exatamente as mesmas obrigações de cartão que
// projectedBalance() usa via futureCardObligations()/futureCardPayments()).
//
// Função pura: recebe os mesmos `commitmentsAll`/`proj` que viewDashboard() já calcula para as
// seções anteriores (Próximos compromissos, Fluxo de caixa), evitando qualquer recomputação.
// AJUSTE (horizonte curto): "Disponível para gastar" deixa de ser proj.projectedBalance (que soma
// TODAS as obrigações futuras cadastradas, inclusive faturas/parcelas de meses distantes) e passa a
// ser o saldo atual menos apenas os compromissos com vencimento real ATÉ o próximo recebimento —
// o mesmo horizonte de "Até o próximo recebimento" logo abaixo. Sem recebimento futuro cadastrado,
// o horizonte alternativo é o fim do mês atual. Nada além deste indicador muda: proj.projectedBalance
// continua intacto e ainda é usado no card "Disponível projetado" do Resumo financeiro; faturas,
// parcelas, limite de cartão, Fluxo de caixa, Próximos compromissos/lançamentos e Relatórios
// continuam lendo getNextCommitments()/projectedBalance() exatamente como antes.
function getSpendableSummary(commitmentsAll,proj){
  let disponivelParaGastar=proj.currentBalance, horizonDate=null, horizonKind=null;

  // getNextCommitments() já vem ordenada cronologicamente (ver seu próprio sort), então o primeiro
  // item de kind 'receita' É a próxima receita futura, sem precisar reordenar nada.
  const receitas=commitmentsAll.filter(it=>it.kind==='receita' && it.date>todayISO()); // receita vencida e não confirmada não é "próximo recebimento"
  let nextIncome=null, beforeNextIncome=null, daysUntilNextIncome=null, perDay=null;

  if(receitas.length){
    const nextDate=receitas[0].date;
    // Várias receitas no mesmo dia (mesma data da "próxima") contam juntas como um único evento —
    // é o mesmo instante no calendário, não duas próximas receitas diferentes.
    const sameDay=receitas.filter(it=>it.date===nextDate);
    const totalAmount=sameDay.reduce((s,it)=>s+Number(it.amount),0);
    nextIncome={date:nextDate,amount:totalAmount,
      desc:sameDay.length===1?sameDay[0].desc:`${sameDay.length} recebimentos`,count:sameDay.length};

    // Só os compromissos (despesa/pagamento de fatura/obrigação de fatura já líquida) com data
    // ESTRITAMENTE anterior à próxima receita entram aqui — a própria receita nunca é somada.
    const outflowsBefore=commitmentsAll.filter(it=>it.kind!=='receita'&&it.date<nextDate);
    const totalOutflowBefore=outflowsBefore.reduce((s,it)=>s+Number(it.amount),0);
    beforeNextIncome=proj.currentBalance-totalOutflowBefore;
    disponivelParaGastar=beforeNextIncome; horizonDate=nextDate; horizonKind='recebimento';

    daysUntilNextIncome=daysDiffISO(nextDate,todayISO());
    if(daysUntilNextIncome>0) perDay=beforeNextIncome/daysUntilNextIncome;
    // Se daysUntilNextIncome<=0 (recebimento hoje — o que as regras atuais de futureTx()/
    // isFutureDate() já impedem de acontecer na prática, já que uma data "hoje" não é futura),
    // perDay permanece null propositalmente, para nunca dividir por zero.
  } else {
    // Sem recebimento futuro cadastrado: horizonte alternativo = último dia do mês atual, para que
    // o indicador não volte a descontar compromissos de meses futuros distantes por falta de
    // referência.
    const t=todayISO(), y=Number(t.slice(0,4)), m=Number(t.slice(5,7));
    const eomISO=t.slice(0,7)+'-'+String(new Date(y,m,0).getDate()).padStart(2,'0');
    const outflowsBefore=commitmentsAll.filter(it=>it.kind!=='receita'&&it.date<=eomISO);
    const totalOutflowBefore=outflowsBefore.reduce((s,it)=>s+Number(it.amount),0);
    disponivelParaGastar=proj.currentBalance-totalOutflowBefore; horizonDate=eomISO; horizonKind='fim_do_mes';
  }

  return {disponivelParaGastar,nextIncome,beforeNextIncome,daysUntilNextIncome,perDay,horizonDate,horizonKind};
}

// Apenas apresentação: nenhum valor aqui é recalculado, só formatado/rotulado. Reaproveita fmt(),

      ${extra}
    </div>
    <div class="spend-note"><div>${negNote}${hCaption} Compromissos com vencimento posterior a essa data não entram neste valor — eles continuam em Próximos compromissos, Faturas e Fluxo de caixa.</div></div>
  </div>`;
}

// ================== V1.2.2 — METAS FINANCEIRAS ==================
// Metas são puramente informativas: apenas acompanham um valor-alvo definido pelo próprio usuário.
// Nenhuma função financeira existente (accBalance, totalBalance, projectedBalance, cardUsed,
// cardAvailable, getOpenInvoices, getNextCommitments, computeCashFlow, getNotifications,
// categoryTotals etc.) lê ou escreve em DB.goals, e nenhuma ação de meta (criar/editar/adicionar
// valor/remover valor/ativar/desativar/excluir) cria um DB.transactions ou altera
// DB.accounts/DB.cards/DB.budgets. É apenas acompanhamento — sem segunda lógica de saldo.

// Normaliza um único item de DB.goals para o formato mínimo, sem inventar dados financeiros:
// número inválido vira 0 (nunca um valor estimado), texto inválido vira string vazia, e um id
// ausente ganha um novo uid() só para a meta continuar utilizável na interface.
function normalizeGoalItem(g){
  if(!g||typeof g!=='object'||Array.isArray(g)) g={};
  const targetAmount=Number(g.targetAmount);
  const currentAmount=Number(g.currentAmount);
  let deadline=g.deadline;
  if(deadline!=null && typeof deadline!=='string') deadline=null;
  return {
    id:(typeof g.id==='string'&&g.id)?g.id:uid(),
    name:(typeof g.name==='string')?g.name:'',
    targetAmount:(isFinite(targetAmount)&&targetAmount>0)?targetAmount:0,
    currentAmount:(isFinite(currentAmount)&&currentAmount>=0)?currentAmount:0,
    deadline:deadline||null,
    active:g.active!==false
  };
}
// Garante DB.goals como array de metas válidas. Instalações/backups antigos sem "goals", ou com
// "goals" corrompido (não-array, itens que não são objetos, campos inválidos), continuam
// funcionando normalmente — nunca quebram o Dashboard nem o restante do sistema.
function normalizeGoals(db){
  if(!Array.isArray(db.goals)) db.goals=[];
  db.goals=db.goals.map(normalizeGoalItem);
}

function goalProgressPct(g){
  if(!g.targetAmount||g.targetAmount<=0) return 0;
  return (g.currentAmount/g.targetAmount)*100;
}
function goalRemaining(g){ return Math.max(0,(toCents(g.targetAmount)-toCents(g.currentAmount))/100); }
// Meta atingida: currentAmount >= targetAmount. Ultrapassar o objetivo é permitido e mostrado
// como "100%+"/percentual real (ver goalCardHTML) — currentAmount nunca é limitado ao objetivo.
function goalAchieved(g){ return g.targetAmount>0 && toCents(g.currentAmount)>=toCents(g.targetAmount); }
function goalStatus(g){
  if(!g.active) return 'inativa';
  if(goalAchieved(g)) return 'atingida';
  return 'andamento';
}
const GOAL_STATUS_LABEL={andamento:'Em andamento',atingida:'Meta atingida',inativa:'Inativa'};
const GOAL_STATUS_CLASS={andamento:'tag-accent',atingida:'tag-green',inativa:'tag'};
// Ordenação neutra e previsível (nunca um ranking financeiro): metas ativas primeiro, na ordem em
// que já estão armazenadas em DB.goals (ordem de criação); depois as inativas, mesma ordem relativa
// entre si. Usa apenas o sort estável nativo do array — nenhum critério de "melhor"/"pior" meta.
function sortedGoals(){
  return (DB.goals||[]).slice().sort((a,b)=>(a.active===b.active)?0:(a.active?-1:1));
}

function goalDaysLeft(g){
  if(!g.deadline) return null;
  const m=/^(\d{4})-(\d{2})-(\d{2})/.exec(g.deadline); if(!m) return null;
  const d=new Date(+m[1],+m[2]-1,+m[3]); const t=new Date(); t.setHours(0,0,0,0);
  return Math.round((d-t)/86400000);
}
const GOAL_SVG={
  edit:'<path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/>',
  del:'<path d="M3 6h18"/><path d="M8 6V4h8v2"/><path d="M19 6l-1 14H6L5 6"/><path d="M10 11v6M14 11v6"/>',
  cal:'<rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/>',
  plus:'<path d="M12 5v14M5 12h14"/>',
  minus:'<path d="M5 12h14"/>',
  power:'<path d="M12 3v9"/><path d="M6.4 6.6a8 8 0 1 0 11.2 0"/>',
  check:'<path d="M5 12.5l4.5 4.5L19 7.5"/>'
};
const goalIco=(k,sz)=>`<svg viewBox="0 0 24 24" width="${sz||18}" height="${sz||18}" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${GOAL_SVG[k]}</svg>`;

function goalCardHTML(g){

    <span class="gr-txt">${achieved?goalIco('check',24):pctTxt}</span></div>`;
  // prazo + dica informativa (não movimenta nada)

    }
    due=`<span class="goal-due ${(!achieved&&days!==null&&days<0)?'is-late':''}">${goalIco('cal',14)}${escapeHTML(deadlineLabel)}${dtxt}</span>`;
    if(!achieved && status==='andamento' && days!==null && days>0){
      const months=Math.max(1,Math.ceil(days/30));
      hint=`<span class="goal-hint">≈ ${fmt(goalRemaining(g)/months)}/mês até o prazo</span>`;

  } else due='<span class="goal-due">Sem prazo definido</span>';
  return `<div class="card goal-card is-${status}" data-goalcard="${escapeHTML(g.id)}">
    <div class="goal-head">
      ${ring}

        <h3>${escapeHTML(g.name||'(sem nome)')}</h3>

      </div>
      <div class="goal-icons">
        <button type="button" class="ghost goal-ico" data-editgoal="${escapeHTML(g.id)}" aria-label="Editar meta ${nm}" title="Editar">${goalIco('edit')}</button>
        <button type="button" class="ghost goal-ico goal-ico-del" data-delgoal="${escapeHTML(g.id)}" aria-label="Excluir meta ${nm}" title="Excluir">${goalIco('del')}</button>

    <div class="goal-figs">
      <div><div class="goal-l">Objetivo</div><div class="goal-v">${fmt(g.targetAmount)}</div></div>
      <div class="${achieved?'is-ok':''}"><div class="goal-l">${achieved?'Situação':'Faltam'}</div><div class="goal-v">${achieved?'Atingida ✓':fmt(goalRemaining(g))}</div></div>
    </div>
    ${hint?`<div class="goal-hintrow">${hint}</div>`:''}
    <div class="goal-actions">
      <button type="button" class="goal-add" data-addval="${escapeHTML(g.id)}">${goalIco('plus',16)}Adicionar valor</button>

}
function viewMetas(){

  const isAdd=mode==='add';

function bindGoalValueEvents(g,mode){
  document.getElementById('saveGoalValBtn').onclick=()=>{
    const val=money2(document.getElementById('gvVal').value);
    if(!val||val<=0){ showFormError('Informe um valor maior que zero.'); return; }
    if(mode==='add'){
      g.currentAmount=(toCents(g.currentAmount)+toCents(val))/100;
    } else {
      // Preferir rejeitar com mensagem clara em vez de limitar silenciosamente o valor removido.
      if(toCents(val)>toCents(g.currentAmount)){ showFormError('O valor a remover não pode ser maior que o valor atual da meta.'); return; }
      g.currentAmount=Math.max(0,(toCents(g.currentAmount)-toCents(val))/100);
    }
    saveDB();closeModal();render();
  };
}

function dashTxRows(list,withCat){

    const parc=t.installment?` · Parcela ${t.installment.index}/${t.installment.count}`:'';
    const isIn=t.type==='receita', isOut=isExpenseLike(t);
    const catTxt=withCat&&cat?' · '+(cat.icon||'')+' '+cat.name:'';
    return `<div class="bt-row"><div class="bt-main"><div class="bt-desc">${escapeHTML(t.desc||'(sem descrição)')}</div><div class="muted">${escapeHTML(String(t.date).split('-').reverse().join('/')+(src?' · '+src:'')+parc+catTxt)}</div></div><div class="bt-amt ${isIn?'pos':(isOut?'neg':'')}">${isIn?'+':(isOut?'-':'')}${fmt(t.amount)}</div></div>`;
  }).join('');
  return rows+(list.length>LIM?`<p class="muted" style="margin:8px 0 0;font-size:12px">Mostrando ${LIM} de ${list.length} lançamentos.</p>`:'');
}
function dashModal(title,sub,sumHTML,bodyHTML,icon){

}
function openDashDetail(kind,arg){
  const c=dashCtx();
  const byDate=(a,b)=>String(b.date).localeCompare(String(a.date));
  const real=c.months.flatMap(m=>realizedMonthTx(m)).sort(byDate);
  const exp=real.filter(isExpenseLike), inc=real.filter(t=>t.type==='receita');
  const total=l=>l.reduce((x,t)=>x+Number(t.amount),0);
  const sub=c.mesLabel||'';
  const list=l=>`<div class="bt-title">Lançamentos <span class="muted">(${l.length})</span></div><div class="bt-list">${dashTxRows(l,kind!=='cat')}</div>`;
  if(kind==='cat'){
    const l=exp.filter(t=>String(t.categoryId)===String(arg));
    const cat=catById(arg), tot=total(l), all=total(exp)||1;
    dashModal(cat?cat.name:'Outros',sub,`<div class="kd-sum">${kdSumRow('Total gasto',fmt(tot),'neg')}${kdSumRow('Participação nas despesas',(tot/all*100).toFixed(0)+'%')}${kdSumRow('Lançamentos',String(l.length))}</div>`,list(l),cat?cat.icon:'📦');
  } else if(kind==='tx'){
    const l=c.months.flatMap(m=>monthTx(m)).sort(byDate);
    dashModal('Lançamentos',sub,`<div class="kd-sum">${kdSumRow('Registrados no período',String(l.length))}${kdSumRow('Já realizados',String(real.length))}</div>`,list(l),'🧾');
  } else if(kind==='entradas'){
    dashModal('Entradas',sub,`<div class="kd-sum">${kdSumRow('Total recebido',fmt(total(inc)),'pos')}</div>`,list(inc),'💵');
  } else if(kind==='despesas'){
    dashModal('Despesas',sub,`<div class="kd-sum">${kdSumRow('Total gasto',fmt(total(exp)),'neg')}</div>`,list(exp),'💸');
  } else if(kind==='economia'||kind==='result'){
    const ent=total(inc), sai=total(exp), r=ent-sai;
    const top={}; exp.forEach(t=>{ top[t.categoryId]=(top[t.categoryId]||0)+Number(t.amount); });
    const topRows=Object.entries(top).sort((a,b)=>b[1]-a[1]).slice(0,5).map(([cid,v])=>{ const ct=catById(cid); return `<div class="bt-row"><div class="bt-main"><div class="bt-desc">${escapeHTML((ct?(ct.icon||'')+' '+ct.name:'📦 Outros').trim())}</div></div><div class="bt-amt neg">${fmt(v)}</div></div>`; }).join('');
    dashModal(kind==='result'?'Resultado':'Economia',sub,
      `<div class="kd-sum">${kdSumRow('Entradas realizadas',fmt(ent),'pos')}${kdSumRow('− Despesas realizadas',fmt(sai),'neg')}${kdSumRow(r>=0?'Economia':'Resultado negativo',fmt(r),r>=0?'pos':'neg')}</div>`,
      topRows?`<div class="bt-title">Onde mais gastou</div><div class="bt-list">${topRows}</div>`:'',r>=0?'💰':'⚠️');
  } else if(kind==='fatura'){
    const STG={paga:'Paga',atrasada:'Atrasada',pendente_hoje:'Vence hoje',futura:'Em aberto'};
    const rows=DB.cards.map(cd=>{
      const inv=cardCurrentInvoice(cd.id); if(!inv) return '';
      const has=inv.items.length>0;
      const st=has?STG[invoiceStage(cd,inv)]:'Sem compras';
      return `<div class="bt-row oc-click" role="button" tabindex="0" data-dfinv="${escapeHTML(cd.id)}" data-dfper="${escapeHTML(inv.period)}"><div class="bt-main"><div class="bt-desc">💳 ${escapeHTML(cd.name)}</div><div class="muted">Vence ${escapeHTML(String(inv.dueDate).split('-').reverse().join('/'))} · ${st}</div></div><div class="bt-amt ${inv.remaining>0?'neg':''}">${fmt(inv.remaining)} ›</div></div>`;
    }).join('');
    const tot=DB.cards.reduce((x,cd)=>{ const i=cardCurrentInvoice(cd.id); return x+(i?i.remaining:0); },0);
    dashModal('Fatura atual','Toque num cartão para ver a fatura',`<div class="kd-sum">${kdSumRow('Total em aberto',fmt(tot),tot>0?'neg':'')}</div>`,`<div class="bt-title">Cartões</div><div class="bt-list">${rows}</div>`,'💳');
    document.querySelectorAll('[data-dfinv]').forEach(el=>{
      const go=()=>{ const id=el.dataset.dfinv, per=el.dataset.dfper; closeModal(); openInvoiceDetail(id,per); };
      el.addEventListener('click',go);
      el.addEventListener('keydown',e=>{ if((e.key==='Enter'||e.key===' ')&&e.target===el){ e.preventDefault(); go(); } });
    });
  }
}
function bindOutrasInfoEvents(){
  const act=(el,fn)=>{
    el.addEventListener('click',fn);
    el.addEventListener('keydown',e=>{ if((e.key==='Enter'||e.key===' ')&&e.target===el){ e.preventDefault(); fn(); } });
  };
  document.querySelectorAll('[data-ocat]').forEach(el=>act(el,()=>openDashDetail('cat',el.dataset.ocat)));
  document.querySelectorAll('[data-dstat]').forEach(el=>act(el,()=>openDashDetail(el.dataset.dstat)));
  document.querySelectorAll('[data-oins]').forEach(el=>act(el,()=>{
    const v=el.dataset.oins||''; const i=v.indexOf(':');
    const k=i<0?v:v.slice(0,i), arg=i<0?'':v.slice(i+1);
    if(k==='bud') openBudgetDetail(arg); else if(k) openDashDetail(k,arg);
  }));
}

    body=`<div class="kd-sum">${kdSumRow('Total a receber',fmt(sum(r)),'pos')}</div>

      +(key==='pordia'&&s.perDay!=null?`${kdSumRow('÷ Dias até o próximo recebimento',String(s.daysUntilNextIncome))}${kdSumRow('Disponível por dia',fmt(s.perDay),s.perDay<0?'neg':'')}`:'')
      +`</div><div class="bt-title">Compromissos descontados</div><div id="kpiDetailList">${kdRows(out)}</div>`;
